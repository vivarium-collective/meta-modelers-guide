[project]
name = "meta-modelers-guide"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.12"
dependencies = [
    "viva-compiler @ git+https://github.com/vivarium-collective/viva-compiler.git@main",
    "process-bigraph",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
    # Pinned explicitly to git main (not just transitively via vivarium-workbench)
    # so the workspace picks up newer modules the workbench tabs render — e.g.
    # `viva_superpowers.loop_state` (Assurance > Build) and `viva_superpowers.test_audit`
    # (Assurance > Audit), which are not in any published PyPI release yet.
    "viva-superpowers",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Real external-simulator backends behind the executable composites. The compiled
# executables bridge COBRApy (dynamic-FBA metabolism), spatio-flux (diffusion /
# advection chemical fields) and pbg-cpm (Cellular-Potts cells) — e.g.
# cell-environment-coupling, cell-cell-coupling, growth-and-division,
# disintegration, molecular-interfaces. Install with `uv sync --extra simulators`
# (or `pip install -e .[simulators]`) to build and run the executables; without
# them the draft composites + coarse/kinetic handlers still run and the
# simulator-backed tests skip. Serving the workspace and the read-only dashboard
# do NOT need this extra (they use the committed composite JSON + renders).
# NOTE: pbg-cpm is the dist name of the viva-cpm repo (see [tool.uv.sources]).
simulators = ["cobra>=0.29", "spatio-flux", "pbg-cpm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["meta_modelers_guide"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
# Simulator backends for the executable composites (the `simulators` extra).
spatio-flux = { git = "https://github.com/vivarium-collective/spatio-flux.git", branch = "main" }
# pbg-cpm is the dist name the viva-cpm repo published BEFORE its cpm -> viva_cpm
# package rename (#75, commit c5528d1). This workspace's CPM adapters still
# `from cpm.schema import load_world` (meta_modelers_guide/cpm/*), so it is pinned
# to the last pre-rename commit (6d13620), which still ships the `cpm` package as
# dist `pbg-cpm`. Migrating meta_modelers_guide/cpm/* to `viva_cpm` and moving this
# to `viva-cpm @ main` is a follow-up.
pbg-cpm = { git = "https://github.com/vivarium-collective/viva-cpm.git", rev = "6d13620d6a6f29b9b4cbbe38f6c6c05344c4d514" }
