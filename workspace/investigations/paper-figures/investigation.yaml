    framework illustrations rather than cellular composition patterns. (fig-07 nested hierarchy DOES
    participate in the spine via its interface dependency; it is not standalone.)
scientific_argument:
  main_claim: >-
    The eleven figures of the meta-modeler's guide are executable artifacts, not
    just illustrations. Each figure's panel-b process-bigraph diagram denotes a
    real, registered composition (`figNN-runnable`) that runs through the
    workspace's own `build_core`, and when it runs it reproduces the principle the
    figure's caption states — checked by a behavior-gated test, not asserted. The
    claim is about executability (the diagram is a runnable specification), not
    biological calibration; the sibling investigation `draft-to-living-cell`
    carries each pattern to spatially-resolved, controlled rigor.
  evidence_for:
  - >-
    fig-01 (interfaces & composition) — the paper's definitional figure runs: one
    typed `StoreTransfer` wired source→sink conserves total amount to 1e-9 at every
    tick, so the minimal composition the whole guide is built from is itself an
    executable, conservation-respecting object.
  - >-
    fig-05 (disintegration) — the grain-swap payoff: one shared biomass/energy
    interface realized at three grains gives biomass 4.0 / 2.67 / 6.29
    (coarse / kinetic / real-COBRApy dFBA), and only the FBA grain shows acetate
    overflow (secretions 30.45 vs 1.6) — the figure's "same interface, different
    grain" principle, measured off the engine (workbench 0.4.1).
  - >-
    fig-06 (molecular interface) — the F₁Fₒ ATP synthase as one process exposing
    four typed physical ports (chemical / electrical / mechanical / thermal) from a
    single proton flux; the driven `fig06-runnable` sweeps the output 20→128 as the
    proton-motive drive ramps, so the four modalities are one coupled device, not
    four drawn arrows.
  - >-
    fig-08 (self-organized processes) — the minimal cell, inert on the old engine,
    now grows across its coupled stores on workbench 0.4.1 (membrane 0.2→1.4,
    protein pool 0.3→1.57, energy 0.5→0.87), isolated by two process-knockout
    controls — containment, metabolism, gene expression, replication and diffusion
    composing into a maintained whole.
  - >-
    fig-09 (growth & division) as a genuine place-graph rewrite over a colony
    `tree[node]` with exact DNA conservation + equipartition at every division
    event, and fig-10 / fig-11 (development / evolution) as real runtime structure
    changes (attachment preserving cell count and biomass; a population tree with
    standing trait variation) rather than redrawn pictures.
  evidence_against:
  - >-
    Every `figNN-runnable` composite is didactic and uncalibrated — toy-real
    constants chosen to make the principle legible in a short run, not fitted to any
    organism or literature target. A passing gate shows the figure's principle is
    reproduced on genuine output, not that the biology is quantitatively validated.
  - >-
    fig-11 (evolution) is a structural figure: its executable carries only a
    `population`/`environment` tree with no scalar time-series, so its evidence is
    population-tree snapshots, not a dynamics curve.
  - >-
    The bare-draft `fig06-executable` output is flat (chemical_out pinned at the
    k_cat constant 100.0) — the figure's behavior lives in the driven
    `fig06-runnable`, so the executability claim rests on the runnable composite plus
    its driver, not the inert draft alone.
  - >-
    Several figures realize only part of their full biology (two of the four
    physical interface modalities stay unrealized where they appear); per-study
    confidence is held at Provisional throughout — the figures execute, but their
    scientific validation is the sibling investigation's job.
  key_figures:   # aligned with executive.key_figures (reconciled per review): the mechanistic exemplars
  - fig-06
  - fig-04
  - fig-05
  caveats:
  - >-
    Executable is not the same as validated: this investigation's claim is narrow —
    the paper's eleven figures run and reproduce their captions — and deliberately
    stops short of biological fidelity.
  - >-
    All numbers are from workbench 0.4.1 didactic composites; the prior figure
    bundle's values predate the engine update and were refreshed where they drifted.
competing_frameworks:
- name: >-
    Figures-as-illustration (the view this investigation discriminates against)
  prediction: >-
    On the illustration view, a paper figure is a drawing: its panel-b diagram
    documents an idea for a human reader but is not itself a runnable object — you
    could not press play on the diagram and recover the behavior the caption claims,
    because the composition it depicts was never executable. This investigation
    discriminates against that view: every panel-b diagram here is a registered
    process-bigraph composite that runs through the workspace core and reproduces
    its figure's stated principle under a behavior-gated test, so the eleven
    diagrams are executable specifications, not pictures of one.
# ── Study-graph spine (scientific-review revision) ────────────────────────────
# The 11 figures were previously edgeless (no fig→fig dependencies). These edges
# record justified compositional/conceptual dependencies WITHOUT claiming model-level
# code reuse that does not exist (a figNN composite does not import figMM's code).
# relation ∈ {builds-on, tests, motivates, methodological-branch}. The per-study
# parent_studies carry the same edges in the {study, condition} form the schema allows;
# this block carries the relation + rationale the schema cannot.
spine_edges:
- from: fig-01
  to: [fig-02, fig-03, fig-06, fig-07]
  relation: builds-on
  rationale: 'fig-01 defines the typed source→store→sink wiring + conservation discipline every later composition instantiates (orchestration, the cellular interface, the molecular interface, nesting).'
- from: fig-03
  to: fig-04
  relation: builds-on
  rationale: "fig-04 places fig-03's typed cell interface in a spatial environment whose driver is a diffusing field the cell senses AND depletes."
- from: [fig-03, fig-06, fig-07]
  to: fig-08
  relation: builds-on
  rationale: 'self-maintenance (fig-08) composes the cellular interface (fig-03), molecular energetics (fig-06), and nested containment (fig-07) into a coupled whole.'
- from: fig-08
  to: fig-09
  relation: builds-on
  rationale: 'division (fig-09) acts on a self-maintaining cell (fig-08): a maintained interior is what gets partitioned.'
- from: fig-09
  to: [fig-10, fig-11]
  relation: builds-on
  rationale: 'development (fig-10) and evolution (fig-11) both require reproduction (fig-09): a collective forms from dividing cells; a population evolves through heritable division.'
- from: fig-05
  to: null
  relation: methodological-branch
  rationale: 'fig-05 (grain switch) is a METHODOLOGICAL branch about changing model resolution, not a biological stage in the geometry→…→population chain; it is deliberately off the linear spine.'
# ── Competing causal interpretations (scientific-review "contradictions") ─────
# For each figure whose baseline could be read as "emergence", the explicit rival
# reading, and how the mechanistic variant discriminates (via ablation/derivation).
competing_interpretations:
- figures: [fig-05, fig-09, fig-10]
  programmed_reading: 'a scheduled/scripted event — a grain switch at a fixed tick (5), a division at a set size (9), an attachment/ECM rewrite on a wall clock (10).'
  emergent_reading: 'a state-triggered transition — grain refinement driven by quantified model inadequacy (5), division gated by a physiological size/resource condition (9), aggregation from local adhesion + proximity (10).'
  discriminator: "the mechanistic variant's matched-null controls: remove the proposed driver (inadequacy signal / size gate / adhesion) and the transition must NOT fire. A transition that still fires on the clock alone is programmed, not emergent."
- figures: [fig-08]
  programmed_reading: 'forced constitutive positive pools — the "self-maintenance" is just hand-set source terms keeping every pool positive.'
  emergent_reading: 'operational closure — pools are maintained by mutual production/turnover, recover after perturbation, and collapse under closure-breaking ablations.'
  discriminator: 'define operational closure + boundary maintenance first; then test persistence across repeated perturbation and loss of viability after closure-breaking knockouts, against matched external-input/open-loop controls.'
- figures: [fig-11]
  programmed_reading: 'a preselected Gaussian fitness kernel with a linearly drifting optimum — the mean trait moving toward the optimum is expected BY DESIGN.'
  emergent_reading: 'discovered adaptation — selection response exceeds neutral drift over many seeds, fails when the optimum moves too fast, and tracks heritability/mutation.'
  discriminator: 'many-seed selection-vs-neutral comparison with a no-mutation/neutral control and an adaptation-failure regime; a single seeded rerun is reproducibility, not robustness.'
- figures: [fig-03, fig-04, fig-06]
  programmed_reading: 'fitted/proportional port mappings — each output port is an independent linear function of its own driver (no shared internal state).'
  emergent_reading: 'mechanistic physical transduction — outputs derive from shared internal state with conservation/feedback (fig-06 power identity + derived torque; fig-04 real field sink + depletion feedback; fig-03 shared energy/metabolism store coupling the ports).'
  discriminator: 'the mechanistic variant must show a conserved/derived coupling (identity closes, quantity is derived not imposed, perturbing one port propagates through shared state to others) that the proportional baseline cannot.'
what_this_does_not_demonstrate: >-
  These are the paper's FIGURES made executable, not validated cell models. Each `figNN-runnable`
  composite is a small didactic composition with toy-real, uncalibrated constants, chosen to make the
  figure's principle legible and playable within a short run — not fitted to any literature target.
  A passing behavior gate here means the figure's stated principle is reproduced on genuine simulation
  output, not that the underlying biology is quantitatively validated. Where a figure's pattern is
  taken to calibrated, spatially-resolved rigor, that work is the sibling investigation
  `draft-to-living-cell` (cross-linked per figure), and its own honest gaps — two of four physical
  interface modalities unrealized, framework-level rather than per-cell composition — apply there, not
  here. This investigation's claim is deliberately narrow: the paper's eleven figures run and execute
  their captions.
