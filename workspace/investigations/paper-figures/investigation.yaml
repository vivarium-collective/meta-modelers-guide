schema_version: 2
name: paper-figures
title: Executable Figures
created: '2026-08-26'
status: running  # scientific-review revision underway: H1 (executable) met for all 11; H2 (mechanistic) being established variant by variant
object_of_evaluation: figure-as-executable
runtime:
  default_emitter: sqlite
question: >-
  The meta-modeler's guide argues its case through eleven figures — each a BioRender illustration
  (panel a) paired with a process-bigraph diagram (panel b) that names the composition behind the
  biology. Are those diagrams merely drawn, or are they executable? This investigation asks one
  thing of every figure in the paper: does a runnable process-bigraph composite reproduce, under a
  behavior-gated test, the exact principle the figure's caption asserts — a process reading and
  writing typed ports (Fig 1), multi-timescale orchestration (Fig 2), a cellular interface that
  responds to its inputs (Fig 3), an environment that drives those ports (Fig 4), a viability
  crossing that swaps the active grain (Fig 5), a molecular mechanism exchanging through typed
  physical channels (Fig 6), nested hierarchical composites (Fig 7), a cellular interface that
  emerges from self-maintaining processes (Fig 8), division as a compositional rewrite (Fig 9), cells
  reorganizing into a collective (Fig 10), and a population evolving toward a selection optimum
  (Fig 11)? The subject is the figure; the claim is that the paper's diagrams run.
hypothesis: >-
  A TWO-LEVEL hypothesis, with separate verdicts (rewritten per the Oct-2026 scientific review, which
  asked us to stop conflating structural executability with mechanistic emergence).

  H1 (structural executability) — every panel-b diagram in the paper denotes a real, runnable,
  typed process-bigraph composition: for each of the eleven figures there is a `figNN-runnable`
  composite that builds through the workspace `build_core`, runs to completion through the engine, and
  reproduces the caption's stated principle under a behavior-gated test on genuine simulation output.
  REFUTED IF any figure's composite fails to build/run, or its behavior gate fails, or the readout it
  reports is not actually produced by the composition (e.g. a value hard-wired rather than computed).

  H2 (mechanistic emergence) — SELECTED figures additionally exhibit behaviour that ARISES from
  mechanistic coupling (shared internal state, conservation, feedback, derived rather than imposed
  quantities), not solely from imposed rules or a scripted schedule. This is tested only by the
  `figNN-mechanistic` variants (scientific-review revision), each with counterfactual/ablation
  controls and quantitative diagnostics. REFUTED FOR A FIGURE IF, under matched-null controls, the
  claimed behaviour persists when the proposed mechanism is removed (so the behaviour was scripted),
  or if a conservation/identity the mechanism should enforce fails, or if a quantity presented as
  derived is in fact an imposed constant.

  The two levels get SEPARATE verdicts: H1 is a software/behavioral claim (currently met for all
  eleven); H2 is a scientific claim met only where a mechanistic variant demonstrates it (in progress
  — fig-06 and fig-04 established, the rest under revision). The calibrated, spatially-resolved
  counterparts of these patterns live in the sibling investigation `draft-to-living-cell`.
lead: >-
  This investigation makes the meta-modeler's guide's own figures runnable. Where `draft-to-living-cell`
  takes the paper's composition patterns to calibrated, spatially-resolved rigor, this one takes the
  ELEVEN PUBLISHED FIGURES and shows that each panel-b bigraph diagram is a real composition that
  executes its caption's principle. Panels a (the BioRender illustrations) and the rendered b-panel
  diagrams are unchanged — this investigation adds the executable substance behind them: one runnable
  composite per figure, each behind a behavior gate that asserts the figure's claim on real simulation
  output. Fig 1's process moves a conserved quantity between wired stores; Fig 4's cell senses a
  diffusing nutrient gradient and drifts up it; Fig 5's grain selector flips coarse→fine as viability
  crosses its bound, biomass growing then decaying; Fig 9 divides one cell into two with stores
  partitioned; Fig 11's population evolves toward a shifting selection optimum. Figures fig-03 through
  fig-11 cross-link a rigorous spatially-resolved cousin in `draft-to-living-cell` via `parent_studies`;
  only fig-01 (interfaces & composition) and fig-02 (orchestration) stand on their didactic composite
  alone, being framework illustrations rather than cellular composition patterns. The baseline
  composites are toy-real demonstrations — small, illustrative, built to look like the figure and play
  forward — not fitted models, and every study states that plainly; the scientific-review revision adds
  `figNN-mechanistic` variants where the behaviour must arise from real coupling. The point is
  load-bearing but carefully scoped: the paper's figures are not just drawn, they run (H1), and selected
  figures run on genuine mechanism rather than scripted rules (H2).
executive:
  what_is_this: >-
    The publication figures for the meta-modeler's guide, upgraded from a figure bundle into a full
    evaluative investigation. Each figure keeps its BioRender illustration (panel a) and its
    bigraph-loom diagram (panel b) exactly as published, and now carries the executable substance
    behind that diagram: a runnable `figNN-runnable` process-bigraph composite plus a behavior-gated
    principle test that demonstrates the figure's caption on genuine simulation output. The organizing
    claim is that the paper's eleven figures are executable — every panel-b diagram denotes a real
    composition that runs and reproduces its stated principle, not a hand-drawn schematic. The
    investigation adds the runnable models, tests, and per-figure verdicts on top of the published
    panels. (The scientific-review revision additionally adds, for selected figures, a
    `figNN-mechanistic` variant whose behaviour arises from real coupling rather than imposed rules —
    see the two-level hypothesis and the per-study variants.)


    These are DIDACTIC, TOY-REAL compositions: small, illustrative, built to resemble the figure and
    play forward, with uncalibrated constants. That is deliberate — the figures are teaching artifacts,
    and their job is to make the paper's principle legible and playable, not to fit literature. The
    calibrated, spatially-resolved realizations of the same patterns (a Cellular Potts cell coupled to
    spatio-flux diffusion and dynamic-FBA, Turing patterns, emergent membranes) live in the sibling
    investigation `draft-to-living-cell`; seven of the eleven figures name their rigorous cousin there
    via `parent_studies`. Read this investigation as "the paper's figures execute their captions," and
    `draft-to-living-cell` as "the paper's patterns hold under calibrated spatial rigor."
  verdict: >-
    TWO SEPARATE VERDICTS (the scientific review asked that these not be conflated):

    SOFTWARE / STRUCTURAL (H1) — MET for all eleven figures. Every figure carries a runnable
    `figNN-runnable` composite and a behavior-gated principle test that builds, runs through the
    engine, and reproduces its caption on genuine simulation output: Fig 1 conserves a transferred
    quantity to <1e-9; Fig 2 runs two timescales through a shared store; Fig 3's typed ports each
    respond to their driver; Fig 4's cell senses a gradient and the sense→act loop closes; Fig 5's
    grain selector flips coarse→fine at the viability crossing; Fig 6's single proton flux drives four
    typed channels; Fig 7 preserves 6-level containment; Fig 8's coupled processes maintain a bounded
    pool set; Fig 9 divides one cell into two with DNA conserved; Fig 10 re-parents cells into a
    biofilm node; Fig 11's mean trait tracks a drifting optimum. All eleven behavior gates pass
    (verified by the committed test suite; NO independent rerun was performed as part of the scientific
    review — this verdict rests on the recorded gates, not a fresh re-execution by the reviewer).

    SCIENTIFIC / MECHANISTIC (H2) — IN PROGRESS, and varies by figure. Many baseline gates reproduce
    ENCODED behaviour (regression pins, algebraic/prescribed responses) and cannot by themselves
    establish biological emergence or causal mechanism. The `figNN-mechanistic` variants supply that
    evidence where present: fig-06 (torque, efficiency, stall and reversal DERIVED from Δp/ΔG/load;
    power identity closes; first-principles Δp* threshold predicted and verified) and fig-04 (real
    cell↔field feedback via a Michaelis–Menten sink carving a diffusing depletion well; mass ledger
    closes; matched-null controls isolate each arm) are established. The remaining priority figures
    (5, 8, 10, 11) and the accuracy/compositional figures (2, 3, 9, 1, 7) are under the same upgrade.
    Until a figure has a passing mechanistic variant with counterfactual controls, its scientific
    verdict is "executable and self-consistent, mechanism not yet demonstrated" — NOT biological
    validation, which remains the job of the sibling investigation `draft-to-living-cell`.
  verdict_status: in-progress
  key_figures:
  - fig-06
  - fig-04
  - fig-05
  decisions_needed:
