limitations:
- >-
  Every figure is realized by a didactic, toy-real composite with uncalibrated constants — the figures
  are made executable, not quantitatively validated. Each study states its own honest gap.
- >-
  The calibrated, spatially-resolved realizations of these patterns are the sibling investigation
  `draft-to-living-cell`; seven of eleven figures cross-link their rigorous cousin there, four stand
  alone by design as framework illustrations.
- >-
  A passing principle test asserts the figure's caption on genuine simulation output; it is not a
  claim about biological calibration, which is out of scope for the figure-as-executable object.
acceptance_criteria:
  note: >-
    Behavior tests are classified by EVIDENCE KIND (scientific-review taxonomy), because a passing gate
    means very different things depending on its kind. The kinds, weakest-to-strongest as scientific
    evidence: regression_pin (a numeric threshold set after observing the run — a rerun-guard, proves
    reproducibility only); invariant (a conservation/identity that must hold every step — proves
    self-consistency); numerical_convergence (a solver converges to a reference as dt/dx→0);
    empirical_comparison (a derived number checked against a literature/measured value);
    mechanistic_ablation (a counterfactual: remove a proposed mechanism and the behaviour must change);
    prospective_prediction (a threshold/outcome stated from first principles BEFORE the run, then
    verified). Baseline `figNN-runnable` gates are mostly regression_pin / acceptance_criterion
    (implementation verification); the `figNN-mechanistic` variants add invariant / empirical_comparison
    / mechanistic_ablation / prospective_prediction (mechanistic evidence). The investigation-level H1
    bar is qualitative (every figure's composite reproduces its caption under a passing gate); the H2
    bar is met per figure only when its mechanistic variant passes its ablation/derivation gates.
  prior_predictions:
  - >-
    Executable-figure prior — for each of the eleven figures there exists a `figNN-runnable` composite
    that runs to completion through the process-bigraph engine and whose dynamics reproduce the
    figure's caption principle under a passing behavior-gated test.
  - >-
    Conservation/coupling prior — where a figure asserts a conserved exchange or a driven coupling
    (Fig 1 transfer conserves total; Fig 4 environment drives the interface port; Fig 9 division
    partitions stores across daughters), the runnable composite exhibits it on measured output.
  status_reconciliation: >-
    Reconciling the counts the review flagged. There are TWO distinct count-bases, previously conflated:
    (1) BEHAVIOR-TEST ASSERTIONS — the ~70 pytest assertions across the eleven baseline test files
    (software gates; all green per the committed suite). (2) ACCEPTANCE CRITERIA — the qualitative
    investigation-level priors in this block (H1 executability + conservation/coupling). A validation
    summary reading "0 acceptance criteria examined" refers to count-base (2): the investigation does
    not encode machine-checkable acceptance_criterion gate objects, only the qualitative priors here —
    so an automated examiner finds zero AC objects even though all ~70 behavior assertions pass. The
    executive's "assertions" figure is count-base (1). Both are now stated explicitly so the two numbers
    no longer look contradictory.

    Status is in-progress, not complete/accepted, and the verdict is split (see executive): H1
    (all eleven executable) is met on the recorded behavior gates — NO independent re-execution was
    performed as part of the Oct-2026 scientific review, so this rests on the committed suite, not a
    fresh rerun. H2 (mechanistic emergence) is established only where a `figNN-mechanistic` variant
    passes its ablation/derivation gates (fig-06, fig-04 to date), and in progress elsewhere. Per-figure
    confidence stays Provisional: executable and (for the mechanistic variants) mechanistically
    supported, but not biologically calibrated — that rigor remains the sibling investigation
    `draft-to-living-cell`.
