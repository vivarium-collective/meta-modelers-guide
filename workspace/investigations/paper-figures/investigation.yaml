schema_version: 2
name: paper-figures
title: Executable Figures
created: '2026-08-26'
status: running  # scientific-review revision underway: H1 (executable) met for all 11; H2 (mechanistic) being established variant by variant
object_of_evaluation: figure-as-executable
runtime:
  default_emitter: sqlite
question: >-
  The meta-modeler's guide argues its case through eleven figures — each a BioRender illustration
  (panel a) paired with a process-bigraph diagram (panel b) that names the composition behind the
  biology. Are those diagrams merely drawn, or are they executable? This investigation asks one
  thing of every figure in the paper: does a runnable process-bigraph composite reproduce, under a
  behavior-gated test, the exact principle the figure's caption asserts — a process reading and
  writing typed ports (Fig 1), multi-timescale orchestration (Fig 2), a cellular interface that
  responds to its inputs (Fig 3), an environment that drives those ports (Fig 4), a viability
  crossing that swaps the active grain (Fig 5), a molecular mechanism exchanging through typed
  physical channels (Fig 6), nested hierarchical composites (Fig 7), a cellular interface that
  emerges from self-maintaining processes (Fig 8), division as a compositional rewrite (Fig 9), cells
  reorganizing into a collective (Fig 10), and a population evolving toward a selection optimum
  (Fig 11)? The subject is the figure; the claim is that the paper's diagrams run.
hypothesis: >-
  A TWO-LEVEL hypothesis, with separate verdicts (rewritten per the Oct-2026 scientific review, which
  asked us to stop conflating structural executability with mechanistic emergence).

  H1 (structural executability) — every panel-b diagram in the paper denotes a real, runnable,
  typed process-bigraph composition: for each of the eleven figures there is a `figNN-runnable`
  composite that builds through the workspace `build_core`, runs to completion through the engine, and
  reproduces the caption's stated principle under a behavior-gated test on genuine simulation output.
  REFUTED IF any figure's composite fails to build/run, or its behavior gate fails, or the readout it
  reports is not actually produced by the composition (e.g. a value hard-wired rather than computed).

  H2 (mechanistic emergence) — SELECTED figures additionally exhibit behaviour that ARISES from
  mechanistic coupling (shared internal state, conservation, feedback, derived rather than imposed
  quantities), not solely from imposed rules or a scripted schedule. This is tested only by the
  `figNN-mechanistic` variants (scientific-review revision), each with counterfactual/ablation
  controls and quantitative diagnostics. REFUTED FOR A FIGURE IF, under matched-null controls, the
  claimed behaviour persists when the proposed mechanism is removed (so the behaviour was scripted),
  or if a conservation/identity the mechanism should enforce fails, or if a quantity presented as
  derived is in fact an imposed constant.

  The two levels get SEPARATE verdicts: H1 is a software/behavioral claim (currently met for all
  eleven); H2 is a scientific claim met only where a mechanistic variant demonstrates it (in progress
  — fig-06 and fig-04 established, the rest under revision). The calibrated, spatially-resolved
  counterparts of these patterns live in the sibling investigation `draft-to-living-cell`.
lead: >-
  This investigation makes the meta-modeler's guide's own figures runnable. Where `draft-to-living-cell`
  takes the paper's composition patterns to calibrated, spatially-resolved rigor, this one takes the
  ELEVEN PUBLISHED FIGURES and shows that each panel-b bigraph diagram is a real composition that
  executes its caption's principle. Panels a (the BioRender illustrations) and the rendered b-panel
  diagrams are unchanged — this investigation adds the executable substance behind them: one runnable
  composite per figure, each behind a behavior gate that asserts the figure's claim on real simulation
  output. Fig 1's process moves a conserved quantity between wired stores; Fig 4's cell senses a
  diffusing nutrient gradient and drifts up it; Fig 5's grain selector flips coarse→fine as viability
  crosses its bound, biomass growing then decaying; Fig 9 divides one cell into two with stores
  partitioned; Fig 11's population evolves toward a shifting selection optimum. Figures fig-03 through
  fig-11 cross-link a rigorous spatially-resolved cousin in `draft-to-living-cell` via `parent_studies`;
  only fig-01 (interfaces & composition) and fig-02 (orchestration) stand on their didactic composite
  alone, being framework illustrations rather than cellular composition patterns. The baseline
  composites are toy-real demonstrations — small, illustrative, built to look like the figure and play
  forward — not fitted models, and every study states that plainly; the scientific-review revision adds
  `figNN-mechanistic` variants where the behaviour must arise from real coupling. The point is
  load-bearing but carefully scoped: the paper's figures are not just drawn, they run (H1), and selected
  figures run on genuine mechanism rather than scripted rules (H2).
biological_story: >-
  The eleven figures trace one biological arc: how the properties of a living cell are built up,
  compositionally, from simpler typed processes. It begins with the bare machinery of composition --
  a process that reads and writes typed ports (Fig 1) and the multi-timescale orchestration that runs
  several such processes together (Fig 2) -- then adds the biology a cell needs: a membrane interface
  that responds to its inputs (Fig 3), an environment whose gradients drive those ports (Fig 4), a
  viability crossing that switches which grain of description is active as the cell grows and decays
  (Fig 5), a molecular mechanism exchanging matter through typed physical channels (Fig 6), and nested
  hierarchical composites that let a cell contain its own subsystems (Fig 7). The last four figures
  close the loop from molecule to population: a cellular interface that emerges from self-maintaining
  processes rather than being imposed (Fig 8), division as a compositional rewrite that partitions a
  cell's stores into two (Fig 9), many cells reorganizing into a collective (Fig 10), and a population
  evolving toward a selection optimum (Fig 11). The through-line is mechanistic composition: each
  biological capability is not drawn on top of the previous one but emerges from the typed coupling of
  the processes beneath it -- conserved quantities moving between wired stores, derived rather than
  imposed readouts, feedback and self-maintenance -- which is exactly what the figNN-mechanistic
  variants test under matched-null controls.
executive:
  what_is_this: >-
    The publication figures for the meta-modeler's guide, upgraded from a figure bundle into a full
    evaluative investigation. Each figure keeps its BioRender illustration (panel a) and its
    bigraph-loom diagram (panel b) exactly as published, and now carries the executable substance
    behind that diagram: a runnable `figNN-runnable` process-bigraph composite plus a behavior-gated
    principle test that demonstrates the figure's caption on genuine simulation output. The organizing
    claim is that the paper's eleven figures are executable — every panel-b diagram denotes a real
    composition that runs and reproduces its stated principle, not a hand-drawn schematic. The
    investigation adds the runnable models, tests, and per-figure verdicts on top of the published
    panels. (The scientific-review revision additionally adds, for selected figures, a
    `figNN-mechanistic` variant whose behaviour arises from real coupling rather than imposed rules —
    see the two-level hypothesis and the per-study variants.)


    These are DIDACTIC, TOY-REAL compositions: small, illustrative, built to resemble the figure and
    play forward, with uncalibrated constants. That is deliberate — the figures are teaching artifacts,
    and their job is to make the paper's principle legible and playable, not to fit literature. The
    calibrated, spatially-resolved realizations of the same patterns (a Cellular Potts cell coupled to
    spatio-flux diffusion and dynamic-FBA, Turing patterns, emergent membranes) live in the sibling
    investigation `draft-to-living-cell`; seven of the eleven figures name their rigorous cousin there
    via `parent_studies`. Read this investigation as "the paper's figures execute their captions," and
    `draft-to-living-cell` as "the paper's patterns hold under calibrated spatial rigor."
  verdict: >-
    TWO SEPARATE VERDICTS (the scientific review asked that these not be conflated):

    SOFTWARE / STRUCTURAL (H1) — MET for all eleven figures. Every figure carries a runnable
    `figNN-runnable` composite and a behavior-gated principle test that builds, runs through the
    engine, and reproduces its caption on genuine simulation output: Fig 1 conserves a transferred
    quantity to <1e-9; Fig 2 runs two timescales through a shared store; Fig 3's typed ports each
    respond to their driver; Fig 4's cell senses a gradient and the sense→act loop closes; Fig 5's
    grain selector flips coarse→fine at the viability crossing; Fig 6's single proton flux drives four
    typed channels; Fig 7 preserves 6-level containment; Fig 8's coupled processes maintain a bounded
    pool set; Fig 9 divides one cell into two with DNA conserved; Fig 10 re-parents cells into a
    biofilm node; Fig 11's mean trait tracks a drifting optimum. All eleven behavior gates pass
    (verified by the committed test suite; NO independent rerun was performed as part of the scientific
    review — this verdict rests on the recorded gates, not a fresh re-execution by the reviewer).

    SCIENTIFIC / MECHANISTIC (H2) — IN PROGRESS, and varies by figure. Many baseline gates reproduce
    ENCODED behaviour (regression pins, algebraic/prescribed responses) and cannot by themselves
    establish biological emergence or causal mechanism. The `figNN-mechanistic` variants supply that
    evidence where present: fig-06 (torque, efficiency, stall and reversal DERIVED from Δp/ΔG/load;
    power identity closes; first-principles Δp* threshold predicted and verified) and fig-04 (real
    cell↔field feedback via a Michaelis–Menten sink carving a diffusing depletion well; mass ledger
    closes; matched-null controls isolate each arm) are established. The remaining priority figures
    (5, 8, 10, 11) and the accuracy/compositional figures (2, 3, 9, 1, 7) are under the same upgrade.
    Until a figure has a passing mechanistic variant with counterfactual controls, its scientific
    verdict is "executable and self-consistent, mechanism not yet demonstrated" — NOT biological
    validation, which remains the job of the sibling investigation `draft-to-living-cell`.
  verdict_status: in-progress
  key_figures:
    - fig-06
    - fig-04
    - fig-05
  decisions_needed:
    - >-
      H1 (all figures executable) is met; H2 (mechanistic emergence) is being established variant by
      variant. Each figure's scientific verdict should be read from its mechanistic variant (where one
      exists) and its two-layer `conclusion_verdicts`, not from the software-gate pass alone.
    - >-
      Baseline gates that reproduce algebraic or prescribed responses are IMPLEMENTATION VERIFICATION,
      not mechanistic evidence; where a figure's claim is "emergence" (fig-05/08/09/10/11) the competing
      programmed-vs-emergent interpretation (see `competing_interpretations`) must be resolved by the
      mechanistic variant's ablations before any emergence claim stands.
    - >-
      Two figures (fig-01 interfaces & composition, fig-02 orchestration) have no calibrated cousin in
      `draft-to-living-cell` — they stand on their didactic/mechanistic composite alone by design, being
      framework illustrations rather than cellular composition patterns. (fig-07 nested hierarchy DOES
      participate in the spine via its interface dependency; it is not standalone.)
    - >-
      Evidence-ledger gap (rigor, not science): every figure's behavior gate is authored as passed with
      a committed test suite, but the per-test outcome ledger the discovery engine reads is empty, so
      its coded roll-up is BLOCKED and the authored verdict (qualified) diverges from it. This is the
      machine-readable form of the H1 caveat above — the verdicts rest on recorded gates, not a fresh
      re-execution. The honest next action is to re-run each figNN-runnable composite and record graded
      behavior-test outcomes so the coded roll-up confirms the authored verdict on fresh evidence.
scientific_argument:
  main_claim: >-
    The eleven figures of the meta-modeler's guide are executable artifacts, not
    just illustrations. Each figure's panel-b process-bigraph diagram denotes a
    real, registered composition (`figNN-runnable`) that runs through the
    workspace's own `build_core`, and when it runs it reproduces the principle the
    figure's caption states — checked by a behavior-gated test, not asserted. The
    claim is about executability (the diagram is a runnable specification), not
    biological calibration; the sibling investigation `draft-to-living-cell`
    carries each pattern to spatially-resolved, controlled rigor.
  evidence_for:
    - >-
      fig-01 (interfaces & composition) — the paper's definitional figure runs: one
      typed `StoreTransfer` wired source→sink conserves total amount to 1e-9 at every
      tick, so the minimal composition the whole guide is built from is itself an
      executable, conservation-respecting object.
    - >-
      fig-05 (disintegration) — the grain-swap payoff: one shared biomass/energy
      interface realized at three grains gives biomass 4.0 / 2.67 / 6.29
      (coarse / kinetic / real-COBRApy dFBA), and only the FBA grain shows acetate
      overflow (secretions 30.45 vs 1.6) — the figure's "same interface, different
      grain" principle, measured off the engine (workbench 0.4.1).
    - >-
      fig-06 (molecular interface) — the F₁Fₒ ATP synthase as one process exposing
      four typed physical ports (chemical / electrical / mechanical / thermal) from a
      single proton flux; the driven `fig06-runnable` sweeps the output 20→128 as the
      proton-motive drive ramps, so the four modalities are one coupled device, not
      four drawn arrows.
    - >-
      fig-08 (self-organized processes) — the minimal cell, inert on the old engine,
      now grows across its coupled stores on workbench 0.4.1 (membrane 0.2→1.4,
      protein pool 0.3→1.57, energy 0.5→0.87), isolated by two process-knockout
      controls — containment, metabolism, gene expression, replication and diffusion
      composing into a maintained whole.
    - >-
      fig-09 (growth & division) as a genuine place-graph rewrite over a colony
      `tree[node]` with exact DNA conservation + equipartition at every division
      event, and fig-10 / fig-11 (development / evolution) as real runtime structure
      changes (attachment preserving cell count and biomass; a population tree with
      standing trait variation) rather than redrawn pictures.
  evidence_against:
    - >-
      Every `figNN-runnable` composite is didactic and uncalibrated — toy-real
      constants chosen to make the principle legible in a short run, not fitted to any
      organism or literature target. A passing gate shows the figure's principle is
      reproduced on genuine output, not that the biology is quantitatively validated.
    - >-
      fig-11 (evolution) is a structural figure: its executable carries only a
      `population`/`environment` tree with no scalar time-series, so its evidence is
      population-tree snapshots, not a dynamics curve.
    - >-
      The bare-draft `fig06-executable` output is flat (chemical_out pinned at the
      k_cat constant 100.0) — the figure's behavior lives in the driven
      `fig06-runnable`, so the executability claim rests on the runnable composite plus
      its driver, not the inert draft alone.
    - >-
      Several figures realize only part of their full biology (two of the four
      physical interface modalities stay unrealized where they appear); per-study
      confidence is held at Provisional throughout — the figures execute, but their
      scientific validation is the sibling investigation's job.
  key_figures:   # aligned with executive.key_figures (reconciled per review): the mechanistic exemplars
    - fig-06
    - fig-04
    - fig-05
  caveats:
    - >-
      Executable is not the same as validated: this investigation's claim is narrow —
      the paper's eleven figures run and reproduce their captions — and deliberately
      stops short of biological fidelity.
    - >-
      All numbers are from workbench 0.4.1 didactic composites; the prior figure
      bundle's values predate the engine update and were refreshed where they drifted.
competing_frameworks:
  - name: >-
      Figures-as-illustration (the view this investigation discriminates against)
    prediction: >-
      On the illustration view, a paper figure is a drawing: its panel-b diagram
      documents an idea for a human reader but is not itself a runnable object — you
      could not press play on the diagram and recover the behavior the caption claims,
      because the composition it depicts was never executable. This investigation
      discriminates against that view: every panel-b diagram here is a registered
      process-bigraph composite that runs through the workspace core and reproduces
      its figure's stated principle under a behavior-gated test, so the eleven
      diagrams are executable specifications, not pictures of one.
# ── Study-graph spine (scientific-review revision) ────────────────────────────
# The 11 figures were previously edgeless (no fig→fig dependencies). These edges
# record justified compositional/conceptual dependencies WITHOUT claiming model-level
# code reuse that does not exist (a figNN composite does not import figMM's code).
# relation ∈ {builds-on, tests, motivates, methodological-branch}. The per-study
# parent_studies carry the same edges in the {study, condition} form the schema allows;
# this block carries the relation + rationale the schema cannot.
spine_edges:
  - from: fig-01
    to: [fig-02, fig-03, fig-06, fig-07]
    relation: builds-on
    rationale: 'fig-01 defines the typed source→store→sink wiring + conservation discipline every later composition instantiates (orchestration, the cellular interface, the molecular interface, nesting).'
  - from: fig-03
    to: fig-04
    relation: builds-on
    rationale: "fig-04 places fig-03's typed cell interface in a spatial environment whose driver is a diffusing field the cell senses AND depletes."
  - from: [fig-03, fig-06, fig-07]
    to: fig-08
    relation: builds-on
    rationale: 'self-maintenance (fig-08) composes the cellular interface (fig-03), molecular energetics (fig-06), and nested containment (fig-07) into a coupled whole.'
  - from: fig-08
    to: fig-09
    relation: builds-on
    rationale: 'division (fig-09) acts on a self-maintaining cell (fig-08): a maintained interior is what gets partitioned.'
  - from: fig-09
    to: [fig-10, fig-11]
    relation: builds-on
    rationale: 'development (fig-10) and evolution (fig-11) both require reproduction (fig-09): a collective forms from dividing cells; a population evolves through heritable division.'
  - from: fig-05
    to:
    relation: methodological-branch
    rationale: 'fig-05 (grain switch) is a METHODOLOGICAL branch about changing model resolution, not a biological stage in the geometry→…→population chain; it is deliberately off the linear spine.'
# ── Competing causal interpretations (scientific-review "contradictions") ─────
# For each figure whose baseline could be read as "emergence", the explicit rival
# reading, and how the mechanistic variant discriminates (via ablation/derivation).
competing_interpretations:
  - figures: [fig-05, fig-09, fig-10]
    programmed_reading: 'a scheduled/scripted event — a grain switch at a fixed tick (5), a division at a set size (9), an attachment/ECM rewrite on a wall clock (10).'
    emergent_reading: 'a state-triggered transition — grain refinement driven by quantified model inadequacy (5), division gated by a physiological size/resource condition (9), aggregation from local adhesion + proximity (10).'
    discriminator: "the mechanistic variant's matched-null controls: remove the proposed driver (inadequacy signal / size gate / adhesion) and the transition must NOT fire. A transition that still fires on the clock alone is programmed, not emergent."
  - figures: [fig-08]
    programmed_reading: 'forced constitutive positive pools — the "self-maintenance" is just hand-set source terms keeping every pool positive.'
    emergent_reading: 'operational closure — pools are maintained by mutual production/turnover, recover after perturbation, and collapse under closure-breaking ablations.'
    discriminator: 'define operational closure + boundary maintenance first; then test persistence across repeated perturbation and loss of viability after closure-breaking knockouts, against matched external-input/open-loop controls.'
  - figures: [fig-11]
    programmed_reading: 'a preselected Gaussian fitness kernel with a linearly drifting optimum — the mean trait moving toward the optimum is expected BY DESIGN.'
    emergent_reading: 'discovered adaptation — selection response exceeds neutral drift over many seeds, fails when the optimum moves too fast, and tracks heritability/mutation.'
    discriminator: 'many-seed selection-vs-neutral comparison with a no-mutation/neutral control and an adaptation-failure regime; a single seeded rerun is reproducibility, not robustness.'
  - figures: [fig-03, fig-04, fig-06]
    programmed_reading: 'fitted/proportional port mappings — each output port is an independent linear function of its own driver (no shared internal state).'
    emergent_reading: 'mechanistic physical transduction — outputs derive from shared internal state with conservation/feedback (fig-06 power identity + derived torque; fig-04 real field sink + depletion feedback; fig-03 shared energy/metabolism store coupling the ports).'
    discriminator: 'the mechanistic variant must show a conserved/derived coupling (identity closes, quantity is derived not imposed, perturbing one port propagates through shared state to others) that the proportional baseline cannot.'
what_this_does_not_demonstrate: >-
  These are the paper's FIGURES made executable, not validated cell models. Each `figNN-runnable`
  composite is a small didactic composition with toy-real, uncalibrated constants, chosen to make the
  figure's principle legible and playable within a short run — not fitted to any literature target.
  A passing behavior gate here means the figure's stated principle is reproduced on genuine simulation
  output, not that the underlying biology is quantitatively validated. Where a figure's pattern is
  taken to calibrated, spatially-resolved rigor, that work is the sibling investigation
  `draft-to-living-cell` (cross-linked per figure), and its own honest gaps — two of four physical
  interface modalities unrealized, framework-level rather than per-cell composition — apply there, not
  here. This investigation's claim is deliberately narrow: the paper's eleven figures run and execute
  their captions.
