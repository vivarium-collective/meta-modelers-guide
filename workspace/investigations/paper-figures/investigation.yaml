limitations:
- >-
  Every figure is realized by a didactic, toy-real composite with uncalibrated constants — the figures
  are made executable, not quantitatively validated. Each study states its own honest gap.
- >-
  The calibrated, spatially-resolved realizations of these patterns are the sibling investigation
  `draft-to-living-cell`; seven of eleven figures cross-link their rigorous cousin there, four stand
  alone by design as framework illustrations.
- >-
  A passing principle test asserts the figure's caption on genuine simulation output; it is not a
  claim about biological calibration, which is out of scope for the figure-as-executable object.
acceptance_criteria:
  note: >-
    Each figure study carries behavior tests tagged by kind — regression_pin (a numeric threshold set
    after observing the run, a rerun-guard) versus acceptance_criterion (a directional prior stateable
    before the run). The investigation-level bar is qualitative: for every one of the paper's eleven
    figures, a runnable composite reproduces the caption's stated principle under a passing behavior
    gate on real simulation output.
  prior_predictions:
  - >-
    Executable-figure prior — for each of the eleven figures there exists a `figNN-runnable` composite
    that runs to completion through the process-bigraph engine and whose dynamics reproduce the
    figure's caption principle under a passing behavior-gated test.
  - >-
    Conservation/coupling prior — where a figure asserts a conserved exchange or a driven coupling
    (Fig 1 transfer conserves total; Fig 4 environment drives the interface port; Fig 9 division
    partitions stores across daughters), the runnable composite exhibits it on measured output.
  status_reconciliation: >-
    Per-figure confidence is Provisional (principle gates pass as behavior tests, most as regression
    pins; these are didactic demonstrations, not calibrated models). All eleven studies are built and
    green (70 principle-test assertions across the eleven test files, all passing), so the investigation
    status is complete and the executive verdict_status is accepted — one consistent signal. "Accepted"
    means the narrow figure-as-executable claim is proven, NOT that the underlying biology is
    calibrated; that rigor is the sibling investigation `draft-to-living-cell`.
