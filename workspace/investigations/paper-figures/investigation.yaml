schema_version: 2
name: paper-figures
title: Paper Figures (final — download here)
created: '2026-08-26'
status: complete
object_of_evaluation: figure-as-executable
runtime:
  default_emitter: sqlite
question: >-
  The meta-modeler's guide argues its case through eleven figures — each a BioRender illustration
  (panel a) paired with a process-bigraph diagram (panel b) that names the composition behind the
  biology. Are those diagrams merely drawn, or are they executable? This investigation asks one
  thing of every figure in the paper: does a runnable process-bigraph composite reproduce, under a
  behavior-gated test, the exact principle the figure's caption asserts — a process reading and
  writing typed ports (Fig 1), multi-timescale orchestration (Fig 2), a cellular interface that
  responds to its inputs (Fig 3), an environment that drives those ports (Fig 4), a viability
  crossing that swaps the active grain (Fig 5), a molecular mechanism exchanging through typed
  physical channels (Fig 6), nested hierarchical composites (Fig 7), a cellular interface that
  emerges from self-maintaining processes (Fig 8), division as a compositional rewrite (Fig 9), cells
  reorganizing into a collective (Fig 10), and a population evolving toward a selection optimum
  (Fig 11)? The subject is the figure; the claim is that the paper's diagrams run.
hypothesis: >-
  Every panel-b diagram in the paper denotes a real, runnable composition, and each figure's stated
  principle holds when that composition is executed. For each of the eleven figures there is a
  didactic `figNN-runnable` composite whose dynamics demonstrate the caption's claim on genuine
  simulation output — a store drains while another fills and total is conserved, a fast process
  outpaces a slow one through a shared store, a port tracks its driving input, a diffusing field
  drives uptake and up-gradient drift, viability crossing flips coarse→fine so biomass grows then
  decays, a proton-motive force drives torque drives ATP, a process moves quantity in a nested store,
  coupled processes mutually maintain a shared steady state, a division rewrite partitions stores into
  two daughters, cells nest into a collective composite, and a population's mean trait shifts toward a
  drifting niche optimum. These are illustrative, toy-real compositions built to make each figure
  playable; the calibrated, spatially-resolved counterparts live in the sibling investigation
  `draft-to-living-cell`, which each figure cross-links as its rigorous cousin. The narrow, honest
  claim is that the paper's figures are executable, not that they are quantitatively validated models.
lead: >-
  This investigation makes the meta-modeler's guide's own figures runnable. Where `draft-to-living-cell`
  takes the paper's composition patterns to calibrated, spatially-resolved rigor, this one takes the
  ELEVEN PUBLISHED FIGURES and shows that each panel-b bigraph diagram is a real composition that
  executes its caption's principle. Panels a (the BioRender illustrations) and the rendered b-panel
  diagrams are unchanged — this investigation adds the executable substance behind them: one runnable
  composite per figure, each behind a behavior gate that asserts the figure's claim on real simulation
  output. Fig 1's process moves a conserved quantity between wired stores; Fig 4's cell senses a
  diffusing nutrient gradient and drifts up it; Fig 5's grain selector flips coarse→fine as viability
  crosses its bound, biomass growing then decaying; Fig 9 divides one cell into two with stores
  partitioned; Fig 11's population evolves toward a shifting selection optimum. Seven of the eleven
  figures have a rigorous cousin in `draft-to-living-cell` and cross-link to it via `parent_studies`;
  the other four (interfaces & composition, orchestration, nested hierarchy) stand on their own
  didactic composite. These are toy-real demonstrations — small, illustrative, built to look like the
  figure and play forward — not fitted models, and every study states that plainly. The point is
  modest and load-bearing: the paper's figures are not just drawn, they run.
executive:
  what_is_this: >-
    The publication figures for the meta-modeler's guide, upgraded from a figure bundle into a full
    evaluative investigation. Each figure keeps its BioRender illustration (panel a) and its
    bigraph-loom diagram (panel b) exactly as published, and now carries the executable substance
    behind that diagram: a runnable `figNN-runnable` process-bigraph composite plus a behavior-gated
    principle test that demonstrates the figure's caption on genuine simulation output. The organizing
    claim is that the paper's eleven figures are executable — every panel-b diagram denotes a real
    composition that runs and reproduces its stated principle, not a hand-drawn schematic. The figures
    remain downloadable as a bundle under `final/`; the investigation adds the runnable models, tests,
    and per-figure verdicts on top of them.


    These are DIDACTIC, TOY-REAL compositions: small, illustrative, built to resemble the figure and
    play forward, with uncalibrated constants. That is deliberate — the figures are teaching artifacts,
    and their job is to make the paper's principle legible and playable, not to fit literature. The
    calibrated, spatially-resolved realizations of the same patterns (a Cellular Potts cell coupled to
    spatio-flux diffusion and dynamic-FBA, Turing patterns, emergent membranes) live in the sibling
    investigation `draft-to-living-cell`; seven of the eleven figures name their rigorous cousin there
    via `parent_studies`. Read this investigation as "the paper's figures execute their captions," and
    `draft-to-living-cell` as "the paper's patterns hold under calibrated spatial rigor."
  verdict: >-
    The claim holds: all eleven of the paper's figures are executable. Every figure now carries a
    runnable `figNN-runnable` process-bigraph composite and a behavior-gated principle test that
    reproduces its caption on genuine simulation output — Fig 1 moves a conserved quantity between
    wired stores (total invariant to <1e-9, exact geometric decay); Fig 2 runs two timescales through
    a shared store with `molecules + biomass == time` conserved and a 3-step slow staircase; Fig 3's
    typed physical ports each respond linearly to their own driver and viability collapses at 45 °C;
    Fig 4's cell senses a diffusing gradient, the sense→act loop closes through the shared store (exact
    mass↔uptake ledger), and it drifts up-gradient; Fig 5's grain selector flips coarse→fine at the
    viability crossing so biomass grows then decays; Fig 6's single proton flux drives four typed
    channels with the matter⇒charge⇒energy identities closing to 1e-30 (torque N·m, not force); Fig 7
    preserves 6-level place-graph containment while deep processes move quantity in nested stores;
    Fig 8's coupled processes mutually maintain a bounded steady state (two reciprocal knockouts each
    freeze the other's input); Fig 9 divides one cell into two with total DNA conserved and
    equipartitioned; Fig 10 re-parents free cells one level deeper into a new biofilm collective node;
    Fig 11's population mean trait tracks a drifting niche optimum while binary fission replaces each
    parent with two fresh daughters (`appeared == 2·vanished`). Ten of eleven composites are fully
    deterministic; every behavior gate passes. These are didactic, toy-real demonstrations — the paper's
    figures made to run, not calibrated cell models — with seven of eleven cross-linking their
    calibrated cousin in `draft-to-living-cell`. The narrow claim is proven: the paper's figures are
    executable, not merely drawn.
  verdict_status: accepted
  key_figures:
  - fig-04
  - fig-05
  - fig-11
  decisions_needed:
  - >-
    Every figure is realized by a didactic toy-real composite, not a calibrated model; the honest
    depth gap is owned per study and the rigorous cousin is cross-linked in `draft-to-living-cell`.
  - >-
    Four figures (fig-01 interfaces & composition, fig-02 orchestration, fig-07 nested hierarchy) have
    no calibrated cousin — they stand on their didactic composite alone by design, being framework
    illustrations rather than cellular composition patterns.
what_this_does_not_demonstrate: >-
  These are the paper's FIGURES made executable, not validated cell models. Each `figNN-runnable`
  composite is a small didactic composition with toy-real, uncalibrated constants, chosen to make the
  figure's principle legible and playable within a short run — not fitted to any literature target.
  A passing behavior gate here means the figure's stated principle is reproduced on genuine simulation
  output, not that the underlying biology is quantitatively validated. Where a figure's pattern is
  taken to calibrated, spatially-resolved rigor, that work is the sibling investigation
  `draft-to-living-cell` (cross-linked per figure), and its own honest gaps — two of four physical
  interface modalities unrealized, framework-level rather than per-cell composition — apply there, not
  here. This investigation's claim is deliberately narrow: the paper's eleven figures run and execute
  their captions.
