glossary:
- term: Cellular Potts Model (CPM)
  definition: A lattice-based cell-shape simulation framework (here, viva-cpm, a Rust-backed
    engine) in which cells occupy sets of pixels and evolve their shape, adhesion, and volume
    by energy-minimizing Monte Carlo pixel copies, rather than being represented as a scalar
    state bundle.
- term: Spatio-flux
  definition: A process-bigraph-native package providing spatial reaction-diffusion-advection
    PDE processes (`DiffusionAdvection`) and spatial dynamic flux-balance analysis
    (`DynamicFBA`) over a 2D field grid.
- term: CpmCellField
  definition: 'The coupling process this investigation''s flagship builds: a process-bigraph
    Process that owns a viva-cpm world object, reads a shared spatio-flux `fields` grid at the
    CPM cell''s current footprint, runs one dynamic-FBA step there, grows the CPM cell''s target
    volume from the resulting biomass, and writes the uptake/secretion back into the field as a
    spatial delta. The typed interface the paper''s composition claim is made concrete through.'
- term: Niche construction
  definition: The cell measurably reshaping the very environmental gradient it depends on — here,
    the CPM cell's footprint measurably depleting the local glucose field before diffusion
    partially resupplies it.
- term: Toy-real
  definition: Plausible, hand-tuned constants (e.g. glucose_km, glucose_vmax, oxygen_vmax,
    box_volume_L, grow_per_biomass) chosen to produce legible, gradual dynamics over a short
    run — not fitted to a named organism, medium, or literature target.
- term: Spatial counterpart / analogue
  definition: A study in this investigation that realizes the same composition pattern as a
    named study in draft-to-living-cell, but with real 2D spatial frameworks (CPM, spatio-flux,
    and future reaction-diffusion/phase-field processes) instead of lumped ODEs and scripted
    events.
guidelines:
  literature_anchors:
  - Agmon — A meta-modeler's guide to the cellular interface and its composition patterns (the
    source paper; the same nine composition patterns as draft-to-living-cell).
  - Agmon & Spangler — Process Bigraphs and the Architecture of Compositional Systems Biology
    (arXiv:2512.23754 — the spatio-flux worked example this investigation's flagship draws its
    field-coupling pattern from).
  naming_conventions: 'Studies are named after their draft-to-living-cell analogue with a

    `-spatial` suffix where the base slug would otherwise collide (cell-environment-coupling ->

    cell-environment-coupling-spatial); the flagship composite is

    `meta_modelers_guide.composites.single-cell-in-a-field`, discovered by the workbench

    at that dotted stem under `meta_modelers_guide/composites/single-cell-in-a-field.composite.json`

    (the dash in the final segment produces the known composite-name-regex lint WARN also seen on

    draft-to-living-cell''s fig06-* composites — an accepted, pre-existing convention, not a new

    error class).

    '
