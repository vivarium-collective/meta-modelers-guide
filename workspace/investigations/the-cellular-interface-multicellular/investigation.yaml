limitations:
- 4 of the 9 planned studies are built and run (the flagship cell-environment-coupling-spatial,
  plus cell-cell-coupling-spatial, disintegration-spatial, and growth-and-division-spatial); the
  remaining patterns are a named increment plan in the design spec, not results — see
  decisions_needed above.
- Chemotaxis (directed motion up the sensed gradient) is deferred to a follow-up variant of the
  flagship composite; the current flagship cell senses, metabolizes, grows, and secretes, but
  does not chemotax.
- All mechanisms are toy-real (plausible, hand-tuned constants), matching draft-to-living-cell's
  own honesty convention — not calibrated to any named organism, medium, or literature target.
- 'The CPM lattice/world lives inside viva-cpm''s Rust engine as a private object the coupling
  process owns; it is not a process-bigraph store and is not exposed or written to by any other
  process in the composite. The metabolized/diffused field is exclusively the spatio-flux
  `fields` store.'
- A viva-cpm force/mechanical-interface module (deriving effective forces from CPM adhesion,
  volume, and surface energies) is planned as a post-flagship increment (a viva-cpm upstream PR)
  and does not exist yet; no study here currently demonstrates a mechanical-interface channel.
