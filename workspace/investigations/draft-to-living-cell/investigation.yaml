    mechanical, electrical, and thermal exchange ports plus growth, shape, objective, and
    viability. Home of law 1 conformance: the one impostor handler in this codebase is rejected
    at compile time with a CompileError naming the missing ports; that impostor lives in the
    metabolism code, cross-referenced from disintegration.'
- study: cell-environment-coupling
  role: 'Fig 5''s sense/act loop closed over a real diffusing spatial field — the cell depletes
    and reshapes the very chemical gradient it depends on (niche construction), interface
    preserved unchanged (law 2).'
- study: cell-cell-coupling
  role: 'No figure of its own — two cells wired over one shared nutrient store negotiate
    viability: competition starves the weaker cell while the stronger persists; a different
    handler over the identical interface (cross-feeding) keeps both alive (law 4).'
- study: disintegration
  role: 'THE FLAGSHIP (Fig 6) — PLAYABLE: a level-shift you can step through — thermal shock,
    viability collapse, biomass turning to debris. STRUCTURAL: the cell-to-molecular-network
    grain-swap, carrying coarse, kinetic, and real COBRApy FBA metabolism behind one interface
    that never moves (law 4).'
- study: molecular-interfaces
  role: 'Fig 7''s F1Fo ATP-synthase mechanism drives all four physical channels — chemical,
    electrical, mechanical, thermal — from one coupled proton flux; the molecular grain
    disintegration drops into, made concrete.'
- study: biomolecular-complementarity
  role: 'Fig 8''s six-level nested place graph (membrane, cytoplasm, nucleus, chromosome,
    chromatin, nucleosome) with a coupled gene-expression cascade wired to the deepest leaf;
    interface preserved at the deepest nesting (law 2). Selectivity is narrated, assembly is
    demonstrated.'
- study: autopoiesis
  role: 'Fig 9''s metabolism, containment, and replication compile into mutual closure toward a
    minimal cell — law 4''s second grain-swap home. The closure PATTERN, demonstrated
    qualitatively, not validated autopoiesis.'
- study: growth-and-division
  role: 'Fig 10a,b — growth (autocatalytic, energy-coupled) drives the cell''s own DNA past a
    threshold; crossing it fires a genuine place-graph rewrite, one cell node becoming two, mass
    conserved (parent halved, not duplicated) — law 2''.'
- study: development-and-evolution
  role: 'Fig 10c-f — biofilm nesting and port-addition/selection as event-driven rewrites,
    including genuine node-inserting "Live Topology" pairs. EXPLICITLY caveated pattern demos
    (gate: needs_calibration) — the paper itself calls this transition "an open and substantial
    challenge."'
how_to_read: 'Read the 9 studies in the paper''s own order — cellular-interface, cell-environment-

  coupling, cell-cell-coupling, disintegration, molecular-interfaces, biomolecular-complementarity,

  autopoiesis, growth-and-division, development-and-evolution — the arc runs from the interface

  itself, through where it couples and where it breaks, down to the molecular mechanisms that

  maintain it, and back up through growth, division, and the harder, honestly-caveated

  transitions of development and evolution.


  In each study, look at two things side by side: the DRAFT render (the loom figure — the

  structural interface, no dynamics) and the EXECUTABLE dynamics (the same interface, now

  running). The investigation''s sharpest control is the compiler''s IMPOSTOR-REJECTION, exercised

  in the cellular-interface/disintegration metabolism code: a handler that breaks the port

  contract is refused at compile time with a CompileError naming the missing ports — that is the

  interface being enforced, not merely described.


  Short on time? Read cellular-interface (the contract and law 1''s impostor rejection),

  disintegration (the flagship — playable viability collapse plus the three-grain metabolism

  swap), and growth-and-division (a genuine structural rewrite). Then skim the capstone below for

  the same grain-swap carried up to a whole cell. Throughout, hold the compiler''s law 2: did the

  mechanism change while the STRUCTURAL interface — port names, types, wiring — stayed the same?

  And hold the throughline: did the study build, test, break, or rebuild a viability boundary?

  '
capstone:
  title: The capstone — a whole cell, hand-assembled (not compiler-emitted)
  summary: 'The investigation''s thesis is proven study by study; the capstone asks whether it also

    holds at the level of a WHOLE CELL. A cell is assembled BY HAND in the studies'' own style

    (`meta_modelers_guide/wholecell.py`) — it is NOT emitted by the compiler from any study''s

    drafts. What it demonstrates is the disintegration grain-swap (law 4) carried up to whole-cell

    scale: behind ONE unchanged metabolism interface (nutrients to biomass), the disintegration

    mechanism is selectable — coarse, saturating-kinetic, or real COBRApy FBA — and the same

    assembled cell lives three DISTINCT life histories (coarse peaks at biomass 5.78 and divides at

    t≈3.0; saturating-kinetic peaks at 6.43 and divides at t≈2.1; real COBRApy FBA peaks at 6.05 and

    divides at t≈2.7). In every case the cell first grows on the environmental nutrient as

    viability-gated metabolism converts uptake to biomass; once biomass crosses the division

    threshold the rewrite fires ONCE, partitioning the mother''s biomass — division CONSERVES MASS

    (the mother is halved, not doubled), cell_count going 1 to 2. Then a SCRIPTED thermal shock

    (temperature driven 37 to 50 degC at a hard-coded t=12) pushes the cell out of its tolerance

    band; a viability monitor collapses viability 1.0 to 0.018, which gates metabolism off and

    triggers the disintegration rewrite — the maintained boundary fails and biomass decays into

    molecular debris (accumulating to roughly 5.5-6.1, depending on the metabolism). Grow, divide

    once, die — but the "grow" and "divide" are mechanism-driven and mechanism-dependent, while the

    "die" is a scripted shock.'
  limitations:
  - The whole cell is ASSEMBLED BY HAND in the studies' style (`wholecell.py`), not emitted by the
    compiler from any study's drafts. It demonstrates that the disintegration-style mechanism-swap
    holds at whole-cell scale, not a calibrated whole-cell model.
  - The "grow" and "divide" behaviors are mechanism-driven and mechanism-dependent, but the "die" is
    a SCRIPTED thermal shock (hard-coded t=12), not an emergent failure. One deterministic run per
    metabolism.
  - Division conserves mass (the mother is halved) but is symmetric and fires once; next steps would
    replace the scripted shock with an emergent viability failure (e.g. nutrient exhaustion) and run
    replicate seeds and thermal schedules.
coverage_note: 'Every figure draft across all 9 studies in this investigation compiles to a running

  executable — the machinery is not cherry-picked to a few figures. This now includes the two

  cell-cell-coupling executables (competition and cross-feeding, both wired over one shared

  nutrient interface with no figure number of their own in the paper), disintegration''s PLAYABLE

  composite (`fig06-disintegration-dynamics`, watchable step by step in the Composite Explorer) in

  addition to its three metabolism-grain executables, and development-and-evolution''s genuine

  node-inserting "Live Topology" rewrite pairs alongside their continuous-path counterparts. This

  is a coverage result about the draft-to-executable machinery, not a scientific claim about any

  single figure — see each study''s own caveats for what its executable does and does not

  demonstrate.

  '
glossary:
- term: Cellular interface
  definition: The set of typed, unit-bearing variables through which a cellular description couples
    to its environment and to other cells (fluxes, forces, currents, heat, plus growth, shape,
    objective, viability) — simultaneously a modeling choice and a testable hypothesis about which
    interactions matter.
- term: Draft process
  definition: An interface with a STRUCTURAL contract but no dynamics — typed ports + wiring + intent, an
    inert (empty) update; it builds and renders but does nothing if run.
- term: Handler
  definition: An executable Process that implements a draft's interface with real dynamics; the compiler
    installs one per draft.
- term: Conformance (H ⊢ S)
  definition: STRUCTURAL conformance — a handler conforms to a signature when it supplies every interface
    port with a compatible type and wiring; the compiler refuses to install a non-conforming handler. It
    checks port names, types, and wiring — NOT units, dimensions, invariants, or runtime behavior.
- term: Interface preservation (law 2)
  definition: Compilation changes a study's internal mechanism but leaves its external interface — port
    names and wired store paths — identical.
- term: Grain swap
  definition: Realizing one interface at a different level of description (a lumped process vs. a resolved
    network) without changing the interface — disintegration's Fig 6, and autopoiesis's second home.
- term: Autopoiesis
  definition: A composition whose processes collectively produce and sustain the very organization that
    enables them — autopoiesis (Fig 9)'s mutual closure of metabolism, containment, and replication.
- term: Viability bounds
  definition: The region of state space within which a cellular description stays valid; crossing them
    (e.g. a thermal shock) breaks the interface and forces a shift to a molecular description.
- term: Minimal agency
  definition: The property an interface confers on what would otherwise be ordinary chemical dynamics —
    the capacity to sense, act, and maintain a boundary against dissolution — for as long as its
    variables stay inside the viability bound. The investigation's throughline.
- term: Event-driven rewrite
  definition: A discrete change to the place graph itself — division, engulfment, bursting, biofilm
    colonization — that adds or removes nodes at runtime (growth-and-division, Fig 10a,b;
    development-and-evolution's "Live Topology" pairs, Fig 10c-f).
- term: Place graph
  definition: The nesting of stores in the state tree; the bigraph structure that represents compartments
    and containment.
guidelines:
  literature_anchors:
  - Agmon — A meta-modeler's guide to the cellular interface and its composition patterns (the source
    paper).
  - Agmon & Spangler — Process Bigraphs and the Architecture of Compositional Systems Biology (arXiv:2512.23754).
  - Maturana & Varela — Autopoiesis and Cognition (autopoiesis study's closure).
  - Milner — bigraphical reactive systems (the reaction rules behind growth-and-division and
    development-and-evolution's event-driven rewrites).
  naming_conventions: 'Studies are named after the paper''s own section headings (cellular-interface,

    cell-environment-coupling, cell-cell-coupling, disintegration, molecular-interfaces,

    biomolecular-complementarity, autopoiesis, growth-and-division, development-and-evolution), not

    after figure numbers alone, though each study''s composites carry the paper''s figure numbers where

    one exists. Composites are <package>.composites.fig<n>-<slug> where a figure number exists

    (cell-cell-coupling has none); each study''s figures have a SEMANTIC (draft) composite and, where

    compiled, one or more EXECUTABLE composites — disintegration''s single metabolism interface

    carries three (coarse/kinetic/FBA), and cell-cell-coupling''s single coupling interface carries

    two (competition/cross-feeding).

    '
competing_frameworks:
- name: Kappa / BNGL (rule-based modeling)
  prediction: Biology is best written as rule-based, structure-changing rewrites over site graphs — agents,
    bonds, and complexes created and destroyed by rules.
  discriminated_by: 'This work shares FIRST-CLASS structural rewrites (growth-and-division''s division is
    exactly such a rule — one cell node becomes two; development-and-evolution''s "Live Topology" pairs
