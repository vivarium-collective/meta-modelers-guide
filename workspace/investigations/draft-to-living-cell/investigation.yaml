limitations:
- Interfaces are checked at the port/type level — port names and compatible types must match for a handler
  to install — not by runtime invariant. The compiler enforces that the ports line up and carry compatible
  types, not that the mechanism honors the contract's intended behavior once it runs.
- Units are currently name-only on ports (a port is labeled mol·s⁻¹, N, W, hr⁻¹, …); they document the
  intended dimension but are not machine-enforced, so dimensional consistency across a wiring is a
  convention, not a guarantee.
- Handlers are toy-real, not calibrated — plausible constants, not fitted parameters. The dynamics
  demonstrate the pattern (niche construction, viability collapse, closure, genuine rewrite), not a
  quantitatively validated cell.
- The capstone whole cell is ASSEMBLED BY HAND in the studies' style (`wholecell.py`), not emitted by the
  compiler from any study's drafts. It demonstrates the disintegration mechanism-swap at whole-cell scale
  (coarse / kinetic / real-FBA metabolism behind one interface), not a calibrated organism. Its division
  conserves mass (the mother is halved) and its death is a SCRIPTED thermal shock (hard-coded t=12), not an
  emergent failure.
- 'development-and-evolution is the investigation''s most caveated study (gate: needs_calibration) — selection
  is a single fixed-constant ODE and the "new port" a scripted config ramp, honestly labeled as pattern
  demonstrations of an "open and substantial challenge" the paper itself names, not validated results.'
- The compiler is the binding stage only. It installs one conforming mechanism per draft; it does not
  fit parameters, discover mechanisms, or reconcile mechanisms that disagree.
