schema_version: 2
name: draft-to-living-cell
title: From Draft to Living Cell
created: '2026-08-15'
status: complete
object_of_evaluation: composition-protocol
runtime:
  default_emitter: sqlite
question: 'How far can a cell be built compositionally — assembled from typed interfaces,

  each specified as a *draft* before any mechanism is chosen, then compiled into

  something that actually runs — and does that composition hold together into a

  whole cell that lives and dies?

  '
hypothesis: 'Every recurring composition pattern in the cellular-interface paper can be

  authored as an inert draft (typed, unit-bearing ports + a structural contract, with

  no dynamics) and then *compiled* — by installing one conforming mechanism per

  draft — into an executable that preserves the paper''s interface exactly and

  produces genuine dynamics. The same signature admits many mechanisms; the figures

  compose; and the composition sustains a whole cell across growth, division, and

  disintegration.

  '
lead: A biological model can be specified as an inert, typed interface contract and only then compiled —
  one conforming mechanism installed per contract, interface preservation machine-checked — so mechanisms
  of any grain become swappable behind a boundary that provably does not move, and division becomes a
  first-class rewrite. The sharpest proof is one metabolism interface run three ways (coarse, saturating
  kinetics, and REAL COBRApy flux-balance), with a non-conforming impostor rejected at compile time.
executive:
  what_is_this: 'This investigation turns *A meta-modeler''s guide to the cellular interface* into an
    executable test of compositional modeling. Each figure of the paper is written twice. First as a
    draft: a typed, unit-bearing biological interface — a STRUCTURAL contract of port names, types, and
    wiring, with no committed mechanism. It says what a process couples to, not how. Then it is compiled,
    which installs one or more conforming mechanisms — mechanistic, rule-based, data-driven, or otherwise
    — behind the identical ports, so the running simulation preserves the declared interface exactly. The
    compiler''s conformance check is STRUCTURAL: it verifies that a handler supplies every port with a
    compatible type and wiring, and refuses one that does not. It does not check units, dimensions,
    invariants, or runtime behavior.


    The point is not to assemble a single monolithic cell model. It is to test whether a biological model
    can remain open-ended as its mechanisms change, its assumptions fail, and its level of description
    shifts. Interfaces provide the places where models can be connected, isolated, replaced, or expanded;
    graph rewrites allow the composition itself to change through events such as growth, division, and
    disintegration.


    The investigation therefore follows the paper''s central claim: composition is not the final architecture
    of a model, but an ongoing way of building one. Across the studies below, we ask whether the same
    biological specification can support alternative mechanisms, whether those mechanisms can be composed
    without losing their interface semantics, and whether the resulting system can reorganize as the biology
    demands. The endpoint is a composed whole cell that grows, divides, loses viability, and changes its
    own level of description — demonstrating the full arc from interface specification to living, changing
    simulation.'
  verdict: 'The reading holds, and it runs. The thesis is sharpest in one figure: ONE metabolism interface

    (Fig 6, nutrients ⇒ biomass) carries THREE genuinely different mechanisms — a coarse lumped yield, a

    saturating Michaelis–Menten kinetic, and REAL COBRApy flux-balance analysis over e_coli_core — behind

    ports that never move (law 4). The single most persuasive artifact is a negative one: a non-conforming

    impostor handler that renames/retypes/drops those ports is REJECTED by the compiler at compile time

    with a CompileError that names the missing ports. That is structural interface preservation (law 2)

    made mechanical. The machinery is not cherry-picked: the paper''s Figs 4–10 render as 11 figure drafts;

    10 compile to executables (Fig 4a, the interaction-modalities vocabulary, is illustrative and draft-only

    by design), and because Fig 6''s one interface carries three mechanisms there are 12 executable

    composites in all — every one runs to completion. Figure 10 makes division a FIRST-CLASS structural

    rewrite: the cell''s own replicated DNA crosses a threshold and one cell node genuinely becomes two,

    conserving mass (the parent is partitioned, not duplicated). Finally the thesis lifts to the whole

    cell: an assembled whole cell (built by hand in the figures'' style, not compiled from the drafts) runs

    the SAME Fig 6 mechanism-swap — coarse / kinetic / FBA give three distinct life histories (peak biomass

    5.78 / 6.43 / 6.05, dividing at t≈3.0 / 2.1 / 2.7) — each cell growing, dividing once (mass-conserved),

    and dying when a SCRIPTED thermal shock (37 → 50 °C hard-coded at t=12) collapses viability to 0.018

    and disintegration turns biomass to debris.

    '
  verdict_status: passed
  decisions_needed: []
scientific_argument:
  main_claim: 'A cell can be assembled compositionally from typed interfaces, each specifiable as

    a draft (an interface with no committed mechanism) and then compiled — by installing

    a conforming mechanism — into a running model whose *external interface is preserved

    unchanged*. This is the paper''s central claim (mechanism can be refined or replaced

    behind a stable interface) made mechanical, as a compiler whose laws enforce it.

    '
  evidence_for:
  - Fig 4 — the cellular interface is a set of typed, unit-bearing ports (chemical mol·s⁻¹, mechanical
    N, electrical A, thermal W, growth hr⁻¹, viability); a draft declares them, a handler makes a bounded
    goal-directed cell out of them.
  - Fig 5 — cell–environment coupling closes as a sense/act loop over a shared field store; the executable
    diffuses a real spatial (map[float]) chemical field.
  - Fig 6 (THE THESIS) — one metabolism interface (nutrients ⇒ biomass, energy, entropy, secretions) is
    realized by a coarse process, a saturating-kinetic process, OR real COBRApy FBA — three mechanisms,
    one interface (handler independence, law 4). The headline control is a non-conforming impostor handler,
    REJECTED at compile time with a CompileError naming the missing ports (structural interface preservation,
    law 2).
  - Fig 8 — molecular composition is a six-level-deep nested place graph (ECM → membrane → cytoplasm →
    nucleus → chromosome …) with a coupled gene-expression cascade wired to its leaves; the interface
    survives the deepest nesting (law 2).
  - Fig 9 — a toy autocatalytic loop of metabolism, containment, and replication compiles and runs at
    coarse, self-organized, and molecular grains; it illustrates the closure PATTERN but is a stand-in, not
    a demonstration of autopoiesis (folded into the gallery, deflated).
  - 'Fig 10 — division is a FIRST-CLASS structural rewrite. The cell''s own replicated DNA crosses a
    threshold (dna 1 → 3.06, threshold 2.0) and one cell node genuinely becomes two, conserving mass (the
    parent is partitioned to daughters, not duplicated). Fig 10-2 development and Fig 10-3 evolution also
    compile and run, but are deflated to the gallery — their selection is an ODE and their new port a
    config flag flip.'
  - 'The whole cell (mechanism-swap at scale) — an assembled whole cell (built by hand in the figures''
    style, NOT compiled from the drafts) runs the Fig 6 mechanism-swap. Coarse, kinetic, and real-FBA
    metabolism behind one interface give three distinct life histories (peak biomass 5.78 / 6.43 / 6.05).
    Each grows, divides once (mass-conserved), and dies on a scripted thermal shock (37 → 50 °C at t=12)
    that collapses viability to 0.018 — law 4 carried from a single figure up to a composed cell.'
  evidence_against:
  - The figures are toy-real, not calibrated — handlers use plausible constants, not fitted ones, so the
    dynamics demonstrate the *pattern* (ultrasensitivity, closure, division, disintegration) rather than
    a quantitatively validated cell.
  - Fig 4a (interaction modalities) is illustrative — a vocabulary of ports, not a mechanism — and remains
    draft-only by design.
  key_figures:
  - one-interface-three-mechanisms
  - divide
  - the-living-atlas
  caveats:
  - 'Two layers, read deliberately: the DRAFT composites are inert (ports + contract, no dynamics) and
    are rendered in loom; the EXECUTABLE composites run and are shown as dynamics figures. A study''s
    draft render and its executable dynamics are the same interface at two stages, not two different models.'
  - The compiler is the binding stage only — it installs a conforming mechanism per draft; it does not
    fit parameters or invent mechanisms. Conformance is STRUCTURAL (port names, types, wiring), not
    behavioral — it does not check units, dimensions, invariants, or runtime behavior.
  - 'The capstone whole cell (the-living-atlas) is ASSEMBLED BY HAND in the figures'' style, NOT emitted by
    the compiler from the figure drafts. Its death is a SCRIPTED thermal shock (hard-coded t=12), not an
    emergent failure; its division conserves mass (the mother is halved, not doubled).'
  interpretation_ref: docs/concepts/semantic-to-executable-compilation.md
biological_story: 'A cell is two things at once. From the outside it is a bounded, goal-directed agent

  that exchanges matter, energy, and information with its environment across a small set

  of interface variables, and stays alive only while those variables sit inside its

  viability bounds. From the inside it is a dense web of coupled molecular processes that

  build and maintain the very interface the outside view depends on. Neither view is

  complete alone, and the interesting biology lives in how they are connected — which is

  exactly what a compositional model must make explicit.


  This atlas walks that two-sided view as an arc, and at every step the same discipline

  applies: first draw the *interface* (the ports through which a process couples to the

  rest of the cell), commit to no mechanism yet, and only then install one. We begin at

  the cellular interface itself (Fig 4) — chemical, mechanical, electrical, and thermal

  exchange ports plus higher-level cellular variables like growth rate, shape, objective,

  and viability. We make it operational by closing the loop with the environment (Fig 5):

  the cell senses environmental fields and acts back on them, so sensing and acting become

  two sides of one coupling. When regulation fails, the cellular description stops being

  valid and the right level of description drops to molecules (Fig 6–7) — the disintegration

  pattern, and its inverse, coarse-graining a molecular network back into a cell-level

  exchange process. We then ask how a maintained interface arises in the first place: from

  molecular mechanisms composing into nested, self-producing organization (Fig 8–9) — the

  closure of metabolism, containment, and replication that Maturana and Varela called

  autopoiesis. Finally, that organization is rewritten across time: a cell divides, cells

  build a biofilm, and lineages evolve new interface capabilities (Fig 10).


  The move this investigation adds is to make each step *run*. A draft process is an

  interface with a STRUCTURAL contract — port names, types, and wiring — and no mechanism;

  compiling it installs a conforming mechanism (the compiler checks that the handler supplies

  every port with a compatible type, and preserves the ports and their wiring exactly) while

  giving the figure real dynamics. Because the interface is what is held fixed, the same

  figure can be run under different mechanisms — Fig 6''s metabolism as a lumped yield, a

  saturating kinetic law, or a genuine COBRApy flux-balance optimization — and a reader can

  watch the mechanism change underneath a boundary that does not. That mechanism-swap is the

  thesis, and it is carried up to a whole cell: an assembled whole cell — built BY HAND in

  the figures'' style, not emitted by the compiler from the drafts — runs the same Fig 6

  swap, and coarse, kinetic, and real-FBA metabolism give three distinct life histories

  behind one interface. In each, the cell takes up nutrients and grows, divides once its

  biomass crosses a threshold (division conserves mass — the mother is halved, not doubled),

  and — when a SCRIPTED thermal shock pushes its temperature outside the viable band (a

  hard-coded 37 → 50 °C at t=12) — loses viability, stops maintaining its boundary, and

  disintegrates into molecular debris. A cell that lives and dies, with the mechanism of its

  life swappable behind a fixed boundary.

  '
at_a_glance:
- study: one-interface-three-mechanisms
  role: 'THE THESIS — one metabolism interface (Fig 6) run three ways: a coarse lumped yield, a saturating
    kinetic, and REAL COBRApy flux-balance, behind ports that never move. The headline control: a
    non-conforming impostor handler is rejected at compile time with a CompileError naming the missing ports.'
- study: divide
  role: 'Division as a FIRST-CLASS structural rewrite — the cell''s own replicated DNA crosses a threshold
    and one cell node genuinely becomes two, conserving mass (the parent is partitioned, not duplicated).
    No wall clock.'
- study: typed-interface
  role: The contract and its coupling — a cell specified as its typed exchange ports (Fig 4), then closed
    into a sense/act loop over a real diffusing spatial field (Fig 5); sensing and acting are one coupling.
- study: the-nested-cell
  role: From molecules to the nested cell — an F1Fo ATP-synthase molecular mechanism at the deepest grain
    feeding a gene-expression cascade across a six-level nested place graph; the deepest test of structural
    interface preservation.
- study: the-living-atlas
  role: 'The payoff — the thesis at whole-cell scale: one assembled cell (built by hand in the figures''
    style, not compiled), three swappable Fig 6 metabolisms, three distinct life histories — each grows,
    divides once (mass-conserved), and dies on a scripted thermal shock.'
- study: gallery
  role: 'Appendix — every figure compiles and runs (11 figure drafts, 12 executable composites). Fig 9
    self-organization and Fig 10-2/10-3 development/evolution are folded in here and deliberately deflated:
    they compile and run, but the selection is an ODE and the "new port" a config flag flip.'
how_to_read: 'Read the studies in thesis-first order. Start with one-interface-three-mechanisms — the

  whole argument in one figure: one metabolism interface run three ways (coarse lumped yield, saturating

  kinetics, and REAL COBRApy flux-balance), with a non-conforming impostor rejected at compile time. Then

  divide (division as a first-class structural rewrite — the cell''s own DNA crosses a threshold and one

  cell node becomes two, conserving mass). Then typed-interface (the contract and its coupling — a cell

  as its typed ports, closed into a sense/act loop over a real diffusing field). Then the-nested-cell (the

  molecular grain — an ATP-synthase mechanism feeding a cascade across a six-level nested place graph, the

  deepest test of structural interface preservation). Then the-living-atlas (the payoff — the same Fig 6

  mechanism-swap carried up to a whole assembled cell: three metabolisms, three life histories, each

  growing, dividing once, and dying). Finally the gallery appendix (every figure compiles and runs).


  In each study, look at two things side by side: the DRAFT render (the loom figure — the structural

  interface, no dynamics) and the EXECUTABLE dynamics (the same interface, now running). The investigation''s

  genuine control is the compiler''s IMPOSTOR-REJECTION in one-interface-three-mechanisms: a handler that

  breaks the port contract is refused at compile time with a CompileError naming the missing ports — that

  is the interface being enforced, not merely described. (The per-study `draft-is-inert` checks are only

  sanity checks of the framework''s definition — a draft has an empty update by construction — not

  scientific counterfactuals; where a real ablation would strengthen a claim, that is noted in the study.)


  Short on time? Read one-interface-three-mechanisms (the thesis and its impostor control), divide (a

  genuine structural rewrite), and the-living-atlas (the mechanism-swap at whole-cell scale). Throughout,

  hold the compiler''s law 2: did the mechanism change while the STRUCTURAL interface — port names, types,

  wiring — stayed the same?

  '
glossary:
- term: Cellular interface
  definition: The set of typed, unit-bearing variables through which a cellular description couples to
    its environment (fluxes, forces, currents, heat, plus growth, shape, objective, viability).
- term: Draft process
  definition: An interface with a STRUCTURAL contract but no dynamics — typed ports + wiring + intent, an
    inert (empty) update; it builds and renders but does nothing if run.
- term: Handler
  definition: An executable Process that implements a draft's interface with real dynamics; the compiler
    installs one per draft.
- term: Conformance (H ⊢ S)
  definition: STRUCTURAL conformance — a handler conforms to a signature when it supplies every interface
    port with a compatible type and wiring; the compiler refuses to install a non-conforming handler. It
    checks port names, types, and wiring — NOT units, dimensions, invariants, or runtime behavior.
- term: Interface preservation (law 2)
  definition: Compilation changes a figure's internal mechanism but leaves its external interface — port
    names and wired store paths — identical.
- term: Grain swap
  definition: Realizing one interface at a different level of description (a lumped process vs. a resolved
    network) without changing the interface — Fig 6.
- term: Autopoiesis
  definition: A composition whose processes collectively produce and sustain the very organization that
    enables them — Fig 9's mutual closure of metabolism, containment, and replication.
- term: Viability bounds
  definition: The region of state space within which a cellular description stays valid; crossing them
    (e.g. a thermal shock) breaks the interface and forces a shift to a molecular description.
- term: Event-driven rewrite
  definition: A discrete change to the place graph itself — division, engulfment, bursting — that adds
    or removes nodes at runtime (Fig 10; Fig 3c).
- term: Place graph
  definition: The nesting of stores in the state tree; the bigraph structure that represents compartments
    and containment.
guidelines:
  literature_anchors:
  - Agmon — A meta-modeler's guide to the cellular interface and its composition patterns (the source
    paper).
  - Agmon & Spangler — Process Bigraphs and the Architecture of Compositional Systems Biology (arXiv:2512.23754).
  - Maturana & Varela — Autopoiesis and Cognition (Fig 9 closure).
  - Milner — bigraphical reactive systems (the reaction rules behind Fig 10 division).
  naming_conventions: 'Studies are named thematically (one-interface-three-mechanisms, divide, …), not

    after figure numbers. Composites are <package>.composites.fig<n>-<slug>; each of the paper''s Figs

    4–10 has a SEMANTIC (draft) composite (fig<n>-<slug>) and, where compiled, an EXECUTABLE

    (fig<n>-executable[-variant]) — 11 figure drafts, 10 compiled (Fig 4a is draft-only), 12 executable

    composites in all (Fig 6 carries three mechanisms).

    '
competing_frameworks:
- name: Kappa / BNGL (rule-based modeling)
  prediction: Biology is best written as rule-based, structure-changing rewrites over site graphs — agents,
    bonds, and complexes created and destroyed by rules.
  discriminated_by: 'This work shares FIRST-CLASS structural rewrites (Fig 10 division is exactly such a rule
    — one cell node becomes two), but adds an INERT, type-checked SPECIFICATION stage upstream of any
    mechanism — the interface is authored and structurally checked before a rule or rate law is chosen, and
    mechanisms of any grain (ODE, rule-based, or FBA) install behind the same checked interface.'
- name: PySB / BioCRNpyler (programmatic composition)
  prediction: Models are assembled programmatically from reusable components or motifs in a host language,
    then exported to a simulator.
  discriminated_by: Same programmatic-composition spirit, but composition here is over TYPED INTERFACES
    with a compile step that machine-checks interface preservation (law 2). A component is a draft first
    (ports and wiring, no mechanism); swapping mechanisms behind it is a checked operation, not a re-code.
- name: ML-family algebraic-effect handlers / functors (the PL lineage)
  prediction: Effects are declared as an interface (an algebraic-effect signature, or a functor's required
    structure) and later given a handler/implementation the type system checks against the signature.
  discriminated_by: This is the direct programming-languages lineage — a draft is the effect signature /
    functor input, compilation is handler installation, and law 2 is signature preservation. The
    contribution is to instantiate that discipline for biological models — unit-labeled cellular interfaces,
    a place-graph substrate, and structural rewrites as first-class citizens.
- name: Vivarium's own mechanism-swapping behind interfaces
  prediction: Vivarium already composes processes over shared stores and lets one process be replaced by
    another that reads and writes the same ports.
  discriminated_by: 'This work turns that swap into a CHECKED, staged discipline — the interface is authored
    as an inert draft, and a mechanism is installed only if it STRUCTURALLY conforms — a non-conforming
    impostor is rejected at compile time with a CompileError naming the missing ports — rather than relying
    on the convention that two processes happen to share ports.'
studies:
- one-interface-three-mechanisms
- divide
- typed-interface
- the-nested-cell
- the-living-atlas
- gallery
limitations:
- Interfaces are checked at the port/type level — port names and compatible types must match for a handler
  to install — not by runtime invariant. The compiler enforces that the ports line up and carry compatible
  types, not that the mechanism honors the contract's intended behavior once it runs.
- Units are currently name-only on ports (a port is labeled mol·s⁻¹, N, W, hr⁻¹, …); they document the
  intended dimension but are not machine-enforced, so dimensional consistency across a wiring is a
  convention, not a guarantee.
- Handlers are toy-real, not calibrated — plausible constants, not fitted parameters. The dynamics
  demonstrate the pattern (ultrasensitivity, closure, division, disintegration), not a quantitatively
  validated cell.
- The capstone whole cell is ASSEMBLED BY HAND in the figures' style (wholecell.py), not emitted by the
  compiler from the figure drafts. It demonstrates the Fig 6 mechanism-swap at whole-cell scale (coarse /
  kinetic / real-FBA metabolism behind one interface), not a calibrated organism. Its division conserves
  mass (the mother is halved) and its death is a SCRIPTED thermal shock (hard-coded t=12), not an emergent
  failure.
- The compiler is the binding stage only. It installs one conforming mechanism per draft; it does not
  fit parameters, discover mechanisms, or reconcile mechanisms that disagree.
