schema_version: 2
name: draft-to-living-cell
title: From Draft to Living Cell
created: '2026-08-21'
status: running
object_of_evaluation: composition-protocol
runtime:
  default_emitter: sqlite
question: >-
  The paper treats a biological interface as a scientific object — something you can compose with
  other entities, swap the mechanism behind, and watch emerge from the inside. Does that hold in
  executable form? Across nine composition patterns this investigation asks three things about the
  interface. COMPOSE — when one typed interface is coupled to other entities, outward to a nutrient
  field and to neighbouring cells and inward to a metabolism and a membrane, does the composition
  produce the emergent consequence the paper predicts (niche construction, competition,
  cross-feeding, pattern, division), on genuine simulation output rather than a scripted trajectory?
  SWAP — is the same interface substitutable, so the externally observable relation survives when
  the mechanism behind it is replaced (dynamic-FBA by a lumped Michaelis-Menten kinetic) — and does
  that hold at more than one level of composition, not just inside a single cell? EMERGE — can a
  cell's boundary itself be an emergent product of its own internal processes, produced and
  maintained from the inside rather than merely given? The subject is the interface; process bigraphs
  (Vivarium) are the example substrate we use to make it executable.
hypothesis: >-
  An interface is a property of a composition, not of any single mechanism behind it, and the three
  moves the paper makes with it are all executable. COMPOSE: coupling one typed interface to other
  entities — outward to an environment and neighbours, inward to a metabolism and a membrane — yields
  emergent behaviour the interface alone does not have, and every study measures such a consequence
  on genuine simulation output. SWAP: where the same interface is realized by two different
  mechanisms the observable relation is preserved — approached as surrogate calibration (a tuned
  Michaelis-Menten twin agrees within ~10% on the condition it was tuned on) at two levels, the
  single-cell metabolism and the multi-cell colony, with held-out generalization and the remaining
  levels an explicit, honestly-flagged frontier. EMERGE: a cell's boundary
  can be produced and sustained by internal composition — a membrane that runs its own maintenance
  persists, while the identical membrane without that process decays — the interface made, not
  assumed. Each study is a behavior-gated test of one of these claims.
lead: >-
  This investigation turns the paper's nine composition patterns into executable, behavior-gated
  tests of three things you can do with a cellular interface: COMPOSE it, SWAP the mechanism behind
  it, and watch it EMERGE. Compose is the through-line — every study couples one typed interface to
  other entities and measures the emergent consequence. The flagship, cell-environment-coupling,
  reads a spatio-flux nutrient grid at a real CPM cell's own footprint, runs one dynamic-FBA step
  (e_coli_core, oxygen-capped to force acetate overflow), grows the cell from the biomass, and writes
  uptake and secretion back into the field: over 20 ticks the cell grows roughly 3.4x (32 to 110 CPM
  pixels on a 60x60 field), depletes its own footprint glucose by up to ~18% before diffusion
  resupplies it, and leaves a spreading acetate plume — niche construction, the emergent consequence
  of composing a cell interface with an environment, not a scripted trajectory. Compose the same kind
  of interface with neighbours and competition and cross-feeding emerge; with internal reaction and
  diffusion, a Turing pattern; with a division rule, a lineage. Swap is the paper's equivalence-class
  claim, measured: the same interface realized by a different mechanism preserves the observable
  relation — dynamic-FBA versus a lumped Michaelis-Menten kinetic behind the byte-identical flagship
  ports agree within ~10%, and the same swap holds at the multi-cell colony interface too, so
  substitutability is shown at more than one level of composition (the remaining levels are an honest,
  named frontier). Emerge is the inward move: a membrane produced and maintained by its own internal
  process persists, while the identical membrane with that process switched off decays — the boundary
  made from the inside, not assumed. Read in order the nine studies still trace an arc, from the bare
  interface contract to a growing, competing, self-maintaining, evolving agent. These are
  demonstrations with toy-real constants, not fitted models, and every study states its honest gap;
  process bigraphs and Vivarium are the example substrate, not the thesis.
executive:
  what_is_this: >-
    "From Draft to Living Cell" is the executable companion to the meta-modeler's guide: the
    paper's nine cellular composition patterns, each realized as a runnable model behind one typed
    interface. The organizing idea is the paper's own — an interface is a modeling choice and a
    testable biological hypothesis at once, naming which interactions across a cell's boundary
    matter and which can be abstracted away. Every study makes one such interface explicit and puts
    it behind a behavior gate. The interface is the load-bearing artifact: it, not either framework
    alone, is what lets two simulators that were never designed with each other in mind compose.
    The flagship's coupling process, CpmCellField, is exactly this — the point where a CPM cell's
    footprint (a set of lattice pixels) becomes a spatio-flux field read, and a dynamic-FBA solution
    (mmol/gDW/hr fluxes) becomes a per-pixel field delta and a CPM target-volume update. Composition
    runs in two directions: outward, where a cell couples to its environment and to other cells; and
    inward, where internal processes compose to produce the interface and the viability constraints
    that hold it together. Process bigraphs and Vivarium are the example substrate that makes all of
    this executable — they are how the patterns are expressed, not the claim being tested.


    The paper makes three moves with such an interface, and each is executable here. COMPOSE it with
    other entities — outward to an environment and neighbours, inward to a metabolism and a membrane —
    and an emergent consequence appears that the interface alone does not have; every study measures
    one. SWAP the mechanism behind it and the observable relation is preserved — shown as a measured
    result at two levels of composition: the flagship swaps its internal metabolism from dynamic-FBA
    to a TUNED lumped Michaelis-Menten kinetic (four free parameters) behind byte-identical
    CpmCellField ports (observables within ~10% on the tuned condition), and the cell-cell colony
    swaps the same mechanism behind byte-identical CpmColonyField ports with the observables
    preserved. This is surrogate calibration — a fit, honest as such — and a held-out condition
    neither mechanism was tuned on, plus broadening the swap to the remaining levels, is the named
    frontier, not a silent gap. EMERGE — the interface is not only composed and swapped but
    made: in autopoiesis a membrane is produced and maintained by its own internal process, decaying
    the moment that process is switched off. Same interface, different mechanism, at more than one
    level; and a boundary that makes itself.


    A framing note stated up front, not buried in the verdict. The title "From Draft to Living Cell"
    and the arc language (a growing, competing, self-maintaining, evolving agent) are a narrative
    reading of the nine studies, not a claim of a validated cell — the verdict is explicitly "not a
    quantitatively validated cell." The SWAP result is a tuned surrogate matching on its calibration
    condition (surrogate calibration), not yet held-out mechanism-independence; the EMERGE result is
    an authored operational-closure criterion whose consequences are tested, not closure emerging
    from local physics; and every acceptance gate below is, unless marked otherwise, a regression pin
    set after its run — the honest, narrower claim is that the paper's nine patterns can each be
    expressed, run, and consequence-tested as compositions of independently-built simulators behind
    typed interfaces, with single-variable controls.
  verdict: >-
    The pattern set is complete and the central claim holds in executable form. All nine of the
    paper's composition patterns have a study; eight are realized as real 2D spatial compositions
    (a Cellular Potts cell coupled through one typed process to spatio-flux diffusion and
    dynamic-FBA, or to a pure reaction-diffusion or phase-field mechanism), and the ninth is the
    foundational cellular-interface contract itself. The flagship, cell-environment-coupling, closes
    the outward sense/act loop with genuine simulation output — over 20 ticks the agent depletes
    local glucose (up to ~18% at its own footprint before diffusion partially resupplies it), grows
    (CPM volume 32 -> 110 pixels, roughly 3.4x, against a 3600-pixel lattice it does not come close
    to filling), and secretes acetate that diffuses outward into a plume. This is niche construction
    as a real spatial and metabolic consequence of coupling two independently-built simulators, not
    a scripted trajectory. Substitutability is now measured against held-out conditions, and the
    surrogate's boundary is pinned rather than assumed: a tuned Michaelis-Menten twin reproduces the
    interface observables and generalizes within ~13% to conditions it was not tuned on WITHIN the
    calibrated glucose-limited/fixed-O2 regime, but diverges ~74% on a held-out oxygen cap the lumped
    box has no variable for — mechanism-independence inside the regime, surrogate calibration across
    the O2 axis. These are demonstrations with toy-real
    constants, not calibrated models, and each study names its own honest gap — the whole is a
    proof that the paper's interfaces compose and behave as claimed, not a quantitatively validated
    cell.
  verdict_status: needs_calibration
  key_figures:
  - cell-environment-coupling
  decisions_needed:
  - >-
    All nine composition patterns now have a study: eight realized as real 2D spatial mechanisms
    (cell-environment-coupling, cell-cell-coupling, disintegration, molecular-interfaces,
    biomolecular-complementarity, autopoiesis, growth-and-division, development-and-evolution) plus
    the foundational cellular-interface contract. The honest frontier is not coverage but depth:
    each study realizes part of its pattern's full claim and names the rest as a gap.
  - >-
    The arc's open next rung is learning — a cell whose history of interaction changes its future
    regulation in a way that measurably improves its capacity to stay viable, the executable bridge
    from a self-maintaining agent to an adaptive one. It is named here but not yet built.
  - >-
    Two of the paper's four physical interface modalities remain unrealized across the whole
    investigation: mechanical forces and electrical currents. The chemical port is everywhere and
    the thermal port appears in molecular-interfaces; a mechanical/tension channel and an
    electrostatic channel are the standing gap.
what_this_does_not_demonstrate: >-
  A reader who has read the paper will raise two divergences before any other; this investigation
  owns both here, in the paper's own vocabulary, rather than leaving the cross-study coherence to
  be maintained in a reviewer's head.


  TWO OF FOUR INTERFACE MODALITIES, and the gap is named. The paper (Section on the cellular
  interface) names four physical ports through which a cell exchanges matter and energy: chemical
  fluxes, mechanical forces, electrical currents, and heat transfer. Most studies realize ONLY the
  chemical port — glucose/acetate fluxes, or a scalar membrane/condensate field, through a shared
  spatio-flux grid. molecular-interfaces goes one modality further: its Gray-Scott reaction-diffusion
  study additionally realizes the THERMAL port — a temperature field Arrhenius-scaling the reaction
  rate, a genuine heat-transfer channel that grades the chemical pattern rather than merely
  re-parameterizing it. So across the investigation TWO of the four ports are realized — chemical
  everywhere, thermal in the molecular study — and ELECTRICAL currents and MECHANICAL forces remain
  the named four-modality gap: not one electrical or mechanical interface variable is exposed or
  measured in any study. This is a pointed omission, not an incidental one: the CPM is natively a
  MECHANICAL model (adhesion energies, a volume constraint, contact energies, surface tension), so
  every CPM study runs a mechanical engine and reports zero mechanical-interface observables. A
  viva-cpm force/tension/pressure interface, and an electrostatic channel, are planned and do not
  yet exist.


  THE COMPOSITION IS FRAMEWORK-LEVEL, NOT PER-CELL. The paper puts EACH CELL behind its own
  interface ports, cells nested in hierarchies, with rewrites mutating the composition graph itself.
  Here the entire cellular world lives inside ONE monolithic coupling process — CpmCellField /
  CpmColonyField / CpmGrowthDivision / CpmDisintegration / CpmSorting — that owns a private viva-cpm
  world object. Cells are NOT processes; they have no ports; division mints a new id INSIDE a Rust
  object without changing the composition graph — the opposite of the paper's structural-rewrite
  claim the growth-and-division study itself cites. The composition realized is between the two
  FRAMEWORKS, not between cells.


  WHAT IS DEMONSTRATED: framework-level composition through one typed interface (two
  independently-built simulators — viva-cpm and spatio-flux/cobra — meeting at one typed process,
  neither built with the other in mind); real spatial mechanisms behind that coupling (genuine CPM
  shape dynamics, dynamic-FBA optimization, PDE diffusion, Metropolis differential-adhesion sorting,
  Cahn-Hilliard phase separation), not scripted trajectories; and the paper's substitutability
  thesis, run concretely (the flagship swaps its internal metabolism from dynamic-FBA to a lumped
  Michaelis-Menten mechanism behind the byte-identical CpmCellField ports, and the interface-level
  observables agree within ~10%).


  WHAT IS NOT: per-cell interfaces (each cell a process with its own ports); hierarchical nesting of
  cellular interfaces into a collective interface; structural rewrites that mutate the composition
  graph at division or disintegration; the two non-chemical modalities still unrealized (mechanical
  forces and electrical currents) after the molecular study added the thermal port; and learning,
  the arc's next rung. These are the honest boundary of the claim, not hidden caveats.
scientific_argument:
  main_claim: >-
    A biological interface is a scientific object defined by three things you can do with it, and all
    three are executable here. COMPOSE — coupling the interface to other entities (outward to an
    environment and neighbours, inward to a metabolism and a membrane) produces emergent behaviour the
    interface alone does not have, measured on genuine simulation output in every study. SWAP — a
    tuned surrogate mechanism reproduces the externally observable relation behind byte-identical
    ports, calibrated at two levels of composition (the single-cell metabolism and the multi-cell
    colony); this is surrogate calibration, and mechanism-independence proper is earned only on a
    held-out condition, the named next step. EMERGE — the interface itself is produced and maintained
    by internal composition; here that maintenance is an authored operational-closure criterion whose
    consequences are tested, not closure emerging from local physics. The interface — not either
    framework alone — is the load-bearing artifact that makes each of these possible.
  evidence_for:
  - >-
    cell-environment-coupling (the outward sense/act flagship) — a real CPM cell reads a spatio-flux
    glucose field at its own footprint, runs one dynamic-FBA step (e_coli_core, oxygen-capped to
    force acetate overflow), grows its CPM target volume from the biomass produced, and writes
    uptake/secretion back into the field as a spatial delta that DiffusionAdvection then spreads.
    Over 20 ticks: CPM volume grows ~3.4x (32 -> 110 px, ~3% of the 60x60 lattice — the cell does
    not fill it), local footprint glucose depletes up to ~18% before diffusion partially resupplies
    it, and the field-wide acetate total rises from 0 to ~47 field units as the secreted plume
    diffuses outward. Net field-wide glucose falls (~32 of 5940 total field mass consumed) even
    though the depletion signal is much sharper locally at the cell's own footprint than in the
    field-wide total — the direct environmental-modification signature (local depletion +
    secretion; "niche construction" is reserved for development-and-evolution, where a selection
    feedback closes the loop).
  - >-
    Surrogate calibration of the interface, run concretely at two levels of composition (the SWAP
    move) — a tuned match, not yet a held-out finding. At the single cell: the flagship's internal
    metabolism is swapped from dynamic-FBA to a lumped Michaelis-Menten kinetic (four free parameters
    — vmax, km, yield, overflow — tuned to match, not derived) behind the byte-identical CpmCellField
    ports, and the interface-level observables (growth, local depletion, secretion) agree within ~10%
    on the tuned condition. Four knobs fit to roughly four observables is optimizer success on that
    one condition; held-out, the swap IS mechanism-independent WITHIN the calibrated
    glucose-limited/fixed-O2 regime (agreement ~13% on a different glucose field and a 2x run), but on
    a held-out O2 cap the lumped box has no oxygen variable for, dFBA nearly quadruples growth and
    agreement diverges ~74% — the surrogate's structural boundary, measured. At the multi-cell colony:
    the swap behind the byte-identical CpmColonyField ports preserves the growth/competition
    observables pre-saturation (~9%; total biomass 302.4 vs 287.6, competition ratio 3.69x vs 3.47x);
    the ~0.2% total-volume and acetate agreement was measured at ~97.5% lattice occupancy and is a
    finite-lattice saturation artifact — pre-saturation the acetate plume diverges ~68% (dFBA saturates
    early, the overflow surrogate only catches up at the endpoint it was tuned to). The Michaelis-Menten
    arm does run with cobra absent entirely. Same ports, different mechanism: mechanism-independence
    holds within each regime, and where it breaks (the O2 axis; the acetate trajectory) is now measured,
    not a silent gap.
  evidence_against:
  - >-
    Each study realizes only part of its pattern's full claim: two of the four physical modalities
    (mechanical, electrical) are unrealized investigation-wide; the composition is framework-level,
    not per-cell; and learning, the arc's next rung, is not yet built.
  - >-
    Chemotaxis (directed up-gradient motion) is deferred; the flagship agent senses and acts on the
    field locally but does not move toward higher concentration.
  - >-
    The e_coli_core constants (glucose_km, glucose_vmax, oxygen_vmax, box_volume_L, grow_per_biomass)
    are toy-real — plausible, hand-tuned magnitudes chosen to produce gradual, spatially-legible
    dynamics over a short run, not fitted to any organism or medium.
  - >-
    The CPM lattice itself (the cell's shape, occupied pixels, footprint) lives inside viva-cpm's
    Rust engine as a private, write-protected world object, not a process-bigraph store — only the
    coupling process reads and writes it. The environment the interface exposes to the rest of the
    composite is exclusively the spatio-flux fields store (glucose, acetate).
  key_figures:
  - cell-environment-coupling
  caveats:
  - >-
    All nine composition patterns have a study, but the investigation demonstrates the patterns, not
    a calibrated cell: every mechanism is toy-real (plausible constants, not calibrated to a named
    organism, medium, or literature target), and each study names its own honest gap.
  - >-
    The whole reads as an arc — interface, individuality, viability, self-maintenance, agency,
    adaptation — with learning as the open next rung. Read the studies in that order for the
    through-line rather than as nine independent demonstrations.
biological_story: >-
  A cell in a real 2D environment is not a point that reads and writes scalars — it is a shape,
  occupying a footprint of lattice pixels that grows, moves, and metabolizes at whatever
  concentration happens to sit under it right now. The paper's thesis is that we can reason about
  such a cell by naming its interface: the small set of variables across its boundary that carry the
  interactions that matter. This investigation makes that thesis executable, one pattern at a time,
  and lets the studies build on each other into an arc — from the bare interface contract, through a
  cell that senses and acts on its environment, competes with neighbors, and dissolves when its
  viability fails, to one that maintains itself, grows, divides, and evolves.


  The flagship study, cell-environment-coupling, answers yes for the outward sense/act pattern. One
  coupling process, CpmCellField, is the entire interface: it reads the spatio-flux glucose field at
  the CPM cell's current footprint, solves one dynamic-FBA step against e_coli_core (oxygen-capped so
  the optimizer is pushed into mixed-acid acetate overflow, the way a real glycolysis-outpacing-
  respiration cell would be), grows the CPM cell's target volume from the biomass that solution
  produces, and writes the resulting uptake and secretion back into the shared field as a spatial
  delta that spatio-flux's own diffusion process then spreads outward. Over a 20-tick run the cell
  grows about 3.4-fold in CPM pixel volume, draws its own local glucose down by close to a fifth
  before diffusion partially refills it, and leaves a spreading acetate plume behind it — niche
  construction as a direct, unscripted consequence of two independently-built simulators talking
  through one typed port.


  The other eight patterns fill out the arc: the cellular-interface contract itself; multi-cell
  competition over a shared field; a structural-integrity collapse in which the cell ceases to be
  the appropriate unit of description and molecular processes take its place; molecular-scale
  reaction-diffusion with a thermal channel; differential-adhesion sorting and phase separation for
  complementarity; a self-maintained protocell whose viability bound is produced from the inside;
  CPM growth and division; and colony development-and-evolution under selection. Learning — a cell
  whose past changes its future regulation to stay viable — is named as the next rung and not yet
  built. Every study is toy-real and honest about its gap; together they are an executable path from
  a draft interface to a living, adapting cell.
at_a_glance:
- study: cellular-interface
  role: >-
    [EMERGE · the contract] A cell's exposed variables (footprint, fluxes, shape, viability) ARE its
    interface; the study makes the inside/outside boundary explicit and shows the same contract behind
    different realizations (lumped modalities, executable handler, and a spatial composition with a
    diffusion field). The foundation cell-environment-coupling composes from.
- study: cell-environment-coupling
  role: >-
    [COMPOSE × environment · SWAP · flagship] Compose the cell interface with a real spatio-flux
    nutrient field (CpmCellField) — senses local glucose, runs dynamic-FBA (e_coli_core, O2-capped to
    force acetate overflow), grows ~3.4x, secretes a diffusing plume: environmental modification
    (local depletion + secretion) as an emergent consequence, not a scripted trajectory. Carries a
    SWAP as surrogate calibration: dynamic-FBA vs a tuned lumped Michaelis-Menten kinetic behind
    byte-identical ports, interface observables within ~10% on the tuned condition (held-out is the
    named next step).
- study: cell-cell-coupling
  role: >-
    [COMPOSE × cells · SWAP] Compose the interface with neighbours over a shared field → resource
    preemption between two cells and metabolic cross-feeding emerge (population-level competitive
    exclusion, an ecological concept, would need dividing populations — the growth-and-division
    machinery — not two single non-dividing cells). Carries the second SWAP as surrogate calibration,
    at the multi-cell colony interface: the colony's per-cell metabolism swapped dynamic-FBA -> a
    tuned lumped Michaelis-Menten behind byte-identical CpmColonyField ports, observables preserved on
    the tuned condition — a calibrated match at a second level, with the ~0.2% volume agreement noted
    as a lattice-saturation artifact and a pre-saturation comparison pending.
- study: disintegration
  role: >-
    [COMPOSE fails] The interface dissolves: composed with a rising toxin field, viability crosses a
    threshold and the cell ceases to be the appropriate unit of description — molecular processes
    (resorption, shedding) take its place. Death as a change in the level of description. The foil to
    autopoiesis (a boundary lost from outside, not maintained from within).
- study: molecular-interfaces
  role: >-
    [COMPOSE internal · channels] Reaction composed with differential diffusion → a Turing pattern
    emerges (causally isolated by an equal-diffusion control going uniform); adding a thermal channel
    composes a second physical modality that coarsens the pattern. The interface's chemical + thermal
    ports realized from internal composition.
- study: biomolecular-complementarity
  role: >-
    [EMERGE (formation) · COMPOSE] A phase boundary is PRODUCED from a well-mixed field by internal
    spinodal decomposition (mass-conserved) — interface formation from the inside; and differential
    adhesion composes cells into sorted domains. Formation without maintenance — the partial case
    autopoiesis completes.
- study: autopoiesis
  role: >-
    [EMERGE · the full case] The membrane is produced AND maintained by its own internal process: it
    persists with production on, and the identical membrane with production switched off (single-knob
    control) loses closure and decays to zero. The boundary made and sustained from the inside — the
    paper's individual criterion, executable.
- study: growth-and-division
  role: >-
    [COMPOSE × division] Compose the interface with real per-footprint dFBA metabolism and a
    volume-gated division rule → a lineage emerges: multi-generation growth, bounded sawtooth volume,
    sibling desynchronization by crowding. The interface reproducing itself.
- study: development-and-evolution
  role: >-
    [COMPOSE across timescales · capstone] A colony develops a rim/core organization (emergent from
    internal mass balance) and evolves a heritable uptake trait under selection-by-differential-
    division — mean trait up significantly over a 30-seed ensemble (Mann-Whitney p = 5.3e-4,
    drift-null p = 1.2e-5), gated on the ensemble statistic not a flagship seed, versus frozen
    no-mutation and undirected no-selection controls. Composition organizing adaptation across timescales.
how_to_read: >-
  Read the nine studies as three moves the paper makes with an interface, not only a linear arc.
  COMPOSE is the through-line — every study couples the interface to other entities and measures the
  emergent consequence: cell-environment-coupling (× an environment → niche construction),
  cell-cell-coupling (× other cells → competition and cross-feeding), molecular-interfaces (internal
  reaction + diffusion → a Turing pattern), growth-and-division (× a division rule → a lineage),
  development-and-evolution (across timescales → adaptation), and disintegration (composition failing
  → the interface dissolves). SWAP — cell-environment-coupling and cell-cell-coupling each carry a
  surrogate-calibration result (dynamic-FBA versus a TUNED lumped Michaelis-Menten kinetic behind
  byte-identical ports, observables preserved on the tuned condition) at two different levels of
  composition; a held-out condition neither mechanism was tuned on, and a pre-saturation colony
  window, are the named frontier before the result is mechanism-independence rather than a fit. EMERGE — cellular-interface makes the
  contract explicit, biomolecular-complementarity produces a boundary from a well-mixed field, and
  autopoiesis produces AND maintains one from the inside (with a single-knob control that decays
  without it). Each study is a behavior-gated test on genuine simulation output, tagged by move in the
  at-a-glance above, and states in the paper's own vocabulary exactly what it does and does not
  demonstrate.
capstone: development-and-evolution
coverage_note: >-
  All nine of the paper's composition patterns now have a study: eight realized as real 2D spatial
  mechanisms (most compositions of two independently-built simulators, some a single reaction-diffusion
  or phase-field mechanism), plus the foundational cellular-interface contract.
  This is a note about depth, not coverage — the pattern set is complete, but each study realizes
  part of its pattern's full claim (two of four physical modalities are unrealized investigation-wide,
  the composition is framework-level rather than per-cell, and learning is named but not built). The
  honest per-study gaps are stated in each study, not hidden here.
glossary:
- term: Cellular Potts Model (CPM)
  definition: A lattice-based cell-shape simulation framework (here, viva-cpm, a Rust-backed
    engine) in which cells occupy sets of pixels and evolve their shape, adhesion, and volume
    by energy-minimizing Monte Carlo pixel copies, rather than being represented as a scalar
    state bundle.
- term: Spatio-flux
  definition: A process-bigraph-native package providing spatial reaction-diffusion-advection
    PDE processes (DiffusionAdvection) and spatial dynamic flux-balance analysis
    (DynamicFBA) over a 2D field grid.
- term: CpmCellField
  definition: >-
    The coupling process the flagship builds: a process-bigraph Process that owns a viva-cpm world
    object, reads a shared spatio-flux fields grid at the CPM cell's current footprint, runs one
    dynamic-FBA step there, grows the CPM cell's target volume from the resulting biomass, and writes
    the uptake/secretion back into the field as a spatial delta. The typed interface the paper's
    composition claim is made concrete through.
- term: Interface (as scientific object)
  definition: >-
    The small set of variables across a cell's boundary that carry the interactions that matter — at
    once a modeling choice (what to expose, what to abstract) and a testable hypothesis (each study
    passes or fails a behavior gate on its chosen interface). The subject of this investigation;
    process bigraphs are the substrate used to express it.
- term: Substitutability (the SWAP move)
  definition: >-
    The paper's equivalence-class claim: different mechanisms may realize the same externally
    observable relation, so an interface is a natural level at which heterogeneous mechanisms can be
    compared. Approached here as SURROGATE CALIBRATION, not yet demonstrated substitutability: at two
    levels of composition — the flagship's metabolism (dynamic-FBA vs a TUNED lumped Michaelis-Menten
    kinetic, four free parameters, behind byte-identical CpmCellField ports) and the cell-cell colony
    (the same tuned swap behind byte-identical CpmColonyField ports) — the interface observables agree
    within ~10% on the condition the surrogate was tuned on. Four knobs matching roughly four
    observables demonstrates that a surrogate CAN be fit; whether the mechanisms are interchangeable
    is decided by held-out agreement, which is now measured. Held-out, the swap is
    mechanism-independent WITHIN its calibrated regime (single cell ~13% on untuned glucose/time;
    colony growth ~9% pre-saturation) and surrogate calibration only where the lumped box lacks a
    variable the mechanism needs (the O2 axis, ~74%; the acetate trajectory, ~68% pre-saturation) —
    the equivalence class holds inside the regime and its boundary is pinned, not assumed. Broadening
    the swap to the other levels of composition remains the frontier.
- term: The three moves (compose · swap · emerge)
  definition: >-
    The three things the paper does with an interface, and the spine of this investigation. COMPOSE
    it with other entities — outward to an environment and neighbours, inward to a metabolism and a
    membrane — and an emergent consequence appears. SWAP the mechanism behind it and the observable
    relation is preserved. EMERGE: the interface itself is produced and maintained by internal
    composition, not given. Every study is a behavior-gated test of one of these moves.
- term: Composition direction
  definition: >-
    Outward composition couples a cell to its environment and to other cells; inward composition is
    internal processes composing to produce the interface and its viability constraints. Every study
    is labeled by direction and by the move (compose / swap / emerge) it demonstrates.
- term: Toy-real
  definition: Plausible, hand-tuned constants (e.g. glucose_km, glucose_vmax, oxygen_vmax,
    box_volume_L, grow_per_biomass) chosen to produce legible, gradual dynamics over a short
    run — not fitted to a named organism, medium, or literature target.
guidelines:
  literature_anchors:
  - Agmon — A meta-modeler's guide to the cellular interface and its composition patterns (the
    source paper; the nine composition patterns realized here).
  - Agmon & Spangler — Process Bigraphs and the Architecture of Compositional Systems Biology
    (arXiv:2512.23754 — the spatio-flux worked example the flagship draws its field-coupling pattern
    from).
  naming_conventions: >-
    Studies are named after their composition pattern (cell-environment-coupling, cell-cell-coupling,
    disintegration, and so on). The flagship composite is
    meta_modelers_guide.composites.single-cell-in-a-field, discovered by the workbench at that dotted
    stem; the dash in the final segment produces a known composite-name-regex lint WARN, an accepted,
    pre-existing convention rather than a new error class.
competing_frameworks:
- name: Mechanism-first modeling (the alternative the substitutability test discriminates against)
  prediction: >-
    The behavior of a composition pattern is a property of the specific mechanism used to realize it,
    so changing the mechanism behind a cell (dynamic-FBA to a lumped kinetic, a CPM cell to a lumped
    ODE cell) would change the externally observable relation.
    A TUNED Michaelis-Menten surrogate (four free parameters) is fit behind byte-identical ports at
    two levels of composition — the single-cell flagship (CpmCellField, observables within ~10%) and
    the multi-cell colony (CpmColonyField) — and the interface-level relation holds on the tuned
    condition each time. This is CONSISTENT WITH the interface-first prediction but does not yet
    discriminate against mechanism-first: a four-knob surrogate can be made to match roughly four
    observables by construction. The discriminating test — agreement on a HELD-OUT condition neither
    mechanism was tuned on — has now been run: within the calibrated regime the interface relation
    holds (single cell ~13%, colony growth ~9% pre-saturation), evidence that there the pattern is a
    property of the interface, not the mechanism; where the lumped mechanism lacks a needed variable
    (the O2 axis ~74%, the acetate trajectory ~68%) the relation breaks, and mechanism-first wins.
    The equivalence-class claim is thus true but regime-bounded, with the boundary measured.
studies:
- cellular-interface
- cell-environment-coupling
- cell-cell-coupling
- disintegration
- molecular-interfaces
- biomolecular-complementarity
- autopoiesis
- growth-and-division
- development-and-evolution
limitations:
- >-
  All nine patterns have a study, but the investigation demonstrates the patterns, not a calibrated
  cell: every mechanism is toy-real, and each study realizes only part of its pattern's full claim.
- >-
  Two of the four physical interface modalities — mechanical forces and electrical currents — are
  unrealized across every study; the chemical port is everywhere and the thermal port appears in the
  molecular study. A viva-cpm force/tension/pressure interface and an electrostatic channel are
  planned and do not yet exist.
- >-
  The composition is framework-level, not per-cell: the cellular world lives inside one monolithic
  coupling process that owns a private viva-cpm world object; cells are not processes and have no
  ports of their own.
- >-
  Chemotaxis (directed motion up the sensed gradient) is deferred to a follow-up variant of the
  flagship; the agent senses, metabolizes, grows, and secretes, but does not move up-gradient.
- >-
  Learning — a cell whose history of interaction changes its future regulation to keep itself viable
  — is the arc's next rung, named but not yet built.
expert_docs: []
acceptance_criteria:
  note: >-
    Two kinds of gate are distinguished throughout, in answer to the review. Per-study behaviour
    gates are tagged kind — regression_pin (a numeric threshold set AFTER observing the run; a
    valuable rerun-guard, not a discriminating test) versus acceptance_criterion (a directional
    prior that could be stated BEFORE the run). The investigation-level criteria below are the
    latter: qualitative predictions stated as priors, plus order-of-magnitude external anchors. The
    model is NOT calibrated to the anchors — they exist so an order-of-magnitude sanity check is at
    least possible, and to keep "passed" from meaning "matches nothing outside itself."
  prior_predictions:
  - >-
    Overflow prior — under an oxygen cap, an overflow-metabolism cell secretes acetate (acetate flux
    and field-total acetate rise above zero); with the O2 cap removed, secretion collapses toward
    zero. Stated before the run; the O2-uncap control tests it (acetate ~47 -> ~0, biomass
    0.37 -> 2.35).
  - >-
    Growth prior — with nutrients available a viable cell increases biomass and CPM volume over the
    run; a cell whose viability crosses its death threshold ceases to grow and dissolves.
  - >-
    Maintenance prior — a membrane whose production process is switched OFF loses closure and decays
    faster than the identical membrane with production ON (knockout strictly below control). A
    directional prediction, independent of the exact persistence step counts.
  - >-
    Selection prior — MET. Under selection-by-differential-division the population-mean uptake trait
    drifts UP relative to a no-selection control. Measured over a 30-seed ensemble per arm
    (selection-ON mean delta +0.233 up in 22/30, no-selection -0.026 up in 13/30): Mann-Whitney
    U p = 5.3e-4, rank-biserial r = +0.52, and a Wilcoxon drift-null gives p = 1.2e-5 — the shift is
    distinguishable from neutral drift. The gate is on this ensemble statistic, not a flagship seed.
    The effect is significant but medium — about a third of selection-ON seeds still drift down.
  - >-
    Substitutability prior — MEASURED, and the surrogate's boundary is now pinned, not assumed. A
    tuned surrogate is accepted as mechanism-independence only where it agrees on a HELD-OUT condition
    neither mechanism was tuned on. Single cell: the swap IS mechanism-independent WITHIN the
    calibrated glucose-limited/fixed-O2 regime (held-out ~13% on a different glucose field and a 2x
    run), but the lumped Michaelis-Menten box carries no oxygen variable, so on a held-out O2 cap it
    diverges ~74% — surrogate calibration, not mechanism-independence, across the O2 axis. Colony: the
    growth/competition observables are substitutable pre-saturation (~9%), but the ~0.2% acetate match
    is a lattice-saturation artifact — pre-saturation the acetate diverges ~68%. Degrees of freedom:
    single cell 4 params / 4 observables (exactly determined; the in-regime held-out agreement is the
    real evidence), colony 2 free / 6 observables (over-constrained, and the one parameter the
    surrogate controls is exactly the acetate that fails).
  external_anchors:
  - >-
    Acetate yield under overflow — order-of-magnitude anchor ~0.3-0.5 mol acetate / mol glucose
    (E. coli mixed-acid overflow). Not a calibration target; the flagship's toy-real constants are
    not fitted to it.
  - >-
    Glucose uptake — order-of-magnitude anchor ~10 mmol / gDW / hr (E. coli aerobic). Anchor only.
  - >-
    Aqueous diffusivities — glucose ~600 um^2/s, acetate ~1100 um^2/s, real ratio ~1.5-2x. The
    cross-feeding study uses an acetate/glucose diffusion ratio of ~37.5x, roughly 20x the physical
    ratio — a legibility choice so the plume reaches the consumer within the short run, stated as
    such, not "directionally defensible."
  status_reconciliation: >-
    Per-study confidence is reported as Provisional (gates pass as regression pins; scientific
    acceptance pending calibration), the investigation status is running, and the executive
    verdict_status is needs_calibration — one consistent signal, replacing the earlier
    Accepted/needs_calibration split the review flagged.
