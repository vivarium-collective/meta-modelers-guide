schema_version: 4
name: biofilm
investigation: draft-to-living-cell
title: Biofilm
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can multicellular development (Fig 10) be expressed as compositional reorganization — individual
  cells attaching, secreting extracellular matrix, and assembling into a biofilm that is itself a higher-level
  composite with its own aggregate observables?
biological_summary: 'If division makes two cells from one, development makes a community from many. Fig
  10-2 treats a biofilm as a composite at a level above the single cell: cells adhere to a surface (attached
  → 1.35, adhesion → 0.675), secrete a shared extracellular matrix (ecm → 1.8), and the whole assembly
  acquires an aggregate property — biofilm_mass → 2.25 — that no single cell has. The compositional point
  is that the same modelling apparatus that describes one cell describes their collective by nesting:
  the biofilm is a store containing cells, with processes that act on the group.'
claim: 'Development is composition at a higher level: individual cells reorganize into a community that
  is itself a composite with its own aggregate behavior.'
