schema_version: 4
name: biofilm
investigation: draft-to-living-cell
title: Biofilm
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can multicellular development (Fig 10) be expressed as compositional reorganization — individual
  cells attaching, secreting extracellular matrix, and assembling into a biofilm that is itself a higher-level
  composite with its own aggregate observables?
biological_summary: 'If division makes two cells from one, development makes a community from many. Fig
  10-2 treats a biofilm as a composite at a level above the single cell: cells adhere to a surface (attached
  0 → 1.35, adhesion 0 → 0.67) and grow (cells 1 → 1.57), secrete a shared extracellular matrix (ecm
  0 → 1.8), and the whole assembly acquires aggregate, colony-level observables that no single cell has —
  an emergent biofilm_mass accumulating 0 → 2.25. The compositional point
  is that the same modelling apparatus that describes one cell describes their collective by nesting:
  the biofilm is a store containing cells, with processes that act on the group.'
claim: 'Development is composition at a higher level: individual cells reorganize into a community that
  is itself a composite with its own aggregate behavior.'
baseline:
- name: development-rewrite
  composite: viva_meta_modelers_guide.composites.fig10-2-rewrite
  params: {}
- name: development
  composite: viva_meta_modelers_guide.composites.fig10-2-development
  params: {}
variants: []
behavior_tests:
- name: colony-growth
  classification: primary
  measure:
    kind: observable
    path: cells
    expr: last(cells)
  pass_if:
    op: '>='
    value: 1.4
    provenance: colony grows (exec cells last≈1.57)
  requires_simulation: colony-growth
- name: ecm-production
  classification: primary
  measure:
    kind: observable
    path: ecm
    expr: last(ecm)
  pass_if:
    op: '>='
    value: 1.0
    provenance: colony secretes extracellular matrix (exec ecm last≈1.8)
  requires_simulation: ecm-production
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: cells
    expr: last(cells)
  pass_if:
    op: '>='
    value: 1.4
    provenance: inert-draft run stays at seed cells 1 (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: biofilm
  composite: biofilm
  emitter: RAMEmitter
  id: biofilm
  status: completed
  provenance: scripts/render_study_evidence.py — fig10-2-executable compiled from the Fig 10-2 draft, run
    to completion through the engine.
  params: {}
  outcomes:
    COLONY-GROWS:
      result: PASS
      detail: cells 1 → 1.57, attaching to the surface (attached 0 → 1.35)
    ECM-ACCUMULATES:
      result: PASS
      detail: ecm 0 → 1.8; aggregate biofilm_mass 0 → 2.25
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The colony grows and its cells attach to the surface. Confirmed: cells 1 → 1.57, attached
    0 → 1.35.'
  evidence:
    from_test: colony-growth
    from_run: biofilm
    observed: cells 1 → 1.57, attached 0 → 1.35
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'Cells secrete a shared matrix and the assembly accumulates aggregate biofilm mass. Confirmed:
    ecm 0 → 1.8, biofilm_mass 0 → 2.25.'
  evidence:
    from_test: ecm-production
    from_run: biofilm
    observed: ecm 0 → 1.8, biofilm_mass 0 → 2.25
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Colony-growth and ECM-production pass on measured readouts; the inert draft stays at seed, so growth and secretion are mechanism-driven.
  explanatory_gain:
    result: POSITIVE
    basis: Nesting cells inside a biofilm store makes "development as higher-level composition" measurable via aggregate colony observables.
conclusion: '## Claims

  - The colony grows (cells 1→1.57), attaches, and secretes ECM (0→1.8), and colony-level observables
  emerge from nesting cells in a biofilm store — an aggregate biofilm_mass accumulating 0→2.25 that no
  single cell has.


  ## Evidence

  - **COLONY-GROWS** — cells 1 → 1.57, attached 0 → 1.35

  - **ECM-ACCUMULATES** — ecm 0 → 1.8; aggregate biofilm_mass 0 → 2.25


  ## Limitations

  - Toy-real colony: cells grow mildly (1→1.57) and ECM accumulates, but the rate constants are illustrative.


  ## Next steps

  - Give the biofilm spatial structure to test nutrient gradients and detachment as compositional processes.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - evolve
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Well-mixed colony with mild growth (cells 1→1.57); no spatial gradients, detachment, or nutrient-limited zones within the biofilm.
- Adhesion and ECM-secretion rates are illustrative, not fitted to a measured biofilm.
falsifiability: Overturned if the cells fail to grow and attach or if ECM and aggregate biofilm_mass fail to accumulate as the colony develops.
