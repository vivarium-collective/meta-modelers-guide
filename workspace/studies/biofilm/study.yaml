schema_version: 4
name: biofilm
investigation: draft-to-living-cell
title: Biofilm
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can multicellular development (Fig 10) be expressed as compositional reorganization — individual
  cells attaching, secreting extracellular matrix, and assembling into a biofilm that is itself a higher-level
  composite with its own aggregate observables?
biological_summary: 'If division makes two cells from one, development makes a community from many. Fig
  10-2 treats a biofilm as a composite at a level above the single cell: cells adhere to a surface and
  grow logistically toward a carrying capacity (cells 0.2 → 5.0 = K), secrete a shared extracellular matrix
  (ecm accumulating to ≈ 21.8), and the whole assembly acquires aggregate, colony-level observables that
  no single cell has. The compositional point
  is that the same modelling apparatus that describes one cell describes their collective by nesting:
  the biofilm is a store containing cells, with processes that act on the group.'
claim: 'Development is composition at a higher level: individual cells reorganize into a community that
  is itself a composite with its own aggregate behavior.'
baseline:
- name: development-rewrite
  composite: viva_meta_modelers_guide.composites.fig10-2-rewrite
  params: {}
- name: development
  composite: viva_meta_modelers_guide.composites.fig10-2-development
  params: {}
variants: []
behavior_tests:
- name: colony-growth
  classification: primary
  measure:
    kind: observable
    path: cells
    expr: last(cells)
  pass_if:
    op: '>='
    value: 2.0
    provenance: logistic colony grows toward K (exec last≈5.0)
  requires_simulation: colony-growth
- name: ecm-production
  classification: primary
  measure:
    kind: observable
    path: ecm
    expr: last(ecm)
  pass_if:
    op: '>='
    value: 5.0
    provenance: colony secretes extracellular matrix (exec last≈21.8)
  requires_simulation: ecm-production
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: cells
    expr: last(cells)
  pass_if:
    op: '>='
    value: 2.0
    provenance: inert-draft run stays at seed (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: biofilm
  composite: biofilm
  emitter: RAMEmitter
  id: biofilm
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    LOGISTIC-SATURATION:
      result: PASS
      detail: cells 0.2 → 5.0 (= K), sigmoidal
    ECM-ACCUMULATES:
      result: PASS
      detail: ECM accumulates through development
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Cell number follows logistic growth to carrying capacity. Confirmed: cells 0.2 → 5.0 (=
    K), sigmoidal.'
  evidence:
    from_test: logistic-saturation
    from_run: biofilm
    observed: cells 0.2 → 5.0 (= K), sigmoidal
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'Extracellular matrix accumulates as the colony develops. Confirmed: ECM accumulates through
    development.'
  evidence:
    from_test: ecm-accumulates
    from_run: biofilm
    observed: ECM accumulates through development
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Logistic-saturation and ECM-accumulates pass on measured readouts; the inert draft stays at seed, so growth and secretion are mechanism-driven.
  explanatory_gain:
    result: POSITIVE
    basis: Nesting cells inside a biofilm store makes "development as higher-level composition" measurable via aggregate colony observables.
conclusion: '## Claims

  - The colony grows LOGISTICALLY to its surface carrying capacity (cells saturate at K=5, not unbounded/linear)
  while ECM accumulates — development as a saturating, resource-limited compositional process.


  ## Evidence

  - **LOGISTIC-SATURATION** — cells 0.2 → 5.0 (= K), sigmoidal

  - **ECM-ACCUMULATES** — ECM accumulates through development

  - **conservation** — cells saturate at carrying capacity K (cells_final 5.00), not unbounded/linear
  growth


  ## Limitations

  - Toy-real colony: growth saturates logistically at K and ECM accumulates, but the rate constants are illustrative.


  ## Next steps

  - Give the biofilm spatial structure to test nutrient gradients and detachment as compositional processes.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - evolve
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Well-mixed logistic colony with a single carrying capacity; no spatial gradients, detachment, or nutrient-limited zones within the biofilm.
- Adhesion and ECM-secretion rates are illustrative, not fitted to a measured biofilm.
falsifiability: Overturned if the colony grows without bound (no logistic saturation at K) or if ECM fails to accumulate as the colony develops.
