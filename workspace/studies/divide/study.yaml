schema_version: 4
name: divide
investigation: draft-to-living-cell
title: Divide
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Is cell division in Fig 10 a genuine structural rewrite of the place graph — a single cell node actually becoming two daughter nodes at runtime, fired by the cell's own replicated DNA crossing a threshold — rather than a pre-declared post-structure that is merely animated on a wall clock?
biological_summary: 'Fig 10 rewrites the cell across time, and division is its sharpest case. This is not a process nudging numbers in a fixed structure — it is a change to the place graph itself, a reaction rule in Milner''s sense whose reactum has more nodes than its redex. The trigger is the cell''s OWN biology, not a timer: an autocatalytic DNA-replication process grows the cell''s ``dna`` and, when it crosses ``dna_threshold`` = 2.0, the rewrite fires exactly once. There is no wall clock, no ``division_time``, no scheduled tick — the cell divides because ``dna >= threshold``. At the event the parent''s biomass is PARTITIONED, not duplicated: the parent node''s biomass is driven to 0 and each of the two daughters receives M/2, so mass is CONSERVED (one cell node → two daughter nodes). Measured on the compiled composite fig10-1-executable, the parent''s ``dna`` climbs 1 → 3.06 and crosses the threshold; the rewrite fires; ``cell_count`` goes 1 → 2; each daughter inherits DNA (0 → 2.75) and half the parent''s biomass (0 → 0.5) while the parent''s biomass falls to 0. The daughters are structurally new — they do not exist in the initial state — which is exactly what makes this an event-driven rewrite rather than an animation of a pre-built pair.'
claim: 'Division is a change to the composition itself, triggered by the cell''s own replicated DNA crossing a threshold: one cell becomes two through a graph rewrite that creates new nodes at runtime and conserves mass (the parent is halved, not doubled) — not a pre-drawn pair on a timer.'
baseline:
- name: division-rewrite
  composite: meta_modelers_guide.composites.fig10-1-rewrite
  params: {}
- name: division
  composite: meta_modelers_guide.composites.fig10-1-division
  params: {}
variants: []
behavior_tests:
- name: division-fires
  classification: primary
  description: 'The cell''s replicated DNA crosses ``dna_threshold`` = 2.0 (parent dna 1 → 3.06) and the rewrite fires ONCE — cell_count goes 1 → 2. The trigger is DNA state, not a wall clock.'
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 1.5
    provenance: 'DNA crosses threshold 2.0 (parent dna 1→3.06) → rewrite fires once, cell_count 1→2 (exec fig10-1-executable)'
  requires_simulation: divide
- name: daughters-spawn
  classification: primary
  description: 'The rewrite spawns two structurally-new daughter nodes and CONSERVES MASS: each daughter inherits DNA (0 → 2.75) and half the parent''s biomass (0 → 0.5) while the parent''s biomass is driven to 0 (M → M/2 + M/2, not M → 2M).'
  measure:
    kind: observable
    path: dna
    expr: last(dna)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'division spawns two new daughters (exec daughter dna 0→2.75; each daughter biomass 0→0.5, parent biomass →0 — mass conserved)'
  requires_simulation: divide
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'One-line sanity check (NOT the study''s control): the inert draft has empty updates by construction, so it stays at seed cell_count 1 and fails this threshold by design. This confirms the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 1.5
    provenance: 'inert-draft run stays at seed cell_count 1 (empty update by construction) → fails by design (expected-fail control)'
  requires_simulation: divide
runs:
- name: divide
  composite: divide
  emitter: RAMEmitter
  id: divide
  status: completed
  provenance: scripts/render_study_evidence.py — fig10-1-executable compiled from the Fig 10-1 draft, run to completion through the engine.
  params: {}
  outcomes:
    DIVISION-FIRES:
      result: PASS
      detail: parent dna 1 → 3.06 crosses dna_threshold 2.0 → the rewrite fires once, cell_count 1 → 2 (spawning daughter_1 + daughter_2)
    DAUGHTERS-SPAWN:
      result: PASS
      detail: each daughter inherits dna 0 → 2.75 and biomass 0 → 0.5, while the parent biomass falls to 0 — mass conserved (one node → two nodes)
    DRAFT-IS-INERT:
      result: PASS
      detail: 'expected-fail control: the inert draft (empty update) stays at seed cell_count 1 — it fails the ≥1.5 threshold by design, confirming a draft is inert'
