schema_version: 4
name: divide
investigation: draft-to-living-cell
title: Divide
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Is cell division in Fig 10 a genuine structural rewrite of the place graph — a single cell node
  actually becoming two daughter nodes at runtime — rather than a pre-declared post-structure that is
  merely animated?
biological_summary: 'Fig 10 rewrites the cell across time, and division is its sharpest case. This is
  not a process nudging numbers in a fixed structure — it is a change to the place graph itself, a reaction
  rule in Milner''s sense whose reactum has more nodes than its redex. When a cell''s DNA crosses a
  threshold, the rule fires: the cell node is replaced by two daughter nodes, each inheriting a symmetric
  share of the parent''s DNA. Fired once as the cell grows to threshold, it takes cell_count from 1 to 2
  — a single division event — with the parent''s dna climbing 1 → 3.06 and each new daughter spawning dna
  0 → 2.75 and biomass 0 → 0.5. The daughters
  are structurally new — they do not exist in the initial state — which is exactly what makes this an
  event-driven rewrite rather than an animation of a pre-built pair.'
claim: 'Division is a change to the composition itself: one cell becomes two through a graph rewrite that
  creates new nodes at runtime, not a pre-drawn pair.'
