conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Division-fires and daughters-spawn both pass — the DNA threshold is crossed, the rewrite fires once, and mass is conserved across the partition; the inert draft stays at cell_count 1, so division is a real runtime rewrite.
  explanatory_gain:
    result: POSITIVE
    basis: Watching one cell node be replaced by two structurally-new daughters — fired by the cell's own DNA crossing a threshold, with mass conserved — makes division-as-graph-rewrite concrete rather than animated on a clock.
conclusion: '## Claims

  - The cell''s own replicated DNA crossing a threshold (dna_threshold = 2.0) triggers a single division event: the cell node is replaced by two structurally-new daughter nodes and cell_count goes 1→2. The rewrite CONSERVES MASS — the parent''s biomass fully partitions (parent→0, each daughter M/2=0.5), it is not duplicated. There is no wall clock: the trigger is ``dna >= threshold``.


  ## Evidence

  - **DIVISION-FIRES** — parent dna 1 → 3.06 crosses dna_threshold 2.0 → rewrite fires once, cell_count 1 → 2

  - **DAUGHTERS-SPAWN** — each daughter dna 0 → 2.75, biomass 0 → 0.5; parent biomass → 0 (mass conserved)

  - **DRAFT-IS-INERT** — sanity check: the inert draft (empty update) stays at cell_count 1 by construction


  ## Limitations

  - Toy-real division: the rewrite fires once and division is symmetric; the DNA threshold, replication and segregation constants are illustrative.


  ## Next steps

  - Add repeated, size-controlled, or asymmetric division rules to test the rewrite mechanism under realistic division control.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; the DNA-threshold trigger fires, the structural rewrite runs, and mass is conserved.
    pipeline_unblocks:
    - typed-interface
  if_primary_tests_fail:
    diagnose:
    - the DNA-replication process never drives dna across the threshold (the rewrite never fires)
    - the rewrite fails to spawn two structurally-new daughter nodes, or fails to conserve mass across the partition
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's division rewrite)
limitations:
- Symmetric division with a fixed DNA threshold; asymmetric division, septum placement, and size control are not modelled.
- The rewrite fires once (cell_count 1→2); repeated division and spatial structure among daughters are not modelled.
falsifiability: Overturned if cell_count never increases (the DNA threshold is never crossed and the rewrite never fires), if the division fails to spawn two structurally-new daughter nodes, or if mass is not conserved across the partition (the parent's biomass is not driven to 0 while the daughters receive M/2 each).
