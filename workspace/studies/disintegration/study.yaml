experiment: 'Two runs test the two faces of disintegration. (a) Play `fig06-disintegration-dynamics` (a scripted thermal shock against a viability-gated cell) to 20 steps and watch viability, then debris. (b) Install three different handlers — coarse lumped yield, saturating kinetic, real COBRApy FBA over e_coli_core — behind the identical nutrients ⇒ biomass interface and run each to completion; also compile an impostor handler to test that the port contract is enforced.'
result: 'Played through, the dynamics composite shows the level shift: viability collapses 1.0 → ~0 after a thermal shock, and biomass converts into molecular debris (0 → ~4.6). The three metabolism grains produce three distinct trajectories (biomass 4.0 / 2.667 / 6.29) behind the identical port set; the FBA grain shows acetate overflow (secretions 30.4), and an impostor that breaks the interface is rejected at compile time.'
