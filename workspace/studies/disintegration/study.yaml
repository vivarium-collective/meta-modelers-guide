conclusion: '## Claims

  - Composing one real CPM cell with a real spatio-flux acetate field and a real spatio-flux
    particle-movement process through two coupling processes (`CpmDisintegration` for the
    viability-collapse trigger and resorption, stock `BrownianMovement` for the debris scatter)
    reproduces the paper''s §Disintegration level-shift (Fig 6) as genuine spatial dissolution.
    Over a 20-24
    tick run: the cell holds coherent (area > 30) through tick 6, the footprint-local acetate
    mean crosses viability_threshold at released_tick == 7, the domain resorbs to area 0 by tick
    16, and sheds 68 particles -- the CPM trajectory (hold/cross/resorb, released_tick, area,
    shed particle count) is fixed-seed deterministic and reproduces exactly. The debris cloud''s
    RMS spread keeps strictly increasing through tick 24 (~5.3 -> ~7.6 in a representative run);
    BrownianMovement is unseeded, so those exact magnitudes vary run-to-run -- only the strict
    increase is the robust, reproducible claim.

  - The stressor is literally `acetate` -- the SAME molecule that is metabolic waste and
    cross-feeding food in `cell-cell-coupling-spatial`, here a toxin whose high local concentration
    crosses the cell''s viability bound. This carries the paper''s closing relational-molecule
    claim (§Cell–cell coupling): one molecule counting as nutrient, signal, or toxin through its
    consequences for viability -- nutrient/food there, toxin here.

  - The two phases realize §Disintegration''s failure cascade end to end: an actively maintained,
    far-from-equilibrium CPM domain, once viability is lost, relaxes into a diffusion-dominated,
    equilibrating debris cloud under `BrownianMovement`. Most models skip this transition
    explicitly -- agent-based models remove cells mid-simulation and whole-cell models assume
    viability -- so carrying a coherent domain through its own dissolution into diffusing debris is
    the explanatory gain.


  ## Evidence

  - **CELL-HOLDS-COHERENT-BEFORE-CROSSING** -- area 61-66 through tick 6, released False, 0
    particles

  - **STRESSOR-CROSSES-VIABILITY-BOUND** -- released_tick == 7.0, deterministic

  - **DOMAIN-RESORBS-TO-ZERO** -- area falls from 56 (tick 7) to 0 (tick 16)

  - **SHED-MATERIAL-BECOMES-DEBRIS-PARTICLES** -- 68 debris particles by tick 16

  - **DEBRIS-CLOUD-KEEPS-SCATTERING** -- RMS spread ~5.3 (tick 16) -> ~7.6 (tick 24), a
    representative run (BrownianMovement is unseeded; the strict increase is the robust claim)

  - **PARTICLE-BRIDGE-EMITS-THEN-SCATTERS** -- 3 synthetic particles emitted then scattered,
    bridge verified independently


  ## Limitations

  - The disintegration mechanism realized here is resorption + particle-shedding, not in-lattice
    fragmentation -- the connectivity/E1 structural-integrity constraint is a verified no-op in
    this viva-cpm build, and lambda_volume/temperature are init-only with no runtime setters, so
    a settled domain cannot be shattered into scattered pixels in-lattice. This is a chosen,
    honest realization of "the coherent domain dissolves," not emergent lattice fragmentation --
    a real engine limitation, documented in the API map.

  - Debris particles move under spatio-flux BrownianMovement (NumPy diffusion), not rigid-body
    pymunk physics -- they drift and scatter, they do not collide or fall.

  - The acetate gradient, viability_threshold, resorb_per_tick, max_particles_per_tick, and
    diffusion coefficients are toy-real -- plausible, hand-tuned magnitudes chosen to make the
    full arc legible within a 20-24 tick run, not fitted to a named stressor or material.

  - Unlike studies 2-3 in this investigation, this study''s CPM cell has no metabolism/cobra path
    at all -- CpmDisintegration is built around the viability-collapse trigger alone.

  - The released flag latches permanently once crossed and never un-crosses, even once the
    footprint empties and would otherwise read a misleadingly low stressor mean.


  ## Next steps

  - Extend the debris-scatter mechanism with pymunk rigid-body physics so shed particles can
    collide and settle, rather than only diffusing.

  - Investigate whether the connectivity/E1 no-op is a genuine viva-cpm upstream bug worth
    reporting, since a working structural-integrity lock would let a future study demonstrate
    in-lattice fragmentation directly.

  - Fan out to the next spatial counterpart in the design spec''s increment plan.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'disintegration-spatial.composite.json builds and runs to completion

      through the engine over a deterministic 20-24 tick run.'
    biological_validation: The spatial §Disintegration level-shift pattern (Fig 6) is demonstrated
      at the toy-real
      (uncalibrated) level, with genuine per-pixel CPM shape dynamics, a real diffusing acetate
      field, and a verified particle bridge behind the hold-cross-resorb-scatter arc, rather than
      a scripted trajectory.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the cell fails to hold coherent before crossing (the acetate gradient is too aggressive,
      or the cell's viability threshold is being crossed spuriously at the seed footprint)
    - released_tick drifts or the released flag never latches (the diffusion coefficient or
      gradient shape no longer brings the footprint-local mean above threshold within the run)
    - the domain fails to resorb to 0 (resorb_per_tick too small relative to the run length, or
      the target-volume ramp is not being applied after release)
    - shed particles are missing or the debris cloud stops scattering (the CPM-to-particle bridge
      is broken, or BrownianMovement is not wired to the particles store)
    block_downstream: 'any future spatial study reusing the CpmDisintegration pattern or the
      CPM-to-particle bridge (e.g. a spatial growth-and-division study that needs to shed
      material on division)'
