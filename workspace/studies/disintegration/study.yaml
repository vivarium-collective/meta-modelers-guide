- The released flag latches once the crossing happens and never un-crosses, even once the
  footprint empties and its mean-stressor reading would otherwise read misleadingly low -- a
  deliberate design choice so a dissolved cell cannot spuriously "recover" viability.
- 'The CPM-to-particle bridge (a process emitting particles via the map `_add` sentinel into a
  shared map[particle] store, moved by a separate stock BrownianMovement process) is now
  runtime-verified directly (tests/test_particle_bridge_spike.py), independent of the
  disintegration mechanism itself -- previously an unverified primitive.'
- 'Read against a lumped, specification-stage realization of the same pattern: that

  kind of model closes the paper''s §Disintegration level-shift (Fig 6) with a scripted viability scalar

  decaying on a thermal-shock

  timer, over a lumped cell-state composite. This study closes the same level-shift with a real

  CPM cell''s structural viability collapsing under a real diffusing acetate field, its domain

  genuinely resorbing in lattice pixels rather than a scalar dropping toward zero, and its shed

  material becoming literal scattering particles rather than an abstract debris variable. Compare

  the two for the same disintegration claim at two very different mechanistic resolutions.'
falsifiability: Overturned if the cell fails to hold coherent before the acetate crosses its
  viability bound, if the crossing tick is not deterministic across repeated runs of the same
  composite, if the domain fails to resorb to near-zero area within the run, if shed pixels do
  not appear as particles in the shared store, if the debris cloud's RMS spread fails to increase
  after dissolution completes (implying stalling or wall-saturation rather than genuine
  scattering), or if the foundational CPM-to-particle bridge control fails to preserve particle
  count or produce movement.
