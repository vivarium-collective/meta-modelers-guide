schema_version: 4
name: disintegration
investigation: draft-to-living-cell
title: Disintegration
created: '2026-08-20'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'Fig 6 is disintegration — the change in level of description that fires when a cell crosses its viability bound. Two faces: (a) played through, does the disintegration composite actually show that shift — a thermal shock pushing viability past its bound, viability collapsing, viability-gated metabolism halting, and biomass turning into molecular debris? (b) Is the metabolic-exchange interface at the heart of that same shift realizable at a coarse cell-level grain, an intermediate kinetic grain, and a resolved molecular-network grain (real COBRApy flux-balance optimization) — three grains behind ports that never move?'
biological_summary: 'Fig 6 is disintegration: the point where a cellular description stops being adequate and the right level of description drops to interacting molecular components. This study makes that shift both watchable and structural. (a) Playable: `fig06-disintegration-dynamics` scripts a thermal shock (temperature 37 → 50 at t≈8) against a cell with a fixed viability band. Play it in the Composite Explorer and the trajectory is legible without reading code — viability holds near 1.0, the shock lands, viability collapses toward 0, viability-gated metabolism halts, and biomass converts into molecular debris (biomass-conserving decay, not disappearance). Measured on `fig06-disintegration-dynamics` over 20 steps: viability 1.0 → ~0, debris 0 → ~4.6 (`tests/test_disintegration_dynamics.py::test_playing_the_composite_shows_disintegration`). (b) Structural: the same metabolic-exchange interface (nutrients ⇒ biomass, energy, entropy, secretions) that disintegration eventually halts is realizable at three different grains without moving a port. The coarse handler applies a lumped yield (biomass → 4.0). The kinetic handler applies a saturating Michaelis–Menten-like rate on the identical nutrient supply, reaching a distinct endpoint (biomass → 2.667). The FBA handler calls real COBRApy to solve a flux-balance optimization over the `e_coli_core` network each step — the resolved molecular network — and under sustained uptake overflows surplus carbon to acetate (biomass → 6.29, secretions → 30.4). `test_fig6_handler_independence` compiles the coarse and kinetic handlers against the identical interface and asserts they diverge; `tests/test_fba.py` adds the real COBRApy grain and its acetate-overflow signature. Three grains, one interface, coarse-graining as the reverse move: that is Law 4 made concrete on the exact interface that disintegration, played through, shows failing.

  How to view: run `/viva-explore fig06-disintegration-dynamics` and step through it in the Composite Explorer to watch the viability curve collapse and debris rise in real time.'
claim: 'Disintegration is a change in level of description made executable and watchable: playing `fig06-disintegration-dynamics`, a thermal shock pushes the cell past its viability bound, viability collapses, viability-gated metabolism halts, and biomass decays into molecular debris (Fig 6a). The same metabolic-exchange interface''s cell↔molecular-network equivalence carries three grains behind ports that never move — a coarse lumped yield, a saturating kinetic law, and real COBRApy flux-balance on `e_coli_core` (Fig 6b, Law 4).'
baseline:
- name: disintegration-dynamics
  composite: meta_modelers_guide.composites.fig06-disintegration-dynamics
  params: {}
- name: disintegration-grain-swap
  composite: meta_modelers_guide.composites.fig06-disintegration
  params: {}
- name: coarse-grain
  composite: meta_modelers_guide.composites.fig06-executable-coarse
  params: {}
- name: kinetic-grain
  composite: meta_modelers_guide.composites.fig06-executable-kinetic
  params: {}
- name: fba-grain
  composite: meta_modelers_guide.composites.fig06-executable-fba
  params: {}
variants: []
behavior_tests:
- name: viability-collapse
  classification: primary
  description: 'Headline — played through, `fig06-disintegration-dynamics` shows the level shift: the cell starts viable (viability > 0.9), the scripted thermal shock (t≈8) lands, and viability collapses past the floor (< 0.3) by step 20. This is the composite''s own dynamics, not a post-hoc annotation.'
  measure:
    kind: observable
    path: cell.viability
    expr: last(cell.viability)
  pass_if:
    op: <
    value: 0.3
    provenance: 'played to 20 steps: viability 1.0 → ~0, collapsing past the 0.3 floor (tests/test_disintegration_dynamics.py::test_playing_the_composite_shows_disintegration)'
  requires_simulation: disintegration-dynamics
- name: biomass-to-debris
  classification: primary
  description: 'The same run shows biomass converting into molecular debris once viability-gated metabolism halts — the cell-level description literally decaying into molecular-level debris (debris > 0 by step 20).'
  measure:
    kind: observable
    path: cell.debris
    expr: last(cell.debris)
  pass_if:
    op: '>'
    value: 0.0
    provenance: 'played to 20 steps: debris 0 → ~4.6 as biomass disintegrates into molecular debris (tests/test_disintegration_dynamics.py::test_playing_the_composite_shows_disintegration)'
  requires_simulation: disintegration-dynamics
- name: coarse-linear-growth
  classification: primary
  description: 'The linear coarse-grain handler drives biomass on the shared nutrients ⇒ biomass interface to its own endpoint (exec 4.0), also emitting energy 2.4, entropy 0.8, secretions 1.6.'
  measure:
    kind: observable
    path: biomass
    expr: last(biomass)
  pass_if:
    op: '>='
    value: 3.5
    provenance: 'coarse (lumped linear yield) → biomass 4.0 (exec fig06-executable-coarse)'
  requires_simulation: coarse-grain
- name: kinetic-saturating-growth
  classification: primary
  description: 'The Michaelis–Menten handler, on the identical interface and wiring, reaches a distinct biomass endpoint (exec 2.667) — the same ports, a different mechanism, a different trajectory (handler independence, law 4). Directly asserted by test_fig6_handler_independence, which compiles the coarse and kinetic grains against the same interface and requires their dynamics to diverge.'
  measure:
    kind: observable
    path: biomass
    expr: last(biomass)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'kinetic (saturating Michaelis–Menten uptake) → biomass 2.667 (exec fig06-executable-kinetic), distinct from the coarse 4.0 (tests/test_compilation.py::test_fig6_handler_independence)'
  requires_simulation: kinetic-grain
- name: fba-overflow-secretion
  classification: primary
  description: 'The real COBRApy flux-balance handler (LP over e_coli_core, the resolved molecular network) reaches its own distinct biomass endpoint (exec 6.29) and routes surplus carbon to acetate overflow — secretions on the shared port rise to 30.4. Requires the optional `cobra` dependency; guarded skip when absent (tests/test_fba.py).'
  measure:
    kind: observable
    path: secretions
    expr: last(secretions)
  pass_if:
    op: '>='
    value: 10.0
    provenance: 'FBA overflow metabolism: acetate on the secretions port 0→30.4 (exec fig06-executable-fba); biomass reaches 6.29 (tests/test_fba.py)'
  requires_simulation: fba-grain
- name: impostor-rejected
  classification: primary
  control: negative
  description: 'Headline control (must-fail) — the single most persuasive artifact for the interface being real. An impostor handler (NonConformingMetabolism) that renames the biomass output to ``growth`` with the wrong type (``growth_rate`` not ``mass``) and drops energy/entropy/secretions is rejected by the compiler at compile time with a CompileError that names the missing ports (biomass, energy, entropy, secretions) — tests/test_fba.py::test_impostor_handler_rejected_by_compiler. Because the impostor never runs, it produces no biomass observable, so this test''s biomass threshold must fail by design — that expected failure is the interface being enforced. (Scope: structural — port names/types/wiring — not units, dimensions, invariants, or runtime behavior.)'
  measure:
    kind: observable
    path: biomass
    expr: last(biomass)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'Rejection control: NonConformingMetabolism is rejected by the compiler (CompileError names missing biomass/energy/entropy/secretions); it never runs, so no biomass observable exists — must fail (tests/test_fba.py::test_impostor_handler_rejected_by_compiler)'
  requires_simulation: disintegration-grain-swap
