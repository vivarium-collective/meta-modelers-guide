parent_studies:
- study: cell-cell-coupling-spatial
  condition: tests-passed
experiment: 'Run the `disintegration-spatial` composite (`CpmDisintegration`, a single CPM cell
  on a shared 60x60 field grid inside a radial acetate gradient, coupled to a stock
  `BrownianMovement` particle-scatter process) to completion over 20-24 ticks through the
  process-bigraph engine, and measure whether a diffusing acetate field crossing a CPM cell''s
  own viability bound is enough to trigger structural dissolution (domain resorption) and convert
  its shed material into a genuinely scattering debris cloud.

  '
result: 'Over a 20-24 tick run, the CPM cell holds coherent (area > 30) through
  tick 6, the footprint-local acetate mean crosses viability_threshold at released_tick == 7,
  the domain resorbs to area 0 by tick 16, and sheds exactly 68 particles into a shared debris
  store -- the CPM trajectory (hold/cross/resorb, released_tick, area, shed particle count) is
  fixed-seed deterministic and reproduces exactly run to run. That debris cloud''s RMS spread
  keeps strictly increasing through tick 24 (~5.3 -> ~7.6 in a representative run) -- genuine
  scattering, not wall-saturation; BrownianMovement is unseeded, so the exact RMS magnitudes vary
  run-to-run and are representative rather than reproducible, but the strict increase is the
  robust, test-asserted claim. The paper''s §Disintegration level-shift (Fig 6) holds
  as real spatial dissolution, composed from independent frameworks (viva-cpm + spatio-flux particles) through
  one coupling process plus one stock movement process. The stressor here is literally `acetate`,
  the SAME molecule that is metabolic waste and cross-feeding food in `cell-cell-coupling-spatial`
  -- one molecule whose meaning is set relationally by each cell''s interface (§Cell–cell coupling):
  nutrient there, toxin here. And the scatter phase reads directly as §Disintegration''s failure
  cascade -- the actively maintained, far-from-equilibrium cell relaxing, once viability is lost,
  into a diffusion-dominated debris cloud, the transition most models skip (agent-based models
  delete the cell, whole-cell models assume viability).

  '
