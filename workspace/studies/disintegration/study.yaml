  particles. This is framed as a chosen, honest realization of "the coherent domain dissolves,"
  not as emergent lattice fragmentation -- a real engine limitation, documented in
  docs/superpowers/api-maps/2026-08-21-disintegration-api-map.md.
- Debris particles move under spatio-flux BrownianMovement (NumPy diffusion), not rigid-body
  pymunk physics -- the particles drift and scatter, they do not collide with each other or with
  the dissolving cell, and do not fall under gravity.
- The acetate field's radial gradient, viability_threshold, resorb_per_tick,
  max_particles_per_tick, and the diffusion coefficients (acetate D=4.0, debris
  diffusion_rate=1.0) are toy-real, hand-tuned magnitudes chosen to make hold-cross-resorb-scatter
  all legible within a 20-24 tick run -- not fitted to a named stressor, material, or literature
  target.
- Unlike studies 2-3 in this investigation (cell-environment-coupling-spatial,
  cell-cell-coupling-spatial), this study's CPM cell has no metabolism/cobra path at all --
