parent_studies:
- study: disintegration-spatial
  condition: tests-passed
experiment: 'Run the `growth-division-spatial` composite (`CpmGrowthDivision`, a single CPM cell
  seeded on a uniform abundant 60x60 glucose field, glucose_vmax=1.5, vol_threshold=80,
  reset_target=40) to completion over 36 ticks through the process-bigraph engine, and measure
  whether metabolism-driven volume growth crossing a threshold is enough to trigger the native
  CPM engine''s divide_cells operation and compound a single seed cell into a small, bounded
  lineage.

  '
result: 'Over a 36-tick run sampled every 3 ticks, the CPM cell population steps up in a monotonic
  non-decreasing staircase (1,2,2,2,4,4,5,8,8,11,14,18), spanning roughly 3-4 generations from a
  single seed cell, while every cell''s CPM volume stays bounded in a sawtooth between
  reset_target = 40 and vol_threshold = 80 -- growth, crossing, division, and resumed growth in
  the daughters, all as direct simulation output composed from three independently-developed
  frameworks (viva-cpm + spatio-flux + cobra) through one coupling process. The paper''s
  §Growth and division growth-then-divide pattern (Fig 10a,b) holds as genuine spatial
  multicellular compounding, using the native
  spatial CPM division primitive in contrast to `draft-to-living-cell/growth-and-division`''s
  place-graph rewrite.

  '
