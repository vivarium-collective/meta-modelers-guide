parent_studies:
- study: disintegration-spatial
  condition: tests-passed
experiment: 'Run the `growth-division-spatial` composite (`CpmGrowthDivision`, a single CPM cell
  seeded on a uniform abundant 60x60 glucose field, glucose_vmax=1.5, vol_threshold=80,
  reset_target=40) to completion over 36 ticks through the process-bigraph engine, and measure
  whether metabolism-driven volume growth crossing a threshold is enough to trigger the native
  CPM engine''s divide_cells operation, partition biomass across daughters, and compound a single
  founder cell into a genuine multi-generation lineage tree -- and whether sibling cells sharing
  the field begin diverging in division timing rather than staying in lockstep.

  '
result: 'Over a 36-tick run sampled every 3 ticks, a single founder cell compounds into an
  18-cell lineage tree spanning 4 generations (max_generation = 4), with every daughter''s
  generation and parent id tracked from the engine''s own divide_cells return value. The
  population steps up in a monotonic non-decreasing staircase (1,2,2,2,4,4,5,8,8,11,14,18) that
  departs from clean powers of two from tick 21 onward -- sibling cells, coupled through the
  shared glucose field, grow at different local rates as the colony crowds, so their division
  timing desynchronizes even though they share a common parent, exactly the paper''s "coordination
  and divergence" (§Growth and division). Every cell''s CPM volume stays bounded in a sawtooth
  between reset_target = 40 and vol_threshold = 80; the staircase is bounded more by lattice
  crowding (the colony packs to roughly two-thirds occupancy within its own footprint) than by
  nutrient limitation (field-wide glucose depletes only ~3% over the run). Growth, crossing,
  division with biomass partitioned across daughters, and resumed growth in each -- all direct
  simulation output composed from three independently-developed frameworks (viva-cpm + spatio-flux
  + cobra) through one coupling process. The paper''s §Growth and division growth-then-divide
  pattern (Fig 10a,b) holds as genuine spatial multicellular compounding, using the native spatial
  CPM division primitive in contrast to `draft-to-living-cell/growth-and-division`''s place-graph
  rewrite.

  '
