schema_version: 4
name: growth-and-division-spatial
investigation: the-cellular-interface-multicellular
title: Growth and Division, Spatial
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'Does the paper''s §Growth and division growth-then-divide pattern (Fig 10a,b) hold spatially -- a CPM cell whose
  metabolism (dFBA solved at its own lattice footprint) grows its volume until it crosses a
  threshold and divides via the native CPM engine operation `divide_cells` (mass-conserved),
  compounding into a small lineage over the run -- composed from independent frameworks
  (viva-cpm + spatio-flux + cobra) through one coupling process (`CpmGrowthDivision`)?

  '
biological_summary: 'This is the spatial realization of the paper''s §Growth and division
  growth-then-divide pattern (Fig 10a,b), built on a new coupling process,
  `CpmGrowthDivision`, that owns a single CPM cell on a shared spatio-flux glucose field. Each
  tick the process reads glucose at the cell''s own CPM footprint, runs one dynamic-FBA step
  against `e_coli_core`, grows the cell''s CPM target volume from the biomass produced (the same
  metabolism-drives-growth pattern as the flagship, `cell-environment-coupling-spatial`), and
  once the cell''s actual CPM volume crosses `vol_threshold`, calls the native engine operation
  `divide_cells(vol_threshold, reset_target)` -- splitting the cell into two mass-conserved
  daughters (parent keeps its id, one new id is minted) and resetting both to `reset_target`
  biomass/volume so growth resumes in each. Each daughter gets its own independent cobra model
  copy, keyed off the live cell ids read from the engine''s own snapshot each tick, so newly
  divided cells are picked up and grown without any scripted bookkeeping. The native division
  primitive this depends on is not an assumption -- it is runtime-verified directly
  (`tests/test_cpm_divide_spike.py`): a single grown cell split at threshold 80/reset 40 yields
  exactly one new daughter id, the parent id is kept, and the two daughters'' combined volume
  matches the pre-split volume within rounding; a cell below threshold is confirmed a no-op.


  One tuned regime over `growth-division-spatial`
  (`meta_modelers_guide.composites.growth-division-spatial`) demonstrates the full arc: a single
  CPM cell seeded on a uniform, abundant 60x60 glucose field (`glucose_vmax` deliberately tuned
  down to 1.5, `vol_threshold` 80, `reset_target` 40). Measured over a 36-tick run sampled every 3
  ticks (`tests/test_growth_division_regime.py`, `tests/test_cpm_growth_division.py`,
  `tests/test_growth_division_viz.py`): the population steps up 1 -> 2 -> 2 -> 2 -> 4 -> 4 -> 5 -> 8 -> 8 -> 11 -> 14 -> 18, a monotonic non-decreasing staircase spanning roughly 3-4 generations
  from a single seed cell, never losing a cell to a phantom or a runaway single-cell absorbing the
  whole lattice. Per-cell CPM volume sawtooths in a bounded band (roughly 31-79 px) throughout the
  run -- each cell grows toward `vol_threshold` = 80, is halved by division back down near
  `reset_target` = 40, and immediately resumes growing -- with every daughter''s starting volume
  well clear of zero. The whole arc -- grow, cross threshold, divide, daughters resume -- is
  direct, code-verified simulation output composed from three independently-developed frameworks
  (viva-cpm''s CPM engine, spatio-flux''s diffusion-advection field and dynamic-FBA, and cobra''s
  flux-balance solver) through one coupling process, not a scripted lineage tree.

  '
claim: 'Composing one real CPM cell, growing via real per-footprint dFBA metabolism, with the
  native CPM engine operation `divide_cells` through a single coupling process
  (`CpmGrowthDivision`) reproduces the paper''s §Growth and division growth-then-divide pattern
  (Fig 10a,b) as genuine spatial multicellular compounding, not a scripted lineage or a lumped
  stand-in for it: over a 36-tick
  run sampled every 3 ticks, the population steps up in a monotonic non-decreasing staircase
  (1,2,2,2,4,4,5,8,8,11,14,18), spanning roughly 3-4 generations, while every cell''s CPM volume
  stays bounded in a sawtooth between `reset_target` = 40 and `vol_threshold` = 80 -- growth,
  crossing, division, and resumed growth in the daughters, all as direct simulation output from
  three independently-developed frameworks (viva-cpm + spatio-flux + cobra) meeting at one typed
  interface. This mirrors `draft-to-living-cell/growth-and-division`''s §Growth and division
  claim (Fig 10a,b) (growth
  drives the cell''s own state across a threshold; crossing the threshold triggers division) but
  realizes the division event itself as the native spatial CPM operation `divide_cells` acting
  directly on lattice pixels, in contrast to that study''s place-graph rewrite (one node becoming
  two structurally-new nodes at a lumped, non-spatial level of composition).

  '
baseline:
- name: growth-division-spatial
  composite: meta_modelers_guide.composites.growth-division-spatial
  params: {}
variants: []
key_assumptions:
- 'Growth is genuinely metabolism-driven -- a real dynamic-FBA solve against `e_coli_core` at the
  cell''s own CPM footprint each tick, the same mechanism as the flagship''s `CpmCellField` -- but
  the constants (`glucose_vmax` = 1.5, `glucose_km`, `box_volume_L`, `grow_per_biomass`,
  `oxygen_vmax`) are toy-real: plausible, hand-tuned magnitudes chosen to make the growth-divide
  staircase legible over a 36-tick run, not fitted to a named organism or medium.'
- 'Division is the NATIVE CPM engine operation `divide_cells(vol_threshold, reset_target)` -- a
  modeling primitive triggered by the cell''s own grown volume crossing `vol_threshold`, which
  splits the cell (approximately across its long axis) into two daughters and conserves mass
  between them, then resets both to `reset_target` -- NOT emergent membrane constriction or
  cytokinesis mechanics. The trigger condition (crossing a volume threshold reached by real
  metabolism-driven growth) is genuine simulation state; the split operation itself is an
  engine-provided primitive, not a simulated physical process. This mirrors the honest framing
  `disintegration-spatial` gave its own resorption primitive: a chosen, code-verified engine
  operation standing in for a mechanism (cytokinesis) the underlying CPM engine does not itself
  simulate.'
- 'The run spans roughly 3-4 generations (1 -> 2 -> 4 -> 8 -> 18 cells) bounded by the shared
  glucose field and the 60x60 lattice''s finite capacity, not by any hard-coded generation limit.
  `glucose_vmax` is deliberately tuned down from the brief''s literal reference value of 10.0 to
  1.5: at 10.0 every live cell grows fast enough to re-cross `vol_threshold` almost every tick, and
  the population explodes past the lattice''s pixel budget within ~20 ticks, crowding cells down
  toward near-zero-volume phantoms. At 1.5, growth is slow enough that the staircase stays legible
  and every cell settles in a bounded volume band between divisions -- the field-depletion and
  lattice-crowding limit is a deliberate design choice, not an incidental one.'
- 'Each CPM cell gets its own independent cobra model copy, not one shared model instance across
  the lineage -- the same convention as `cell-cell-coupling-spatial`''s `CpmColonyField` -- keyed
  off the live cell ids read from the engine''s own snapshot each tick, so newly divided daughters
  are picked up automatically without scripted lineage bookkeeping.'
- 'The native `divide_cells` primitive this study''s division depends on is no longer an
  assumption; it is runtime-verified directly (`tests/test_cpm_divide_spike.py`) against a
  synthetic single-cell world, independently of the growth-division composite''s own metabolism
  mechanism: parent id kept, one new daughter id minted, combined post-split volume matches the
  pre-split volume within rounding, and a sub-threshold cell is confirmed a no-op.'
- 'Read alongside its specification-stage analogue, `draft-to-living-cell/growth-and-division`:
  that study drives an autocatalytic ODE (`d[dna]/dt = k*dna*energy`) to grow the cell''s own dna
  store past `dna_threshold`, then fires division as a place-graph rewrite -- a structural change
  to the composition itself, one cell node becoming two structurally-new daughter nodes, with the
  parent''s biomass halved rather than duplicated. This study drives growth with real per-footprint
  dFBA metabolism instead of a lumped ODE, and realizes division as the native spatial CPM
  operation `divide_cells` acting directly on lattice pixels instead of a graph rewrite. Compare
  the two for the same growth-then-divide claim at two very different mechanistic and
  compositional resolutions -- place-graph rewrite vs. spatial pixel-level engine operation.'
behavior_tests:
- name: population-steps-up-by-division
  classification: primary
  description: Over a 36-tick run sampled every 3 ticks, the CPM cell population steps up as
    cells' metabolism-driven volume growth repeatedly crosses vol_threshold and native
    divide_cells splits them -- reaching at least 3 full generations from a single seed cell.
  measure:
    kind: observable
    path: obs.n_cells
    expr: max(obs.n_cells) over the 36-tick run
  pass_if:
    op: '>='
    value: 8.0
    provenance: 'n_cells trajectory 1,2,2,2,4,4,5,8,8,11,14,18 over 36 ticks (12 samples, cadence
      3) -- steps 1 -> 2 -> 4 -> 8 -> 18 (tests/test_growth_division_regime.py::test_population_steps_up_by_division,
      tests/test_growth_division_viz.py::test_growth_division_gif_and_metrics)'
  requires_simulation: growth-division-spatial
- name: population-never-shrinks
  classification: primary
  description: The n_cells trajectory is monotonic non-decreasing across the run -- division only
    adds cells; no cell is ever lost to a phantom or a scripted removal.
  measure:
    kind: observable
    path: obs.n_cells
    expr: obs.n_cells == sorted(obs.n_cells) over the 36-tick run
  pass_if:
    op: '>'
    value: 0.0
    provenance: 'n_cells trajectory 1,2,2,2,4,4,5,8,8,11,14,18 is monotonic non-decreasing over the
      full 36-tick run (tests/test_growth_division_regime.py::test_population_steps_up_by_division
      asserts ns == sorted(ns))'
  requires_simulation: growth-division-spatial
- name: daughters-resume-growth-without-runaway
  classification: primary
  description: Starting from a single seed cell, the population grows via division over 30 ticks,
    and daughters resume growth after being split -- no runaway single cell absorbing the
    lattice, no zero-volume phantom daughters.
  measure:
    kind: observable
    path: obs.n_cells
    expr: obs.n_cells after run(30) from a single seed cell (n0 = 1)
  pass_if:
    op: '>='
    value: 3.0
    provenance: 'starting from n0 = 1, n_cells >= 3 after 30 ticks (at least 1 -> 2 -> ~4), with
      every per-cell volume bounded in (5, 200) -- no runaway single cell, no zero-volume phantom
      daughters (tests/test_cpm_growth_division.py::test_cell_grows_and_divides_into_a_population)'
  requires_simulation: growth-division-spatial
- name: per-cell-volume-stays-bounded
  classification: primary
  description: Per-cell CPM volume sawtooths in a bounded band throughout the run -- each cell
    grows toward vol_threshold, is halved by division back near reset_target, and immediately
    resumes growing -- rather than either exploding or collapsing to zero.
  measure:
    kind: observable
    path: obs.volume
    expr: range of per-cell CPM volume across all cells and all sampled ticks
  pass_if:
    op: '<'
    value: 200.0
    provenance: 'per-cell volumes stay bounded roughly 31-79 px across the 36-tick run (division
      halves a cell once it crosses vol_threshold = 80, resetting toward reset_target = 40, then
      it regrows); the tests'' hard bounds (8 < v < 200) hold at every sampled tick
      (tests/test_growth_division_regime.py::test_population_steps_up_by_division,
      tests/test_cpm_growth_division.py::test_cell_grows_and_divides_into_a_population)'
  requires_simulation: growth-division-spatial
- name: native-division-conserves-mass
  classification: diagnostic
  control: negative
  description: 'Foundational control (not this study''s scientific claim): the native CPM
    divide_cells operation this study''s division depends on splits a grown cell into two
    mass-conserved daughters and is a correct no-op below threshold -- independent of the
    growth-division composite''s own metabolism mechanism.'
  measure:
    kind: observable
    path: cell_volumes
    expr: (vol_parent + vol_new_daughter) - vol_before_split, and divide_cells(500.0, 40.0) on a
      sub-threshold cell
  pass_if:
    op: '<='
    value: 2.0
    provenance: 'divide_cells(80.0, 40.0) on a cell grown to ~150 splits it into two daughters (parent
      id kept + one new id) whose combined volume matches the pre-split volume within +-2 px
      (rounding); divide_cells(500.0, 40.0) on a cell at 60 (below threshold) returns [] -- a
      correct no-op (tests/test_cpm_divide_spike.py::test_divide_splits_one_into_two_mass_conserved,
      test_below_threshold_is_noop)'
  requires_simulation: none
