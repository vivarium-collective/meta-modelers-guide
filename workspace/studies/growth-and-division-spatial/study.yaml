conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: 'growth-division-spatial.composite.json builds and runs to completion through the
      process-bigraph engine (tests/test_growth_division_regime.py,
      tests/test_cpm_growth_division.py, tests/test_cpm_divide_spike.py,
      tests/test_growth_division_viz.py); guarded skip when the optional cpm/spatio_flux/cobra
      dependencies are absent, matching this investigation''s flagship and companion studies''
      convention.'
  biological_validation:
    result: PASS
    basis: All primary behavior tests pass on measured readouts from a real 36-tick run -- the
      population steps up in a monotonic non-decreasing staircase across roughly 3-4 generations,
      compounding into an 18-cell genealogy (max_generation = 4) rather than a bare count,
      per-cell volume stays bounded in a sawtooth between reset_target and vol_threshold, and
      daughters resume growth without runaway or phantoms. The staircase also demonstrably
      desynchronizes from clean powers of two as sibling division timing diverges under shared,
      local glucose competition -- the paper's own "coordination and divergence." The foundational
      native-division mass-conservation control also passes, independent of the growth-division
      mechanism itself.
  explanatory_gain:
    result: POSITIVE
    basis: 'Realizing the paper''s §Growth and division growth-then-divide pattern (Fig 10a,b)
      with a real CPM cell''s volume driven
      by real per-footprint dFBA metabolism and divided by the native spatial CPM engine
      operation -- rather than a lumped ODE growing a scalar dna store and firing a place-graph
      rewrite -- makes draft-to-living-cell''s growth-and-division claim (growth drives the cell''s
      own state across a threshold; crossing the threshold changes the composition itself)
      concrete at real spatial, per-pixel resolution, and contrasts two structurally different
      ways of realizing "the composition changes": a graph rewrite creating new nodes vs. a
      spatial engine operation splitting lattice pixels.'
conclusion: '## Claims

  - Metabolism-driven growth crossing a threshold fires division, and division partitions state
    across two daughters that resume growing themselves, compounding into a genuine
    multi-generation lineage tree whose siblings desynchronize as they compete for shared, local
    resources -- the paper''s §Growth and division growth-then-divide pattern (Fig 10a,b),
    including its "coordination and divergence" clause, realized spatially by one real CPM cell,
    real per-footprint dFBA metabolism, and the native CPM engine operation divide_cells through a
    single coupling process (CpmGrowthDivision). Over a 36-tick run sampled every 3 ticks: the
    founder compounds into an 18-cell lineage tree spanning 4 generations (max_generation = 4),
    the population steps up in a monotonic non-decreasing staircase (1,2,2,2,4,4,5,8,8,11,14,18)
    that departs from clean powers of two from tick 21 onward, and every cell''s CPM volume stays
    bounded in a sawtooth between reset_target = 40 and vol_threshold = 80. The staircase is
    bounded more by lattice crowding than by nutrient limitation (field-wide glucose depletes only
    ~3% over the run).


  ## Evidence

  - **POPULATION-STEPS-UP-BY-DIVISION** -- n_cells trajectory 1,2,2,2,4,4,5,8,8,11,14,18 over 36
    ticks

  - **POPULATION-NEVER-SHRINKS** -- n_cells trajectory is monotonic non-decreasing

  - **DAUGHTERS-RESUME-GROWTH-WITHOUT-RUNAWAY** -- n_cells >= 3 after 30 ticks from a single seed
    cell, all volumes in (5, 200)

  - **PER-CELL-VOLUME-STAYS-BOUNDED** -- per-cell volume bounded roughly 31-79 px across the run

  - **NATIVE-DIVISION-CONSERVES-MASS** -- divide_cells splits one cell into two mass-conserved
    daughters; no-op below threshold, verified independently

  - **DIVISION-DESYNCHRONIZES-FROM-LOCKSTEP** -- n_cells departs from powers of two from tick 21
    onward (5, 11, 14, 18); 5 distinct generations coexist in the colony at the final tick

  - **LINEAGE-COMPOUNDS-INTO-A-TREE** -- max_generation reaches 4; every daughter''s generation
    traces its recorded parent''s generation + 1


  ## Limitations

  - Growth is genuinely metabolism-driven (real dFBA against e_coli_core at the cell''s own
    footprint) but the constants (glucose_vmax = 1.5, glucose_km, box_volume_L, grow_per_biomass,
    oxygen_vmax) are toy-real -- plausible, hand-tuned magnitudes, not fitted to any organism or
    medium.

  - Division is the native CPM engine operation divide_cells -- a modeling primitive triggered by
    the volume threshold, splitting the cell (approximately across its long axis) and conserving
    lattice-pixel mass between daughters -- NOT emergent membrane constriction or cytokinesis
    mechanics. The trigger is genuine simulation state; the split itself is an engine-provided
    operation. The process''s own tracked biomass is partitioned proportional to post-split
    daughter volume (not reset to a fixed value), per §Growth and division''s Fig 10b "partitions
    state variables such as DNA and biomass."

  - The run spans roughly 3-4 generations (1 -> 2 -> 4 -> 8 -> 18 cells), not by a hard-coded
    generation limit. What actually bounds the staircase: field-wide glucose barely dips (~3% over
    36 ticks), a weak brake; the dominant limit is lattice crowding -- the colony packs to roughly
    two-thirds occupancy within its own bounding footprint even though the full 60x60 lattice
    remains only ~26% occupied overall. "Bounded by the shared glucose field" overstated the
    nutrient contribution; "bounded by lattice crowding and, more weakly, shared-glucose
    depletion" is the honest claim.

  - Each CPM cell gets its own independent cobra model copy, not one shared model instance across
    the lineage.


  ## Next steps

  - Extend the run length or lattice size to see whether the staircase continues past 18 cells or
    saturates as lattice crowding and glucose depletion dominate further.

  - Measure per-cell local glucose alongside position to show the fed-rim-vs-depleting-interior
    mechanism directly (a center-vs-edge growth-rate readout), rather than inferring it from
    staircase desync alone.

  - Fan out to the next spatial counterpart in the design spec''s increment plan.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'growth-division-spatial.composite.json builds and runs to completion
      through the engine over a 36-tick run.'
    biological_validation: The spatial §Growth and division growth-then-divide pattern (Fig 10a,b)
      is demonstrated at the toy-real (uncalibrated) level, with genuine per-footprint dFBA
      metabolism driving growth, the native CPM divide_cells operation firing division at
      threshold and partitioning biomass across daughters, and a real tracked lineage (not a
      scripted one) whose siblings desynchronize under shared-field competition, per the paper's
      "coordination and divergence."
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the population never steps up past 1 (glucose_vmax too low or vol_threshold never reached,
      or divide_cells is not being called)
    - n_cells ever decreases (a division is losing a cell, or a duplicate/phantom id is being
      dropped)
    - per-cell volume runs away past 200 or collapses toward 0 (glucose_vmax tuned too high,
      re-crossing vol_threshold almost every tick and crowding the lattice; or reset_target is
      being applied incorrectly)
    - the native divide_cells control fails to conserve mass or fails the no-op check
      (the engine primitive this study's division depends on is broken, independent of the
      composite)
    - the staircase stays a clean power of two the whole run (siblings would be growing in
      perfect lockstep, meaning the shared-field coupling is not actually creating local
      heterogeneity), or max_generation never compounds past 1-2 (the lineage bookkeeping is
      broken or division is not recursing into daughters)
    block_downstream: 'any future spatial study reusing the CpmGrowthDivision pattern or the
      native divide_cells primitive (e.g. a spatial development-and-evolution study that needs a
      growing, dividing colony)'
limitations:
- Growth is genuinely metabolism-driven (real dFBA against e_coli_core at the cell's own CPM
  footprint each tick) but the constants (glucose_vmax = 1.5, glucose_km, box_volume_L,
  grow_per_biomass, oxygen_vmax) are toy-real, hand-tuned magnitudes chosen to make the
  growth-divide staircase legible over a 36-tick run -- not fitted to any organism or medium.
- 'Division is the NATIVE CPM engine operation divide_cells(vol_threshold, reset_target) -- a
  modeling primitive triggered by the cell''s own grown volume crossing vol_threshold, splitting
  the cell (approximately across its long axis) and conserving lattice-pixel mass between the two
  daughters, then resetting both daughters'' physical target volume toward reset_target -- NOT
  emergent membrane constriction or cytokinesis mechanics. The trigger condition is genuine
  simulation state reached by real metabolism-driven growth; the split operation itself is an
  engine-provided primitive standing in for a mechanism (cytokinesis) the underlying CPM engine
  does not itself simulate. The process''s own tracked biomass -- what drives future growth -- is
  partitioned proportional to post-split daughter volume (per §Growth and division''s Fig 10b
  "partitions state variables such as DNA and biomass"), not reset to a fixed value that would
  discard it.'
- 'The run spans roughly 3-4 generations (1 -> 2 -> 4 -> 8 -> 18 cells), not by a hard-coded
  generation limit. glucose_vmax is deliberately tuned down to 1.5 (from a brief reference value
  of 10.0) so the population steps up as a legible staircase rather than every live cell
  re-crossing threshold almost every tick and crowding the lattice down toward near-zero-volume
  phantoms. What actually bounds the staircase, measured: field-wide glucose barely dips (~3%
  over 36 ticks), so nutrient depletion is a weak brake; the dominant limit is lattice crowding --
  the 18-cell colony packs to roughly two-thirds occupancy within its own bounding footprint even
  though the full 60x60 lattice remains only ~26% occupied overall. "Bounded by the shared glucose
  field" overstates the nutrient contribution; "bounded by lattice crowding and, more weakly,
  shared-glucose depletion" is the honest claim.'
- Each CPM cell gets its own independent cobra model copy, not one shared model instance across
  the lineage -- the same convention as cell-cell-coupling-spatial's CpmColonyField -- keyed off
  the live cell ids read from the engine's own snapshot each tick.
- 'The native divide_cells primitive this study''s division depends on is now runtime-verified
  directly (tests/test_cpm_divide_spike.py), independent of the growth-division composite''s own
  metabolism mechanism -- previously an untested primitive.'
- 'Read alongside its specification-stage analogue, `draft-to-living-cell/growth-and-division`:
  that study drives an autocatalytic ODE to grow the cell''s own dna store past a threshold, then
  fires division as a place-graph rewrite -- a structural change to the composition itself, one
  cell node becoming two structurally-new daughter nodes, at a lumped, non-spatial level. This
  study drives growth with real per-footprint dFBA metabolism and realizes division as the native
  spatial CPM operation divide_cells acting directly on lattice pixels. Compare the two for the
  same growth-then-divide claim at two very different mechanistic and compositional resolutions.'
falsifiability: Overturned if the population never steps up past 1 cell within the run (metabolism
  never drives volume to vol_threshold, or divide_cells is never invoked), if n_cells ever
  decreases (a division event loses a cell rather than gaining one), if per-cell volume runs away
  unboundedly or collapses to a zero-volume phantom, if the foundational native divide_cells
  control fails to conserve mass between daughters or fails its no-op check below threshold, if
  the staircase stays a clean power of two the entire run (no shared-field-driven desync ever
  appears), or if max_generation never compounds past 1-2 (the lineage never becomes a genuine
  multi-generation tree).
