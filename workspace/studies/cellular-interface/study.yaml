schema_version: 4
name: cellular-interface
investigation: draft-to-living-cell
title: The Cellular Interface
created: '2026-08-20'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can the cellular boundary be specified as nothing but typed, unit-bearing exchange ports (chemical mol·s⁻¹, mechanical N, electrical C·s⁻¹, thermal J·s⁻¹) plus higher-level variables (growth, shape, objective, viability) — with no committed mechanism — and compiled, by installing one conforming handler, into a bounded, goal-directed cell whose interface is exactly the one declared?
biological_summary: 'A cell, viewed from the outside, is a small alphabet of exchange variables: fluxes of matter (chemical, mol·s⁻¹), forces (mechanical, N), currents (electrical, C·s⁻¹) and heat (thermal, J·s⁻¹), together with higher-level cellular quantities — growth rate (hr⁻¹), shape, an objective the cell pursues, and a viability that says whether the cellular description still holds. Fig 4 is that alphabet: Fig 4a draws four interaction-modality cards (nutrient exchange, motile force, growth rate, electrical signaling) as inert draft processes — unit-bearing ports and a behavior contract, no update dynamics. Fig 4b assembles the minimal cellular interface itself: one cell (draft process) that senses environmental drivers and exposes its physical exchange ports plus the higher-level cellular ports, all carrying declared units. Installing one conforming handler (`CellularInterfaceHandler`) turns the inert draft into a bounded, goal-directed cell with genuine toy-real dynamics while the ports and their wiring are preserved unchanged: chemical is taken up by Monod kinetics and drives Monod growth, growth accretes both shape (a volume proxy) and a biomass-proxy objective, viability follows an honest first-order Arrhenius thermal-death law (holds near 37 degC, collapses within minutes at 55 degC — the E. coli D-value reference), and the remaining physical ports (mechanical, electrical, thermal, signaling) carry small, physically-plausible linear responses to their drivers. Measured on the compiled fig04b-executable: chemical flux goes 0.0 to -0.8 (net uptake) and drives shape 1.0 to 4.2 and objective 0.0 to 1.6. This is the base cell contract that Law 1 (conformance) protects: the compiler checks a candidate handler''s declared ports against the draft''s signature before it will install it, and rejects a handler that renames or drops a port with a CompileError naming what is missing. The one concrete impostor implemented in this codebase, `NonConformingMetabolism` (in `handlers_fig06_fba.py`, exercised by `tests/test_fba.py::test_impostor_handler_rejected_by_compiler`), breaks the *metabolism* interface used in the disintegration/Fig 6 study, not a cellular-interface-specific contract — but it is the mechanical proof that the same compiler mechanism this study relies on (Law 1) rejects any handler that breaks its declared port contract, structurally, at compile time.'
claim: The cell's interface is authored as an inert typed contract and compiled to a running bounded cell; a non-conforming handler that breaks the port contract is rejected at compile time with a CompileError naming the missing ports (Law 1 conformance).
baseline:
- name: interaction-modalities
  composite: meta_modelers_guide.composites.fig04a-interaction-modalities
  params: {}
- name: cellular-interface
  composite: meta_modelers_guide.composites.fig04b-cellular-interface
  params: {}
- name: cellular-interface-executable
  composite: meta_modelers_guide.composites.fig04b-executable
  params: {}
variants: []
key_assumptions:
- Law 1 (conformance) is demonstrated mechanically by `tests/test_fba.py::test_impostor_handler_rejected_by_compiler`, which lives in the disintegration/Fig 6 metabolism-signature code (`handlers_fig06_fba.py`'s `NonConformingMetabolism`), not by a cellular-interface-specific impostor — no such impostor exists in this codebase, and none is claimed. The compiler mechanism it exercises (reject a handler whose declared ports don't match the draft's signature) is the same mechanism that would reject a non-conforming handler installed behind this study's Fig 4 interface.
- Conformance checking is structural — port names, types, and wiring — not units, dimensions, or runtime behavior. Ports carry unit labels (mol·s⁻¹, N, C·s⁻¹, J·s⁻¹, hr⁻¹, ...) that document intended dimension but are name-only annotations, not machine-enforced.
behavior_tests:
- name: shape-growth
  classification: primary
  description: The conforming handler grows the cell through its interface — shape climbs well above its seed.
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'executable run: shape 1.0→4.2 (chemical uptake drives growth); exec last≈4.2 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: chemical-uptake
  classification: primary
  description: The cell takes up chemical across its interface — net chemical flux goes negative.
  measure:
    kind: observable
    path: chemical
    expr: min(chemical)
  pass_if:
    op: <=
    value: -0.5
    provenance: 'chemical flux 0.0→-0.8 (net uptake across the interface); exec last≈-0.8 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: objective-climbs
  classification: primary
  description: The cell pursues its declared objective — the objective readout climbs from zero.
  measure:
    kind: observable
    path: objective
    expr: last(objective)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'objective 0.0→1.6 as growth proceeds; exec last≈1.6 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'One-line sanity check (not the study''s control): the inert draft has empty updates by construction, so shape stays at its 1.0 seed and fails this threshold by design — confirming the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'inert-draft run: shape stays 1.0 (empty update by construction) → fails by design (expected-fail control)'
  requires_simulation: cellular-interface
runs:
- name: cellular-interface
  composite: cellular-interface
  emitter: RAMEmitter
  id: cellular-interface
  status: completed
  provenance: scripts/render_study_evidence.py — fig04b-executable compiled from the Fig 4 draft, run to completion through the engine.
  params: {}
  outcomes:
    SHAPE-GROWTH:
      result: PASS
      detail: shape 1.0 → 4.2 (growth well above seed)
    CHEMICAL-UPTAKE:
      result: PASS
      detail: chemical flux 0.0 → -0.8 (net uptake across the interface)
    OBJECTIVE-CLIMBS:
