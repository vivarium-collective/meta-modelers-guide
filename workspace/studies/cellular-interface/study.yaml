- id: F-04
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'Law 1 (conformance) is machine-checked at compile time: a handler whose declared ports do not match the draft signature is rejected with a CompileError naming the missing ports. A native impostor for this figure, `NonConformingCellularInterface`, supplies conforming inputs but drops the required `viability` and `objective` output ports, and the compiler rejects it naming exactly those two — the mechanical proof that the same Law-1 structural check protects this figure''s own interface.'
  evidence:
    from_test: tests/test_cellular_interface_impostor.py::test_native_impostor_rejected_by_compiler
    observed: 'compile_composite raises CompileError; the message names the missing "viability" and "objective" ports'
    discovered_during: authoring this study — the native impostor runs as part of this study's own tests (tests/test_cellular_interface_impostor.py), not only cross-referenced
  expected:
    summary: Law 1 conformance predicts any handler whose ports diverge from the declared signature is refused at compile time.
  provenance:
    run_ids: []
- id: F-05
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The same `CellularInterfaceHandler` contract, unchanged, composed with a spatial diffusion field via a field↔point adapter — evidence the interface is substrate-independent. Only the chemical modality is spatialized here; mechanical, electrical, and thermal remain lumped. Taking the byte-identical fig04b handler and composing a spatio-flux `DiffusionAdvection` chemical field behind its chemical port (through the small `FieldPointCoupling` adapter that samples the field over the cell''s footprint and writes the handler''s uptake flux back as a spatial delta) yields a running 2D composite: the field depletes at the footprint (environmental modification — local resource depletion, footprint mean 1.68 → 1.43 over 20 steps) and the concentration the interface senses now varies with position on the gradient — a cell on the low side senses ≈0.74 and grows slower, one on the high side senses ≈2.1 and grows faster — rather than a fixed constant.'
  evidence:
    from_test: tests/test_cellular_interface_spatial.py
    observed: 'footprint field mean 1.68 → 1.43 (net uptake depletes the field where the cell feeds); sensed chemical_ext ≈0.74 (low side) vs ≈2.1 (high side), growth_rate follows the local field'
    discovered_during: authoring the spatial translation of this study — the unchanged handler composed over a spatio-flux field via a new field-point adapter
  expected:
    summary: If the interface is genuinely substrate-independent, the unchanged handler should run against a spatial field with the same ports, sensing a spatially-varying concentration and depleting the local field where it feeds.
  provenance:
    run_ids: []
- id: F-06
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'A tuned second handler behind byte-identical cell ports reproduces the interface observables across the chemical operating range — surrogate calibration, not yet mechanism-independence. Two handlers behind byte-identical cell ports — the Monod twin (first-order uptake + independent Monod growth + Arrhenius thermal death) vs a genuinely different box (a saturable Michaelis-Menten membrane-carrier uptake + an independent cooperative Moser/Hill (n=1.3) growth law + Q10 thermal death) — produce interface observables that agree within ~10.5% when chemical supply is SWEPT across chem∈[0.2,2.5]. Measured max relative divergence over the sweep: chemical flux 8.6% (saturable carrier vs first-order line), growth_rate 10.5% (cooperative sigmoid vs Monod hyperbola); driven over a ramp through the whole range the integrated observables diverge at most shape 7.7%, objective 10.5%, viability 0.01% — all under a 15% band across the operating range. This is surrogate calibration — the second handler''s ~4 free parameters (vmax, km, cooperative-growth params, Q10) are tuned to reproduce the same ~4 interface observables (4 knobs fit to ~4 constraints), not yet mechanism-independence. The sweep across chem∈[0.2,2.5] is stronger evidence than a single tuned point, but a held-out condition neither handler was fit on — tune the twin on a sub-range, then test on a disjoint held-out sub-range — is the named next step. Complements the metabolism-level swap (dFBA vs Michaelis-Menten) and the colony-level swap.'
  evidence:
    from_test: tests/test_cellular_interface_substitutability.py
    observed: 'ports byte-identical (inputs/outputs diff empty); concentration sweep chem∈[0.2,2.5]: max flux divergence 8.6%, max growth_rate divergence 10.5%; ramp-integrated: shape 7.7%, objective 10.5%, viability 0.01%; overall max ~10.5% < 15% tolerance across the operating range'
    discovered_during: authoring the interface-realization swap — a second conforming handler with a genuinely different internal mechanism installed behind the unchanged Fig 4 ports, then measured across the chemical operating range
  expected:
    summary: A second handler with a different internal mechanism but identical ports, its ~4 free params tuned to the interface observables, should reproduce them across the chemical operating range within tolerance (surrogate calibration). Mechanism-independence proper would require agreement on a held-out sub-range neither handler was tuned on — the named next step.
  provenance:
    run_ids: []
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: The Fig 4a and Fig 4b composites build and fig04b-executable runs to completion (scripts/build_executables.py + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: The interface tests (shape, chemical, objective) all pass on measured readouts; the inert-draft sanity check stays at its 1.0 shape seed, isolating the installed handler as the cause. Law 1 conformance is confirmed mechanically by a native impostor test for this figure (`NonConformingCellularInterface`, which drops the viability and objective ports).
  explanatory_gain:
    result: POSITIVE
    basis: Compiling the inert Fig 4 interface into a running, bounded, goal-directed cell makes structural conformance (Law 1) and interface preservation directly observable — with a native impostor for this figure proving the compiler rejects a handler that drops declared ports — and separates the interface-specification claim from the mechanism-independence claim now homed in disintegration/Fig 6.
conclusion: '## Claims

  - Given one conforming handler, the cellular interface becomes a bounded, goal-directed cell: chemical is taken up across the interface (flux 0.0→−0.8) and drives growth, so shape climbs 1.0→4.2 and the objective rises 0.0→1.6, all while the declared port set is preserved unchanged. The compiler enforces this contract structurally (Law 1): a handler that breaks the port names/types/wiring is rejected at compile time with a CompileError naming the missing ports — demonstrated by this figure''s own native impostor, `NonConformingCellularInterface`, which drops the required `viability` and `objective` ports.


  ## Evidence

  - **SHAPE-GROWTH** — shape 1.0 → 4.2 (growth well above seed)

  - **CHEMICAL-UPTAKE** — chemical flux 0.0 → -0.8 (net uptake across the interface)

  - **OBJECTIVE-CLIMBS** — objective 0.0 → 1.6 (goal-directed progress)

  - **Law 1 (conformance)** — `tests/test_cellular_interface_impostor.py::test_native_impostor_rejected_by_compiler` raises `CompileError` naming the missing `viability`/`objective` ports when the native impostor `NonConformingCellularInterface` is installed behind this figure''s interface


  ## Limitations

  - Single-handler toy-real model: the rate laws are real in shape (Monod uptake/growth, Arrhenius thermal death) but the constants are illustrative; one mechanism is installed behind the Fig 4 interface.

  - Conformance (Law 1) is checked structurally — port names, types, and wiring — not units, dimensions, or runtime behavior. Units are name-only labels.

  - Law 1 is demonstrated by a native impostor for this figure (`NonConformingCellularInterface`, dropping the viability and objective ports), checked structurally at compile time — port names, types, and wiring, not units, dimensions, or runtime behavior.


  ## Next steps

  - Install a second, independent handler behind the Fig 4 interface to show mechanism-independence directly at this figure (Law 4 currently lives at disintegration/Fig 6 and autopoiesis/Fig 9).

  - Done — a cellular-interface-specific impostor (`NonConformingCellularInterface`, which drops the viability and objective ports) now gives Law 1 a demonstration native to this figure (`tests/test_cellular_interface_impostor.py`).'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The Fig 4 draft compiles to an executable that runs.
    biological_validation: The paper's interface-specification pattern is demonstrated at the toy-real (uncalibrated) level; structural interface preservation and conformance (Law 1) hold.
    pipeline_unblocks:
    - cell-environment-coupling
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 1/2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: cell-environment-coupling (Fig 5's sense/act loop is built on this figure's interface)
limitations:
- One handler realizes the Fig 4 interface (chemical uptake driving Monod growth); the port set admits many mechanisms but only this one is installed and measured.
- Constants (uptake rate, growth rate, thermal-death Arrhenius parameters) are illustrative toy-real values, not fitted to a named organism or medium.
- Conformance (Law 1) is structural only. The compiler checks port names, types, and wiring against the signature; it does not check units, dimensions, invariants, or runtime behavior. Units are name-only labels on ports (mol·s⁻¹, N, C·s⁻¹, J·s⁻¹, hr⁻¹, ...) that document intended dimension but are not machine-enforced.
- Law 1 has a native impostor for this figure — `tests/test_cellular_interface_impostor.py::test_native_impostor_rejected_by_compiler` installs `NonConformingCellularInterface` (conforming inputs, but it drops the required `viability` and `objective` output ports) and the compiler rejects it with a CompileError naming those two ports. Conformance is structural only — port names, types, and wiring, not units or runtime behavior.
falsifiability: Overturned if the compiled cell's port set differs from the declared Fig 4 interface, if installing the handler leaves shape flat (no growth) or the objective unchanged, or if a non-conforming handler is found to compile without error against any declared interface (Law 1 not enforced).
