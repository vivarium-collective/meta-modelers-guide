  composite: meta_modelers_guide.composites.cellular-interface-spatial
  params: {}
variants:
- name: cellular-interface-executable-alt
  composite: meta_modelers_guide.composites.fig04b-executable-alt
  params: {}
  description: The same typed cellular-interface contract realized by a second, independent handler (CooperativeCellularInterfaceHandler) — a saturable Michaelis-Menten membrane-carrier uptake, an independent cooperative Moser/Hill (n>1) growth law, and Q10 thermal death — behind byte-identical cell ports, where the Monod twin uses first-order uptake, Monod growth, and Arrhenius death. Fitted (surrogate calibration — the twin's ~4 free params tuned to the interface observables) so they track the fig04b-executable across the chemical operating range chem∈[0.2,2.5] to within ~10% (a concentration sweep, not a single point; a held-out sub-range test is the named next step).
key_assumptions:
- Law 1 (conformance) is demonstrated mechanically by a native impostor for this figure, `tests/test_cellular_interface_impostor.py::test_native_impostor_rejected_by_compiler`, exercising `handlers_fig04b.py`'s `NonConformingCellularInterface` (conforming inputs, but it drops the required `viability` and `objective` output ports). The compiler rejects it with a CompileError naming those two missing ports — the same conformance check that protects any handler installed behind this study's Fig 4 interface.
- Conformance checking is structural — port names, types, and wiring — not units, dimensions, or runtime behavior. Ports carry unit labels (mol·s⁻¹, N, C·s⁻¹, J·s⁻¹, hr⁻¹, ...) that document intended dimension but are name-only annotations, not machine-enforced.
acceptance_criteria:
- Installing one conforming handler should drive non-trivial dynamics on the declared ports — shape grows above its seed, chemical flux goes net-negative (uptake), and the objective climbs from zero.
- A handler whose declared ports do not match the draft signature should be rejected at compile time (Law 1 conformance), not silently accepted.
- The inert draft, with no handler installed, should produce no dynamics — shape stays at its seed.
units_and_time:
  time: 1 tick = unspecified physical time (dimensionless model time).
  quantities: shape, objective, viability, and the physical-port readouts are dimensionless model units. The port unit labels (mol·s⁻¹, N, C·s⁻¹, J·s⁻¹, hr⁻¹) are name-only annotations documenting intended dimension — not machine-enforced and not calibrated to physical units.
behavior_tests:
- name: shape-growth
  classification: primary
  description: The conforming handler grows the cell through its interface — shape climbs well above its seed.
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    kind: regression_pin
    op: '>='
    value: 2.0
    provenance: 'executable run: shape 1.0→4.2 (chemical uptake drives growth); exec last≈4.2 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: chemical-uptake
  classification: primary
  description: The cell takes up chemical across its interface — net chemical flux goes negative.
  measure:
    kind: observable
    path: chemical
    expr: min(chemical)
  pass_if:
    kind: regression_pin
    op: <=
    value: -0.5
    provenance: 'chemical flux 0.0→-0.8 (net uptake across the interface); exec last≈-0.8 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: objective-climbs
  classification: primary
  description: The cell pursues its declared objective — the objective readout climbs from zero.
  measure:
    kind: observable
    path: objective
    expr: last(objective)
  pass_if:
    kind: regression_pin
    op: '>='
    value: 1.0
    provenance: 'objective 0.0→1.6 as growth proceeds; exec last≈1.6 (fig04b-executable)'
  requires_simulation: cellular-interface
- name: draft-is-inert
  classification: diagnostic
  control: negative
  expected_result: fail
  description: 'One-line sanity check (not the study''s control): the inert draft has empty updates by construction, so shape stays at its 1.0 seed and fails this threshold by design — confirming the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    kind: regression_pin
    op: '>='
    value: 2.0
    provenance: 'inert-draft run: shape stays 1.0 (empty update by construction) → fails by design (expected-fail control)'
  requires_simulation: cellular-interface
