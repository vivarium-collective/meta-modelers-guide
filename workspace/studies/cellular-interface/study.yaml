experiment: Start with the Fig 4 interface as an inert specification, install a bounded-cell mechanism behind it, and run the resulting composite. The compiler must preserve the declared interface exactly, and must reject any handler whose ports don't match it (Law 1).
result: 'The interface is preserved while the installed mechanism produces dynamics: chemical uptake drives growth and progress toward the cell''s objective (shape 1.0→4.2, objective 0.0→1.6). Law 1 conformance is confirmed mechanically by the codebase''s one impostor test, which lives in the metabolism-interface code (disintegration/Fig 6) rather than being specific to this figure — cited honestly rather than fabricated as native.'
