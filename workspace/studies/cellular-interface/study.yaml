experiment: Start with the Fig 4 interface as an inert specification, install a bounded-cell mechanism behind it, and run the resulting composite. The compiler must preserve the declared interface exactly, and must reject any handler whose ports don't match it (Law 1).
result: 'The interface is preserved while the installed mechanism produces dynamics: chemical uptake drives growth and progress toward the cell''s objective (shape 1.0→4.2, objective 0.0→1.6). Law 1 conformance is confirmed mechanically by a native impostor for this figure (`NonConformingCellularInterface`, which drops the viability and objective ports), rejected at compile time with a CompileError naming those two ports.'
