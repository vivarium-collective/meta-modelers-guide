schema_version: 4
name: cellular-interface
investigation: draft-to-living-cell
title: The Cellular Interface
created: '2026-08-20'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional
question: Can the cellular boundary be specified as nothing but typed, unit-bearing exchange ports (chemical mol·s⁻¹, mechanical N, electrical C·s⁻¹, thermal J·s⁻¹) plus higher-level variables (growth, shape, objective, viability) — with no committed mechanism — and compiled, by installing one conforming handler, into a bounded, goal-directed cell whose interface is exactly the one declared?
biological_summary: 'A cell, viewed from the outside, is a small alphabet of exchange variables: fluxes of matter (chemical, mol·s⁻¹), forces (mechanical, N), currents (electrical, C·s⁻¹) and heat (thermal, J·s⁻¹), together with higher-level cellular quantities — growth rate (hr⁻¹), shape, an objective the cell pursues, and a viability that says whether the cellular description still holds. Fig 4 is that alphabet: Fig 4a draws four interaction-modality cards (nutrient exchange, motile force, growth rate, electrical signaling) as inert draft processes — unit-bearing ports and a behavior contract, no update dynamics. Fig 4b assembles the minimal cellular interface itself: one cell (draft process) that senses environmental drivers and exposes its physical exchange ports plus the higher-level cellular ports, all carrying declared units. Installing one conforming handler (`CellularInterfaceHandler`) turns the inert draft into a bounded, goal-directed cell with genuine toy-real dynamics while the ports and their wiring are preserved unchanged: chemical is taken up by Monod kinetics and drives Monod growth, growth accretes both shape (a volume proxy) and a biomass-proxy objective, viability follows a first-order Arrhenius thermal-death law (holds near 37 degC, collapses within minutes at 55 degC — the E. coli D-value reference), and the remaining physical ports (mechanical, electrical, thermal, signaling) carry small, physically-plausible linear responses to their drivers. Measured on the compiled fig04b-executable: chemical flux goes 0.0 to -0.8 (net uptake) and drives shape 1.0 to 4.2 and objective 0.0 to 1.6. This is the base cell contract that Law 1 (conformance) protects: the compiler checks a candidate handler''s declared ports against the draft''s signature before it will install it, and rejects a handler that renames or drops a port with a CompileError naming what is missing. A native impostor for this figure, `NonConformingCellularInterface` (in `handlers_fig04b.py`, exercised by `tests/test_cellular_interface_impostor.py::test_native_impostor_rejected_by_compiler`), supplies conforming inputs but drops the required `viability` and `objective` output ports, and the compiler rejects it with a CompileError naming exactly those two missing ports — the mechanical proof that Law 1 rejects any handler that breaks this study''s own declared port contract, structurally, at compile time.'
claim: The cell's interface is authored as an inert typed contract and compiled to a running bounded cell; a non-conforming handler that breaks the port contract is rejected at compile time with a CompileError naming the missing ports (Law 1 conformance).
baseline:
- name: interaction-modalities
  composite: meta_modelers_guide.composites.fig04a-interaction-modalities
  params: {}
- name: cellular-interface
  composite: meta_modelers_guide.composites.fig04b-cellular-interface
  params: {}
- name: cellular-interface-executable
  composite: meta_modelers_guide.composites.fig04b-executable
  params: {}
