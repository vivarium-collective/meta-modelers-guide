- id: F-06
  kind: computational
  tier: mechanism
  status: novel
  variant: fig06-mechanistic
  statement: 'The model makes a genuine prospective prediction and passes it. Synthesis proceeds iff n_c·e·Δp > n_ATP·ΔG_ATP, so the stall gradient Δp* = n_ATP·ΔG_ATP/(n_c·e) = 125 mV can be computed BEFORE any run. Sweeping the proton-motive force then confirms it: ω < 0 (hydrolysis) below Δp*, ω ≈ 0 at Δp*, ω > 0 (synthesis) above. Direction is set by the proton gradient relative to the ATP free energy — the thermodynamic directionality the review asked for — demonstrated as a predicted threshold, not a fitted curve.'
  evidence:
    from_test: mech-proton-gradient-sets-direction
    from_run: fig06-mechanistic
    observed: Δp* = 125 mV predicted from pool thermodynamics; sweep ω<0 at 95 mV, ≈0 at 125 mV, >0 at 155 mV
  provenance:
    run_ids:
    - fig06-mechanistic
- id: F-07
  kind: computational
  tier: mechanism
  status: confirms
  variant: fig06-mechanistic
  statement: 'The efficiency is a derived, operating-point-dependent outcome, and the pools provide real back-pressure — with the limits stated honestly. η = P_ATP/P_in = τ_chem/τ_drive = 0.833 at 150 mV and falls as Δp rises (more proton power spent as rotation/viscous loss), so it is not the baseline''s imposed 0.75. With the ADP/ATP/Pi pools unbuffered, accumulating ATP raises ΔG_ATP and slows the rotor monotonically (product inhibition) — a feedback the strictly-linear baseline lacks entirely. Honest scope: this is still a reduced one-degree-of-freedom model (no explicit c-ring half-channels, no elastic power-stroke, overdamped, pool_coupling is a convenience scale), and the back-pressure slows but does not fully stall the rotor over the tested window.'
