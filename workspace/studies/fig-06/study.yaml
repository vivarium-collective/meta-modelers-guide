conclusion: '## Claims

  - The F₁Fₒ ATP synthase modeled as a single molecular process with four TYPED physical ports
    (chemical, electrical, mechanical torque, thermal) over a `structure` leaf -- and NO cell
    boundary -- reproduces the paper''s §Molecular interfaces figure (Fig molecular_interface) as a
    runnable transducer. Driven by one ramped proton flux over a 20-tick run: the ATP synthesis flux
    scales linearly with the drive (4× activity ⇒ exactly 4× flux; monotone 20.0 → 128.0), the proton
    current is fixed to that flux at ATP:H⁺ = 1/3.3 on every step, the rotary torque holds constant at
    4×10⁻²⁰ N·m, and the dissipated heat equals (1−η)·PMF power (25 % of input). All readouts are
    deterministic and reproduce exactly.

  - The four channels are ONE coupled quantity, not four free knobs -- the coupling identities
    (I = J_ATP·n·e for matter⇒charge, Q = (1−η)·I·pmf for charge⇒energy) hold exactly to 1e-30 on the
    live run, so matter, charge, angular momentum, and energy are conserved across the interface. The
    energy balance closes at a 75 %/25 % useful/dissipated split.

  - There is no cell-level boundary anywhere in the state -- only the mechanism, its ramp driver, and
    the typed ports over molecular structure -- which is exactly the Fig molecular_interface b point.


  ## Evidence

  - **ATP-FLUX-SCALES-WITH-THE-PROTON-DRIVE** -- J_ATP = k_cat·activity exactly (ratio 4.0 for 4×
    drive); monotone rise 20.0 → 128.0

  - **FOUR-CHANNELS-DERIVE-FROM-ONE-PROTON-FLUX** -- I == J_ATP·3.3·e and heat == 0.25·(I·pmf) exactly
    (1e-30) every step; all four co-fire under drive

  - **ATP-PROTON-STOICHIOMETRY-CONSERVED** -- J_ATP/J_H == 1/3.3 == 0.30303 on every active step

  - **ROTARY-TORQUE-HOLDS-NEAR-CONSTANT** -- mechanical_out == 4.0×10⁻²⁰ N·m exactly, constant while
    the other channels scale

  - **ELECTRICAL-ENERGY-BALANCE-CLOSES** -- heat == 25 % of input PMF power, useful == 75 %, both ≥ 0

  - **NO-DRIVE-NO-SPONTANEOUS-FLUX** -- all three flux channels == 0.0 at zero drive (negative control)


  ## Limitations

  - This is a didactic / toy-real transducer, not a calibrated biophysical model: the constants are
    literature-plausible order-of-magnitude values, and the transduction law is algebraic (strictly
    linear J_ATP, fixed stoichiometry, fixed torque leaf), with no saturation or PMF back-pressure.

  - The mechanical channel is realized specifically as rotary torque (N·m), a deliberate choice
    matching the draft''s `mechanical_out: torque` port; the caption''s "mechanical forces" appears
    here as torque, not force or power.

  - The rigorous molecular-scale cousin is `molecular-interfaces` in the `draft-to-living-cell`
    investigation -- see limitations; this study does not restate its numbers as its own.


  ## Next steps

  - Add saturation / Michaelis–Menten kinetics and a self-consistent proton-motive force with
    back-pressure, so the ATP flux rolls over rather than rising linearly without bound.

  - Couple this molecular interface into a cell-level composite to show the same typed ports composing
    across scales (the QM/MM and integrative-structural-modeling composition the paper cites).'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig06-runnable.composite.json builds and runs to completion over a
      deterministic 20-tick run through the engine.'
    biological_validation: The §Molecular interfaces figure (Fig molecular_interface) is demonstrated
      at the toy-real (uncalibrated) level -- a molecular mechanism exposing four typed, coupled
      physical channels over molecular structure with no cell boundary, matter/charge/angular-momentum/
      energy conserved across the interface, rather than a static drawing.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the ATP flux does not scale with the drive (the ProtonMotiveRamp is not wired to chemical_in, or
      the k_cat·activity law is broken)
    - the coupling identities fail (I ≠ J_ATP·n·e or heat ≠ (1−η)·I·pmf -- the four channels have become
      independent rather than derived from the one proton flux)
    - the stoichiometry drifts off 1/3.3 (n_protons_per_atp changed or matter/charge decoupled)
    - the torque is no longer constant or is scaling with the drive (the mechanical port has been
      turned into a force/power channel)
    - the energy balance no longer closes (efficiency changed or heat is not the (1−η) remainder)
    block_downstream: 'any future study composing this molecular interface into a larger multiscale
      composite through its typed ports'
limitations:
- This `fig06-runnable` composite is a didactic / toy-real transducer, not a calibrated biophysical
  model of ATP synthase. Its constants (k_cat ≈ 100 ATP·s⁻¹, H⁺/ATP ≈ 3.3, |Δp| ≈ 150 mV, Fₒ torque
  ≈ 40 pN·nm, η ≈ 75 %) are literature-plausible order-of-magnitude values in `config`, chosen to make
  the four-channel coupling legible over a 20-tick run -- not fitted to a specific enzyme, membrane
  potential, or measured turnover curve.
- The transduction law is algebraic, not a mechanistic rotary-kinetics model -- J_ATP = k_cat·activity
  is strictly linear (no Michaelis–Menten saturation, no proton-motive-force back-pressure), the ATP:H⁺
  ratio is a fixed constant, and the torque is a fixed leaf value. This renders the paper''s
  typed-coupled-channels point minimally, not the enzyme''s true rate law.
- The mechanical channel deliberately carries torque (N·m), not force (N) or power (W) -- the drive sets
  the rotor's speed, not its torque. The caption's "mechanical forces" is realized here specifically as
  rotary torque, matching the draft's declared `mechanical_out` torque port (N·m).
- The `ProtonMotiveRamp` is a scripted monotonic driver (drive_rate 0.06/tick), standing in for a real,
  self-consistently maintained proton-motive force. The environment→transducer coupling it makes legible
  is real; the ramp shape itself is scripted, not emergent.
- The `structure` port is a read-only string identifier and does not enter the dynamics -- it stands for
  the molecular structure the interface is defined over, not a simulated conformation.
- The rigorous molecular-scale cousin is `molecular-interfaces` in the `draft-to-living-cell`
  investigation, which treats the molecular interface at higher fidelity; this study is the deliberately
  minimal, runnable figure-carrier and does not restate that study's numbers as its own.
falsifiability: Overturned if the ATP flux fails to scale linearly with the proton drive, if any of the
  coupling identities (I = J_ATP·n·e, Q = (1−η)·I·pmf) fails on the live run, if the ATP:H⁺ stoichiometry
  drifts off 1/3.3, if the rotary torque is not constant or begins scaling with the drive (implying a
  force/power channel rather than torque), if the energy balance fails to close at the (η, 1−η) split, or
  if a zero drive produces a non-zero flux on any of the three driven channels.
