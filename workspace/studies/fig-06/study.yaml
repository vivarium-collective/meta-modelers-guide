parent_studies:
- study: molecular-interfaces
  condition: tests-passed
experiment: 'Run the `fig06-runnable` composite (MolecularMechanismHandler -- the F₁Fₒ ATP synthase as
  a four-channel transducer -- driven by a ProtonMotiveRamp charging the substrate/proton drive
  linearly) to completion over 20 ticks through the process-bigraph engine, and measure whether one
  coupled proton flux drives four TYPED physical channels (chemical ATP flux, electrical proton current,
  mechanical rotary torque, thermal heat) with matter, charge, angular momentum, and energy conserved
  across a molecular interface that has no cell-level boundary.'
result: 'Over a deterministic 20-tick run, the F₁Fₒ ATP synthase transducer drives four TYPED physical
  channels from ONE ramped proton flux, with no cell-level boundary in the state. The chemical channel
  (ATP synthesis flux) scales linearly with the drive -- 4× activity gives exactly 4× flux (30.0 at
  activity 0.3, 120.0 at 1.2), rising monotonically 20.0 → 128.0 over the run. The four channels are one
  coupled quantity: the proton current is the ATP flux carried as charge (I = J_ATP·n·e), the ATP:H⁺
  stoichiometry holds at 1/3.3 exactly on every step, the rotary torque holds constant at 4×10⁻²⁰ N·m
  (torque, not force/power -- the drive sets speed, not torque), and the dissipated heat equals
  (1−η)·PMF power = 25 % of input, useful work 75 %, both non-negative. All coupling identities hold to
  1e-30 on the live run and every readout reproduces exactly. A zero drive produces zero flux on all
  three driven channels (negative control). The paper''s §Molecular interfaces figure (Fig
  molecular_interface) holds as a runnable process: a molecular mechanism exposing typed, coupled
  chemical/electrical/mechanical/thermal channels over molecular structure, matter/charge/
  angular-momentum/energy conserved across the interface, with no cell boundary -- executable, not merely
  drawn. The rigorous molecular-scale cousin is `molecular-interfaces` in the `draft-to-living-cell`
  investigation.'
