  status: novel
  variant: fig06-mechanistic
  statement: 'The baseline''s TWO imposed constants become DERIVED, validated outcomes in the mechanistic variant. The rotary drive torque is τ_drive = n_c·e·Δp/2π — a consequence of n_c protons each delivering e·Δp of work per revolution — and at Δp = 150 mV it equals 38.2 pN·nm, reproducing the measured ~40 pN·nm Fₒ stall torque (Junge & Nelson 2015) that fig06-runnable merely set by hand. It scales linearly with the proton-motive force (τ(2Δp)/τ(Δp) = 2.000), so it is a derived function of Δp, not a leaf value. This directly answers the review''s "fixed torque is imposed" objection: the number is now predicted from the gradient and matches experiment.'
