- id: F-05
  kind: computational
  tier: mechanism
  status: novel
  variant: fig06-mechanistic
  statement: 'Stall and reversal are EMERGENT outcomes of the torque balance, not scripted events. Ramping the external shaft load drives the rotor forward (synthesis), through a stall where τ_ext = τ_drive − τ_chem (≈ tick 11), and into reversal (ω < 0) where it runs backward as an ATP-driven proton pump — J_ATP and the proton current both flip sign with ω. Throughout, the full power budget P_in = P_ATP + P_ext + P_heat closes to 3.1e-33 W (machine precision), with viscous dissipation P_heat = ζω² ≥ 0 — so the machine is thermodynamically reversible and energy-conserving by construction, not by an imposed efficiency. The baseline could not represent stall, reversal, or load at all.'
  evidence:
