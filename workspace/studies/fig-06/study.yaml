- name: A molecular transducer couples a proton-motive force across four channels
  address: image:visualizations/fig06-dynamics.png
  config:
    chart: image
    caption: 'Time series of the runnable fig06 transducer (fig06-runnable): the F₁Fₒ
      ATP synthase driven by a proton-motive-force ramp. From the ONE coupled proton
      flux (drive, dashed) the mechanism produces four TYPED physical channels — ATP
      synthesis flux (chemical), proton current (electrical), a near-constant rotary
      torque on the Fₒ rotor (mechanical), and dissipated heat (thermal). ATP flux
      scales with the drive at the fixed ATP:H⁺ = 1/3.3 stoichiometry, and the
      electrical energy balance holds (heat = (1−η)·input power, η = 0.75) — matter,
      charge, angular momentum and energy conserved. From scripts/build_fig06_dynamics.py.'
question: How is a molecular mechanism a process with typed physical channels?
