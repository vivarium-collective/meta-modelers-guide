- id: F-03
  kind: computational
  tier: mechanism
  status: novel
  statement: 'The ATP-flux sweep is produced by the proton-drive ramp, not by the rate law itself -- shown by contrasting the bare figure draft against the driven transducer. The bare draft `fig06-executable` pins the substrate/proton activity at chemical_in = 1.0 and so reports a FLAT ATP turnover of chemical_out = 100.0 = k_cat (no ProtonMotiveRamp wired; its electrical, mechanical, and thermal output channels read 0.0 in the bare draft). Adding the ramp in `fig06-runnable` charges chemical_in from 0.2 to ~1.34, and because J_ATP = k_cat * activity the ATP flux then sweeps 20.0 -> 128.0 over the run while all four channels co-fire. The sweep is therefore the environment->transducer coupling (the ramp driving the proton flux), not an intrinsic nonlinearity of the mechanism -- the paper''s point that at the molecular level interactions are governed by the driving flux, made measurable. Verified in-memory (workbench 0.4.1): fig06-executable chemical_out flat 100.0; fig06-runnable chemical_out 20.0 at first drive, rising linearly with activity.'
