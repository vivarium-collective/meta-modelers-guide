schema_version: 4
name: self-made
investigation: draft-to-living-cell
title: Self-Made
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How does a cell hold itself together? Does the Fig 9 composition express autopoiesis — metabolism,
  containment, and replication mutually producing one another — and does that same closure appear when
  each function is realized at a coarse, a self-organized, or a molecular grain?
hypothesis: 'The Fig 9 executables show all three closure functions simultaneously active and expressible
  at multiple grains: a coarse metabolism/containment/replication triad and a molecular minimal cell (Fig
  9b) that grows its own membrane and proteins — the mutual closure Maturana & Varela called autopoiesis.'
objective: Run the Fig 9a (three-grain closure) and Fig 9b (minimal cell) executables and confirm metabolism,
  containment, and replication are all productive at more than one grain.
biological_summary: 'Fig 9 asks where a maintained interface comes from in the first place, and answers
  with autopoiesis: a cell is a network of processes that collectively produce and sustain the very organization
  that lets them run. Three functions close the loop — metabolism builds the parts (metabolites → 4.8,
  products → 2.4), containment builds the boundary that holds them (membrane → 1.6, boundary → 1.2), and
  replication copies the blueprint (copies → 1.6 coarse, 1.2 self-organized). The same triad is drawn
  at three grains — coarse lumped processes, self-organizing processes, and molecular detail — showing
  that closure is a pattern, not a particular mechanism. Fig 9b makes it concrete as a minimal cell whose
  membrane area grows to 1.2 and whose protein pool reaches 1.27 from its own gene→enzyme→metabolite economy.'
claim: Metabolism, containment, and replication close on one another (autopoiesis) and the same three
  functions appear at coarse, self-organized, and molecular grains — metabolites 4.8, membrane 1.6, replication
  copies 1.6/1.2.
baseline:
- name: coarse-graining
  composite: viva_meta_modelers_guide.composites.fig09a-coarse-graining
  params: {}
- name: minimal-cell
  composite: viva_meta_modelers_guide.composites.fig09b-minimal-cell
  params: {}
variants: []
expected_behavior:
- Metabolism, containment, and replication are all productive.
- The closure appears at more than one grain.
- The Fig 9b minimal cell grows membrane and proteins.
behavior_tests:
- name: closure-active
  classification: behavioral
  description: All three autopoietic functions produce output (metabolism, containment, replication).
  measure:
    kind: observable
    expr: last(metabolism_selforg.products), containment_selforg.membrane, replication_coarse.copies
  pass_if:
    op: threshold
    condition: all > 0 (2.4 / 1.6 / 1.6)
  requires_simulation: self-made
- name: multi-grain
  classification: structural
  description: Each function is realized at more than one grain (coarse AND self-organized nonzero).
  measure:
    kind: observable
    expr: coarse and selforg variants of each function
  pass_if:
    op: threshold
    condition: both > 0
  requires_simulation: self-made
- name: minimal-cell-grows
  classification: behavioral
  description: The Fig 9b minimal cell grows its own membrane and protein pool.
  measure:
    kind: observable
    expr: last(membrane.area) and last(proteins.concentration)
  pass_if:
    op: threshold
    condition: both > 1.0 (1.2 / 1.27)
  requires_simulation: self-made
runs:
- name: self-made
  composite: self-made
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes:
    CLOSURE-ACTIVE:
      result: PASS
      detail: metabolism 2.4, containment 1.6, replication 1.6 — all > 0
    MULTI-GRAIN:
      result: PASS
      detail: coarse + self-organized variants both nonzero for each function
    MINIMAL-CELL-GROWS:
      result: PASS
      detail: membrane.area->1.2, proteins->1.2687
  id: self-made
  status: completed
- name: fig09b-executable
  composite: fig09b-executable
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes: {}
  id: fig09b-executable
  status: completed
