schema_version: 4
name: self-made
investigation: draft-to-living-cell
title: Self-Made
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How does a cell hold itself together? Does the Fig 9 composition express autopoiesis — metabolism,
  containment, and replication mutually producing one another — and does that same closure appear when
  each function is realized at a coarse, a self-organized, or a molecular grain?
biological_summary: 'Fig 9 asks where a maintained interface comes from in the first place, and answers
  with autopoiesis: a cell is a network of processes that collectively produce and sustain the very organization
  that lets them run. Three functions close the loop — metabolism builds the parts (metabolites → 4.8,
  products → 2.4), containment builds the boundary that holds them (membrane → 1.6, boundary → 1.2), and
  replication copies the blueprint (copies → 1.6 coarse, 1.2 self-organized). The same triad is drawn
  at three grains — coarse lumped processes, self-organizing processes, and molecular detail — showing
  that closure is a pattern, not a particular mechanism. Fig 9b makes it concrete as a minimal cell whose
  membrane area grows to 1.2 and whose protein pool reaches 1.27 from its own gene→enzyme→metabolite economy.'
claim: 'A cell holds itself together through closure: metabolism, containment, and replication each produce
  what the others need, so the organization sustains itself.'
baseline:
- name: coarse-graining
  composite: viva_meta_modelers_guide.composites.fig09a-coarse-graining
  params: {}
- name: minimal-cell
  composite: viva_meta_modelers_guide.composites.fig09b-minimal-cell
  params: {}
variants: []
behavior_tests:
- name: closure-sustains
  classification: primary
  description: The intact composition self-produces (autocatalytic membrane + enzyme).
  measure:
    kind: observable
    expr: membrane/enzyme(t), intact
  pass_if:
    op: threshold
    condition: rise to a large pool
  requires_simulation: self-made
- name: knockout-collapses
  classification: primary
  description: The enzyme-knockout NEGATIVE control collapses — closure is required.
  measure:
    kind: observable
    expr: enzyme(t), knockout
  pass_if:
    op: threshold
    condition: decays to ≈0
  requires_simulation: self-made
- name: multi-grain
  classification: supporting
  description: Metabolism, containment, replication are all productive in the closure.
  measure:
    kind: observable
    expr: the three functions, intact
  pass_if:
    op: threshold
    condition: all active
  requires_simulation: self-made
runs:
- name: self-made
  composite: self-made
  emitter: RAMEmitter
  id: self-made
  status: completed
