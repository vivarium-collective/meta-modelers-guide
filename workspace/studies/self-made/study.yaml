schema_version: 4
name: self-made
investigation: draft-to-living-cell
title: Self-Made
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How does a cell hold itself together? Does the Fig 9 composition express autopoiesis — metabolism,
  containment, and replication mutually producing one another — and does that same closure appear when
  each function is realized at a coarse, a self-organized, or a molecular grain?
biological_summary: 'Fig 9 asks where a maintained interface comes from in the first place, and answers
  with autopoiesis: a cell is a network of processes that collectively produce and sustain the very organization
  that lets them run. Three functions close the loop — metabolism builds the parts, containment builds
  the boundary that holds them, and replication copies the blueprint. In the intact composition the closure
  is self-producing: the membrane climbs to 1.6 and the catalyst pool to 1.2, products to 2.4 and the
  metabolite pool to 4.8, held up by the very economy they sustain, whereas the inert draft (uncompiled,
  no mechanism) never builds — it stays at seed, isolating the compiled closure as the cause. The same
  triad is drawn at three grains — coarse lumped processes, self-organizing processes, and molecular detail
  (where the minimal cell grows proteins to 1.27, enzymes to 0.72 and its membrane area to 1.2) — showing
  that closure is a pattern, not a particular mechanism.'
claim: 'A cell holds itself together through closure: metabolism, containment, and replication each produce
  what the others need, so the organization sustains itself.'
baseline:
- name: coarse-graining
  composite: meta_modelers_guide.composites.fig09a-coarse-graining
  params: {}
- name: minimal-cell
  composite: meta_modelers_guide.composites.fig09b-minimal-cell
  params: {}
variants: []
behavior_tests:
- name: membrane-sustains
  classification: primary
  measure:
    kind: observable
    path: membrane
    expr: last(membrane)
  pass_if:
    op: '>='
    value: 1.0
    provenance: intact closure self-sustains the membrane (exec last≈1.6)
  requires_simulation: self-made
- name: enzyme-maintained
  classification: primary
  measure:
    kind: observable
    path: enzymes
    expr: last(enzymes)
  pass_if:
    op: '>='
    value: 0.5
    provenance: the enzyme pool is held up by the closure (exec last≈0.72)
  requires_simulation: self-made
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: membrane
    expr: last(membrane)
  pass_if:
    op: '>='
    value: 1.0
    provenance: inert draft stays at seed (no mechanism / no closure)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: self-made
runs:
- name: self-made
  composite: self-made
  emitter: RAMEmitter
  id: self-made
  status: completed
  provenance: scripts/render_study_evidence.py — fig09a-executable and fig09b-executable compiled from
    the Fig 9 drafts, run to completion through the engine.
  params: {}
  outcomes:
    CLOSURE-SUSTAINS:
      result: PASS
      detail: intact membrane→1.6, catalysts→1.2, products→2.4 (self-produced)
    DRAFT-INERT:
      result: PASS
      detail: inert draft stays at seed — no membrane/enzyme built without the compiled closure
    MULTI-GRAIN:
      result: PASS
      detail: sustained at all three grains — coarse (metabolites→4.8), self-organized (membrane→1.6,
        products→2.4), molecular (proteins→1.27, enzymes→0.72)
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The intact composition self-produces (autocatalytic membrane + catalysts). Confirmed: intact
    membrane→1.6, catalysts→1.2, products→2.4 (self-produced).'
  evidence:
    from_test: membrane-sustains
    from_run: self-made
    observed: intact membrane→1.6, catalysts→1.2, products→2.4 (self-produced)
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The inert-draft NEGATIVE control never builds — the closure is required. Confirmed: the inert
    draft stays at seed, no membrane/enzyme produced.'
  evidence:
    from_test: draft-is-inert
    from_run: self-made
    observed: inert draft stays at seed, no membrane/enzyme built
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'Metabolism, containment, replication are all productive across the three grains. Confirmed:
    coarse (metabolites→4.8), self-organized (membrane→1.6, products→2.4), molecular (proteins→1.27, enzymes→0.72)
    all sustained.'
  evidence:
    from_test: enzyme-maintained
    from_run: self-made
    observed: coarse metabolites→4.8, self-organized membrane→1.6/products→2.4, molecular proteins→1.27/enzymes→0.72
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Membrane-sustains, enzyme-maintained, and multi-grain all pass; the inert-draft negative control stays at seed, showing the compiled closure is load-bearing.
  explanatory_gain:
    result: POSITIVE
    basis: Contrasting the intact autopoietic loop against the inert draft makes closure a measurable, falsifiable dependency rather than a metaphor.
conclusion: '## Claims

  - The autopoietic composition SELF-SUSTAINS — metabolism→products→catalysts→metabolism closes on itself
  and builds up membrane (→1.6), catalysts (→1.2) and products (→2.4) — while the inert-draft CONTROL never
  builds, staying at seed. The closure is load-bearing, not decorative.


  ## Evidence

  - **CLOSURE-SUSTAINS** — intact membrane→1.6, catalysts→1.2, products→2.4 (self-produced)

  - **DRAFT-INERT** — inert draft stays at seed — no membrane/enzyme built without the compiled closure

  - **MULTI-GRAIN** — coarse (metabolites→4.8), self-organized (membrane→1.6, products→2.4), molecular
  (proteins→1.27, enzymes→0.72) all sustained


  ## Limitations

  - Toy-real autopoiesis: the loop sustains raised steady levels while the inert draft stays flat, but the constants are illustrative and self-production is lumped.


  ## Next steps

  - Add a genuine knockout executable to map which loop members are individually essential to the closure.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - divide
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Closure is shown as sustained steady levels, not literal self-fabrication of new components; the self-production is a toy autocatalytic loop.
- The negative control is the inert draft, not a targeted knockout; robustness of the closure to specific perturbations is untested.
falsifiability: Overturned if the intact composition fails to sustain its membrane and enzyme pools, or if the inert draft does NOT stay at seed (which would mean the closure is not load-bearing).
