schema_version: 4
name: molecular-channels
investigation: draft-to-living-cell
title: Molecular Channels
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: When a description drops to the molecular grain (Fig 7), can a single molecular machine — F1Fo
  ATP synthase — be compiled from its draft and run through the engine as a PMF-driven rotary catalyst that
  synthesizes ATP on its chemical output port?
biological_summary: 'Fig 6 said the description can drop to molecules; Fig 7 shows what a molecular mechanism
  looks like as an executable interface. The mechanism here is F1Fo ATP synthase — the rotary machine that
  couples the proton-motive force across the membrane to phosphorylation of ADP. Compiled from its draft
  and run to completion, it synthesizes ATP: its chemical output port (ports.chemical_out) rises from 0 to
  100 over the run. This executable is deliberately thin — it exposes a single moving observable, the ATP
  synthesized — so the honest claim is narrow: the molecular grain is executable, not merely illustrated,
  and the mechanism drives its chemical output rather than sitting inert.'
claim: At the molecular grain a mechanism — F1Fo ATP synthase — compiles from its draft and runs through
  the engine, synthesizing ATP on its chemical output port.
baseline:
- name: molecular-mechanism
  composite: viva_meta_modelers_guide.composites.fig07-molecular-mechanism
  params: {}
variants: []
behavior_tests:
- name: atp-synthesized
  classification: primary
  description: 'The F1Fo ATP synthase mechanism drives its chemical output port: ATP synthesized rises from
    0 to 100 over the run (exec fig07-executable, ports.chemical_out).'
  measure:
    kind: observable
    path: chemical_out
    expr: last(chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: ATP synthesized on chemical_out 0→100 (exec fig07-executable)
  requires_simulation: molecular-channels
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'Negative control: the inert draft (no mechanism installed) synthesizes no ATP — chemical_out
    stays at its seed value of 0 — so a test requiring ATP synthesis MUST fail on it. Its failure confirms
    the ATP rise is mechanism-driven, not an artifact of the wiring.'
  measure:
    kind: observable
    path: chemical_out
    expr: last(chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: inert-draft run stays at seed chemical_out 0 (no mechanism → no synthesis) — MUST fail
  requires_simulation: molecular-channels
runs:
- name: molecular-channels
  composite: molecular-channels
  emitter: RAMEmitter
  id: molecular-channels
  status: completed
  provenance: scripts/render_study_evidence.py — fig07-executable compiled from the Fig 7 draft, run to
    completion through the engine.
  params: {}
  outcomes:
    ATP-SYNTHESIZED:
      result: PASS
      detail: chemical_out (ATP synthesized) 0→100
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The F1Fo ATP synthase mechanism, compiled from the Fig 7 draft and run through the engine,
    synthesizes ATP on its chemical output port. Confirmed: chemical_out (ATP synthesized) 0→100.'
  evidence:
    from_test: atp-synthesized
    from_run: molecular-channels
    observed: chemical_out (ATP synthesized) 0→100
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: The F1Fo ATP synthase executable runs to completion and synthesizes ATP on its chemical output port (chemical_out 0→100); the inert draft stays at seed, so the synthesis is mechanism-driven.
  explanatory_gain:
    result: POSITIVE
    basis: Compiling the Fig 7 molecular draft to a running ATP-synthase executable shows the molecular grain is executable, not just illustrated — though this executable exposes a single moving observable.
conclusion: '## Claims

  - The Fig 7 molecular mechanism — F1Fo ATP synthase, PMF-driven rotary catalysis — compiles from its draft
  and runs through the engine, synthesizing ATP on its chemical output port (chemical_out 0→100). The inert
  draft, with no mechanism installed, stays at seed — so the synthesis is mechanism-driven.


  ## Evidence

  - **ATP-SYNTHESIZED** — chemical_out (ATP synthesized) 0→100


  ## Limitations

  - This executable exposes a single moving observable (chemical_out); the multi-channel (chemical/electrical/mechanical/thermal)
  transduction described in the Fig 7 draft is not exercised by this run, so it is not claimed here.


  ## Next steps

  - Extend the executable to emit the electrical, mechanical, and thermal channels so the four-channel transduction
  described by the draft can be measured, not merely asserted.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; the
      molecular mechanism drives its chemical output.
    pipeline_unblocks:
    - the-nested-cell
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- The executable exposes a single moving observable (ATP on chemical_out); the four-channel (chemical/electrical/mechanical/thermal) transduction of the Fig 7 draft is described but not measured in this run.
- Magnitudes are illustrative (chemical_out 0→100), not calibrated to a specific ATP-synthase turnover rate.
falsifiability: Overturned if the compiled ATP-synthase executable fails to synthesize ATP on its chemical output port (chemical_out stays at seed).
visualizations:
