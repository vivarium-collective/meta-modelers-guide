  condition: tests-passed
experiment: Compile the Fig 7 F1Fo ATP-synthase draft to an executable and run it to completion, reading its
  chemical output port.
result: The mechanism synthesizes ATP — chemical_out rises 0→100 — while the inert draft, with no mechanism,
  stays at seed.
