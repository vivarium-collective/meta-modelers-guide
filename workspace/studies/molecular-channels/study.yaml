schema_version: 4
name: molecular-channels
investigation: draft-to-living-cell
title: Molecular Channels
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: When a description drops to the molecular grain (Fig 7), can a single molecular mechanism act
  as a transducer across four typed physical channels at once — chemical, electrical, mechanical, thermal
  — each carried on its own port in its own unit, without the channels collapsing into one lumped output?
biological_summary: 'Fig 6 said the description can drop to molecules; Fig 7 shows what a molecular mechanism
  looks like as an interface. A molecular machine is rarely a single-input single-output device — it couples
  chemistry, charge, force and heat simultaneously. Here one mechanism transduces all four at once: it
  turns over a depleting substrate (8.0) into a chemical product (→ 4.8) while dissipating heat (→ 3.2),
  and carries an electrical current and a mechanical output on their own typed ports. Product plus heat
  balance the substrate consumed (4.8 + 3.2 ≡ 8.0).
  The point is that these are four *typed* ports, not one scalar: the interface keeps them distinct so
  a downstream composite can wire each to the appropriate cell-level channel.'
claim: At the molecular level a single mechanism can transduce several physical channels at once — chemical,
  electrical, mechanical, thermal — each carried on its own typed port.
baseline:
- name: molecular-mechanism
  composite: viva_meta_modelers_guide.composites.fig07-molecular-mechanism
  params: {}
variants: []
behavior_tests:
- name: product-formation
  classification: primary
  measure:
    kind: observable
    path: product
    expr: last(product)
  pass_if:
    op: '>='
    value: 2.0
    provenance: chemical turnover yields product (exec last≈4.8)
  requires_simulation: product-formation
- name: substrate-consumed
  classification: primary
  measure:
    kind: observable
    path: substrate
    expr: last(substrate)
  pass_if:
    op: <=
    value: 0.5
    provenance: substrate pool consumed to ~0 (exec last≈0.0 from 8.0)
  requires_simulation: substrate-consumed
- name: heat-generated
  classification: primary
  measure:
    kind: observable
    path: heat
    expr: last(heat)
  pass_if:
    op: '>='
    value: 1.0
    provenance: turnover dissipates heat (exec last≈3.2)
  requires_simulation: heat-generated
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: product
    expr: last(product)
  pass_if:
    op: '>='
    value: 2.0
    provenance: inert-draft run stays at seed (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: molecular-channels
  composite: molecular-channels
  emitter: RAMEmitter
  id: molecular-channels
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    ENERGY-CONSERVED:
      result: PASS
      detail: product 4.8 + heat 3.2 ≡ substrate 8.0
    DYNAMIC-RESPONSE:
      result: PASS
      detail: product rises sigmoidally; current peaks then relaxes
    OHMIC-CHANNEL:
      result: PASS
      detail: current tracks g·voltage as voltage decays
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Product + dissipated heat balance the substrate energy consumed. Confirmed: product 4.8
    + heat 3.2 ≡ substrate 8.0.'
  evidence:
    from_test: energy-conserved
    from_run: molecular-channels
    observed: product 4.8 + heat 3.2 ≡ substrate 8.0
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'Channels show a real transient (turnover + relaxation), not a step. Confirmed: product rises
    sigmoidally; current peaks then relaxes.'
  evidence:
    from_test: dynamic-response
    from_run: molecular-channels
    observed: product rises sigmoidally; current peaks then relaxes
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'The electrical channel is an Ohmic response to its decaying drive. Confirmed: current tracks
    g·voltage as voltage decays.'
  evidence:
    from_test: ohmic-channel
    from_run: molecular-channels
    observed: current tracks g·voltage as voltage decays
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Energy-conserved, dynamic-response, and Ohmic-channel all pass; the inert draft stays at seed, so the transduction is mechanism-driven.
  explanatory_gain:
    result: POSITIVE
    basis: Driving one mechanism and accounting for its energy budget makes the four typed channels measurable and distinct rather than asserted.
conclusion: '## Claims

  - The molecular mechanism transduces a driven, depleting substrate into product + heat with a CONSERVED
  energy budget (product 4.8 + dissipated heat 3.2 account for the substrate energy consumed, 8.0) and
  an Ohmic electrical channel tracking its decaying drive — dynamic response, not a step to constant.


  ## Evidence

  - **ENERGY-CONSERVED** — product 4.8 + heat 3.2 ≡ substrate 8.0

  - **DYNAMIC-RESPONSE** — product rises sigmoidally; current peaks then relaxes

  - **OHMIC-CHANNEL** — current tracks g·voltage as voltage decays

  - **conservation** — energy balance: product 4.80 + heat 3.20 accounts for substrate consumed 8.00


  ## Limitations

  - Toy-real transducer: the energy budget is conserved and the channel shapes are real, but gains and constants are illustrative.


  ## Next steps

  - Wire each channel to a downstream cell-level port to show the molecular transducer composing upward.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - the-nested-cell
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- One transducer mechanism with four lumped channels; real molecular machines add stochasticity and internal states not resolved here.
- The energy budget is closed by construction (product + heat ≡ substrate); channel gains are illustrative, not measured from a specific enzyme.
falsifiability: Overturned if the four channels collapse into one lumped output, or if the energy budget fails to close (product + dissipated heat ≠ substrate consumed).
