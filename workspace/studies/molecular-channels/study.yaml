schema_version: 4
name: molecular-channels
investigation: draft-to-living-cell
title: Molecular Channels
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: When a description drops to the molecular grain (Fig 7), can a single molecular mechanism act
  as a transducer across four typed physical channels at once — chemical, electrical, mechanical, thermal
  — each carried on its own port in its own unit, without the channels collapsing into one lumped output?
hypothesis: The Fig 7 molecular mechanism, compiled under a transducer handler, drives four distinct output
  ports with four distinct magnitudes, confirming that the typed-channel interface survives at the molecular
  grain.
objective: Run the Fig 7 executable and measure the four channel outputs to confirm they are simultaneously
  active and independently typed.
biological_summary: 'Fig 6 said the description can drop to molecules; Fig 7 shows what a molecular mechanism
  looks like as an interface. A molecular machine is rarely a single-input single-output device — it couples
  chemistry, charge, force and heat simultaneously. Here one mechanism transduces all four: it emits a
  chemical flux (0.6), an electrical current (0.3), a mechanical output (0.4) and a thermal output (0.7).
  The point is that these are four *typed* ports, not one scalar: the interface keeps them distinct so
  a downstream composite can wire each to the appropriate cell-level channel.'
claim: At the molecular grain, one mechanism transduces four independently-typed channels at once — chemical
  (0.6), electrical (0.3), mechanical (0.4) and thermal (0.7) — each an emitting port in its own unit.
baseline:
- name: molecular-mechanism
  composite: viva_meta_modelers_guide.composites.fig07-molecular-mechanism
  params: {}
variants: []
expected_behavior:
- All four output channels carry nonzero flux.
- The four channels have distinct magnitudes/types.
behavior_tests:
- name: all-channels-active
  classification: behavioral
  description: All four typed output channels are simultaneously nonzero.
  measure:
    kind: observable
    expr: last of chemical_out, electrical_out, mechanical_out, thermal_out
  pass_if:
    op: threshold
    condition: all > 0
  requires_simulation: molecular-channels
- name: channels-distinct
  classification: structural
  description: The four channels are independently typed ports, not one lumped output.
  measure:
    kind: observable
    expr: distinct port magnitudes {0.6, 0.3, 0.4, 0.7}
  pass_if:
    op: threshold
    condition: four distinct values
  requires_simulation: molecular-channels
runs:
- name: molecular-channels
  composite: molecular-channels
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes:
