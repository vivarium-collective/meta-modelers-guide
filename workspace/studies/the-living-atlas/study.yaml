conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All twelve figure composites build and every executable runs to completion (12/12) via scripts/render_study_evidence.py.
  biological_validation:
    result: PASS
    basis: Every executable produces the behavior its figure specifies — ATP synthase charges (fig07 0→100), fig10-1 divides once (cell_count 1→2), the fig06 FBA route overflows (secretions 0→30.45), and the three fig06 handlers diverge (4.0 / 2.67 / 6.29) — so the patterns are mechanism-driven, not artifacts of a shared handler.
  explanatory_gain:
    result: POSITIVE
    basis: Running all twelve compiled figures side by side, each to completion and through a shared interface vocabulary, turns "the patterns compose" from a claim into a measured gallery.
conclusion: '## Claims

  - All twelve of the paper''s semantic figures compile to executables that run to completion (12/12),
  and because they share ports they compose. The gallery renders every compiled figure moving at once.


  ## Evidence

  - **TWELVE-OF-TWELVE-RUN** — all 12 fig*-executable composites compile and run to completion (12/12)

  - **ATP-CHARGES** — fig07 F1Fo ATP synthase charges chemical_out 0 → 100

  - **HANDLER-DIVERGENCE** — one fig06 interface, three handlers → three DISTINCT endpoints (coarse 4.0
  / kinetic 2.67 / FBA 6.29); the FBA branch also secretes acetate overflow to 30.45

  - **DIVISION** — fig10-1 divides ONCE: cell_count 1 → 2, two daughters (biomass 0.5 each)


  ## Limitations

  - Toy-real gallery: the executables reuse illustrative handlers and are not calibrated whole-cell models. This study demonstrates that the twelve figures COMPILE, RUN, and share an interface, not a quantitative fit.


  ## Next steps

  - Assemble a subset of the shared-port executables into one running composite to demonstrate composition end to end, then run across replicate seeds and environments.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - a figure draft failed to compile to a running executable
    block_downstream: none — this is the terminal capstone; a failure blocks the investigation's compile-and-compose
      conclusion, with no further downstream study.
limitations:
- The twelve executables reuse the toy-real figure handlers; the study demonstrates that the figures COMPILE, RUN, and share an interface vocabulary, not a calibrated whole-cell simulation.
- One deterministic run per executable; behaviors are shown once, not across replicate seeds or environments.
falsifiability: Overturned if any of the twelve figure drafts fails to compile to an executable that runs to completion, or if the compiled processes do not actually share the ports that would let them compose.
