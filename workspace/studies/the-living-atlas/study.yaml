confidence: Accepted
question: 'Do all of the paper''s semantic figures actually compile to executables that run — and, the
  real test of composition, do the independently-authored figure mechanisms share enough interface to
  compose? This capstone runs all twelve at once.'
biological_summary: This is the payoff. Each figure study showed one pattern compiling from draft to
  executable; this study shows the whole atlas running at once. The gallery renders the dynamics of all
  twelve executables side by side — every compiled figure, actually moving, run to completion (12/12).
  And because the compiled processes share ports, they compose. The thermal interface (fig04b) reshapes
  a cell (shape 1.0 → 4.2) while holding viability near the top of its band (1.0 → 0.97); the cell↔field
  loop closes (fig05, uptake_flux 0 → 0.34 driving mass 1.0 → 1.17); one fig06 interface drives three
  different handlers to three DISTINCT endpoints (coarse biomass 4.0 / kinetic 2.67 / FBA 6.29 — the FBA
  route secreting acetate overflow to 30.45), which is the handler-independence point; the F1Fo ATP synthase
  charges its port ATP 0 → 100 (fig07); the central-dogma cascade builds RNA and protein (fig08, rna 0
  → 0.18); autopoietic membrane and enzymes self-sustain (fig09a membrane 0 → 1.6; fig09b enzymes 0 →
  0.72); and the population-scale figures divide ONCE into two daughters (fig10-1, cell_count 1 → 2), grow
  a biofilm (fig10-2, mass 0 → 2.25, ecm 0 → 1.8), and evolve an emergent capability (fig10-3, population
  1 → 3.4). Twelve drafts, twelve running executables, one shared interface vocabulary.
claim: 'All twelve of the paper''s semantic figures compile to executables that run to completion (12/12),
  and because they share ports they compose — independently-authored mechanisms assembled through one
  interface vocabulary.'
