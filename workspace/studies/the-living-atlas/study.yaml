variants: []
behavior_tests:
- name: cell-grows
  classification: primary
  measure:
    kind: observable
    path: biomass
    expr: max(biomass)
  pass_if:
    op: '>='
    value: 3.0
    provenance: viability-gated metabolism converts nutrient uptake to biomass; the composed cell grows
      biomass 0.3 → peak ≈5.1 (exec max≈5.1)
  requires_simulation: the-living-atlas
- name: cell-divides
  classification: primary
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 2.0
    provenance: once biomass crosses the division threshold the rewrite fires ONCE, partitioning the cell
      into two daughters — cell_count 1 → 2 at t≈3.4 (exec last=2.0)
  requires_simulation: the-living-atlas
- name: cell-dies
  classification: primary
  measure:
    kind: observable
    path: viability
    expr: last(viability)
  pass_if:
    op: <=
    value: 0.1
    provenance: the thermal shock (temperature 37 → 50 °C at t≈12) leaves the viability band; the monitor
      collapses viability 1.0 → 0.018 and the disintegration rewrite turns biomass to debris 0 → 4.87 (exec
      last=0.018)
  requires_simulation: the-living-atlas
- name: all-figures-run
  classification: secondary
  measure:
    kind: observable
    path: ports.chemical_out
    expr: last(ports.chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: all twelve fig*-executable composites compile and run to completion (12/12); fig07''s F1Fo
      ATP synthase charging its port chemical_out 0 → 100 is a witness that the gallery executes (exec last=100.0)
  description: 'Gallery witness: the whole cell composes twelve figure modules; independently, all twelve
    figures compile to executables that each run to completion.'
  requires_simulation: the-living-atlas
runs:
- name: the-living-atlas
  composite: the-living-atlas
