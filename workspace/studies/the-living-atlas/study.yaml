    caption: The composed whole cell, three metabolisms behind one interface — coarse / kinetic / FBA give three life histories (peak biomass 5.78 / 6.43 / 6.05), each growing, dividing once (mass-conserved), and dying on a scripted thermal shock. (The 'every figure compiles and runs' gallery is now its own study.)
parent_studies:
- study: the-nested-cell
  condition: tests-passed
experiment: Assemble a whole cell in the figures' style (cell–environment uptake, a viability-gated Fig 6 metabolism, a viability monitor, and the division/disintegration rewrites) through shared cell and environment stores, then SWAP the Fig 6 metabolism behind identical ports — build_whole_cell(metabolism="coarse"|"kinetic"|"fba") — and run each 20 steps through the engine.
result: Behind one unchanged metabolism interface the same cell lives three distinct life histories — coarse (peak biomass 5.78, divides t≈3.0), saturating-kinetic (6.43, t≈2.1), and real COBRApy FBA (6.05, t≈2.7). In every case the cell grows, divides once (cell_count 1 → 2, mass-conserved — the mother is halved), and dies when a scripted thermal shock (37 → 50 °C at t=12) collapses viability (1.0 → 0.018) and disintegration converts biomass to debris (≈5.5–6.1). Mechanism-swap (law 4), demonstrated at the whole-cell level.
