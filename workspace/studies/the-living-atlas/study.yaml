behavior_tests:
- name: peak-growth
  classification: primary
  measure:
    kind: observable
    path: biomass
    expr: max(biomass)
  pass_if:
    op: '>='
    value: 3.0
    provenance: biomass peaks then lyses (exec max≈8.4)
  requires_simulation: the-living-atlas
- name: disintegration
  classification: primary
  measure:
    kind: observable
    path: debris
    expr: last(debris)
  pass_if:
    op: '>='
    value: 2.0
    provenance: lysis converts biomass to debris (exec last≈7.3)
  requires_simulation: the-living-atlas
- name: division
