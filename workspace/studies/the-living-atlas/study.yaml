variants: []
expected_behavior:
- All 12 executables build and produce dynamics.
- The composed cell grows and peaks in biomass.
- The composed cell divides.
- A thermal shock drives viability to ~0 and debris rises.
- Grow->divide->shock->disintegrate happen in one run.
behavior_tests:
- name: all-executables-run
  classification: structural
  description: Every executable composite builds and produces non-trivial dynamics.
  measure:
    kind: observable
    expr: count of executables with a rendered dynamics series
  pass_if:
    op: threshold
    condition: = 12 / 12
  requires_simulation: the-living-atlas
- name: whole-cell-grows
  classification: behavioral
  description: The composed whole cell grows and peaks in biomass.
  measure:
    kind: observable
    expr: max(biomass)
  pass_if:
    op: threshold
    condition: '> 3.0 (5.108)'
  requires_simulation: the-living-atlas
- name: whole-cell-divides
  classification: behavioral
  description: The composed whole cell divides during the run.
  measure:
    kind: observable
    expr: max(cell_count)
  pass_if:
    op: threshold
    condition: ≥ 2 (at t ≈ 3.4)
  requires_simulation: the-living-atlas
- name: whole-cell-dies
  classification: behavioral
  description: A thermal shock drives viability toward zero and molecular debris accumulates.
  measure:
    kind: observable
    expr: min(viability) and last(debris)
  pass_if:
    op: threshold
    condition: viability < 0.1 AND debris > 1 (0.018 / 4.87)
  requires_simulation: the-living-atlas
runs:
- name: the-living-atlas
  composite: the-living-atlas
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes:
    ALL-EXECUTABLES-RUN:
      result: PASS
      detail: 12 / 12 executables rendered dynamics (measure_all.py)
    WHOLE-CELL-GROWS:
      result: PASS
      detail: peak biomass 5.108 > 3.0
    WHOLE-CELL-DIVIDES:
