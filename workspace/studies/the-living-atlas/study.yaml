behavior_tests:
- name: atp-synthase-charges
  classification: primary
  measure:
    kind: observable
    path: ports.chemical_out
    expr: last(ports.chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: fig07 F1Fo ATP synthase drives its chemical port ATP 0→100 (exec last=100.0)
  requires_simulation: the-living-atlas
- name: division-event
  classification: primary
  measure:
    kind: observable
    path: environ.cell_count
    expr: last(environ.cell_count)
  pass_if:
    op: '>='
    value: 1.5
    provenance: fig10-1 divides ONCE — one event, two daughters, cell_count 1→2 (exec last=2.0)
  requires_simulation: the-living-atlas
- name: fba-acetate-overflow
  classification: primary
  measure:
    kind: observable
    path: coarse.secretions
    expr: last(coarse.secretions)
  pass_if:
    op: '>='
    value: 5.0
    provenance: fig06 FBA handler secretes acetate overflow, secretions 0→30.45 (exec last=30.45)
  requires_simulation: the-living-atlas
- name: handler-divergence
  classification: diagnostic
  measure:
    kind: observable
    path: coarse.biomass
    expr: last(coarse.biomass)
  pass_if:
    op: '>='
    value: 5.0
    provenance: one fig06 interface, three handlers → THREE distinct endpoints (coarse 4.0 / kinetic 2.67
      / FBA 6.29); the FBA branch measured here clears 5.0
  description: 'Handler independence: the same interface yields three distinct trajectories, not one shared
    endpoint.'
  requires_simulation: the-living-atlas
