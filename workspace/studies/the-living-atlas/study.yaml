experiment: Wire the paper's recurring figure modules (thermal interface, cell↔environment uptake, viability-gated
  metabolism, viability monitor, and the division/disintegration rewrites) through shared cell and environment
  stores into one whole-cell composite, run it 20 steps through the engine, and — as the backing gallery —
  compile all twelve figure drafts to executables and run each to completion.
result: The composed whole cell lives a full life in one run — it grows (biomass 0.3 → peak ≈5.1), divides
  once into two daughters (cell_count 1 → 2 at t≈3.4), and dies after a thermal shock (temperature 37 →
  50 °C) collapses viability (1.0 → 0.018) and disintegration converts biomass to debris (0 → 4.87). Backing
  it, all twelve figure drafts compile to executables that run to completion (12/12). The figures'' mechanisms
  are modular and compose into one cell.
