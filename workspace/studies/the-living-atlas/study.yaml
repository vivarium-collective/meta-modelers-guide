title: The Living Atlas
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'Do all of the paper''s semantic figures actually compile to executables that run, and — the
  real test of composition — can the independently-authored figure mechanisms be assembled into a single
  whole cell that lives the paper''s full arc: grow, divide, and die?'
biological_summary: This is the payoff. The nine figure studies each showed one pattern compiling from
  draft to executable; this study shows the whole atlas running at once and, more importantly, composing.
  The gallery renders the dynamics of all twelve executables side by side — each compiled figure, actually
  moving. Then the figures are assembled into a single cell. It takes up nutrients and grows (biomass
  0.3 → 5.1); when its biomass crosses threshold it divides (cell_count → 2 at t ≈ 3.4); and when a thermal
  shock pushes its temperature to 50° — outside the viable band — it loses viability (→ 0.018), stops
  maintaining its boundary, and disintegrates into molecular debris (→ 4.87). The paper's arc — interface,
  coupling, metabolism, closure, division, disintegration — runs end to end in one composite. A cell,
  assembled from drafts, that lives and dies.
claim: 'The patterns compose: independently-specified interfaces and mechanisms can be assembled into
  one cell that lives the paper''s full arc.'
