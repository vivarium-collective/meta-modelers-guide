experiment: Compile all twelve of the paper's semantic figure drafts to executable composites and run
  each to completion through the engine, rendering their dynamics side by side as one gallery.
result: All twelve executables run to completion (12/12) — ATP synthase charges (fig07 0 → 100), fig10-1
  divides once into two daughters (cell_count 1 → 2), the fig06 FBA route overflows acetate (secretions
  0 → 30.45), and one fig06 interface drives three handlers to three distinct endpoints (coarse 4.0 / kinetic
  2.67 / FBA 6.29). The figures compile, run, and share an interface vocabulary.
