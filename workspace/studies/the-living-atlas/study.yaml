conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: The assembled whole-cell composite runs 20 steps to completion under all three metabolism selections (coarse/kinetic/fba) via scripts/run_wholecell.py.
  biological_validation:
    result: PASS
    basis: Behind one unchanged metabolism interface, the three Fig 6 mechanisms give three distinct whole-cell life histories (peak biomass 5.78 / 6.43 / 6.05, dividing at t≈3.0 / 2.1 / 2.7); in every case the cell grows, divides once (cell_count 1 → 2, mass-conserved), and dies when a scripted thermal shock (37 → 50 °C at t=12) collapses viability to 0.018 and disintegration turns biomass to debris — mechanism-swap (law 4) demonstrated at the whole-cell level.
  explanatory_gain:
    result: POSITIVE
    basis: Swapping coarse, saturating-kinetic, and real-COBRApy metabolisms behind one whole-cell interface — and watching the same cell live three distinct life histories while the interface never moves — carries the investigation's thesis from a single figure up to a composed cell.
conclusion: '## Claims

  - The thesis holds at the whole-cell level. The cell is ASSEMBLED BY HAND in the figures'' style (not compiled from the figure drafts), and behind ONE unchanged metabolism interface the Fig 6 mechanism is swappable: coarse (peak biomass 5.78, divides t≈3.0), saturating-kinetic (6.43, t≈2.1), and real COBRApy FBA (6.05, t≈2.7) — same cell, three mechanisms, three life histories. In every case the cell grows, divides once (cell_count 1 → 2, mass-conserved — the mother is halved), and dies when a SCRIPTED thermal shock (37 → 50 °C hard-coded at t=12) collapses viability to 0.018 and disintegration converts biomass to molecular debris (≈5.5–6.1).


  ## Evidence

  - **METABOLISM-SWAP-COARSE** — coarse metabolism: peak biomass 5.78, divides t≈3.0

  - **METABOLISM-SWAP-KINETIC** — saturating-kinetic metabolism: peak biomass 6.43, divides t≈2.1 (distinct)

  - **METABOLISM-SWAP-FBA** — real COBRApy FBA metabolism: peak biomass 6.05, divides t≈2.7

  - **CELL-DIVIDES** — the rewrite fires once: cell_count 1 → 2, mother halved (mass conserved)

  - **CELL-DIES** — scripted shock (37 → 50 °C at t=12) collapses viability 1.0 → 0.018; disintegration turns biomass to debris (≈5.5–6.1)


  ## Limitations

  - The whole cell is ASSEMBLED BY HAND in the figures'' style (wholecell.py), not emitted by the compiler from the figure drafts; it demonstrates that a Fig-6-style mechanism-swap holds at the whole-cell scale, not a calibrated whole-cell model.

  - The "grow" and "divide" behaviors are mechanism-driven and mechanism-dependent, but the "die" is a SCRIPTED thermal shock (hard-coded t=12), not an emergent failure. One deterministic run per metabolism.


  ## Next steps

  - Replace the scripted shock with an emergent viability failure (e.g. nutrient exhaustion), run replicate seeds and thermal schedules, and drive the whole cell toward calibration rather than illustration.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The assembled whole cell runs under all three metabolism selections.
    biological_validation: Mechanism-swap (law 4) is demonstrated at the whole-cell level, at the toy-real (uncalibrated) level; the metabolism interface is preserved across the three selections.
    pipeline_unblocks:
    - gallery
  if_primary_tests_fail:
    diagnose:
    - swapping the Fig 6 metabolism changes the whole cell's ports (the metabolism interface is not preserved across selections)
    - the assembled whole-cell composite fails to run to completion under one of the metabolism selections
    block_downstream: none — this is the terminal capstone; a failure blocks the investigation's mechanism-swap-at-whole-cell conclusion.
limitations:
- The whole cell is assembled by hand in the figures' style (wholecell.py); it is NOT compiled by the draft→executable compiler from the figure drafts. The study demonstrates that a Fig-6-style mechanism-swap holds at the whole-cell scale, not a calibrated whole-cell simulation.
- Division conserves mass (the mother is halved) but is symmetric and fires once; the death is a SCRIPTED thermal shock hard-coded at t=12, not an emergent failure.
- One deterministic run per metabolism selection (20 steps); behaviors are shown once per mechanism, not across replicate seeds or environments.
falsifiability: Overturned if swapping the Fig 6 metabolism (coarse/kinetic/fba) changes the whole cell's ports rather than only its trajectory, if the three metabolisms fail to produce three distinct life histories, if division fails to conserve mass (the mother is not halved), or if the assembled cell fails to run to completion under any metabolism selection.
