schema_version: 4
name: shape-dynamics
investigation: model-sourcing
title: Shape Dynamics
created: '2026-08-17'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Given the task's required capabilities ['cpm', 'cell_shape', 'morphology'], what is the right
