    ACETATE-SECRETED-AND-DIFFUSES:
      result: PASS
      detail: field-wide acetate 0 -> ~47.0 as the plume spreads
    NET-GLUCOSE-CONSUMED:
      result: PASS
      detail: field-wide glucose 5940.0 -> ~5908.4; local footprint drawdown up to ~18%
- name: single-cell-in-a-field-o2uncapped
  composite: single-cell-in-a-field-o2uncapped
  emitter: RAMEmitter
  id: single-cell-in-a-field-o2uncapped
  status: completed
  provenance: 'O2-uncapped mechanism control (foundational, not the scientific claim):
