      one interface neither framework was built with the other in mind for.
conclusion: '## Claims

  - A single cell reshapes the very nutrient gradient it depends on — niche construction

    (odling1996), realized spatially. Composing a real CPM cell with a real spatio-flux nutrient

    field through one typed coupling process (`CpmCellField`) reproduces the paper''s

    §Cell–environment coupling sense → metabolize → secrete loop (Fig 5) as genuine spatial

    metabolism — the loop closed (depletion → uptake feedback), with directed control (chemotaxis)

    the deferred half.

    Over 20 ticks the cell grows ~3.4x in CPM volume (32 -> 110 px, ~3% of a 60x60 lattice it does

    not come close to filling), depletes its own local glucose by up to ~18% before diffusion

    partially resupplies it (niche construction), and secretes a diffusing acetate plume from an

    O2-capped dynamic-FBA overflow mechanism.


  ## Evidence

  - **CELL-METABOLIZES-AND-GROWS** — biomass 0.1 -> ~0.37 via dynamic-FBA at the cell''s own

    footprint

  - **CPM-VOLUME-GROWS** — CPM lattice volume 32 -> 110 px (~3.4x), ~3% lattice coverage

  - **ACETATE-SECRETED-AND-DIFFUSES** — field-wide acetate 0 -> ~47.0 as the plume spreads

  - **NET-GLUCOSE-CONSUMED** — field-wide glucose 5940.0 -> ~5908.4; local footprint drawdown up

    to ~18%

  - **O2-CAP-FORCES-ACETATE-OVERFLOW** (foundational control) — O2-uncapped acetate 0 -> 0.0

    (exactly) vs capped 0 -> ~47.0: the overflow is caused by the O2 cap, shown by experiment

  - **FIELD-MASS-BALANCE-CLOSES** (foundational control) — glucose and acetate ledgers close to

    < 1e-6 (cell nets a glucose sink + acetate source; diffusion nets ~0)


  ## Limitations

  - e_coli_core constants (`glucose_km`, `glucose_vmax`, `oxygen_vmax`, `box_volume_L`,

    `grow_per_biomass`) are toy-real — plausible, hand-tuned magnitudes, not fitted to any

    organism or medium.

  - Chemotaxis toward the sensed field is deferred to a follow-up variant; the cell does not move

    directionally up-gradient in this composite. Its modest position drift is CPM thermal

    fluctuation, not directed motion.

  - Growth is roughly exponential in this coupling, so the run is deliberately bounded to

    ~20-25 ticks to stay spatially legible; a longer run was not attempted.

  - The metabolized field is exclusively the spatio-flux `fields` store; the CPM cell''s own

    internal lattice/world is a private, write-protected object inside viva-cpm''s Rust engine,

    not a process-bigraph store, and no other process reads or writes it.

  ## Next steps

  - Add directed chemotaxis (motion up the sensed gradient) as a variant of this composite.

  - Fan out to the next spatial counterpart, multi-cell competition over one shared field

    (`cell-cell-coupling`''s spatial analogue), reusing `CpmCellField` for each competing cell.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'single-cell-in-a-field.composite.json builds and runs to completion

      through the engine over 20 ticks.'
    biological_validation: The spatial §Cell–environment coupling sense → metabolize → secrete
      pattern (Fig 5) is demonstrated at the toy-real (uncalibrated) level, with genuine CPM shape
      dynamics and dynamic-FBA optimization behind the coupling rather than a scripted trajectory
      (directed control/chemotaxis remains the deferred half of the paper's loop).
    pipeline_unblocks:
    - cell-cell-coupling-spatial (planned; not yet built)
  if_primary_tests_fail:
    diagnose:
    - the cell's biomass or CPM volume never rises (metabolism or growth-coupling broken)
    - local footprint glucose never depletes despite consumption (mass-balance/clamp bug)
    - acetate never appears in the field (O2 cap not forcing overflow, or the secretion write
      is not reaching the shared field store)
    - net field-wide glucose does not fall (the cell is not acting as a genuine sink)
    block_downstream: 'the remaining 8 planned spatial-counterpart studies, all of which reuse
      CpmCellField or its coupling pattern'
limitations:
- e_coli_core constants (glucose_km, glucose_vmax, oxygen_vmax, box_volume_L, grow_per_biomass)
  are toy-real, hand-tuned magnitudes chosen for gradual, legible dynamics over a short run — not
  fitted to any organism or medium.
- Chemotaxis toward the external field is deferred to a follow-up variant; the flagship cell
  senses, metabolizes, grows, and secretes, but does not move directionally up-gradient.
- Growth is roughly exponential in this coupling, so the run is deliberately bounded to
  ~20-25 ticks to stay spatially legible.
- 'The metabolized nutrient field is exclusively the spatio-flux ``fields`` store; the CPM cell''s
  own internal lattice/world lives inside viva-cpm''s Rust engine as a private, write-protected
  object the coupling process owns, not a process-bigraph store — no other process in the
  composite reads or writes it, and viva-cpm''s own internal field concept
  (field_at_cell/secretory_types) is separate machinery this composite does not use.'
- Only one of the nine planned spatial-counterpart studies exists; see the investigation's own
  decisions_needed for the honest scope of what this investigation currently demonstrates.
falsifiability: Overturned if the cell's biomass or CPM lattice volume never rise over the run,
  if local footprint glucose never depletes despite ongoing consumption, if acetate never appears
  in the shared field (the O2 cap failing to force overflow, or the secretion write not reaching
  the field store), or if net field-wide glucose does not fall (the cell failing to act as a
  genuine sink on the shared field).
