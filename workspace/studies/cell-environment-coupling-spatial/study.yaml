    result: PASS
    basis: 'All four primary behavior tests pass on measured readouts from a real 20-tick run — the
      cell metabolizes and grows (biomass, CPM volume), depletes its own local nutrient before
      diffusion resupplies it (niche construction), and secretes a diffusing acetate plume — and
