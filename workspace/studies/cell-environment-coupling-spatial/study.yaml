- name: single-cell-in-a-field-mm
  composite: single-cell-in-a-field-mm
  emitter: RAMEmitter
  id: single-cell-in-a-field-mm
  status: completed
  provenance: 'Interface-substitutability twin (this investigation''s demonstration of the paper''s
    §2 / §Cellular interface central claim): meta_modelers_guide/composites/single-cell-in-a-field-mm.composite.json
    — identical to the flagship except the cell''s internal metabolism is swapped from dFBA to a
    lumped, cobra-free Michaelis–Menten metabolism (mechanism: mm) behind the byte-identical
    CpmCellField ports — run 20 ticks through the process-bigraph engine head-to-head with the dFBA
    flagship (tests/test_substitutability.py::test_interface_observables_substitutable and
