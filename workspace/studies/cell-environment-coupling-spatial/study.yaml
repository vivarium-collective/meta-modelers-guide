  params: {}
  outcomes:
    O2-CAP-FORCES-ACETATE-OVERFLOW:
      result: PASS
      detail: 'uncapped field-wide acetate 0 -> 0.0 (exactly) vs capped 0 -> ~47.0; uncapped
