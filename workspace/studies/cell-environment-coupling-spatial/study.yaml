schema_version: 4
name: cell-environment-coupling-spatial
investigation: the-cellular-interface-multicellular
title: Cell–Environment Coupling, Spatial (flagship)
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'When a single cell metabolizes at its own location, does it measurably reshape the very

  nutrient gradient it depends on — niche construction (odling1996) — closing the paper''s

  §Cell–environment coupling sense → metabolize → secrete loop (Fig 5) as real spatial

  metabolism: one cell sensing local glucose, running flux-balance analysis at its own footprint,

  growing, and secreting a byproduct that diffuses back into the field it senses? The paper

  frames this feedback loop as "the minimal structure required for control"; here the loop is

  genuinely closed (a real depletion → uptake feedback), while directed control — chemotaxis up

  the sensed gradient — is the deferred half. Mechanistically, the cell and its environment are

  two real, independently-built simulators (viva-cpm''s Cellular Potts engine, spatio-flux''s

  diffusion-advection and dynamic-FBA processes) composed through one typed coupling process

  (`CpmCellField`), rather than a scripted or lumped stand-in for that coupling.

  '
biological_summary: 'A cell does not merely inhabit its environment — it remakes it. Here one

  cell sits in a nutrient gradient, eats at its own location, and secretes a byproduct back into

  the field, measurably reshaping the very gradient it depends on: niche construction (odling1996),

  realized spatially. This is the paper''s §Cell–environment coupling sense → metabolize → secrete

  loop (Fig 5), and this investigation''s flagship. The paper frames this feedback loop as "the

  minimal structure required for control": here the loop is genuinely closed (a real

  depletion → uptake feedback), while directed control — chemotaxis up the sensed gradient — is a

  tracked, deferred half (see key_assumptions/limitations), so this cell senses, metabolizes,

  grows, and secretes, but does not yet act on what it senses. Mechanically it composes two real,

  independently-built simulators through one typed coupling process (`CpmCellField`): one CPM cell

  — a real Cellular Potts Model agent from viva-cpm, with genuine pixel-level shape, adhesion, and

  volume dynamics on a 60x60 lattice — with a shared spatio-flux `fields` grid (glucose, acetate)

  running `DiffusionAdvection`. `CpmCellField` is the entire interface between

  them: each tick it reads the mean glucose concentration at the cell''s current footprint (the

  set of lattice pixels the CPM cell occupies), solves one dynamic-FBA step against `e_coli_core`

  with Michaelis–Menten-limited glucose uptake (`glucose_km`, `glucose_vmax`) and a fixed

  oxygen cap (`oxygen_vmax`) — the O2 cap is what forces the optimizer into mixed-acid acetate

  overflow rather than pure aerobic respiration, matching the biological mechanism this coupling

  is meant to demonstrate. That causal claim is not left to the code: the O2-uncapped mechanism

  control (`o2-cap-forces-acetate-overflow` below) lifts the oxygen bound and shows acetate

  secretion collapses to ~0 while the capped flagship secretes a real plume, so the overflow is a

  demonstrated experiment rather than an assertion. The coupling then mass-balances the FBA

  solution against how much glucose the

  footprint actually holds (so the cell can never manufacture biomass or acetate from glucose it

  did not actually remove), grows the CPM cell''s target volume in proportion to the resulting

  biomass, and writes the clamped glucose uptake and acetate secretion back into the field as a

  spatial delta. spatio-flux''s own `DiffusionAdvection` then spreads both species outward: the

  depleted local glucose is partially resupplied from the field''s pre-set left-low-to-right-high

  gradient, and the secreted acetate forms an expanding plume.


  Measured on `single-cell-in-a-field` over 20 ticks (`tests/test_flagship_field.py`,

  `tests/test_cpm_cell_field.py`, `tests/test_cpm_viz.py`): the CPM cell grows from 32 to 110

  lattice pixels (about 3.4x), against a 60x60 = 3600-pixel lattice — roughly 3% coverage at the

  end, nowhere near filling the field. Local footprint glucose peaks at 1.15 (t=2, after diffusion

  briefly outpaces the cell''s own uptake) then falls to 0.94 by t=20, an up-to-~18% local

  drawdown as the cell''s own consumption outpaces the partial resupply diffusion provides. Field-wide,

  net glucose falls by about 32 units (5940 -> 5908, out of the field''s full 3600-pixel total

  mass) — a small fraction of the whole field, because only the cell''s own footprint and its

  immediate diffusive neighborhood are touched, which is exactly the local, footprint-scale niche

  construction the composite is built to show rather than a field-wide depletion event. Acetate,

  starting at zero everywhere, rises to a field-wide total of about 47 by t=20 as the secreted

  byproduct diffuses into a spreading plume. Biomass (the FBA-tracked internal state driving CPM

  growth) rises from 0.1 to about 0.37.

  '
claim: 'Composing a real CPM cell with a real spatio-flux nutrient field through one typed

  coupling process (`CpmCellField`) reproduces the paper''s §Cell–environment coupling

  sense → metabolize → secrete loop (Fig 5) as genuine spatial metabolism, not a scripted stand-in

  for it (the loop is closed; directed control/chemotaxis is deferred): over 20 ticks the

  cell runs dynamic-FBA at its own

  footprint (`e_coli_core`, O2-capped to force acetate overflow), grows ~3.4x in CPM volume (32

  -> 110 px, ~3% of a 60x60 lattice it does not come close to filling), depletes local glucose by

  up to ~18% before diffusion partially resupplies it (niche construction), and secretes a

  diffusing acetate plume — two independently-built simulators talking through one typed port.

  '
baseline:
- name: single-cell-in-a-field
  composite: meta_modelers_guide.composites.single-cell-in-a-field
  params: {}
variants:
- name: mm-mechanism
  composite: meta_modelers_guide.composites.single-cell-in-a-field-mm
  description: 'Interface-substitutability twin (this investigation''s demonstration of the paper''s

    central claim): the flagship with the cell''s INTERNAL metabolism swapped from constraint-based

    dynamic-FBA (cobra e_coli_core, O2-capped) to a lumped Michaelis–Menten / Monod metabolism

    (`mechanism: mm`, no cobra) BEHIND THE BYTE-IDENTICAL `CpmCellField` ports. Uptake

    v = mm_vmax·glc/(mm_km+glc); biomass gain mm_yield·v; acetate overflow mm_overflow·v — a fixed

    overflow fraction standing in for the dFBA''s O2-cap-driven mixed-acid overflow. The MM params

    (mm_vmax 4.0, mm_km 0.5, mm_yield 0.024, mm_overflow 1.4) are TUNED so the interface-level

    observables track the dFBA flagship; they are not derived from the dFBA solution.'
  params:
    mechanism: mm
    mm_vmax: 4.0
    mm_km: 0.5
    mm_yield: 0.024
    mm_overflow: 1.4
key_assumptions:
- 'e_coli_core constants (`glucose_km` 0.5, `glucose_vmax` 3.5, `oxygen_vmax` 2.5,

  `box_volume_L` 0.3, `grow_per_biomass` 300.0) are toy-real: plausible, hand-tuned magnitudes

  chosen to produce gradual, spatially-legible dynamics over a short (~20-25 tick) run, not

  fitted to a named organism, medium, or literature target.'
- 'The metabolized/diffused nutrient field is exclusively the spatio-flux `fields` store

  (glucose, acetate) that `CpmCellField` and `DiffusionAdvection` share. The CPM cell''s OWN

  internal lattice/world (its shape, occupied pixels, footprint) lives inside viva-cpm''s Rust

  engine as a private object the coupling process owns (`CpmCellField.world`) — it is not a

  process-bigraph store, and no other process in the composite reads or writes it. viva-cpm''s

  own internal field concept (`field_at_cell`, `secretory_types`, `receptor_coupling`) is

  separate machinery this composite does not use.'
- Growth is roughly exponential in this coupling (biomass compounds each tick), so the run is
  deliberately bounded to ~20-25 ticks — a longer run would need either a saturating growth term
  or a much larger field to stay spatially legible rather than filling the lattice.
- Chemotaxis toward the sensed field (directed up-gradient motion) is deferred to a follow-up
  variant; the flagship cell senses, metabolizes, grows, and secretes, but does not chemotax —
  its modest position drift over the run (roughly (17,17) seed to about (18.7, 30.3) by t=20) is
  CPM thermal fluctuation under the configured temperature, not directed motion.
behavior_tests:
- name: cell-metabolizes-and-grows
  classification: primary
  description: 'The cell runs dynamic-FBA at its own footprint and grows: biomass rises above its

    initial value and CPM volume exceeds 40 px by step 20.'
  measure:
    kind: observable
    path: obs.biomass
    expr: last(obs.biomass)
  pass_if:
    op: '>'
    value: 0.1
    provenance: 'over 20 ticks, biomass 0.1 -> ~0.37 (tests/test_flagship_field.py::test_flagship_sense_act_loop;
      tests/test_cpm_cell_field.py::test_cell_metabolizes_grows_and_reshapes_field asserts the
      same pattern on a smaller 40x40 grid over 12 ticks)'
  requires_simulation: single-cell-in-a-field
- name: cpm-volume-grows
  classification: primary
  description: The CPM cell's own target-volume-driven growth carries through to its actual
    lattice-pixel volume — the cell occupies more pixels by the end of the run.
  measure:
    kind: observable
    path: obs.volume
    expr: last(obs.volume)
  pass_if:
    op: '>'
    value: 40.0
    provenance: 'CPM volume 32 -> 110 px over 20 ticks (~3.4x), ~3% of the 60x60=3600px lattice
      (tests/test_flagship_field.py::test_flagship_sense_act_loop)'
  requires_simulation: single-cell-in-a-field
- name: acetate-secreted-and-diffuses
  classification: primary
  description: The cell secretes acetate into the shared field as a genuine byproduct of the
    O2-capped dFBA overflow mechanism, and it is present in the field (i.e. has diffused/spread)
    by the end of the run.
  measure:
    kind: observable
    path: fields.acetate
    expr: sum(fields.acetate)
  pass_if:
    op: '>'
    value: 0.0
    provenance: 'field-wide acetate 0 -> ~47.0 over 20 ticks, spreading into a plume around the
      cell''s footprint (tests/test_flagship_field.py::test_flagship_sense_act_loop; the plume
      is the third panel of the baked GIF)'
  requires_simulation: single-cell-in-a-field
- name: net-glucose-consumed
  classification: primary
  description: Net field-wide glucose falls over the run — the cell is a genuine sink on the
    shared field, not merely redistributing it.
  measure:
    kind: observable
    path: fields.glucose
    expr: sum(fields.glucose)
  pass_if:
    op: <
    value: 5940.0
    provenance: 'field-wide glucose total 5940.0 -> ~5908.4 over 20 ticks (~32 units net consumed);
      the local footprint drawdown is much sharper (up to ~18%) than the field-wide total because
      only the cell''s footprint and its immediate diffusive neighborhood are touched
      (tests/test_flagship_field.py::test_flagship_sense_act_loop)'
  requires_simulation: single-cell-in-a-field
- name: o2-cap-forces-acetate-overflow
  classification: diagnostic
  control: negative
  description: 'Foundational mechanism control (not this study''s scientific claim): the acetate
    the flagship secretes is CAUSED BY the O2 cap, not an artifact of the coupling. This runs a
    second composite (`single-cell-in-a-field-o2uncapped`) identical to the flagship except the
    oxygen bound is lifted (`oxygen_vmax` 2.5 -> 1000, EX_o2_e effectively unbounded). With
    respiration no longer capacity-limited, unconstrained e_coli_core takes pure aerobic
    respiration as growth-optimal and EX_ac_e sits at 0 — so the cell secretes ~0 acetate (and
    grows faster: biomass ~2.35 vs the capped ~0.37), while the capped flagship secretes a real
    plume. This turns the study''s overflow claim ("the O2 cap is what forces the optimizer into
    mixed-acid overflow") from a code assertion into a demonstrated experiment. The flagship
    was built first and, unlike the later studies, had no such foundational control until this
    pass; this is it.'
  measure:
    kind: observable
    path: fields.acetate
    expr: sum(fields.acetate) with oxygen uncapped vs capped
  pass_if:
    op: approx_equal
    value: 0.0
    provenance: 'field-wide acetate over 20 ticks: capped flagship 0 -> ~47.0, O2-uncapped 0 -> 0.0
      (exactly), a >100x collapse; uncapped biomass ~2.35 vs capped ~0.37 (the cell respires fully
      instead of overflowing) (tests/test_flagship_field.py::test_o2_cap_is_what_forces_acetate_overflow;
      composite meta_modelers_guide/composites/single-cell-in-a-field-o2uncapped.composite.json)'
  requires_simulation: single-cell-in-a-field-o2uncapped
- name: field-mass-balance-closes
  classification: diagnostic
  control: positive
  description: 'Foundational conservation control (not this study''s scientific claim): the paper
    frames conservation laws (mass, energy balance) as interface constraints on any coupling. This
    runs the flagship composite through a closed per-species ledger — for glucose and acetate,
    initial_field_mass + Σ(every writer''s own reported net exchange) == final_field_mass — where
    the writer''s reported delta and what actually accumulates in the shared grid travel through two
    independent code paths (the process''s per-tick arithmetic vs process-bigraph''s additive
    `apply` for a `map[array]` port), so a clamp that manufactures mass, a double-write, or a
    schema `apply` that concatenates instead of sums surfaces as a nonzero residual. The ledger
    also shows the cell nets a glucose sink and an acetate source while DiffusionAdvection under
    Neumann BC nets ~0.'
  measure:
    kind: observable
    path: fields.glucose, fields.acetate
    expr: abs(final_mass - (initial_mass + Σ writer_net_exchange)) per species
  pass_if:
    op: <
    value: 1.0e-06
    provenance: 'both glucose and acetate ledgers close to < 1e-6 over 15 ticks; cell net glucose
      < 0 (sink) and net acetate > 0 (source), diff net ~0 for both
      (tests/test_mass_balance.py::test_flagship_field_mass_balance_closes;
      meta_modelers_guide/analysis/mass_balance.py)'
  requires_simulation: single-cell-in-a-field
- name: interface-substitutable-across-mechanisms
  classification: primary
  description: 'The paper''s central thesis, run: two DIFFERENT internal metabolisms — constraint-based

    dynamic-FBA (cobra e_coli_core, O2-capped) and a lumped, cobra-free Michaelis–Menten / Monod

    metabolism (`single-cell-in-a-field-mm`) — realize the SAME coarse-grained cell↔field interface

    behind the byte-identical `CpmCellField` ports. Tuned to preserve the interaction variables, the

    MM twin''s interface-level observables (final biomass, total acetate secreted, CPM volume, net

    glucose depletion) agree with the dFBA flagship within ~10% (all four within a 30% tolerance).'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose
    expr: per-observable abs(dFBA - MM) / dFBA over a 20-tick run
  pass_if:
    op: <
    value: 0.30
    provenance: 'over 20 ticks (tests/test_substitutability.py::test_interface_observables_substitutable):
      biomass dFBA 0.370 vs MM 0.342 (7.5%), CPM volume 110 vs 99 (10%), field-wide acetate 47.02 vs
      47.02 (~0%), net glucose depleted 31.6 vs 33.6 (6.2%) — every interface observable within ~10%;
      the MM path also runs with NO cobra (test_mm_mechanism_runs_without_cobra), the substitutability
      payoff. MM params (mm_vmax 4.0, mm_km 0.5, mm_yield 0.024, mm_overflow 1.4) were tuned to match,
      not derived from the dFBA solution.'
  requires_simulation: single-cell-in-a-field-mm
