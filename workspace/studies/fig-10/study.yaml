schema_version: 4
name: fig-10
investigation: paper-figures
title: Development
created: '2026-08-26'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional
question: 'Is the paper''s §Development figure (Fig development) executable -- can a runnable
  process-bigraph composite demonstrate, under test, that development is "a hierarchical
  reorganization where individual cells become part of a collective composite" rather than
  merely more cells? Concretely: does running the `fig10-emergence` composite turn a set of
  free motile bacteria (top-level place-graph siblings) into a nested biofilm microcolony that
  then secretes an extracellular matrix -- surface attachment, ECM secretion, growth of a
  structured community (caption a) realized as a genuine runtime place-graph rewrite (caption b)?

  '
biological_summary: 'This study is the runnable, toy-real backing for the paper''s §Development
  figure (Fig development). The paper argues that once self-maintaining cellular interfaces exist,
  "cellular interfaces can become coupled strongly enough to sustain a collective one": cells
  joined through adhesion, signaling, and shared extracellular stores form structures such as
  biofilms "in which individual interfaces become embedded in a collective interface with its own
  shared state and constraints." Development, the paper stresses, "is not only repeated growth and
  division but a coordinated change in the space of possible couplings" -- a hierarchical
  reorganization, not just population growth.

  The `fig10-emergence` composite makes exactly that claim executable. Its state is an environment
  `tree[node]` holding a surface and four free motile bacteria as top-level siblings (each with
  biomass and a `motile` marker). A single `BiofilmEmergence` process fires two event-driven
  place-graph rewrites over a 16-step run: at `attach_at = 6` an ATTACHMENT + AGGREGATION rewrite
  moves all four free cells out of the top level and re-parents them as children of a NEW `biofilm`
  collective node (switching them sessile); at `mature_at = 12` a MATURATION rewrite has the
  sessile community secrete `ecm_count = 3` extracellular-matrix nodes inside the biofilm. The run
  is deterministic (no RNG), so every count and timing below is an exact regression pin, reproduced
  run to run.

  The measured trajectory reads directly as caption a''s "surface attachment, ECM secretion, growth
  of structured communities" and caption b''s "hierarchical reorganization where individual cells
  become part of a collective composite": four free planktonic cells hold dispersed through t=5,
  then at t=6 all four attach at once (free count 4 -> 0, biofilm-nested count 0 -> 4) as the
  biofilm collective node appears; the cells'' place-graph depth jumps from 1 (direct children of
  env) to 2 (children of the biofilm), and they never return to the top level. ECM stays absent
  until maturation and then accumulates 1 -> 2 -> 3 nodes over t=12..14, only ever while the sessile
  community is present. The planktonic -> sessile -> matured arc is the figure''s dynamics panel.

  Two companion place-graph rewrites, exercised by the same fig-10 test suite, round out the paper''s
  §Growth/division/development/evolution section that this figure sits in. A cell-cycle rewrite
  (`build_fig10_division`) segregates a single chromosome (1 -> 2) and then divides one cell into two
  daughters that each keep exactly one chromosome carrying its DNA -- a true partition, not a copy --
  and keeps dividing 1 -> 2 -> 4 -> 8 under a capacity cap. A collectives rewrite
  (`build_fig10_biofilm`, `build_fig10_evolution`) grows a biofilm to carrying capacity then secretes
  ECM, and evolves a population in which a mutant lineage arises and sweeps the wildtype to
  extinction within a bounded population. Together these demonstrate the figure''s core claim at the
  level of running topology: development and its neighbors (division, collective formation, evolution)
  are compositional rewrites that change the place graph itself.

  These composites are deliberately DIDACTIC / toy-real: small, illustrative place graphs built to
  look like the figure and play forward through the process-bigraph engine, NOT calibrated to any
  biofilm, adhesion energetics, or ECM secretion literature. The rigorous spatial cousin -- a real
  CPM/metabolism realization of growth into a structured community -- is `development-and-evolution`
  in the `draft-to-living-cell` investigation; this study does not restate its numbers.

  '
claim: 'The paper''s §Development figure (Fig development) is executable, not merely drawn: running
  the `fig10-emergence` composite performs a genuine runtime place-graph rewrite that turns four free
  motile bacteria (top-level siblings) into a nested biofilm microcolony that then secretes an
  extracellular matrix -- "individual cells become part of a collective composite" (caption b) via
  "surface attachment, ECM secretion, growth of structured communities" (caption a). Over a
  deterministic 16-step run: all four free cells attach at once at t=6 (free 4 -> 0, biofilm-nested
  0 -> 4) as a new `biofilm` collective node appears and the cells'' place-graph depth increases from
  1 to 2 and never reverts; ECM is absent until maturation and then accumulates to 3 nodes over
  t=12..14, only while the sessile community exists. This is a hierarchical reorganization -- a
  re-parenting into a collective with its own shared state -- not merely more cells. Two companion
  rewrites exercised by the same suite (cell-cycle division 1 -> 2 -> 4 -> 8 with true chromosome
  partition; biofilm-to-capacity + ECM, and a mutant lineage sweeping a wildtype population) confirm
  the same principle across the section''s neighboring transformations. The composites are toy-real
  and uncalibrated; the calibrated spatial cousin is `development-and-evolution` in
  `draft-to-living-cell`.

  '
baseline:
- name: fig10-emergence
  composite: meta_modelers_guide.composites.fig10-emergence
  params: {}
variants: []
key_assumptions:
- 'These fig-10 composites are DIDACTIC / toy-real: small, illustrative place graphs built to look
  like the figure and play forward through the process-bigraph engine, NOT calibrated to biofilm,
  adhesion, or ECM-secretion literature. `attach_at` (6.0), `mature_at` (12.0), `ecm_count` (3.0),
  the four founding cells, and the division/biofilm/evolution capacities are hand-picked, unitless
  model-time and count values chosen to make attach -> mature -> ECM legible within a short run.'
- 'Development is realized here as an EVENT-DRIVEN place-graph rewrite, not emergent self-assembly:
  the `BiofilmEmergence` process fires ATTACHMENT+AGGREGATION at a scheduled tick and MATURATION at
  a later scheduled tick. The timings are scripted (config `attach_at`/`mature_at`); what the
  composite demonstrates is the STRUCTURE of the reorganization (free siblings -> nested collective
  -> matrix-encased community), not an emergent decision about when to attach.'
- 'The `fig10-emergence` run is deterministic -- there is no RNG in the attachment, aggregation, or
  maturation rewrites -- so every count and timing (attach at t=6, ECM 1/2/3 at t=12/13/14, final
  4 nested cells + 3 ECM) is an exact regression pin, reproduced byte-for-byte run to run, valid
  while the composite config is pinned.'
- 'Attachment is modeled as a hierarchical RE-PARENTING (the four cells leave the top level and
  become children of a new `biofilm` node), and cell identity/biomass is carried across; it is a
  topological reorganization of the place graph, not a physical/spatial aggregation with adhesion
  forces or diffusing signals. Signaling, morphogen gradients, and differentiation from the paper''s
  broader §Development discussion are NOT modeled here.'
- 'The companion cell-cycle (`build_fig10_division`) and collectives (`build_fig10_biofilm`,
  `build_fig10_evolution`) rewrites exercised by the same test suite are likewise toy-real,
  scheduled rewrites (division at a cycle interval, biofilm growth every N ticks to a capacity,
  a mutation scheduled at a fixed tick that then sweeps) -- illustrative topology dynamics, not
  fitted growth, secretion, or selection rates.'
acceptance_criteria:
- Before attachment, the four founding cells are free planktonic top-level siblings of the
  environment and no `biofilm` collective node exists.
- 'Running the composite performs a genuine place-graph rewrite: at attachment all free cells leave
  the top level at once (free count -> 0) and become nested children of a new `biofilm` collective
  node (nested count -> all founders), and the cells never return to the top level -- a hierarchical
  reorganization (place-graph depth 1 -> 2), not relabelling or duplication.'
- The extracellular matrix appears only AFTER maturation (strictly after attachment) and only ever
  while the sessile community is present -- ECM secreted by a matured collective, not by free cells.
- 'The companion cell-cycle rewrite genuinely partitions structure: a chromosome segregates 1 -> 2,
  then a cell divides into two daughters that each keep exactly one chromosome carrying its DNA, and
  the colony keeps dividing (2 -> 4 -> 8) under a capacity bound.'
- 'The companion collectives rewrites reorganize topology under bounds: a biofilm colonizes to
  carrying capacity then secretes ECM, and a mutant lineage arises and sweeps the wildtype to
  extinction within a bounded population.'
units_and_time:
  time: 1 step = 1 unit of dimensionless model time (interval = 1.0); the baseline run is 16 such
    steps (17 emitted frames, t=0..16).
  quantities: 'cell / ECM / chromosome / organism / mutant counts are integer place-graph node
    counts, not physical mass or cell numbers; biomass and dna values are dimensionless model
    quantities. attach_at (6.0), mature_at (12.0), ecm_count (3.0), and the companion cycle/grow
    intervals and capacities carry no calibrated physical unit.'
  note: No quantity here is calibrated to a named organism, biofilm, adhesion energetics, or
    ECM-secretion literature target.
behavior_tests:
- name: free-cells-attach-into-a-nested-biofilm
  classification: primary
  description: Running the composite rewrites the place graph so that all four free planktonic
    (top-level) cells attach at once into a single nested biofilm microcolony -- caption a's
    "surface attachment" and caption b's cells becoming "part of a collective composite," conserving
    the cells (free -> 0 exactly as nested -> all).
  measure:
    kind: observable
    path: env
    expr: (#free top-level cells, #biofilm-nested cells) over the run
  pass_if:
    op: '=='
    kind: regression_pin
    deterministic_pin: true
    value: free[0]==4, free[-1]==0, max(nested)==4, at the attach step free==0 and nested==4
    provenance: 'prior: a dispersed population of free cells attaches and aggregates into one nested
      community, conserving cell count (free -> 0 as nested -> all). Observed on the deterministic run:
      free 4 through t=5, then 4 -> 0 at t=6 while a biofilm node appears holding all 4 nested cells;
      free stays 0 thereafter. Exact counts are regression pins, valid while the composite config is
      pinned (deterministic, no RNG)
      (tests/test_fig10_dynamics.py::test_free_cells_attach_into_a_nested_biofilm)'
  requires_simulation: fig10-emergence
- name: attachment-nests-cells-one-level-deeper
  classification: primary
  description: The fig 10b principle itself -- biofilm formation is a HIERARCHICAL REORGANIZATION,
    not merely more cells. The cells' place-graph depth jumps from 1 (free top-level siblings of env)
    to 2 (children of a NEW `biofilm` collective node that did not exist before), a genuine
    re-parenting that is never undone.
  measure:
    kind: derived
    path: env
    expr: place-graph depth of the cell nodes, and presence of the `biofilm` collective node, per frame
  pass_if:
    op: depth_increases_and_persists
    kind: acceptance_criterion
    deterministic_pin: true
    value: depth 1 -> 2 at attach; no `biofilm` node before attach, present after; no cell left at top
      level once nested
    provenance: 'prior: development embeds individual cells in a collective composite with its own
      shared state -- a depth-increasing re-parenting, not relabelling. Observed: at t=0 the four cells
      are direct children of env (depth 1) and no `biofilm` key exists; a `biofilm` collective node
      appears exactly at t=6 with all four cells nested inside it (depth 2), and depth stays 2 with
      zero top-level cells for the rest of the run. Deterministic; exact tick is a pin, the depth
      1 -> 2 re-parenting is the a-priori prediction
      (tests/test_fig10_dynamics.py::test_attachment_nests_cells_one_level_deeper)'
  requires_simulation: fig10-emergence
- name: ecm-secreted-only-after-maturation
  classification: primary
  description: The matured sessile community secretes an extracellular matrix -- caption a's "ECM
    secretion" -- strictly AFTER attachment, and ECM only ever exists while the nested community is
    present (secreted by a collective, never by free cells).
  measure:
    kind: observable
    path: env
    expr: (#biofilm-nested cells, #ecm nodes) over the run
  pass_if:
    op: '=='
    kind: regression_pin
    deterministic_pin: true
    value: ecm[0]==0, first ECM at t=12 (> attach t=6), ecm rises 1->2->3 by t=14, ECM>0 only while
      nested>0
    provenance: 'prior: ECM appears only after maturation (strictly after attachment) and only while
      the sessile community exists. Observed: ECM 0 through t=11, then 1 at t=12, 2 at t=13, 3 at t=14,
      holding at 3; every ECM-bearing frame has 4 nested cells. Deterministic pins; the
      strictly-after-attachment ordering is the a-priori prediction
      (tests/test_fig10_dynamics.py::test_ecm_appears_only_after_maturation)'
  requires_simulation: fig10-emergence
- name: division-rewrites-and-partitions-the-place-graph
  classification: primary
  description: 'Companion cell-cycle rewrite (same section, Fig division): running the composite makes
    the place graph change over engine steps -- a chromosome segregates 1 -> 2 while still one cell,
    then the cell divides into two daughters that each keep exactly one chromosome carrying its DNA
    (a true partition, not a copy), and the colony keeps dividing 1 -> 2 -> 4 -> 8 under a capacity cap.'
  measure:
    kind: observable
    path: colony
    expr: cell-count and chromosome-count trajectories, and per-daughter chromosome/DNA after division
  pass_if:
    op: '=='
    kind: regression_pin
    deterministic_pin: true
    value: cells 1 -> 2 (chrom 1 -> 2 -> 2, seg-before-div), each daughter has 1 chromosome with dna==1.0;
      longer run reaches >=4 cells (1 -> 2 -> 4 -> 8); capacity caps the colony
    provenance: 'prior: division is a compositional rewrite that partitions state (DNA/biomass) into two
      daughters, each re-establishing a viable interface. Observed on the deterministic build: chromosome
      segregates 1 -> 2 while still one cell, then divides to 2 cells holding 2 chromosomes total (not 4),
      each daughter one chromosome with dna==1.0; a 20-step run reaches 4 then 8 cells; capacity=4 caps at 4
      (tests/test_fig10_rewrite.py::test_chromosome_segregates_before_division,
      tests/test_fig10_rewrite.py::test_each_daughter_keeps_one_chromosome_with_dna,
      tests/test_fig10_rewrite.py::test_keeps_dividing_when_run_longer,
      tests/test_fig10_rewrite.py::test_capacity_caps_the_colony)'
  requires_simulation: fig10-cell-cycle
- name: collectives-colonize-and-a-lineage-sweeps
  classification: primary
  description: 'Companion collectives rewrites (same section, Fig development b and Fig evolution): a
    biofilm colonizes to carrying capacity then secretes ECM (never before it is full), and a mutant
    lineage arises and sweeps the wildtype to extinction within a bounded population -- topology
    reorganizing under bounds, the higher-scale echo of the biofilm emergence.'
  measure:
    kind: observable
    path: biofilm / population
    expr: biofilm cell-count and ecm-count over the run; wildtype vs mutant counts over the run
  pass_if:
    op: '=='
    kind: regression_pin
    deterministic_pin: true
    value: biofilm grows 1 -> 5 (monotone) then ECM appears only at 5 cells; mutant arises, sweeps to
      >=2 with wildtype -> 0, total population <= capacity 6
    provenance: 'prior: cellular interfaces couple into a collective one that grows to capacity and
      matures, and selection lets a mutant lineage replace the wildtype. Observed on the deterministic
      builds: biofilm cells 1 -> 5 (grow_every=2, capacity=5), ECM only once 5 cells reached (1 -> 2 -> 3);
      evolution wildtype 1 -> 2 -> ...-> 0 while mutant arises at t=4 and sweeps to 3, total <= 6
      (tests/test_fig10_topology.py::test_biofilm_colonizes_to_capacity,
      tests/test_fig10_topology.py::test_biofilm_secretes_ecm_after_maturing,
      tests/test_fig10_topology.py::test_evolution_mutant_arises_then_sweeps,
      tests/test_fig10_topology.py::test_evolution_total_population_bounded)'
  requires_simulation: fig10-collectives
