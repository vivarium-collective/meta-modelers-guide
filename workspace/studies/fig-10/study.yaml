result: 'Over a deterministic 16-step run, the four free motile bacteria hold as top-level place-graph
  siblings through t=5, then at t=6 all four attach at once (free 4 -> 0, biofilm-nested 0 -> 4) as a new
  `biofilm` collective node appears and the cells'' place-graph depth increases from 1 to 2 and never
  reverts -- caption b''s "hierarchical reorganization where individual cells become part of a collective
  composite." The matured community then secretes an extracellular matrix strictly after attachment (ECM
  0 through t=11, then 1/2/3 at t=12/13/14, only while the nested community is present) -- caption a''s
  "surface attachment, ECM secretion, growth of structured communities." Every count and timing is exact
  and reproduces run to run (no RNG). The companion rewrites confirm the same principle across the
  section: a chromosome segregates 1 -> 2 then a cell divides into two daughters that each keep one
  chromosome with its DNA (true partition), continuing 1 -> 2 -> 4 -> 8 under a capacity cap; a biofilm
  colonizes to capacity 5 then secretes ECM; and a mutant lineage arises and sweeps the wildtype to
  extinction within a bounded population. The §Development figure is executable, not merely drawn. The
  composites are toy-real and uncalibrated; the calibrated spatial cousin is `development-and-evolution`
  in the `draft-to-living-cell` investigation.

