schema_version: 4
name: fig-10
title: Development
kind: theoretical
purpose:
  mechanism: 'Multicellular development as biofilm emergence from free motile bacteria,
    modelled as a runtime place-graph rewrite. Initial state: an environment holding
    a surface and N free motile bacteria (top-level siblings, motile). Processes:
    a BiofilmEmergence process fires two update rules — ATTACHMENT & AGGREGATION
    (the motile bacteria leave the top level and become children of a new biofilm
    node, switching to sessile) and MATURATION (the sessile community secretes ECM
    matrix nodes inside the biofilm). Running it reorganizes the place graph:
    dispersed free cells → a nested microcolony → a matrix-encased biofilm.'
