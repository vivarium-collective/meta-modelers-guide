conclusion: '## Claims

  - The paper''s §Development figure (Fig development) is executable: running the `fig10-emergence`
    composite performs a genuine runtime place-graph rewrite that turns four free motile bacteria
    (top-level siblings) into a nested biofilm microcolony (attach at t=6: free 4 -> 0, nested 0 -> 4,
    a new biofilm collective node, cell depth 1 -> 2 and never reverting) that then secretes an
    extracellular matrix (ECM 0 -> 1 -> 2 -> 3 over t=12..14, only while the sessile community exists).
    This is caption b''s "hierarchical reorganization where individual cells become part of a
    collective composite" via caption a''s "surface attachment, ECM secretion, growth of structured
    communities" -- a re-parenting into a collective, not merely more cells. Deterministic, exact,
    reproduced run to run.

  - The same principle holds across the section''s companion figures, exercised by the same fig-10
    suite: a cell-cycle rewrite segregates a chromosome (1 -> 2) then divides a cell into two daughters
    that each keep one chromosome with its DNA (true partition), continuing 1 -> 2 -> 4 -> 8 under a
    capacity cap; a collectives rewrite grows a biofilm to capacity then secretes ECM, and evolves a
    population in which a mutant lineage sweeps the wildtype to extinction within a bound. Development,
    division, collective formation, and evolution are all compositional rewrites of the place graph.


  ## Evidence

  - **FREE-CELLS-ATTACH-INTO-A-NESTED-BIOFILM** -- free 4 -> 0 at t=6, biofilm node holds all 4 nested

  - **ATTACHMENT-NESTS-CELLS-ONE-LEVEL-DEEPER** -- cell place-graph depth 1 -> 2 at t=6, new collective
    node, never reverts

  - **ECM-SECRETED-ONLY-AFTER-MATURATION** -- ECM 0 through t=11, then 1/2/3 at t=12/13/14, only while
    nested cells present

  - **DIVISION-REWRITES-AND-PARTITIONS-THE-PLACE-GRAPH** -- chrom 1 -> 2 then 2 daughters each 1
    chromosome dna==1.0, 1 -> 2 -> 4 -> 8, capacity caps

  - **COLLECTIVES-COLONIZE-AND-A-LINEAGE-SWEEPS** -- biofilm 1 -> 5 then ECM; mutant arises, sweeps
    wildtype -> 0 within capacity 6


  ## Limitations

  - Toy-real and uncalibrated: attach_at, mature_at, ecm_count, founder count, and the companion
    capacities are hand-picked unitless model-time/count values, not fitted to any biofilm, adhesion,
    or ECM-secretion data. The rigorous spatial cousin is `development-and-evolution` in the
    `draft-to-living-cell` investigation.

  - The rewrites are event-driven at SCHEDULED ticks -- the composite demonstrates the STRUCTURE of the
    reorganization, not an emergent decision about when to attach or mature.

  - Attachment is a topological re-parenting, not a physical/spatial aggregation; adhesion forces,
    diffusing signals, morphogen gradients, and differentiation from the paper''s broader §Development
    discussion are not modeled.


  ## Next steps

  - Compare against the spatial cousin `development-and-evolution` to contrast the toy-real place-graph
    rewrite with a calibrated CPM/metabolism realization of growth into a structured community.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig10-emergence.composite.json and the companion division/biofilm/evolution
      builds run to completion through the engine over deterministic runs.'
    biological_validation: The §Development figure''s "hierarchical reorganization where individual
      cells become part of a collective composite" is demonstrated at the toy-real level as a genuine
      place-graph rewrite (free siblings -> nested biofilm -> matrix-encased community), with companion
      division, biofilm, and evolution rewrites confirming the same principle across the section.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - free cells never leave the top level or no biofilm node appears (the ATTACHMENT+AGGREGATION
      rewrite did not fire, or attach_at is beyond the run length)
    - ECM appears before or without attachment (the MATURATION rewrite is mis-ordered or ECM is
      secreted outside the collective)
    - cell depth does not increase 1 -> 2, or cells are copied rather than re-parented (the rewrite
      duplicates instead of moving nodes)
    - a daughter loses its chromosome/DNA, or the colony fails to keep dividing / exceeds capacity
      (the division partition or capacity cap is broken)
    - the mutant lineage fails to arise or sweep, or the population exceeds capacity (the evolution
      rewrite or its bound is broken)
    block_downstream: []
limitations:
- 'These fig-10 composites are didactic / toy-real: small, illustrative place graphs built to look
  like the figure and play forward through the engine, NOT calibrated to biofilm, adhesion, or
  ECM-secretion literature. attach_at (6.0), mature_at (12.0), ecm_count (3.0), the four founding
  cells, and the companion capacities are hand-picked unitless model-time/count values chosen to make
  the attach -> mature -> ECM arc legible within a short run.'
- 'The rigorous spatial cousin is `development-and-evolution` in the `draft-to-living-cell`
  investigation -- a calibrated CPM/metabolism realization of growth into a structured community. This
  study does not restate that cousin''s numbers as its own.'
- 'Development is realized as an event-driven place-graph rewrite fired at SCHEDULED ticks
  (config attach_at / mature_at), not emergent self-assembly: the composite demonstrates the STRUCTURE
  of the reorganization (free siblings -> nested collective -> matrix-encased community), not an
  emergent decision about when to attach or mature.'
- Attachment is a hierarchical re-parenting of the place graph (cells leave the top level and become
  children of a new biofilm node), not a physical/spatial aggregation with adhesion forces or diffusing
  signals. Signaling, morphogen gradients, and differentiation from the paper''s broader §Development
  discussion are not modeled here.
- The companion cell-cycle, biofilm, and evolution rewrites exercised by the same suite are likewise
  toy-real scheduled rewrites (division at a cycle interval, biofilm growth every N ticks to a capacity,
  a mutation scheduled at a fixed tick that then sweeps) -- illustrative topology dynamics, not fitted
  growth, secretion, or selection rates.
falsifiability: Overturned if running the composite does not move all free cells out of the top level
  into a single nested biofilm node at attachment, if the cells' place-graph depth does not increase
  from 1 to 2 (or reverts), if the biofilm collective node is not newly created at attachment, if ECM
  appears before or without maturation or outside the collective, if any of these counts or timings
  fail to reproduce across repeated runs of the pinned deterministic composite, or if the companion
  division/biofilm/evolution rewrites fail to partition, colonize-then-secrete, or sweep within their
  bounds.
