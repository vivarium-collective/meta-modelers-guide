schema_version: 4
name: evolve
investigation: draft-to-living-cell
title: Evolve
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can evolution (Fig 10) be modelled compositionally — variation and selection acting on a population,
  and, crucially, the *addition of a new interface port* to a lineage — so that the interface set itself
  changes over evolutionary time?
biological_summary: 'The last rewrite is the slowest one: evolution. Fig 10-3 models a population of cell
  variants under selection — the population grows under selection (cell_ecoli.cell_count 1 → 3.4) — and
  adds the move that makes evolution more than parameter drift: a variant lineage
  acquires a *new interface port*, a new capability emerging from 0 to ≈ 0.57 (cell_O157.new_port). This is the compositional signature of innovation:
  the interface alphabet itself is extended, not merely re-valued. A cell that has a port its ancestors
  lacked can couple to its environment in a way they could not.'
claim: Evolution is a composition that rewrites itself over time — variants compete, selection acts, and
  a lineage can acquire an entirely new interface port.
baseline:
- name: evolution-rewrite
  composite: viva_meta_modelers_guide.composites.fig10-3-rewrite
  params: {}
- name: evolution
  composite: viva_meta_modelers_guide.composites.fig10-3-evolution
  params: {}
variants: []
behavior_tests:
- name: capability-emerges
  classification: primary
  measure:
    kind: observable
    path: new_port
    expr: last(new_port)
  pass_if:
    op: '>='
    value: 0.3
    provenance: a new interface capability emerges on a variant (exec new_port last≈0.57)
  requires_simulation: evolve
- name: population-grows
  classification: primary
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 2.0
    provenance: the population grows under selection (exec cell_ecoli.cell_count last≈3.4)
  requires_simulation: evolve
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: new_port
    expr: last(new_port)
  pass_if:
    op: '>='
    value: 0.3
    provenance: draft/knockout run collapses — new_port stays 0 (no mechanism / no closure)
  control: negative
  description: 'Negative control: the inert/knockout draft MUST fail this.'
  requires_simulation: evolve
runs:
- name: evolve
  composite: evolve
  emitter: RAMEmitter
  id: evolve
  status: completed
  provenance: scripts/render_study_evidence.py — fig10-3-executable compiled from the Fig 10-3 draft, run
    to completion through the engine.
  params: {}
  outcomes:
    POPULATION-GROWS:
      result: PASS
      detail: cell_ecoli.cell_count 1 → 3.4 under selection
    NEW-CAPABILITY:
      result: PASS
      detail: cell_O157.new_port 0 → 0.57 — a new interface capability on a variant
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The population grows under selection. Confirmed: cell_ecoli.cell_count 1 → 3.4 over the
    run.'
  evidence:
    from_test: population-grows
    from_run: evolve
    observed: cell_ecoli.cell_count 1 → 3.4
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'A variant lineage acquires a new interface port under selection. Confirmed: cell_O157.new_port
    0 → 0.57.'
  evidence:
    from_test: capability-emerges
    from_run: evolve
    observed: cell_O157.new_port 0 → 0.57
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'The interface alphabet itself is extended — the winning lineage carries a port its ancestors
    lacked. Confirmed: new_port 0 → 0.57.'
  evidence:
    from_test: new-capability
    from_run: evolve
    observed: new_port 0 → 0.57
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Population-grows and capability-emerges pass on measured readouts; the inert/knockout draft leaves new_port at 0, isolating the mechanism.
  explanatory_gain:
    result: POSITIVE
    basis: Letting a lineage gain a new port under selection makes "the interface alphabet itself changes over time" observable, not just asserted.
conclusion: '## Claims

  - Under selection the population grows (cell_ecoli.cell_count 1→3.4) and a variant lineage acquires
  a new interface port (cell_O157.new_port 0→0.57). Selection as a compositional rewrite of the population
  that extends the interface alphabet itself.


  ## Evidence

  - **POPULATION-GROWS** — cell_ecoli.cell_count 1 → 3.4 under selection

  - **NEW-CAPABILITY** — cell_O157.new_port 0 → 0.57 on a variant


  ## Limitations

  - Toy-real selection: the population growth and new-port emergence are real in shape, but selection coefficients and timing are illustrative.


  ## Next steps

  - Introduce multiple competing new ports to test selection over a richer interface-innovation space.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - the-living-atlas
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Two-variant competition with a single new port; real evolution explores a combinatorial space of interface changes not sampled here.
- Selection coefficients and mutation timing are illustrative, not inferred from a measured fitness landscape.
falsifiability: Overturned if the population fails to grow or if the new interface port never emerges in the winning lineage (new_port stays at 0).
