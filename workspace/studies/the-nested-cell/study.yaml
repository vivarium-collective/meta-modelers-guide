conclusion: '## Claims

  - At the deepest grain, the F1Fo ATP synthase mechanism (PMF-driven rotary catalysis) compiles from its
  Fig 7 draft and synthesizes ATP on its chemical output port (chemical_out 0→100). One scale up, the six-level
  nested place graph carries a central-dogma cascade with metabolism feeding it: nutrients are taken up (→2.4),
  metabolites produced (→1.5) and energy accumulates (→0.84), while transcription–translation adds a small
  mRNA (→0.18) and protein (→0.008) pool. The interface is preserved from the lone molecular machine up to
  the deepest leaf — the nested ribosomal complex stays present (≈0.50).


  ## Evidence

  - **ATP-SYNTHESIZED** — chemical_out (ATP synthesized) 0→100 (F1Fo ATP synthase, deepest molecular grain)

  - **CASCADE-POPULATES** — nutrients→2.4, metabolites→1.5, energy→0.84

  - **EXPRESSION-FLOWS** — mRNA→0.18, protein→0.008

  - **INTERFACE-PRESERVED** — ribosomal complex ≈0.50 at the deepest leaf; transport flux→0.3


  ## Limitations

  - The ATP-synthase executable exposes a single moving observable (chemical_out 0→100); the multi-channel
  transduction described in the Fig 7 draft is not exercised here. The expression cascade is toy-real: the
  observables rise from zero to illustrative levels; the rate constants are not fitted to a measured transcriptome/proteome.


  ## Next steps

  - Wire the ATP synthesized at the molecular grain into the cytoplasmic energy pool so the molecular mechanism
  drives the cascade quantitatively, and add feedback (protein regulating its own gene) to test interface
  preservation under closed-loop control across depths.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure drafts compile to executables that run.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; the
      molecular mechanism drives its chemical output and structural interface preservation holds through the nesting.
    pipeline_unblocks:
    - the-living-atlas
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- The ATP-synthase executable exposes a single moving observable (ATP on chemical_out 0→100); the four-channel
  (chemical/electrical/mechanical/thermal) transduction of the Fig 7 draft is described but not measured, and
  the magnitude is illustrative, not calibrated to a specific turnover rate.
- One gene-expression cascade at illustrative rate constants; degradation and synthesis rates are not fitted to a measured transcriptome/proteome.
- Nesting depth (six levels) is structural; the study tests interface preservation through depth, not compartment-specific transport physics.
falsifiability: Overturned if the compiled ATP-synthase executable fails to synthesize ATP on its chemical
  output port (chemical_out stays at seed), if compilation drops or renames a port at any nesting level (the
  deepest leaf goes undriven), or if the cascade fails to reach a degradation-balanced steady state (unbounded ramp).
