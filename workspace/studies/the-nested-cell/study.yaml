behavior_tests:
- name: atp-synthesized
  classification: primary
  description: 'The F1Fo ATP synthase mechanism at the deepest grain drives its chemical output port: ATP
    synthesized rises from 0 to 100 over the run (exec fig07-executable, ports.chemical_out).'
  measure:
    kind: observable
    path: chemical_out
    expr: last(chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: exec last≈100 — F1Fo ATP synthase (ATP synthesized on chemical_out 0→100, exec fig07-executable)
  requires_simulation: the-nested-cell
- name: metabolites-produced
  classification: primary
