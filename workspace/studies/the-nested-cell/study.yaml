experiment: Build the Fig 8 six-level place graph (ECM → membrane → cytoplasm → nucleus → chromosome →
  nucleosome) and wire a transcription–translation cascade through it.
result: The cascade populates — nutrients→2.4, metabolites→1.5, energy→0.84, with a small mRNA (→0.18)
  and protein (→0.008) pool — and the interface is preserved at the deepest leaf (ribosomal complex ≈0.50).
