schema_version: 4
name: the-nested-cell
investigation: draft-to-living-cell
title: The Nested Cell
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How do molecules compose into a cell? Can the Fig 8 molecular composition be authored as a deeply
  nested place graph — membrane, cytoplasm, nucleus, chromosome, chromatin, nucleosome — with a gene-expression
  cascade wired to its deepest leaves, and does compilation preserve the interface even six levels down?
biological_summary: 'Fig 8 is the inside view: a cell as a hierarchy of compartments, each containing
  the next. The place graph nests six levels deep — extracellular matrix outside the membrane, cytoplasm
  within, nucleus within that, then chromosome, chromatin, and finally the nucleosome that holds the DNA.
  Wired through this structure is the central dogma cascade: DNA is transcribed to mRNA (→ 2.4), mRNA is
  translated to protein (→ 10.5), and metabolism feeds the cascade (metabolite pool climbing to ≈ 20),
  each species settling to a degradation-balanced steady state in the right time order — mRNA fast, protein
  lagging, metabolite slowest. The compiler must preserve every port at every depth: the cascade is driven
  all the way down to the deepest leaf, nucleosome.DNA, proving the interface survives six levels of nesting.'
claim: Molecular composition is a nested containment hierarchy, and an interface can be preserved even
  when it is wired to the deepest levels of that nesting.
baseline:
- name: nested-hierarchy
  composite: viva_meta_modelers_guide.composites.fig08-nested-hierarchy
  params: {}
variants: []
behavior_tests:
- name: protein-expressed
  classification: primary
  measure:
    kind: observable
    path: protein
    expr: last(protein)
  pass_if:
    op: '>='
    value: 3.0
    provenance: central dogma expresses protein (exec last≈10.5)
  requires_simulation: protein-expressed
- name: mrna-transcribed
  classification: primary
  measure:
    kind: observable
    path: mrna
    expr: last(mrna)
  pass_if:
    op: '>='
    value: 0.5
    provenance: gene transcribed to mRNA (exec last≈2.4)
  requires_simulation: mrna-transcribed
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: protein
    expr: last(protein)
  pass_if:
    op: '>='
    value: 3.0
    provenance: inert-draft run stays at seed (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: the-nested-cell
  composite: the-nested-cell
  emitter: RAMEmitter
  id: the-nested-cell
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    STEADY-STATES:
      result: PASS
      detail: mRNA≈2.4, protein≈10.5, metabolite≈20 (steady)
    TIME-HIERARCHY:
      result: PASS
      detail: mRNA fast, protein lags, metabolite slowest
    CASCADE-FLOWS:
      result: PASS
      detail: all four levels populated
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Each species reaches a degradation-balanced steady state (not a ramp). Confirmed: mRNA≈2.4,
    protein≈10.5, metabolite≈20 (steady).'
  evidence:
    from_test: steady-states
    from_run: the-nested-cell
    observed: mRNA≈2.4, protein≈10.5, metabolite≈20 (steady)
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cascade shows the transcription-before-translation delay. Confirmed: mRNA fast, protein
    lags, metabolite slowest.'
  evidence:
    from_test: time-hierarchy
    from_run: the-nested-cell
    observed: mRNA fast, protein lags, metabolite slowest
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'Expression flows gene→mRNA→protein→metabolite. Confirmed: all four levels populated.'
  evidence:
    from_test: cascade-flows
    from_run: the-nested-cell
    observed: all four levels populated
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Steady-states, time-hierarchy, and cascade-flows all pass; the inert draft stays at seed, isolating the wired cascade as the cause.
  explanatory_gain:
    result: POSITIVE
    basis: Driving a central-dogma cascade through a six-level place graph makes deep interface-preservation observable at the leaf.
conclusion: '## Claims

  - The six-level nested place graph carries a central-dogma cascade WITH degradation that reaches steady
  states in the correct time hierarchy — mRNA settles fast (≈2.4), protein lags (≈10.5), metabolite slowest
  (≈20) — the transcription-before-translation ordering.


  ## Evidence

  - **STEADY-STATES** — mRNA≈2.4, protein≈10.5, metabolite≈20 (steady)

  - **TIME-HIERARCHY** — mRNA fast, protein lags, metabolite slowest

  - **CASCADE-FLOWS** — all four levels populated

  - **conservation** — time hierarchy: mRNA settles fast, protein lags — mRNA_ss≈2.40, protein_ss≈10.48


  ## Limitations

  - Toy-real expression cascade: species reach real degradation-balanced steady states, but the rate constants are illustrative.


  ## Next steps

  - Add feedback (protein regulating its own gene) to test interface preservation under closed-loop control across depths.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - self-made
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- One gene-expression cascade at illustrative rate constants; degradation and synthesis rates are not fitted to a measured transcriptome/proteome.
- Nesting depth (six levels) is structural; the study tests interface preservation through depth, not compartment-specific transport physics.
falsifiability: Overturned if compilation drops or renames a port at any nesting level (the deepest leaf goes undriven), or if the cascade fails to reach a degradation-balanced steady state (unbounded ramp).
