experiment: Compile the Fig 7 F1Fo ATP-synthase draft to an executable and run it to completion, reading
  its chemical output port; then build the Fig 8 six-level place graph (ECM → membrane → cytoplasm → nucleus
  → chromosome → nucleosome), wire a transcription–translation cascade through it, and run that to completion.
result: The molecular mechanism synthesizes ATP — chemical_out rises 0→100 — and, one scale up, the cascade
  populates — nutrients→2.4, metabolites→1.5, energy→0.84, with a small mRNA (→0.18) and protein (→0.008)
  pool — while the interface is preserved from the molecular grain up to the deepest leaf (ribosomal complex
  ≈0.50). The inert draft, with no mechanism, stays at seed.
