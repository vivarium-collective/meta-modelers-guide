  control: negative
  description: 'One-line sanity check (NOT the study''s control): the inert draft has empty updates by
    construction, so it stays at seed and fails this threshold by design — confirming the framework''s
    definition of a draft, not a scientific counterfactual.'
  requires_simulation: the-nested-cell
