schema_version: 4
name: the-nested-cell
investigation: draft-to-living-cell
title: The Nested Cell
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How do molecules compose into a cell? Can the Fig 8 molecular composition be authored as a deeply
  nested place graph — membrane, cytoplasm, nucleus, chromosome, chromatin, nucleosome — with a gene-expression
  cascade wired to its deepest leaves, and does compilation preserve the interface even six levels down?
biological_summary: 'Fig 8 is the inside view: a cell as a hierarchy of compartments, each containing
  the next. The place graph nests six levels deep — extracellular matrix outside the membrane, cytoplasm
  within, nucleus within that, then chromosome, chromatin, and finally the nucleosome that holds the DNA.
  Wired through this structure is the central dogma cascade: DNA is transcribed to RNA (rna → 1.41), RNA
  is translated to protein (proteins → 0.52), ribosomes assemble (0.5 → 0.63), and metabolism feeds it
  (nutrients → 2.4, energy → 0.84) across the membrane transport port (0.3). The compiler must preserve
  every port at every depth: the deepest leaf, nucleosome.DNA, rises from 1.0 to 1.4, proving the interface
  survives the deepest nesting.'
claim: Molecular composition is a nested containment hierarchy, and an interface can be preserved even
  when it is wired to the deepest levels of that nesting.
baseline:
- name: nested-hierarchy
  composite: viva_meta_modelers_guide.composites.fig08-nested-hierarchy
  params: {}
variants: []
behavior_tests:
- name: protein-expressed
  classification: primary
  measure:
    kind: observable
    path: protein
    expr: last(protein)
  pass_if:
    op: '>='
    value: 3.0
    provenance: central dogma expresses protein (exec last≈10.5)
  requires_simulation: protein-expressed
- name: mrna-transcribed
  classification: primary
  measure:
    kind: observable
    path: mrna
    expr: last(mrna)
  pass_if:
    op: '>='
    value: 0.5
    provenance: gene transcribed to mRNA (exec last≈2.4)
  requires_simulation: mrna-transcribed
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: protein
    expr: last(protein)
  pass_if:
    op: '>='
    value: 3.0
    provenance: inert-draft run stays at seed (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: the-nested-cell
  composite: the-nested-cell
  emitter: RAMEmitter
  id: the-nested-cell
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    STEADY-STATES:
      result: PASS
      detail: mRNA≈2.4, protein≈10.5, metabolite≈20 (steady)
    TIME-HIERARCHY:
      result: PASS
      detail: mRNA fast, protein lags, metabolite slowest
    CASCADE-FLOWS:
      result: PASS
      detail: all four levels populated
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Each species reaches a degradation-balanced steady state (not a ramp). Confirmed: mRNA≈2.4,
    protein≈10.5, metabolite≈20 (steady).'
  evidence:
    from_test: steady-states
    from_run: the-nested-cell
    observed: mRNA≈2.4, protein≈10.5, metabolite≈20 (steady)
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cascade shows the transcription-before-translation delay. Confirmed: mRNA fast, protein
    lags, metabolite slowest.'
  evidence:
    from_test: time-hierarchy
    from_run: the-nested-cell
    observed: mRNA fast, protein lags, metabolite slowest
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'Expression flows gene→mRNA→protein→metabolite. Confirmed: all four levels populated.'
  evidence:
    from_test: cascade-flows
    from_run: the-nested-cell
