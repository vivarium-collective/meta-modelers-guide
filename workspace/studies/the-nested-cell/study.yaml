schema_version: 4
name: the-nested-cell
investigation: draft-to-living-cell
title: The Nested Cell
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How do molecules compose into a cell? Can the Fig 8 molecular composition be authored as a deeply
  nested place graph — membrane, cytoplasm, nucleus, chromosome, chromatin, nucleosome — with a gene-expression
  cascade wired to its deepest leaves, and does compilation preserve the interface even six levels down?
hypothesis: Compiling the Fig 8 nested-hierarchy draft wires an expression cascade (DNA→RNA→protein) to
  a six-level-deep place graph and runs it, with the deepest leaf (nucleosome.DNA) changing over time
  and every port preserved — the strongest test of interface preservation under nesting (law 2).
objective: Run the Fig 8 executable and measure the expression cascade at several depths, confirming ordered
  DNA→RNA→protein flow and a live deepest leaf.
biological_summary: 'Fig 8 is the inside view: a cell as a hierarchy of compartments, each containing
  the next. The place graph nests six levels deep — extracellular matrix outside the membrane, cytoplasm
  within, nucleus within that, then chromosome, chromatin, and finally the nucleosome that holds the DNA.
  Wired through this structure is the central dogma cascade: DNA is transcribed to RNA (rna → 1.41), RNA
  is translated to protein (proteins → 0.52), ribosomes assemble (0.5 → 0.63), and metabolism feeds it
  (nutrients → 2.4, energy → 0.84) across the membrane transport port (0.3). The compiler must preserve
  every port at every depth: the deepest leaf, nucleosome.DNA, rises from 1.0 to 1.4, proving the interface
  survives the deepest nesting.'
claim: A six-level nested place graph (ECM→membrane→cytoplasm→nucleus→chromosome→nucleosome) carries a
  coupled expression cascade — DNA (1.0→1.4) → RNA (→1.41) → protein (→0.52) — with the interface preserved
  at the deepest leaf (law 2).
baseline:
- name: nested-hierarchy
  composite: viva_meta_modelers_guide.composites.fig08-nested-hierarchy
  params: {}
variants: []
expected_behavior:
- Expression flows DNA→RNA→protein, all rising.
- The six-level-deep DNA leaf changes over the run.
- Matter crosses the membrane boundary.
behavior_tests:
- name: cascade-flows
  classification: behavioral
  description: The gene-expression cascade produces RNA and protein.
  measure:
    kind: observable
    expr: last(cytoplasm.rna) and last(cytoplasm.proteins)
  pass_if:
    op: threshold
    condition: both > 0 (1.41 / 0.52)
  requires_simulation: the-nested-cell
- name: deepest-leaf-live
  classification: structural
  description: The deepest leaf (nucleosome.DNA, six levels down) is wired and changes — interface preserved
    at depth.
  measure:
    kind: observable
    expr: last(...nucleosome.DNA) vs first
  pass_if:
    op: threshold
    condition: '> first (1.4 > 1.0)'
  requires_simulation: the-nested-cell
- name: transport-active
  classification: behavioral
  description: Matter crosses the membrane boundary via the transport port.
  measure:
    kind: observable
    expr: last(membrane.transport_flux)
  pass_if:
    op: threshold
    condition: '> 0'
  requires_simulation: the-nested-cell
runs:
- name: the-nested-cell
  composite: the-nested-cell
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes:
    CASCADE-FLOWS:
      result: PASS
      detail: rna->1.41, proteins->0.518 (both > 0)
    DEEPEST-LEAF-LIVE:
      result: PASS
      detail: nucleosome.DNA 1.0->1.4 (6 levels deep)
    TRANSPORT-ACTIVE:
      result: PASS
      detail: last(membrane.transport_flux) = 0.3 > 0
  id: the-nested-cell
  status: completed
findings:
- id: F-01
  kind: biological
  tier: observation
  status: confirms
  statement: 'The gene-expression cascade produces RNA and protein. Confirmed: rna->1.41, proteins->0.518
    (both > 0).'
  evidence:
    from_test: cascade-flows
    from_run: the-nested-cell
    observed: rna->1.41, proteins->0.518 (both > 0)
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The deepest leaf (nucleosome.DNA, six levels down) is wired and changes — interface preserved
    at depth. Confirmed: nucleosome.DNA 1.0->1.4 (6 levels deep).'
  evidence:
    from_test: deepest-leaf-live
    from_run: the-nested-cell
    observed: nucleosome.DNA 1.0->1.4 (6 levels deep)
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'Matter crosses the membrane boundary via the transport port. Confirmed: last(membrane.transport_flux)
    = 0.3 > 0.'
  evidence:
    from_test: transport-active
    from_run: the-nested-cell
    observed: last(membrane.transport_flux) = 0.3 > 0
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Every behavior test passes against real measured readouts; the study demonstrates the paper's
      pattern qualitatively (toy-real, uncalibrated).
  explanatory_gain:
    result: POSITIVE
    basis: The draft->executable compilation makes the paper's interface-preservation claim mechanical
      and observable for this figure.
conclusion: '## Claims

  - A six-level nested place graph (ECM→membrane→cytoplasm→nucleus→chromosome→nucleosome) carries a coupled
  expression cascade — DNA (1.0→1.4) → RNA (→1.41) → protein (→0.52) — with the interface preserved at
  the deepest leaf (law 2).


  ## Evidence

  - **CASCADE-FLOWS** — rna->1.41, proteins->0.518 (both > 0)

  - **DEEPEST-LEAF-LIVE** — nucleosome.DNA 1.0->1.4 (6 levels deep)

  - **TRANSPORT-ACTIVE** — last(membrane.transport_flux) = 0.3 > 0


  ## Limitations

  - Toy-real, not calibrated: the handler uses plausible constants, not fitted parameters, so the run
  demonstrates the *pattern*, not a validated quantity.

  - A single mechanism/handler per draft; alternative handlers are out of scope here (except the Fig 6
  study, which is *about* alternative handlers).


  ## Next steps

  - Calibrate the handler against literature values to move from pattern-demonstration toward quantitative
  validation.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - molecular-channels
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Uncalibrated toy-real constants — demonstrates the compositional pattern, not a quantitatively validated
  cell.
- Deterministic single run per mechanism; no multi-seed replication (the dynamics here are deterministic
  given the handler).
falsifiability: The claim is overturned if the compiled executable fails to preserve the draft's interface
  (a port renamed or a wire dropped by compilation), or if the handler produces no non-trivial dynamics
  on the declared ports.
