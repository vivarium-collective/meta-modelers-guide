schema_version: 4
name: the-nested-cell
investigation: draft-to-living-cell
title: From Molecules to the Nested Cell
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: How do molecules compose into a cell? At the deepest grain a single molecular machine — F1Fo ATP
  synthase (Fig 7) — is compiled from its draft and run as a PMF-driven rotary catalyst that synthesizes
  ATP on its chemical output port. That mechanism sits at the bottom of the Fig 8 nested cell — a deeply
  nested place graph (membrane, cytoplasm, nucleus, chromosome, chromatin, nucleosome) with a gene-expression
  cascade wired to its deepest leaves. Does compilation preserve every interface, from the lone molecular
  mechanism up through six levels of nesting?
biological_summary: 'From molecules to the nested cell. At the deepest grain sits a single molecular mechanism:
  F1Fo ATP synthase (Fig 7), the rotary machine that couples the proton-motive force across the membrane
  to phosphorylation of ADP. Compiled from its draft and run to completion, it synthesizes ATP — its chemical
  output port (ports.chemical_out) rises from 0 to 100 — proving the molecular grain is executable, not
  merely illustrated. Fig 8 is the inside view one scale up: a cell as a hierarchy of compartments, each
  containing the next. The place graph nests six levels deep — extracellular matrix outside the membrane,
  cytoplasm within, nucleus within that, then chromosome, chromatin, and finally the nucleosome that holds
  the DNA. Wired through this structure is the central dogma cascade: DNA is transcribed to mRNA (→ 0.18),
  mRNA is translated to a small protein pool (→ 0.008), while metabolism feeds the cascade — nutrients taken
  up (→ 2.4), metabolites produced (→ 1.5), energy accumulating (→ 0.84) — each observable rising from zero
  to its own level. The molecular mechanism at the base feeds the cascade above it, and the compiler must
  preserve every port at every depth: the interface is carried all the way down to the deepest leaf, the
  ribosomal complex nested six levels in (present at ≈ 0.50), proving it survives from the lone molecular
  machine up through six levels of nesting.'
claim: A molecular mechanism (F1Fo ATP synthase) sits at the deepest grain and feeds a gene-expression cascade
  nested across six place-graph levels; each interface is preserved, from the lone molecular machine up to
  the deepest leaf of the nesting.
