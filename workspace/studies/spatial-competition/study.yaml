schema_version: 4
name: spatial-competition
investigation: model-sourcing
title: Spatial Competition
created: '2026-08-17'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Given the task's required capabilities ['spatial', 'dfba', 'diffusion'], what is the right way
  to source the model — reuse, compose, or build-new — and does the sourcing audit confirm it?
biological_summary: Two populations compete for a shared, diffusing nutrient across space — spatial dynamic
  flux-balance.
claim: The right sourcing for this task is to reuse spatio-flux.
requires:
- spatial
- dfba
- diffusion
sourcing:
  decision: reuse
  modules:
  - spatio-flux
  rationale: spatio-flux does spatial dFBA competition
  audit:
    gate: pass
    axes:
      source_fit: within_tol
      reinvention: within_tol
      novelty_justified: within_tol
      survey_recorded: within_tol
    catches_if_wrong: a non-spatial module → `source_fit` mismatch.
baseline:
- name: spatio-flux
  module: spatio-flux
  domain: spatial dFBA metabolism
  params: {}
variants: []
behavior_tests:
- name: sourcing-fit
  classification: primary
  description: The chosen module(s)' capabilities cover the task's required capabilities.
  measure:
    kind: audit-axis
    path: sourcing.source_fit
  pass_if:
    op: ==
    value: within_tol
    provenance: module_sourcing.build_sourcing_report -> source_fit=within_tol
- name: no-reinvention
  classification: primary
  description: Did not build-new where a catalogued module already fits.
  measure:
    kind: audit-axis
    path: sourcing.reinvention
  pass_if:
    op: ==
    value: within_tol
    provenance: module_sourcing -> reinvention=within_tol
runs:
- name: spatial-competition
  module: spatio-flux
  status: error
  provenance: 'scripts/model_sourcing_demo.py — run err: TypeError (composite needs module-specific param
    wiring)'
  outcomes:
    SOURCING-GATE:
      result: PASS
      detail: gate=pass; source_fit=within_tol
conclusion: The sourcing audit graded this task **PASS**. Chosen sourcing (reuse spatio-flux) covers the
  required capabilities; the decision is audited (real run is a follow-up).
falsifiability: The sourcing call is overturned if the audit's source_fit/reinvention axes disagree with
  the capability-subset match against the catalog.
visualizations: []
