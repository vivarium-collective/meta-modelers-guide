conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Mass-conserved, distinct-kinetics, and interface-preserved pass across all three handlers; the over-reach control (biomass ≥ 6.0) correctly fails against the 5.0 cap.
  explanatory_gain:
    result: POSITIVE
    basis: Swapping lumped-yield, kinetic, and real-COBRApy handlers behind one fixed interface makes mechanism-independence concrete and measurable.
conclusion: '## Claims

  - One metabolism interface, three handlers (first-order, Michaelis–Menten, real COBRApy LP) as a CLOSED-LOOP
  batch: all converge to the SAME final biomass (yield·S₀ = 5.0, mass conserved) but with three DISTINCT
  kinetic signatures — substrate exhausted at t≈4.0 / 8.6 / 10.2. Same interface, conserved mass, different
  dynamics.


  ## Evidence

  - **MASS-CONSERVED** — coarse/kinetic/FBA all → biomass 5.0

  - **DISTINCT-KINETICS** — t≈4.0 (1st-order) / 8.6 (MM knee) / 10.2 (FBA cap)

  - **INTERFACE-PRESERVED** — nutrients ⇒ biomass, one interface (law 4)

  - **conservation** — all three converge to biomass = yield·S₀ = 5.0 (mass conserved); coarse/MM/FBA
  differ in timescale, not endpoint


  ## Limitations

  - Toy-real metabolism: mass is conserved to yield·S₀ and the kinetic shapes are real, but the FBA network and constants are illustrative.


  ## Next steps

  - Replace the toy FBA network with a genome-scale reconstruction to test the same interface at realistic scale.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - molecular-channels
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Three mechanisms share one toy metabolic setup; the FBA handler uses a small illustrative network, not a genome-scale reconstruction.
- Endpoints are fixed by the shared yield·S₀ budget, so the study tests kinetic shape and interface identity, not absolute biomass accuracy.
falsifiability: Overturned if any handler drives final biomass past the yield·S₀ = 5.0 mass-conservation cap (mass creation), or if the three mechanisms fail to expose a byte-identical nutrients ⇒ biomass port set.
