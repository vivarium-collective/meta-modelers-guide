schema_version: 4
name: one-interface-three-mechanisms
investigation: draft-to-living-cell
title: One Interface, Three Mechanisms
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can a single metabolism interface — the ports nutrients ⇒ {biomass, energy, entropy, secretions}
  of Fig 6 — be realized by three genuinely different mechanisms (a lumped-yield process, a saturating-kinetic
  process, and a real flux-balance optimization via COBRApy) while every other part of the composite,
  and the interface itself, stays byte-for-byte the same?
hypothesis: Installing three different handlers on the one Fig 6 metabolism signature yields three executables
  that all emit the same port set (biomass/energy/entropy/secretions) but with mechanism-specific trajectories
  — coarse highest, kinetic lowest, FBA in between — demonstrating that mechanism is swappable behind
  a preserved interface (compiler law 4, handler independence).
objective: Compile the Fig 6 disintegration/metabolism draft under three handler environments (coarse,
  kinetic, fba), run all three, and compare their biomass trajectories over an identical interface.
biological_summary: 'Fig 6 is the paper''s thesis in a single figure. When a cellular description fails,
  the right level of description drops from the cell to its molecules — but the *interface* that couples
  metabolism to the rest of the cell need not change. This study realizes that one interface three ways.
  The coarse handler applies a lumped yield: nutrients convert to biomass at a fixed stoichiometry (biomass
  → 4.0). The kinetic handler applies a saturating (Michaelis–Menten-like) rate, so the same nutrients
  build biomass more slowly (→ 2.67). The FBA handler calls real COBRApy to solve a flux-balance optimization
  on a small metabolic network each step (→ 3.2). All three write the identical ports; a reader can watch
  the mechanism change underneath a boundary that does not move.'
claim: One metabolism interface (nutrients ⇒ biomass, energy, entropy, secretions) is realized by THREE
  independent handlers — coarse (biomass 4.0), saturating-kinetic (2.67), and real COBRApy FBA (3.2) —
  with no change to the rest of the composite (handler independence, law 4).
baseline:
- name: disintegration
  composite: viva_meta_modelers_guide.composites.fig06-disintegration
  params: {}
variants: []
expected_behavior:
- Every handler converts nutrients into biomass.
- The three handlers give measurably different biomass.
- All three emit the same port set over the same wiring.
behavior_tests:
- name: all-produce-biomass
  classification: behavioral
  description: Each of the three handlers produces positive biomass.
  measure:
    kind: observable
    expr: last(coarse.biomass) for coarse, kinetic, fba
  pass_if:
    op: threshold
    condition: all > 0 (4.0 / 2.67 / 3.2)
  requires_simulation: one-interface-three-mechanisms
- name: mechanisms-differ
  classification: behavioral
  description: The three biomass endpoints are meaningfully spread, not identical.
  measure:
    kind: observable
    expr: max-min of {coarse, kinetic, fba} last biomass
  pass_if:
    op: threshold
    condition: '> 1.0'
  requires_simulation: one-interface-three-mechanisms
- name: interface-preserved
  classification: structural
  description: All three executables expose the identical port set (biomass, energy, entropy, secretions)
    over the identical wiring (compiler law 2/4).
  measure:
    kind: observable
    expr: port-set equality across the three compiled composites
  pass_if:
    op: threshold
    condition: identical
  requires_simulation: one-interface-three-mechanisms
