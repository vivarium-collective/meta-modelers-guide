experiment: Install three different handlers behind the same nutrients ⇒ biomass interface and run each
  as a closed-loop batch that consumes its own substrate.
result: All three conserve mass to the same final biomass but with distinct kinetic signatures — the interface
  stays fixed while the mechanism behind it is swapped freely.
