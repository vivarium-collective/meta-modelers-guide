experiment: Install three different handlers behind the same nutrients ⇒ biomass interface and run each to
  completion; also compile an impostor handler to test that the port contract is enforced.
result: The three handlers produce three DISTINCT trajectories (biomass 4.0 / 2.667 / 6.29) while exposing
  the identical port set; the FBA handler shows acetate overflow (secretions 30.4), and an impostor that breaks
  the interface is rejected at compile time.
