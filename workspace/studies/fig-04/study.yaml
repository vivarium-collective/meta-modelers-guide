findings:
- id: F-01
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The paper''s §Cell-environment coupling figure is executable: a runnable composite closes the caption''s control loop as measured simulation output. A real diffusing nutrient gradient sensed at interior grid index 4 drives the cell''s interface ports — uptake is linear in the local sensed field (4× field ⇒ 4× uptake; per-step uptake tracks the sensed field at correlation 1.0), and a flat zero field gives zero drive on every port, establishing the field as the causal driver. Deterministic (no RNG), so every value reproduces run-to-run.'
  evidence:
    from_test: uptake-tracks-the-local-sensed-field
    from_run: fig04-runnable
    observed: uptake linear in field (ratio 4.0 at 0.8 vs 0.2); per-step uptake↔local-field corr == 1.0; zero field ⇒ zero uptake/traction/drift/mass-gain
  provenance:
    run_ids:
    - fig04-runnable
- id: F-02
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The loop closes and its ledger balances: the cell writes its uptake back into the shared environment store (cumulative uptake_flux 0.0 → 0.864305, monotone), grows mass monotonically (1.0 → 1.432152), and drifts up-gradient (index 4.0 → 4.196, chemotaxis). The mass↔uptake ledger closes exactly — Δmass 0.432152 == 0.5 × cumulative uptake booked to the environment — so no biomass appears that the shared env store did not account for. The sense→act loop runs through a shared store exactly as panel b diagrams.'
  evidence:
    from_test: control-loop-closes-through-shared-store
    from_run: fig04-runnable
    observed: cum uptake_flux 0.0 → 0.864305; Δmass 0.432152 == 0.5 × 0.864305; mass 1.0 → 1.432152; location 4.0 → 4.195695 (+0.196 up-gradient)
  provenance:
    run_ids:
    - fig04-runnable
- id: F-03
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The loop''s environmental-modification leg is measurable: the cell draws down the very gradient it climbs. The local chemical field the cell senses at its grid index falls from 0.5 at the start to 0.2407 by the end of the 24-tick run -- a net drawdown driven by diffusion smoothing the seeded 0->1 gradient and by the cell''s own uptake removing mass at its footprint. Yet per-step uptake still tracks that falling local field at correlation 1.0 throughout, so the coupling holds even as the driver relaxes. This is the half of the control loop that distinguishes it from a one-way driver: cellular output modifies the shared environmental state (panel b), confirmed in-memory on fig04-runnable.'
  evidence:
    from_test: control-loop-closes-through-shared-store
    from_run: fig04-runnable
    observed: local sensed field 0.5 -> 0.2407 over the run (diffusion + uptake drawdown); per-step uptake <-> local field correlation 1.0 throughout
  provenance:
    run_ids:
    - fig04-runnable
    analysis_script: in-memory Composite build from fig04-runnable.composite.json + gather_emitter_results, local-field drawdown check (workbench 0.4.1)
- id: F-04
