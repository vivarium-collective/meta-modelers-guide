schema_version: 4
name: fig-04
investigation: paper-figures
title: "fig-04: Cell–environment coupling"
created: '2026-08-26'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional  # evidence deepened (workbench 0.4.1); kept at the repo's established Provisional pending the scientific-validation gate
confidence_basis: 'Calibrated off Provisional (workbench 0.4.1). BASELINE (fig04-runnable): the sense→act loop is demonstrated, BUT — as the scientific review flags — the cell''s uptake is never subtracted from the field, so its "uptake tracks the local field at correlation 1.0" is an identity, not feedback; this is behavioral verification only, and is held at Medium. MECHANISTIC VARIANT (fig04-mechanistic, scientific-review revision) genuinely closes the loop: saturating Michaelis–Menten uptake is a REAL sink that carves a diffusing depletion well (footprint 1.58 field units), biomass is paid for out of the field with the mass ledger closing to 9e-16, chemotaxis climbs the gradient, and matched-null controls (uptake/motility/gradient off, via epsilon) isolate each arm. The study is still held at Provisional because the model is a 1-D lattice in LATTICE units with didactic rate constants — not calibrated to a named nutrient, physical diffusivity, or measured chemotactic velocity.'
question: 'Is the paper''s §Cell-environment coupling figure (Fig cell_environment) executable — does a runnable process-bigraph composite actually close the control loop the caption asserts, where an environmental chemical field DRIVES the cell''s interface ports (sensing, uptake, growth, motility) and the cell acts back on that shared field? Concretely: does a real diffusing nutrient gradient, sensed locally at an interior grid index, drive uptake that tracks the sensed field, grow the cell''s mass, and pull it up-gradient (chemotaxis) — env field → sensed value → uptake → mass gain, plus up-gradient drift — all as measured simulation output, not a drawn diagram?'
biological_summary: 'This is the runnable realization of the paper''s §Cell-environment coupling figure (Fig cell_environment). The section frames coupling as closing a loop: "cellular outputs modify the environmental state, environmental processes update it further, and that state feeds back to the cellular interface as inputs -- the minimal structure required for control." Panel **a** shows a cell interacting with environmental fields (chemical, electrical, mechanical) and physical barriers; panel **b** shows a composition diagram wiring internal cell state to those environmental fields through exchange processes and shared stores, alongside environmental processes such as diffusion and mechanical relaxation.

  The `fig04-runnable` composite makes that diagram executable. A real length-9 1-D diffusing chemical grid (a `map[float]` store, keys `"0"`..`"8"`) is seeded as a nutrient GRADIENT — 0.0 at index 0 rising linearly to 1.0 at index 8 — and relaxes under a genuine finite-difference `SpatialDiffusion` step (D=0.2, zero-flux edges, mass-conserving). A single cell (`SingleCellSpatial`) sits at interior index 4 and is wired to that SHARED chemical_field store: each tick it senses its LOCAL field value, takes up chemical linearly in that value (uptake_rate=0.1), grows mass at a biomass yield of 0.5, exerts traction, and drifts up the local concentration gradient (migration_rate=0.1). Its `uptake` and `traction` outputs are written BACK into the shared environment store (`environment.uptake_flux`, `environment.traction`) — the same stores the environmental processes and emitter read — so the sense→act loop closes through a shared store exactly as the caption describes. A `MechanicalRelax` process relaxes the scalar mechanical field toward its barrier-imposed equilibrium, standing in for the mechanical/barrier field of panel a.

  Over a 24-step run every leg of the control loop is visible in the emitted trace and is deterministic (no RNG anywhere in this composite): the cell at index 4 senses a starting local field of 0.5 (relaxing to ~0.24 as diffusion smooths the gradient and uptake draws it down), its per-step uptake tracks that sensed field with correlation 1.0, cumulative uptake booked to the shared env reaches ~0.864, mass climbs monotonically 1.0 → ~1.432, and the cell drifts up-gradient from index 4.0 to ~4.196. A zero-field control confirms causality: flatten the field to 0 and uptake, traction, drift, and mass gain are all exactly 0 — the ports are driven BY the environment, not free-running. This is a small, didactic, toy-real composite: it is built to look like the figure and play the coupling forward, not to reproduce a calibrated chemotaxis or metabolic rate.'
claim: 'The paper''s §Cell-environment coupling figure is executable, not merely drawn: the `fig04-runnable` composite closes the caption''s control loop as measured simulation output. A real diffusing nutrient gradient, sensed locally at interior grid index 4, drives the cell''s interface ports — uptake is linear in the local sensed field (exactly 4× the field ⇒ 4× the uptake; per-step uptake tracks the sensed field at correlation 1.0), mass grows monotonically (1.0 → ~1.432 over 24 steps), and the cell drifts up-gradient (index 4.0 → ~4.196, net +0.196). The cell writes its uptake back into the shared environment store, closing the sense→act loop, and the mass↔uptake ledger closes exactly (Δmass == 0.5 × cumulative uptake booked to the env). A zero-field negative control gives zero drive on every port, establishing the field as the causal driver. All values are deterministic run-to-run (no RNG in the composite). These are toy-real, uncalibrated magnitudes — the calibrated spatial cousin is `cell-environment-coupling` in the `draft-to-living-cell` investigation.'
baseline:
- name: fig04-runnable
  composite: meta_modelers_guide.composites.fig04-runnable
  params: {}
variants:
- name: fig04-mechanistic
  composite: meta_modelers_guide.composites.fig04-mechanistic
  params: {}
  rationale: 'Real-mechanism upgrade (scientific-review revision, Oct 2026). The baseline fig04-runnable wires a real diffusion field, but the cell''s uptake is a SCALAR output that is never subtracted from the field — so there is no genuine cell→field feedback, and the "uptake ∝ local field at correlation 1.0" readout is true by construction, not evidence of coupling (the review''s central objection to this figure). This variant CLOSES the loop on a 25-cell lattice (distances in lattice units, dx=1): a MotileCell takes up nutrient with SATURATING Michaelis–Menten kinetics, REMOVES that uptake from the field at its location (a real depletion well that diffuses), grows biomass paid out of the field, and chemotaxes up the local gradient toward an explicit IN-DOMAIN source. Matched-null controls (uptake off, motility off, zero gradient — via epsilon, since float 0.0 config is silently restored to default) isolate each arm, and the mass ledger Σfield = Σsource − Σdecay − Σuptake closes to machine precision. The baseline is kept intact as the didactic smoke test.'
key_assumptions:
- 'This `fig04-runnable` composite is DIDACTIC / toy-real: a length-9 1-D lattice, a single cell, and hand-picked rate constants (uptake_rate=0.1, biomass_yield=0.5, migration_rate=0.1, traction_coef=0.05, diffusivity D=0.2) chosen so every leg of the control loop — sense, uptake, grow, drift — is legible within a 24-step run. It is built to look like the figure and play the coupling forward, NOT calibrated to a named nutrient, a measured chemotactic velocity, or a literature metabolic rate.'
- 'The cell''s interface is intentionally minimal-but-real. The chemical field is a genuine process-bigraph `map[float]` grid store with real neighbour coupling under a finite-difference diffusion step (not a scalar stand-in and not a list-of-floats fallback); the cell reads its LOCAL grid value at its own lattice index. But mass, location, uptake, traction, and shape are SCALAR cell outputs, and the mechanical field is a single scalar relaxed toward a barrier equilibrium — a 1-D reduction of panel a''s chemical/electrical/mechanical/barrier fields.'
- 'The chemotactic drift and uptake use simple linear policies (drift ∝ local gradient, uptake ∝ local field), so the whole composite is deterministic — there is no RNG anywhere. Exact numeric pins in the behavior tests are therefore legitimate regression pins, exact run-to-run while the composite spec and rate constants are held fixed.'
- 'The environmental "source" process (`ProductionDegradationField`) is effectively OFF in this composite (source_index=99 is out of the length-9 grid, so it injects nothing; decay_rate=0.03 only). The gradient the cell responds to is the SEEDED initial condition relaxing under diffusion, not a maintained source — the coupling shown is the cell reading and drawing down a decaying gradient, not a steady-state supply.'
- 'The `location`/`shape` outputs are lightweight proxies: `location` is a 1-D lattice coordinate (a drift index, not a physical position in µm), and `shape` is a scalar volume proxy growing with uptake. No 2-D/3-D morphology is represented.'
acceptance_criteria:
- A higher LOCAL chemical field produces a larger `uptake` output — the port is driven by the environment (and, because uptake is linear, 4× the field gives 4× the uptake).
- With nutrient present, the cell's `mass` increases monotonically over the run (net growth, never falling) — sensed field → uptake → biomass gain.
- 'Per-step uptake tracks the LOCAL sensed field over the actual run (strong positive correlation): the interface port responds to the environmental state tick by tick.'
- Net `location` drift over the run is UP-gradient (toward the higher-field side) — the cell constructs its own trajectory by climbing the gradient it senses (chemotaxis).
- 'The loop CLOSES through a shared store: the cell''s `uptake` output is written back into the shared `environment.uptake_flux` store and accumulates, and the mass↔uptake ledger closes exactly (Δmass == biomass_yield × cumulative uptake booked to the environment).'
- 'Negative control: with a flat ZERO field the cell''s uptake, traction, drift, and mass gain are all exactly zero — the environment is the causal driver of the interface.'
units_and_time:
  time: 1 tick = 1.0 unit of dimensionless model time (interval=1.0); the run is 24 such ticks (25 emitted rows including the initial state).
  quantities: 'chemical_field values, uptake_flux, mass, traction, and the mechanical field are dimensionless model units; `location` is a 1-D lattice index (0..8), not a physical position. Rate constants (uptake_rate=0.1, biomass_yield=0.5, migration_rate=0.1, traction_coef=0.05, diffusivity=0.2) carry no calibrated physical unit.'
  note: No quantity here is calibrated to a named nutrient, a measured chemotactic velocity, or a literature metabolic/diffusion rate.
behavior_tests:
- name: higher-local-field-drives-larger-uptake
  classification: primary
  description: A higher local chemical field drives a larger `uptake` output, and because uptake is linear in the sensed field, exactly 4× the field gives 4× the uptake — the env→port drive made causal by driving the handler directly at two field levels.
  measure:
    kind: observable
    path: obs.uptake
    expr: uptake(field=0.8) / uptake(field=0.2)
  pass_if:
    op: '=='
    kind: acceptance_criterion
    deterministic_pin: true
    value: 4.0
    provenance: 'prior: uptake is driven by the local field, so more field ⇒ more uptake; the linear policy makes the ratio exactly the field ratio. Observed: uptake(0.2)=0.02, uptake(0.8)=0.08, ratio == 4.0 to <1e-6 (deterministic — no RNG) (tests/test_fig04_env_drives_interface.py::test_higher_local_field_drives_larger_uptake)'
  requires_simulation: none
- name: zero-field-gives-no-drive
  classification: diagnostic
  control: negative
  description: 'Negative control for the causal claim: with a flat ZERO chemical field the cell''s uptake, traction, chemotactic drift, and mass gain are ALL exactly zero — the interface ports are driven BY the environment, not free-running.'
  measure:
    kind: observable
    path: obs.uptake
    expr: uptake, traction, location-drift, mass-gain at flat field == 0.0
  pass_if:
    op: '=='
    kind: acceptance_criterion
    deterministic_pin: true
    value: 0.0
    provenance: 'prior: remove the driving field and the interface should go silent. Observed: uptake==0.0, traction==0.0, drift==0.0, mass_gain==0.0 exactly at a flat zero field (deterministic) (tests/test_fig04_env_drives_interface.py::test_zero_field_gives_no_drive)'
  requires_simulation: none
- name: mass-increases-monotonically-under-nutrient
  classification: primary
  description: With nutrient present throughout, the cell's mass increases monotonically over the run (net growth, never falling) — the sensed field → uptake → biomass leg of the loop.
  measure:
    kind: observable
    path: obs.mass
    expr: mass[-1] vs mass[0], and mass[i+1] >= mass[i]
  pass_if:
    op: '>'
    kind: acceptance_criterion
    value: 1.0
    provenance: 'prior: uptake is non-negative each tick and mass grows from it, so mass is monotone non-decreasing and ends above its start. Observed: mass 1.0 → 1.432152 over 24 ticks, monotone non-decreasing throughout (the > 1.0 direction is the a-priori prediction; 1.432 is the deterministic endpoint) (tests/test_fig04_env_drives_interface.py::test_mass_increases_monotonically_under_nutrient)'
  requires_simulation: fig04-runnable
- name: uptake-tracks-the-local-sensed-field
  classification: primary
  description: Per-step uptake rises and falls WITH the local sensed concentration over the actual run — the environment→port coupling, tick by tick, not just at endpoints.
  measure:
    kind: derived
    path: obs.uptake_flux
    expr: Pearson corr(per-step uptake, local sensed field) over the run
  pass_if:
    op: '>'
    kind: acceptance_criterion
    value: 0.99
    provenance: 'prior: the port is driven by the local field, so per-step uptake should track the sensed field tick by tick. Observed: correlation == 1.0 (uptake is exactly linear in the sensed field; > 0.99 asserted to leave the deterministic value a small margin) (tests/test_fig04_env_drives_interface.py::test_uptake_tracks_the_local_sensed_field)'
  requires_simulation: fig04-runnable
- name: net-drift-is-up-gradient
  classification: primary
  description: The cell drifts UP the concentration gradient over the run (net location displacement positive, toward the higher-field side) — chemotaxis, the cell constructing its own trajectory by climbing the field it senses.
  measure:
    kind: observable
    path: obs.location
    expr: location[-1] - location[0]
  pass_if:
    op: '>'
    kind: acceptance_criterion
    value: 0.05
    provenance: 'prior: drift ∝ the local gradient (higher toward index 8), so net displacement is up-gradient and positive. Observed: location 4.0 → 4.195695, net drift +0.195695 (> 0.05 is the loose a-priori floor; +0.196 is the deterministic value) (tests/test_fig04_env_drives_interface.py::test_net_drift_is_up_gradient)'
  requires_simulation: fig04-runnable
- name: control-loop-closes-through-shared-store
  classification: primary
  description: The cell's `uptake` output is written back into the SHARED `environment.uptake_flux` store (the same store other processes read), accumulates monotonically, and the mass↔uptake ledger closes exactly — the sense→act loop closing through a shared store, as the caption describes.
  measure:
    kind: derived
    path: obs.uptake_flux
    expr: cumulative uptake_flux end, and (mass[-1]-mass[0]) == 0.5 * uptake_flux[-1]
  pass_if:
    op: ledger_closes
    kind: acceptance_criterion
    deterministic_pin: true
    value: cum_uptake_flux 0.0 → 0.864305 (monotone); Δmass 0.432152 == 0.5 × 0.864305
    provenance: 'prior: the cell writes uptake back to the shared env store and every unit of biomass is biomass_yield (0.5) × a unit of uptake booked to the env, so the ledger must close. Observed: cumulative uptake_flux 0.0 → 0.864305, monotone; Δmass 0.432152 == 0.5 × 0.864305 to <1e-9 (deterministic) (tests/test_fig04_env_drives_interface.py::test_control_loop_closes_output_written_back_to_shared_env)'
  requires_simulation: fig04-runnable
# ── mechanistic variant (fig04-mechanistic) — scientific-review revision ──────
# Real cell↔field feedback, saturating transport, chemotaxis, and matched-null
# controls, classified by the reviewer's evidence taxonomy (pass_if.kind).
- name: mech-mass-ledger-closes
  classification: primary
  variant: fig04-mechanistic
  description: 'With Neumann edges the field mass ledger closes exactly: Σfield change = Σsource − Σdecay − Σuptake, and the cell''s biomass change = yield·Σuptake. Nothing is created — the cell''s growth is paid for out of the field. Pure diffusion (cell and source removed) conserves the field total to round-off.'
  measure:
    kind: derived
    path: obs.source_total, obs.decay_total, obs.uptake_total; Σfield
    expr: '|Δfield − (Σsource − Σdecay − Σuptake)| and |Δbiomass − yield·Σuptake|'
  pass_if:
    op: '<'
    kind: invariant
    value: 1.0e-9
    provenance: 'INVARIANT. Observed field ledger residual 8.9e-16 and biomass-vs-uptake residual 0.0 over the live 24-tick run; pure diffusion conserves the total to <1e-9 (tests/test_fig04_mechanistic.py::test_mass_ledger_closes, ::test_diffusion_is_mass_conserving)'
  requires_simulation: fig04-mechanistic
- name: mech-cell-depletes-field-real-feedback
  classification: primary
  variant: fig04-mechanistic
  description: 'The cell''s uptake is a REAL sink on the shared field: the field under the cell is drawn below the no-uptake control (a depletion well that diffuses), and the cell leaves a measurable footprint on the environment. This is the bidirectional feedback the baseline lacked — its uptake never touched the field, so its "uptake ∝ field" was an identity, not evidence.'
  measure:
    kind: derived
    path: field(full) vs field(no-uptake) over space×time
    expr: max footprint |full − no-uptake| and max depletion-well depth
  pass_if:
    op: footprint_and_well
    kind: mechanistic_ablation
    value: footprint > 0.1 and well depth > 0.1 (field units)
    provenance: 'MECHANISTIC_ABLATION. Observed max footprint 1.58 and well depth 1.58 field units — the cell visibly imprints a depletion trail that follows its track (tests/test_fig04_mechanistic.py::test_cell_depletes_the_field_real_feedback). Directly refutes the review-flagged spurious correlation=1.0 feedback claim of the baseline.'
  requires_simulation: fig04-mechanistic
- name: mech-controls-isolate-each-arm
  classification: primary
  variant: fig04-mechanistic
  description: 'Matched-null controls (set with an epsilon, not 0.0) cleanly isolate each arm of the loop: NO-UPTAKE preserves the field and keeps biomass constant (no sink, no growth); NO-MOTILITY holds the cell''s position but it still eats locally (uptake without displacement); ZERO-GRADIENT (uniform field, source off) abolishes directed chemotactic drift. Each removes exactly one mechanism.'
  measure:
    kind: derived
    path: biomass, position under {no-uptake, no-motility, zero-gradient}
    expr: no-uptake Δbiomass≈0; no-motility Δposition≈0; zero-gradient Δposition≈0
  pass_if:
    op: controls_hold
    kind: mechanistic_ablation
    value: 'Δbiomass<1e-6 (no-uptake); |Δpos|<1e-6 (no-motility); |Δpos|<1 lattice (zero-gradient)'
    provenance: 'MECHANISTIC_ABLATION (matched nulls, epsilon not 0.0 per the is_empty(Float,0.0)=True gotcha). Observed: no-uptake biomass 1.000 flat; no-motility position fixed at 16.0 with biomass still rising; zero-gradient no directed drift (tests/test_fig04_mechanistic.py::test_no_uptake_preserves_the_field, ::test_no_motility_means_no_displacement, ::test_zero_gradient_abolishes_directed_drift)'
  requires_simulation: fig04-mechanistic
- name: mech-chemotaxis-climbs-the-gradient
  classification: primary
  variant: fig04-mechanistic
  description: 'The full cell moves UP the local gradient toward the in-domain source (lattice position falls 16 → ~1) and the nutrient it senses rises as it climbs. The motion is genuinely gradient-following, not a scripted path — it vanishes on a uniform field.'
  measure:
    kind: observable
    path: obs.position, obs.local_conc
    expr: position decreases by >5 lattice units; sensed nutrient rises while climbing
  pass_if:
    op: climbs
    kind: mechanistic_ablation
    value: Δposition < −5 lattice units and local_conc rising
    provenance: 'MECHANISTIC_ABLATION. Observed cell climbed 16.0 → 0.6 lattice units with sensed nutrient rising 0.27 → ~2.0; the drift is absent under the zero-gradient control (tests/test_fig04_mechanistic.py::test_chemotaxis_climbs_the_gradient)'
  requires_simulation: fig04-mechanistic
- name: mech-uptake-saturates
  classification: diagnostic
  variant: fig04-mechanistic
  description: 'Uptake follows saturating Michaelis–Menten kinetics v = Vmax·c/(Km+c) — bounded by Vmax at high concentration and ~linear at low concentration — not the baseline''s unbounded proportional draw. Transport cannot exceed the carrier limit.'
  measure:
    kind: observable
    path: uptake at c far above vs far below Km
    expr: uptake(c=100)→Vmax; uptake(c≪Km) ≪ Vmax
  pass_if:
    op: saturates
    kind: empirical_comparison
    value: uptake(100) ∈ [0.99·Vmax, Vmax); uptake(0.03) < 0.1·uptake(100)
    provenance: 'EMPIRICAL_COMPARISON to Michaelis–Menten saturation. Observed uptake approaches Vmax=0.45 at high c and is <10% of saturation far below Km — a real carrier limit, unlike the baseline''s linear uptake_rate·local (tests/test_fig04_mechanistic.py::test_uptake_saturates_michaelis_menten)'
  requires_simulation: fig04-mechanistic
