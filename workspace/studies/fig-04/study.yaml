conclusion: '## Claim

  The paper''s §Cell-environment coupling figure (Fig cell_environment) is executable, not
  merely drawn. The `fig04-runnable` composite closes the caption''s control loop as
  measured, deterministic simulation output: a real length-9 diffusing chemical grid seeded
  as a 0→1 nutrient gradient drives a single cell at interior index 4 through one typed
  interface (`SingleCellSpatial`), and the cell writes its uptake/traction back into the
  shared environment store — the sense→act loop the caption calls "the minimal structure
  required for control."


  ## Evidence

  - **HIGHER-LOCAL-FIELD-DRIVES-LARGER-UPTAKE** — uptake(0.2)=0.02, uptake(0.8)=0.08,
    ratio == 4.0 (linear env→port drive)

  - **ZERO-FIELD-GIVES-NO-DRIVE** — flat zero field ⇒ uptake, traction, drift, mass-gain all
    == 0.0 (the environment is the causal driver)

  - **MASS-INCREASES-MONOTONICALLY-UNDER-NUTRIENT** — mass 1.0 → 1.432152, monotone

  - **UPTAKE-TRACKS-THE-LOCAL-SENSED-FIELD** — per-step uptake ↔ local sensed field
    correlation == 1.0

  - **NET-DRIFT-IS-UP-GRADIENT** — location 4.0 → 4.195695, net drift +0.196 up-gradient
    (chemotaxis)

  - **CONTROL-LOOP-CLOSES-THROUGH-SHARED-STORE** — cumulative uptake_flux 0.0 → 0.864305
    (monotone); Δmass 0.432152 == 0.5 × 0.864305 (ledger closes)


  ## Limitations

  - This is a DIDACTIC / toy-real composite — a length-9 1-D lattice, a single cell, and
    hand-picked rate constants chosen to make the loop legible in 24 ticks, not calibrated to
    a named nutrient, a measured chemotactic velocity, or a literature metabolic rate.

  - The rigorous spatial cousin is `cell-environment-coupling` in the `draft-to-living-cell`
    investigation; its calibrated numbers are NOT restated as this study''s own.

  - The environmental source is effectively OFF (source_index=99 is off-grid); the cell reads
    and draws down a SEEDED gradient relaxing under diffusion, not a maintained supply.

  - Panel a''s chemical/electrical/mechanical/barrier fields are reduced to one 1-D chemical
    grid plus a scalar mechanical field; location/shape are lightweight scalar proxies.


  ## Next steps

  - Turn on a maintained source (a valid on-grid source_index) to show steady-state coupling
    rather than a relaxing seeded gradient.

  - Compare against the calibrated `cell-environment-coupling` cousin for the same
    env→interface claim at a rigorous spatial resolution.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig04-runnable.composite.json builds and runs to completion over a
      deterministic 24-tick run through the process-bigraph engine.'
    biological_validation: The §Cell-environment coupling control loop is demonstrated at the
      toy-real (uncalibrated) level — a real diffusing gradient driving a real typed interface
      that acts back on the shared store — rather than as a drawn diagram.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - uptake no longer tracks the local field (the cell is reading the wrong grid index, or the
      field store is no longer refined to the map[float] grid)
    - mass fails to grow monotonically (biomass_yield/uptake_rate mis-wired, or nutrient absent)
    - net drift is not up-gradient (the chemotaxis sign is wrong, or the seeded gradient is flat)
    - the loop fails to close (uptake is not written back to environment.uptake_flux, or the
      mass↔uptake ledger no longer balances)
    block_downstream: 'any figure study reusing the SingleCellSpatial interface or the refined
      map[float] chemical-grid store'
limitations:
- 'This `fig04-runnable` composite is DIDACTIC / toy-real: a length-9 1-D lattice, a single
  cell, and hand-picked rate constants (uptake_rate=0.1, biomass_yield=0.5, migration_rate=0.1,
  traction_coef=0.05, D=0.2) chosen so sense/uptake/grow/drift are all legible within a 24-tick
  run — not fitted to a named nutrient, a measured chemotactic velocity, or a literature rate.'
- The rigorous spatial cousin is `cell-environment-coupling` in the `draft-to-living-cell`
  investigation. That study demonstrates the same env→interface coupling at a calibrated spatial
  resolution; its numbers are NOT restated here as this study's own.
- The environmental source process is effectively OFF (source_index=99 lies off the length-9
  grid, injecting nothing); the gradient the cell responds to is the SEEDED initial condition
  relaxing under diffusion and being drawn down by uptake, not a maintained steady-state supply.
- Panel a's chemical/electrical/mechanical/barrier fields are reduced here to one real 1-D
  chemical grid plus a single scalar mechanical field relaxed toward a barrier equilibrium; the
  electrical field is not represented.
- '`location` is a 1-D lattice index (a drift coordinate, not a physical position in µm) and
  `shape` is a scalar volume proxy; no 2-D/3-D morphology is represented.'
- All numbers are exact regression pins that hold only while the composite spec and rate
  constants are held fixed; the composite is deterministic (no RNG), so they reproduce exactly
  run-to-run under that pinning.
falsifiability: Overturned if a higher local field fails to produce larger uptake, if per-step
  uptake stops tracking the local sensed field, if mass fails to grow monotonically while
  nutrient is present, if net location drift is not up-gradient, if the cell's uptake is not
  written back into the shared environment store or the mass↔uptake ledger fails to close, or if
  a flat zero field produces any non-zero drive on the interface ports.
