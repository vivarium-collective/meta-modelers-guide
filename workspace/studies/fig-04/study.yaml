- id: F-05
  kind: computational
  tier: mechanism
  status: novel
  variant: fig04-mechanistic
  statement: 'Matched-null controls isolate each arm of the loop, so the behaviour is attributable to specific mechanisms rather than to a scripted trajectory. NO-UPTAKE (Vmax=ε) keeps the field intact and biomass flat; NO-MOTILITY (χ=ε) holds position while the cell still eats locally; ZERO-GRADIENT (uniform field, source off) abolishes directed drift. Chemotaxis genuinely climbs the gradient (cell 16→0.6 lattice units, sensed nutrient rising), and vanishes without a gradient. Controls use an epsilon, not 0.0, because bigraph_schema treats a float 0.0 config as empty and restores the schema default — a matched-null-control correctness point.'
