  index 4.0 to 4.195695 (chemotaxis), and the cell''s uptake is written back into the shared
  environment store (cumulative uptake_flux 0.0 → 0.864305, monotone) with the mass↔uptake
  ledger closing exactly (Δmass 0.432152 == 0.5 × 0.864305). The paper''s §Cell-environment
  coupling figure (Fig cell_environment) is thus executable, not merely drawn — the caption''s
  "minimal structure required for control" runs as measured simulation output. These are
  toy-real, uncalibrated magnitudes; the rigorous spatial cousin is `cell-environment-coupling`
  in the `draft-to-living-cell` investigation.'
