question: At the molecular grain, can a single molecular mechanism (F1Fo ATP synthase) be compiled from its draft and run as a PMF-driven rotary catalyst honoring the four physical interface channels (chemical/electrical/mechanical/thermal) and the specialized substrate/cofactor/catalyst/product ports?
biological_summary: 'Fig 7 drops one level below the cellular boundary, to the molecular grain: a single molecule as a process with typed physical channels, no cell-level boundary at all. Fig 7b declares the interface — a molecule exchanges matter (chemical, mol·s⁻¹), charge (electrical, C·s⁻¹), momentum (mechanical, N) and energy (thermal, J·s⁻¹) with its surroundings, and carries a structural identifier (PDB/SMILES). Fig 7c refines the chemical channel into the vocabulary of enzymology — substrates, cofactors, catalysts, products — as a `subports` store nested alongside the four physical channels. As drafted, both stores are inert: unit-bearing ports and wiring, no update dynamics. This study names the transducer and compiles it: the **F1Fo ATP synthase**, the rotary motor that couples the proton-motive force (PMF) across a membrane to phosphorylation. `MolecularMechanismHandler` drives all four physical channels from ONE coupled quantity — the proton flux set by the chemical (substrate/turnover) input — so the channels stay physically consistent with each other: chemical is the ATP synthesis flux (`J_ATP = k_cat * activity`), electrical is the proton current carried by that same flux (`I = J_H * e`), mechanical is the rotary power of the Fo motor (`torque * omega`, `omega` set by the H+ flux through the c-ring), and thermal is the non-conserved remainder dissipated as heat (`(1-eta) * PMF work`, eta ~= 75%). Measured on the compiled fig07-executable, run 8 seconds through the engine (literature constants: k_cat ~= 100 ATP*s^-1, H+/ATP ~= 3.3, PMF ~= 150 mV, torque ~= 40 pN*nm; Milo & Phillips; Junge & Nelson 2015): chemical_out (ATP synthesized) rises 0 -> 100, and the other three channels move together from the same proton flux — electrical_out ~= 5.29e-17 A, mechanical_out ~= 8.29e-18 W, thermal_out ~= 1.98e-18 W (all real SI magnitudes for a single-molecule rotary motor, hence tiny). The four-channel interface is preserved unchanged by compilation (Law 2): `interface_of(draft) == interface_of(executable)`. HONESTY POINT: the Fig 7c `subports` refinement (substrates, cofactors, catalysts, products) is present in both the draft and the compiled executable — the store is wired and read by the dynamics visualization — but `MolecularMechanismHandler` does not write to it; those four ports stay at their 0.0 seed for the whole run. The specialized enzymatic vocabulary is structurally honored (declared, typed, preserved through compilation) but not driven by this handler''s dynamics, and the study says so rather than claiming substrate/cofactor/catalyst/product turnover that was not built. This is the molecular grain the disintegration study (Fig 6) drops into when a cell''s viability collapses: one mechanism, made concrete and executable.'
claim: The molecular interface''s four typed channels compile to a running ATP-synthase mechanism, all four channels driven consistently from one coupled proton flux (chemical_out 0->100; electrical/mechanical/thermal channels move with it) — the molecular level the disintegration study drops into, made concrete. The specialized substrate/cofactor/catalyst/product ports are structurally preserved through compilation but are not driven by this handler (honestly noted, not claimed as dynamic).
baseline:
- name: molecular-mechanism
  composite: meta_modelers_guide.composites.fig07-molecular-mechanism
  params: {}
- name: molecular-mechanism-executable
  composite: meta_modelers_guide.composites.fig07-executable
  params: {}
variants: []
key_assumptions:
- All four physical channels (chemical/electrical/mechanical/thermal) are derived from ONE coupled quantity (the proton flux set by the chemical input), so they are not four independent free parameters — they move together by construction, which is what "physically consistent" means here, not four separately fitted rate laws.
- The Fig 7c `subports` refinement (substrates, cofactors, catalysts, products) is a structural port declaration, not a modeled reaction mechanism. `MolecularMechanismHandler` conforms to the Fig 7b physical-channel signature only; it does not read or write `subports`, so those four leaves stay at their 0.0 seed for the entire run. No substrate-binding, cofactor, catalytic-turnover, or product-release dynamics are claimed.
- Constants (k_cat, H+/ATP stoichiometry, PMF, torque, efficiency) are literature-grounded (Milo & Phillips, *Cell Biology by the Numbers*; Junge & Nelson 2015; Stock et al. 1999) but the model is a single coupled-flux transducer, not a mechanistic rotary-catalysis simulation (no explicit c-ring stepping, no discrete catalytic sites, no load dependence).
behavior_tests:
- name: atp-synthesized
  classification: primary
  description: The F1Fo ATP synthase mechanism drives its chemical output port — ATP synthesized rises from 0 to 100 over the run (exec fig07-executable, ports.chemical_out).
  measure:
    kind: observable
    path: chemical_out
    expr: last(chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: exec last=100.0 — F1Fo ATP synthase (chemical_out 0->100, PMF-driven rotary catalysis; fig07-executable, run(8) matching scripts/render_study_evidence.py TOTAL_TIME=8.0)
  requires_simulation: molecular-interfaces
- name: rotary-power-couples
  classification: primary
  description: The mechanical channel (Fo rotary power) moves off its zero seed, driven by the SAME proton flux that drives ATP synthesis — the four channels are physically coupled, not independently parameterized.
  measure:
    kind: observable
    path: mechanical_out
    expr: last(mechanical_out)
  pass_if:
    op: '>='
    value: 1.0e-19
    provenance: exec last~=8.29e-18 W (rotary mechanical power = torque*omega, both set by the H+ flux; fig07-executable, run(8)). Real single-molecule magnitude — small in absolute SI units, but nonzero and driven by the same coupled flux as chemical_out.
  requires_simulation: molecular-interfaces
