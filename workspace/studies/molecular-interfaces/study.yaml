  control: negative
  description: 'One-line sanity check (NOT the study''s control): the inert Fig 7 draft (address local:MolecularMechanism, not the compiled Handler) has an empty update by construction, so chemical_out stays at its 0.0 seed and fails this threshold by design — confirming the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: chemical_out
    expr: last(chemical_out)
  pass_if:
    op: '>='
    value: 50.0
    provenance: inert-draft run (fig07-molecular-mechanism) stays at chemical_out=0.0 (empty update by construction) -> fails by design (expected-fail control)
