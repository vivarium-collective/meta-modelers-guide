conclusion: '## Claims

  - Coverage: every figure of the paper compiles and runs. 11 figure drafts (Figs 4–10 as composites), 10 compiling to executables (Fig 4a is illustrative, draft-only by design), 12 executable composites in all (Fig 6''s one interface carries three mechanisms) — all run to completion. This is a machinery-coverage result, not a scientific claim about any single figure.


  ## Evidence

  - **ALL-FIGURES-RUN** — 12/12 executable composites run to completion; witness fig07 chemical_out 0 → 100


  ## Limitations

  - The two figures folded into this gallery are DEFLATED on purpose: Fig 9''s "autopoiesis" is a toy autocatalytic loop that merely raises its pools; Fig 10-2''s "development" and Fig 10-3''s "evolution" compile and run, but the selection is an ordinary ODE (SelectionProc) and "acquiring a new port" is a configuration flag flip — not emergent innovation. This appendix claims only that they compile and run.


  ## Next steps

  - Promote any folded figure to its own study only if a genuine mechanism (a real selection dynamic, an emergent port) replaces the toy stand-in.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: Every figure draft compiles to an executable that runs to completion.
    biological_validation: Coverage only; no per-figure biological claim is asserted in this appendix.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - a figure draft failed to compile to an executable (a handler does not conform to the draft's ports)
    - an executable composite failed to run to completion
    block_downstream: none — this is an appendix backing the focused studies.
limitations:
- Coverage result only. It shows the draft→executable machinery runs across all figures; it makes no biological claim about any individual figure.
- 'The folded-in figures are deliberately deflated. Fig 9 is a toy autocatalytic loop (not a demonstration of autopoiesis), and Fig 10-2/10-3 development and evolution are an ODE and a config flag flip (not emergent development or innovation).'
- One deterministic run per executable; behaviors are shown once, not across replicate seeds.
falsifiability: Overturned if any of the paper's figure drafts fails to compile to an executable, or if any of the 12 executable composites fails to run to completion.
