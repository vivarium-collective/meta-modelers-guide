  composite: meta_modelers_guide.composites.protocell-autopoietic-v2-open
  params: {}
variants: []
key_assumptions:
- 'The autopoiesis criterion tested here is the paper''s §Self-organized processes one, quoted directly:
  a membrane alone is insufficient, and the stronger criterion is that the processes inside the boundary
  collectively maintain the organization that keeps those processes possible. This study realizes that as
  a production loop GATED on topological closure and self-limited by enclosed area -- the membrane''s
  ability to make boundary material is conditioned on the boundary it maintains. This is operational
  closure (knockout-provable causation plus a viability bound), not real membrane chemistry, metabolism,
  or molecular self-production.'
- 'The closure criterion is AUTHORED (production is gated by a global binary_fill_holes topological
  observer, not emergent from local physics); within that construction, persistence is a consequence of
  the internal loop, and this is consequence-tested, not merely assumed. The closed loop (k_prod=0.03)
  and the vesicle control (k_prod=0.0) differ in exactly one variable -- the production rate constant --
  with an identical seed, identical wiring, and identical D/k_decay/thr/dt. The knockout flips persistence
  into collapse, isolating the loop within the authored construction. A second consequence-test is the
  fatal-puncture viability bound (beer2024deriving): from the closed-loop steady state, zeroing a wedge of the
  membrane so nothing is enclosed shuts off the authored closure-gated production, and the ring cannot
  rebuild the boundary from nothing -- it relaxes toward phi=0.'
- 'The homeostatic plateau is METASTABLE, not perpetual -- and this is the physically-correct
  signature of finite closure, not a defect to apologize for. A closed toy system with no external
  material influx self-maintains over a bounded window (~2000 internal steps, versus the control''s
  ~96-step collapse) and eventually runs down (the ring breaks past ~2450-2650 steps even with production
  on). Both composites pin steps_per_tick=50 and the regression tests cap the closed-loop run at 36 ticks
  (1800 steps), deliberately inside the plateau window. Perpetual self-maintenance from a closed box would
  require a genuine energy/material influx and would be the LESS physical result.'
- 'The reaction-diffusion physics is deterministic: it has NO RNG. The Protocell process accepts a seed
  config, but it is currently inert (documented in meta_modelers_guide/protocell/autopoiesis.py). So
  persistence is NOT seed-dependent -- unlike this investigation''s CPM/Metropolis studies, where seed
  drives Monte Carlo noise. The multi-seed regression test varies seed 1-5 as the documented interface
  for a future stochastic variant and as the regression guard that would catch seed silently starting to
  matter, but today it produces an EXACT invariant: enclosed_area == 149 at every seed. The reported
  range is therefore a degenerate single point, stated plainly rather than presented as stochastic
  robustness.'
- 'The parameters are tuned demonstration values, not fitted. D=0.02 (comfortably inside the mild
  second-order-diffusion CFL D <= 0.25 -- the CFL guard raises rather than silently admitting an unstable
  config), k_decay=0.01, k_prod=0.03, thr=0.30 sit in a window that produces a legible homeostatic
  plateau; they are not fitted to a measured membrane or organism. No literature acceptance band is
  claimed -- this is a demonstration primitive of the closure criterion, not a model of a specific cell.'
- 'Persistence is gated on enclosed area > 0 AND membrane mass held above a floor, together, so a
  degenerate filled-in blob (interior filled solid, area == 0, mass high) or a near-zero-mass ghost ring
  (area > 0, mass ~0) can never be misread as a persisting vesicle. The enclosed-area metric is
  topological: a closed ring encloses its center (area > 0), while any gap leaks to the grid border and
  binary_fill_holes returns the membrane only (area == 0), cleanly separating "there is still a bounded
  inside" from "the boundary is gone."'
behavior_tests:
- name: closed-loop-persists
  classification: primary
  description: 'The autopoietic closed loop -- production gated on the membrane still enclosing an
    interior, self-limited by area -- self-maintains within the metastable plateau window: persists ==
    1.0, with membrane_mass held above its floor (the mass-held gate, so a degenerate near-zero-mass ring
    cannot pass as persisting).'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 1.0
    kind: acceptance_criterion
    deterministic_pin: true
    provenance: prior -- a membrane whose production is gated on staying topologically closed should
      persist; expect persists == 1.0. Confirmed -- persists == 1.0 with membrane_mass > 0 over a
      1800-step (36-tick) run comfortably inside the ~2000-step homeostatic-plateau window. The exact ==
      1.0 is a deterministic pin (persists is binary and the RD physics has no RNG) -- exact only while the
      engine build is fixed (tests/test_protocell.py::test_closed_loop_persists_within_stable_window,
      tests/test_autopoiesis_regime.py::test_closed_loop_persists)
  requires_simulation: protocell-autopoietic
- name: closed-loop-encloses-interior
  classification: primary
  description: 'The closed loop keeps a genuinely bounded interior throughout the window: the enclosed
    interior area plateaus well above zero (homeostasis at ~149 px, throttled down from the ~465 px seed
    by closure, not a filled solid blob and not runaway growth).'
  measure:
    kind: observable
    path: obs.enclosed_area
    expr: last(obs.enclosed_area)
  pass_if:
    op: '>'
    value: 50.0
    kind: regression_pin
    provenance: enclosed_area plateaus at ~149 px (seed ~465 px), homeostasis not runaway growth; the
      50-px floor was set after observing the ~149 px plateau -- a loose regression pin (not the exact 149,
      so it is not a golden-value pin) (tests/test_protocell_physics.py::test_closed_loop_persists_with_area_homeostasis,
      tests/test_autopoiesis_regime.py::test_persistence_is_multiseed_robust)
  requires_simulation: protocell-autopoietic
- name: closed-loop-never-collapses
  classification: diagnostic
  description: 'Diagnostic that the closed loop never loses closure within the window: collapse_tick
    stays at its sentinel -1.0 (never collapsed), distinguishing genuine self-maintenance from a run that
    merely had not yet reached its breakdown.'
  measure:
    kind: observable
    path: obs.collapse_tick
    expr: last(obs.collapse_tick)
  pass_if:
    op: ==
    value: -1.0
    kind: regression_pin
    deterministic_pin: true
    provenance: collapse_tick == -1.0 across the 1800-step window -- the closed loop never broke inside
      the plateau. The -1.0 is a sentinel deterministic pin (no RNG) -- exact only while the engine build
      is fixed (tests/test_protocell.py::test_closed_loop_persists_within_stable_window,
      tests/test_autopoiesis_regime.py::test_closed_loop_persists)
  requires_simulation: protocell-autopoietic
- name: vesicle-control-collapses
  classification: primary
  control: negative
  description: 'Single-variable knockout: identical seed and wiring, production knocked out via k_prod=0.
    Without the internal maintenance loop the membrane is a mere vesicle -- it decays and diffuses and its
    topological closure is lost, so persists flips to 0.0. This is what shows that, within the authored
    closure construction, the closed loop''s persistence tracks the production loop, not the seed or
    diffusion.'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 0.0
    kind: acceptance_criterion
    deterministic_pin: true
    provenance: 'prior -- a vesicle with production OFF (k_prod=0) should decay below its ON counterpart
      and lose closure; expect persists == 0.0. Confirmed -- k_prod=0 (the only differing variable):
      persists == 0.0, closure lost -- the knockout flips persist -> collapse. The == 0.0 is a
      deterministic pin (persists is binary, no RNG), exact only while the engine build is fixed
      (tests/test_protocell.py::test_negative_control_k_prod_zero_collapses,
      tests/test_autopoiesis_regime.py::test_vesicle_control_collapses)'
  requires_simulation: protocell-vesicle-control
- name: vesicle-control-loses-enclosure
  classification: primary
  control: negative
  description: 'The mechanism of the control''s collapse, made explicit: the vesicle''s enclosed interior
    area falls to exactly 0 (topological closure gone -- a gap opens and the interior leaks to the grid
    border) by step ~96, well before the run window ends.'
  measure:
    kind: observable
    path: obs.enclosed_area
    expr: last(obs.enclosed_area)
  pass_if:
    op: ==
    value: 0.0
    kind: regression_pin
    deterministic_pin: true
    provenance: enclosed_area -> 0 by step ~96 (collapse_tick ~96), the membrane ring decays and its
      closure is lost. The == 0.0 is a deterministic pin (no RNG) -- exact only while the engine build is
      fixed (tests/test_protocell_physics.py::test_negative_control_k_prod_zero_collapses,
      tests/test_autopoiesis_regime.py::test_vesicle_control_collapses)
  requires_simulation: protocell-vesicle-control
- name: puncture-is-fatal
  classification: diagnostic
  description: 'Viability bound (beer2024deriving), the second independent proof of closure. From the closed-loop
    steady state, zero a 60-degree wedge of the membrane so nothing is enclosed. Production stays at the
    canonical k_prod -- it is still "on" -- but gated on closure it cannot fire with nothing enclosed, so
    the ring cannot rebuild the boundary from nothing and relaxes toward phi=0. Crossing the viability
    bound is irreversible: enclosed_area stays 0 for 1500 further steps.'
  measure:
    kind: observable
    path: obs.enclosed_area
    expr: last(obs.enclosed_area)
  pass_if:
    op: ==
    value: 0.0
    kind: acceptance_criterion
    deterministic_pin: true
    provenance: prior -- breaking the boundary so nothing is enclosed should shut off the authored
      closure-gated production irreversibly (a viability bound); expect enclosed_area stays 0, no recovery.
      Confirmed -- after puncturing a 60-degree wedge, enclosed_area stays 0 for 1500 steps and phi.sum()
      -> ~0 even with k_prod at its canonical value -- the authored closure gate cannot rebuild from
      nothing. The == 0.0 is a deterministic pin (no RNG) -- exact only while the engine build is fixed
      (tests/test_protocell_physics.py::test_puncture_is_fatal_no_recovery)
  requires_simulation: none
- name: v2-emergent-closure-sustains
  classification: primary
  description: 'MECHANISM-LEVEL (v2, M4 answer). The local-precursor closed loop -- production
    k_prod*phi*p*(1-phi/phi_max), NO global closure observer in the update -- sustains a genuinely
    enclosed interior well inside its metastable window, and the interior precursor GENUINELY POOLS
    (the local confinement that IS the emergent closure mechanism actually operating).'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 1.0
    kind: acceptance_criterion
    deterministic_pin: true
    provenance: prior -- with production made to depend on a locally-retained precursor and no global
      closure test, a closed membrane should confine its self-secreted precursor and persist. Confirmed --
      run 20 ticks (1000 internal steps) inside the ~2451-step metastable closure window -- persists ==
      1.0, enclosed_area ~293 px (seed ~465), collapse_tick == -1.0, and precursor_mass pooled well above
      zero (~72). The == 1.0 is a deterministic pin (persists is binary, v2 physics has no RNG)
      (tests/test_protocell_v2.py::test_composite_closed_loop_persists,
      tests/test_protocell_v2.py::test_closed_loop_sustains_closure_and_pools_precursor)
  requires_simulation: protocell-autopoietic-v2
- name: v2-update-has-no-global-observer
  classification: primary
  description: 'The emergence guarantee, asserted structurally -- the v2 update (rd_step_v2 and its only
    helper _variable_diffusion) REFERENCES no global closure operator (binary_fill_holes / enclosed_area).
    binary_fill_holes survives in v2 ONLY as a passive enclosed_area readout of the emitted state; it
    never feeds back into phi or p. This is what makes v2''s closure-dependence emergent rather than
    authored.'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 1.0
    kind: regression_pin
    provenance: asserted on the bytecode-referenced names (co_names) of the v2 update functions so a
      docstring merely mentioning the absent operator cannot give a false positive -- binary_fill_holes and
      enclosed_area are absent from the update; only a real call would fail the test
      (tests/test_protocell_v2.py::test_update_has_no_global_closure_operator)
  requires_simulation: protocell-autopoietic-v2
- name: v2-precursor-knockout-collapses
  classification: primary
  control: negative
  description: 'v2 single-variable MECHANISTIC knockout (no v1 analogue): s_p=0 -- the membrane produces
    NO local precursor. With nothing to sustain production the ring dissipates fast (persists flips to
    0.0), showing v2 persistence tracks the local precursor loop, not the seed or diffusion. k_prod=0
    collapses identically.'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 0.0
    kind: acceptance_criterion
    deterministic_pin: true
