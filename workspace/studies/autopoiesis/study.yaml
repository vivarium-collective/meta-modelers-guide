- name: v2-puncture-starves-locally
  classification: diagnostic
  description: 'The v2 puncture is a genuine LOCAL PREDICTION, not a restatement of a global gate. From
    the steady closed loop, zero a 60-degree membrane wedge -- interior precursor bleeds out through the
    gap and production STARVES LOCALLY at the wedge, which is not rebuilt (punctured-wedge membrane mass
    stays far below the intact ring''s at the same step) and never self-heals.'
  measure:
    kind: observable
