schema_version: 4
name: autopoiesis
investigation: draft-to-living-cell
title: Autopoiesis
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
gate_class: genuinely-emergent
gate_class_note: >-
  Two realizations at two mechanistic grains. v1 (protocell-autopoietic) is the SPECIFICATION-level
  realization -- closure-dependence is AUTHORED via a global binary_fill_holes topological observer that
  gates production; its knockout and puncture results consequence-test an implemented criterion. v2
  (protocell-autopoietic-v2, ProtocellV2) is the MECHANISM-level realization answering peer-review M4 --
  production depends on a LOCAL interior precursor field (k_prod*phi*p*(1-phi/phi_max)) with NO global
  closure operator anywhere in the update (asserted structurally). Closure-dependence EMERGES from
  geometry -- a closed membrane confines the precursor it secretes and sustains itself; a punctured one
  bleeds precursor through the gap and starves locally. MEASURED this build -- v2 sustains topological
  closure ~2451 internal steps (metastable, same order as v1) while the precursor knockout s_p=0 collapses
  at ~step 95, so the EMERGE claim is upgraded from authored-closure to genuinely-emergent local-mechanism
  closure. The plateau remains metastable (finite closed budget). The open-system driven version is now
  BUILT AND MEASURED (v2-open, ProtocellV2Open, finding F-04) -- and the honest measured verdict is that a
  local external drive does NOT convert the metastable ring into an indefinite steady state -- it
  DESTABILISES it into faster runaway filling (closure lost ~step 591 at the canonical drive vs ~2451
  undriven), so EMERGE stays at genuinely-emergent-but-metastable closure, NOT upgraded to steady
  self-maintenance.
confidence: Provisional
units_and_time:
  tick: 1 tick = unspecified physical time (dimensionless model time); the run is 36 ticks = 1800 internal reaction-diffusion steps (50 steps_per_tick).
  quantities: membrane density phi, enclosed_area (in lattice pixels), and membrane_mass are dimensionless model units on a 64x64 lattice -- not calibrated to a physical membrane. D=0.02, k_decay=0.01, k_prod=0.03, thr=0.30 are dimensionless model constants, not fitted physical rates.
acceptance_criteria:
- A membrane whose production is gated on the boundary staying topologically closed should persist, while the same membrane with production knocked out (k_prod=0, identical seed and wiring) should lose closure and decay -- the ON arm holds, the OFF arm dies.
- Breaking the boundary so nothing is enclosed should shut off the closure-gated production irreversibly (a viability bound) -- the punctured ring should not rebuild from nothing.
- Because the closure gate is what conditions production, flipping the single production rate constant should flip persistence into dissipation -- persistence should track the authored closure gate, not seed geometry or diffusion alone.
- MECHANISM-LEVEL (v2, M4 answer) -- with production made to depend on a LOCAL interior precursor and NO global closure observer in the update, closure-dependence should EMERGE from local physics -- a closed membrane should retain its self-secreted precursor and sustain itself, a precursor knockout (s_p=0) should collapse it, and a puncture should make the interior precursor bleed out through the gap and production starve locally, all without any binary_fill_holes gating the dynamics.
- OPEN-SYSTEM LEVEL (v2-open, the remaining EMERGE step, built and measured) -- adding an external drive (a local open dissipative throughflow -- uniform precursor feed plus washout to an external reservoir -- that lifts the closed-budget constraint, still with NO global closure observer in the update) should be tested for whether it turns v2''s metastable closure into an INDEFINITE steady self-maintenance. The measured verdict is reported honestly whichever way it falls -- the driven loop''s fate measured against the undriven ~2451-step window -- and the controls (precursor knockout, puncture) must show the drive does NOT rescue closure if closure is genuinely load-bearing.
question: 'The paper''s §Self-organized processes section states the autopoiesis criterion as a boundary
  problem, not a bookkeeping one: "A membrane alone is insufficient: a vesicle may form a boundary without
  constituting a living system. A stronger criterion is that the processes inside the boundary collectively
  contribute to maintaining the organization that, in turn, keeps those processes possible." This study
  puts that criterion on a 2D lattice and asks the discriminating question directly: does a membrane
  PERSIST because an internal production loop -- gated on the boundary itself staying topologically
  closed -- replenishes the membrane against decay, and does a mere vesicle with no such loop, from the
  identical seed, DISSIPATE? The two composites differ in exactly one variable (the production rate
  constant k_prod), so the contrast between persistence and collapse is the finding. beer2024deriving''s viability
  bounds -- constraints on a shared state that must be maintained for the composition to persist -- are
  the frame: closure here is that the membrane''s own maintenance is conditioned on the boundary it
  maintains, so break the boundary and the maintenance cannot fire.'
biological_summary: 'The paper''s §Self-organized processes section (its autopoiesis discussion, Fig 8)
  draws a sharp line a coarser, specification-stage lumped realization could only gesture
  at: a boundary is not enough. A vesicle forms a boundary and is still not alive; what the criterion asks
  for is that the processes inside the boundary maintain the very organization that keeps those processes
  possible. This study realizes that line spatially as a single scalar membrane-density field phi on a
  64x64 periodic grid, seeded as a deterministic Gaussian-annulus ring -- a closed membrane -- evolving
  under a reaction-diffusion update dphi/dt = D*lap(phi) - k_decay*phi + production. The production term
  is the closure loop made literal: it fires ONLY where the membrane still topologically encloses an
  interior (binary_fill_holes(phi>thr) & ~(phi>thr)), is deposited onto existing membrane, and is
  throttled by the enclosed area relative to the seed''s own enclosed area, so the loop self-limits into
  a homeostatic plateau rather than growing without bound. The membrane''s ability to make boundary
  material is conditioned on the boundary it maintains -- exactly beer2024deriving''s viability-bound reading of
  closure, where a shared state must be held for the composition to persist.


  The discriminator is a single-variable knockout. The autopoietic composite (protocell-autopoietic,
  k_prod=0.03) and the vesicle control (protocell-vesicle-control, k_prod=0.0) share the same seed, the
  same process wiring, and the same D/k_decay/thr/dt/steps_per_tick; the ONLY difference is whether the
  internal production loop exists. Measured this build. The closed loop PERSISTS: the enclosed interior
  area plateaus at ~149 pixels (down from the seed''s ~465, throttled by closure -- homeostasis, not
  runaway growth) and holds there through the ~1800-step run, with persists == 1.0 and collapse_tick ==
  -1.0 (it never breaks within the window) and membrane_mass held above zero. The vesicle control
  COLLAPSES: with production knocked out, the ring decays and diffuses, its topological closure is lost
  by step ~96, enclosed_area falls to 0, and persists == 0.0. Flipping one rate constant flips
  persistence into dissipation -- within this authored construction the contrast shows the production loop
  is what maintains the boundary, not the seed geometry or diffusion alone.


  What is honestly demonstrated, and what is not. FIRST, the closure criterion is AUTHORED, not emergent:
  the closure-dependence is hand-coded via a global binary_fill_holes topological observer, so what this
  study shows is the criterion IMPLEMENTED and its consequences consequence-tested -- not a boundary that
  made and sustained itself from local physics. Within that authored construction, the production loop is
  what maintains the boundary, shown two ways -- the k_prod=0 knockout (the single differing variable; it
  flips persist -> collapse) and the fatal-puncture viability bound (take the closed-loop steady state,
  zero a wedge of the membrane so nothing is enclosed, and production -- gated on the authored closure test
  -- cannot rebuild the boundary from nothing; the punctured ring relaxes toward phi=0). That puncture is
  beer2024deriving''s viability bound made concrete -- cross it and the shared state can no longer be maintained. SECOND, the homeostatic plateau is METASTABLE, not eternal, and that is the physically
  correct signature of finite closure, not a defect. A closed toy system with no external material influx
  self-maintains over a bounded window (~2000 internal steps, vastly longer than the control''s ~96-step
  collapse) and then eventually runs down; perpetual self-maintenance would require a genuine energy or
  material influx, and a toy that self-maintained forever from a closed box would be the LESS physical
  result. THIRD, the reaction-diffusion physics has no RNG: the seed config is accepted but currently
  inert, so persistence is NOT seed-dependent (unlike this investigation''s CPM/Metropolis studies), and
  the multi-seed test''s reported range is a degenerate single point (enclosed_area == 149 at every seed
  1-5) -- a degenerate single point, not stochastic robustness. FOURTH, this is a minimal
  self-maintaining boundary, NOT real membrane chemistry or metabolism: what is demonstrated is
  operational closure (the criterion implemented, its knockout and puncture consequences verified), not
  lipid biophysics, not a metabolic network, not molecular self-production.


  These four boundaries describe the v1 SPECIFICATION-level realization. The mechanistically-local
  version they named -- an interior precursor confined by a closed membrane that bleeds out when the
  membrane leaks, so closure-dependence follows from LOCAL physics rather than a global observer -- is NO
  longer a next step: it is built and measured here as v2 (protocell-autopoietic-v2, ProtocellV2),
  answering peer-review M4. v2 removes the binary_fill_holes observer from the update entirely (production
  depends on the local precursor field p; the observer survives only as a passive enclosed_area readout,
  asserted structurally absent from the update). MEASURED -- the v2 closed loop sustains topological
  closure ~2451 internal steps (persists == 1.0, enclosed_area ~293 px at 1000 steps, interior precursor
  pooled ~72) with no global observer in the loop, while the mechanistic precursor knockout s_p=0 collapses
  at ~step 95 (~26x faster) and a 60-degree wedge puncture makes the interior precursor bleed out through
  the gap so the wedge membrane starves LOCALLY (~2 vs ~79 intact) and never self-heals. So EMERGE is
  upgraded from authored-closure (v1) to genuinely-emergent local-mechanism closure (v2); v2''s plateau is
  still metastable on a finite closed budget. The open-system driven version (v2-open, ProtocellV2Open,
  finding F-04) is now BUILT AND MEASURED, and the honest verdict is that a local external drive does NOT
  make emergent closure sustain indefinitely -- it DESTABILISES the metastable ring into faster runaway
  filling (closure lost ~step 591 at the canonical drive vs ~2451 undriven; an ~80-point drive sweep found
  no local drive reaching a bounded steady enclosed_area), while the controls confirm the drive does not
  rescue closure (s_p=0 still collapses ~step 188, a puncture is not healed). EMERGE therefore stays at
  genuinely-emergent-but-metastable closure, NOT upgraded to steady self-maintenance -- an honest measure of
  how hard steady emergent closure is. Read this side by side with the
  lumped ODE predecessor, which built the same closure idea as a compiled minimal-cell
  coupling of metabolism/containment/replication with no boundary-maintenance criterion applied; this
  study supplies exactly the boundary-maintenance criterion that one named as its own next step, at a
  very different mechanistic resolution.'
claim: 'The paper''s §Self-organized processes autopoiesis criterion -- a membrane persists because the
  processes inside the boundary maintain the organization that keeps those processes possible -- is
  IMPLEMENTED here as an AUTHORED operational-closure criterion and its consequences are tested. The
  closure-dependence is hand-coded (production is gated by a global binary_fill_holes topological
  observer), NOT emergent from local physics; the persistence, knockout, and puncture results all follow
  from that construction, and are worthwhile because the criterion is implemented and its consequences are
  verified -- not because closure arose on its own. A scalar membrane field under reaction-diffusion, with
  production gated on the boundary staying topologically closed and self-limited by enclosed area, PERSISTS:
  enclosed interior area plateaus at ~149 px (homeostasis, down from the ~465 px seed) with persists == 1.0
  and no collapse within a ~1800-step window. The single-variable negative control (k_prod=0, the
  production loop knocked out, identical seed and wiring) COLLAPSES: closure is lost by step ~96,
  enclosed_area -> 0, persists == 0.0. Flipping one rate constant flips persistence into dissipation, so
  within this authored construction the production loop is what maintains the boundary -- confirmed
  independently by a fatal-puncture viability bound (beer2024deriving): breaking the boundary so nothing is
  enclosed shuts off the closure-gated production, and the ring cannot rebuild from nothing. The boundaries
  of the claim are stated as findings: the homeostatic plateau is metastable, not eternal (the
  physically-correct signature of a closed system with no external influx, not a defect); the
  reaction-diffusion physics has no RNG, so persistence is deterministic and NOT seed-dependent (the
  multi-seed range is a degenerate single point); and this is a minimal self-maintaining boundary, NOT
  real membrane chemistry or metabolism. The v1 maintenance gate is an authored global topological test,
  and the mechanistically-local version that removes it is NO LONGER just a named next step -- it is built
  and measured here as v2 (see below).


  MECHANISM-LEVEL UPGRADE (v2, ProtocellV2, answering peer-review M4). v2 removes the global observer
  entirely -- production depends on a LOCAL interior precursor field p, k_prod*phi*p*(1-phi/phi_max), and
  binary_fill_holes appears ONLY as a passive enclosed_area readout, never in the update (asserted
  structurally on the update''s referenced names). Closure-dependence EMERGES from geometry -- the membrane
  secretes precursor (s_p*phi) and is a barrier to it (mobility Mp*(1-alpha*phi) drops inside the
  membrane), so a CLOSED ring confines the precursor it secretes into the enclosed pocket (measured --
  interior precursor pools from ~0 to ~72 by step 1000) and sustains itself, while an OPEN ring bleeds it.
  MEASURED this build -- the v2 closed loop SUSTAINS topological closure ~2451 internal steps (metastable,
  the same order as v1''s ~2450-2650 window, but with no global observer in the loop; enclosed_area
  declines 465 -> 0 as the membrane thickens inward -- a long metastable transient, not an eternal fixed
  point), while the PRECURSOR knockout s_p=0 (the new mechanistic single-variable control) collapses at
  ~step 95, ~26x faster, as does k_prod=0. The PUNCTURE is now a genuine local PREDICTION, not a
  restatement -- zeroing a 60-degree wedge of the steady ring makes the interior precursor bleed out
  through the gap and the wedge membrane starves LOCALLY (punctured-wedge mass stays ~2 versus ~79 in the
  intact ring at the same step) and never self-heals. So EMERGE is upgraded from authored-closure to
  genuinely-emergent local-mechanism closure. What v2 does NOT do -- reach steady self-maintenance: the
  plateau is still METASTABLE (a closed budget). The open-system driven version (v2-open, ProtocellV2Open)
  is BUILT AND MEASURED, and the honest verdict is that a local external drive does NOT sustain closure
  indefinitely -- it DESTABILISES the ring into faster runaway filling (closure lost ~step 591 vs the
  undriven ~2451; no local drive in an ~80-point sweep reaches a bounded steady enclosed_area), while the
  controls confirm the drive does not rescue closure. So EMERGE stays at genuinely-emergent-but-metastable
  closure, NOT upgraded to steady self-maintenance.'
