parent_studies:
- study: biomolecular-complementarity
  condition: tests-passed
experiment: 'Run reaction-diffusion protocell composites to completion through the process-bigraph
  engine directly from their JSON specs, at TWO mechanistic grains. SPECIFICATION-level (v1):
  protocell-autopoietic (Protocell, a 64x64 Gaussian-annulus membrane field with production gated on a
  global binary_fill_holes topological closure test and self-limited by enclosed area, canonical
  k_prod=0.03, 1800 internal steps) and protocell-vesicle-control (the single-variable knockout, k_prod=0,
  identical seed and wiring, 300 steps); measure whether the closed loop persists while the control
  collapses, and probe the viability bound by puncturing the steady state. MECHANISM-level (v2, M4 answer):
  protocell-autopoietic-v2 (ProtocellV2, the same membrane seed plus an interior precursor field p, with
  production k_prod*phi*p*(1-phi/phi_max) depending on LOCAL precursor and NO global closure observer in
  the update; 1000 internal steps inside the ~2451-step window) and its s_p=0 precursor knockout; measure
  whether closure-dependence EMERGES -- the closed loop confines its self-secreted precursor and sustains
  itself, the precursor knockout collapses, and a wedge puncture makes the interior precursor bleed out and
  the membrane starve locally -- and assert structurally that the update references no binary_fill_holes.
  OPEN-SYSTEM level (v2-open, the remaining EMERGE step): protocell-autopoietic-v2-open (ProtocellV2Open,
  the same v2 seed and physics plus a LOCAL open dissipative throughflow -- uniform precursor feed f_in
  plus washout k_wash to an external reservoir, still no global observer in the update; canonical drive
  f_in=0.01/k_wash=0.02, 1000 internal steps) and its drive-off, s_p=0, and puncture controls; measure
  whether the external drive turns v2''s metastable closure into an INDEFINITE steady self-maintenance --
  the honest verdict reported whichever way it falls -- backed by an ~80-point drive regime sweep.'
result: The autopoietic closed loop persists -- enclosed interior area plateaus at ~149 px (homeostasis,
  down from the ~465 px seed) with persists == 1.0 and collapse_tick == -1.0 over 1800 steps -- while the
  single-variable k_prod=0 vesicle control collapses (enclosed_area -> 0 by step ~96, persists == 0.0),
  implementing the paper's §Self-organized processes autopoiesis criterion as an AUTHORED
  operational-closure criterion (gated by a global binary_fill_holes topological observer, not emergent
  from local physics) and testing its consequences. Within this authored construction persistence tracks
  the internal loop, verified by the knockout (the only differing variable) and independently by a
  fatal-puncture viability bound (beer2024deriving) -- breaking the boundary shuts off the authored closure-gated
  production and the ring cannot rebuild from nothing. The MECHANISM-level v2 (protocell-autopoietic-v2,
  ProtocellV2) then removes the global observer entirely and reproduces closure from LOCAL physics --
  production depends on a local interior precursor confined by the closed membrane -- so closure-dependence
  EMERGES -- the v2 closed loop sustains closure ~2451 internal steps (persists == 1.0, enclosed_area ~293
  px, precursor pooled ~72) with no binary_fill_holes in the update (asserted structurally), the precursor
  knockout s_p=0 collapses at ~step 95, and a wedge puncture makes the interior precursor bleed out so the
  wedge membrane starves locally (~2 vs ~79 intact), never self-healing. EMERGE is upgraded from
  authored-closure (v1) to genuinely-emergent local-mechanism closure (v2). The open-system driven version
  (v2-open, ProtocellV2Open, F-04) is then BUILT AND MEASURED, and the honest verdict is that a local
  external drive does NOT convert the metastable ring into steady self-maintenance -- it DESTABILISES it into
  faster runaway filling (closure lost ~step 591 vs undriven ~2451; no local drive in an ~80-point sweep
  reaches a bounded steady enclosed_area), with the controls confirming the drive does not rescue closure
  (s_p=0 collapses ~step 188, a puncture is not healed). So EMERGE stays at genuinely-emergent-but-metastable
  closure. Remaining boundaries are reported as limitations -- v2''s plateau is still metastable on a finite
  closed budget and external drive does not fix it (the window also depends on seed geometry), the physics is
  deterministic so persistence is not seed-dependent (the multi-seed range is a degenerate single point), and
  this is a minimal self-maintaining boundary, not real membrane chemistry or metabolism.
