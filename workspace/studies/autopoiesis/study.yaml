variants: []
key_assumptions:
- 'HONESTY: this study illustrates the Maturana-Varela CLOSURE PATTERN (each function''s output is a precondition for another function''s flux), not validated autopoiesis. There is no boundary-maintenance criterion, no measured steady state, and no perturbation/recovery test — the loop''s self-maintenance is demonstrated QUALITATIVELY (enzymes and energy climb from zero because a coupled process made them), not quantitatively validated against any autopoietic criterion from the literature.'
- 'All rate constants (k_cat, k_expr, k_rep, yields, assembly/turnover rates) are toy-real: illustrative, uncalibrated against any organism''s measured kinetics.'
- 'Fig 9a''s three-function/three-grain framing is not symmetric in this composite: containment and replication each have three draft grains (replication''s molecular grain is structural, no numeric handler); metabolism has only two (no molecular-grain metabolism draft exists in fig09a-coarse-graining).'
- 'In fig09b''s wiring, containment (lipids → membrane) draws from its own environment-supplied lipid pool in parallel with the metabolism/replication/expression loop, rather than being fed by their outputs. The mutual-dependence closure is demonstrated for metabolism + replication + gene expression; containment''s coupling into that same loop is not modeled here.'
behavior_tests:
- name: containment-three-grains
  classification: primary
  description: 'Law 4''s second home: containment is drawn at three grains in Fig 9a — coarse closure (ContainmentClosureODE), self-organized process (MembraneSelfAssemblyODE), and molecular mechanism (LipidAggregationODE) — each a distinct conforming handler behind its own draft signature, all three producing genuine, non-identical numeric dynamics from the shared lipid driver over one compiled interface.'
  measure:
    kind: observable
    path: containment_coarse.boundary
    expr: last(containment_coarse.boundary)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'containment_coarse.boundary 0.0 → 1.5, containment_selforg.membrane 0.0 → 2.0, containment_molecular.aggregate 0.0 → 1.0 — three distinct grains of one function, each moving under its own handler (exec fig09a-executable, 10 engine steps)'
  requires_simulation: autopoiesis
- name: closure-enzymes-from-zero
  classification: primary
  description: 'The closure pattern''s clearest signature: enzymes start at zero and can ONLY be produced by gene expression, so metabolism cannot flux until the loop has already turned once. Confirmed: enzymes.concentration climbs from 0.'
  measure:
    kind: observable
    path: enzymes.concentration
    expr: last(enzymes.concentration)
  pass_if:
    op: '>='
    value: 0.5
    provenance: 'enzymes.concentration 0.0 → 0.95 over 10 engine steps — metabolism''s catalyst pool exists only because gene expression made it (exec fig09b-executable)'
  requires_simulation: autopoiesis
- name: metabolism-powers-replication
  classification: primary
  description: 'The second link in the closure loop: metabolism''s energy output feeds replication, which spends it to grow the gene pool above its seed — the coupling that ties replication''s fate to metabolism''s output rather than to an independent driver.'
  measure:
    kind: observable
    path: genes.concentration
    expr: last(genes.concentration)
  pass_if:
    op: '>='
    value: 1.3
    provenance: 'genes.concentration 1.0 → 1.69 as energy.energy climbs 1.0 → 1.31 and is spent by replication (exec fig09b-executable, 10 engine steps)'
  requires_simulation: autopoiesis
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'One-line sanity check (NOT the study''s control): the inert fig09b-minimal-cell draft has empty updates by construction, so enzymes stay at seed 0.0 and fail this threshold by design. This confirms the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: enzymes.concentration
    expr: last(enzymes.concentration)
  pass_if:
    op: '>='
    value: 0.5
    provenance: 'inert draft (fig09b-minimal-cell, empty update by construction) stays at enzymes.concentration 0.0 → fails the ≥0.5 threshold by design (expected-fail control)'
  requires_simulation: autopoiesis
