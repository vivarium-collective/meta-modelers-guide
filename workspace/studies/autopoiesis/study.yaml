- name: protocell-autopoietic
  composite: meta_modelers_guide.composites.protocell-autopoietic
  params: {}
- name: protocell-vesicle-control
  composite: meta_modelers_guide.composites.protocell-vesicle-control
  params: {}
- name: protocell-autopoietic-v2
  composite: meta_modelers_guide.composites.protocell-autopoietic-v2
  params: {}
