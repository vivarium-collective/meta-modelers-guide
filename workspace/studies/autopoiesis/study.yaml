conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: 'All four fig09a/fig09b composites build (tests/test_composites_build.py::test_composite_builds, parametrized over every *.composite.json stem) and both fig09a-executable and fig09b-executable run to completion with interface preservation confirmed (tests/test_compilation.py::test_env_conforms_compiles_and_runs).'
  biological_validation:
    result: PASS
    basis: 'PASS at the toy-real, qualitative level ONLY: the Maturana-Varela closure PATTERN is demonstrated (enzymes and energy exist only because a coupled process made them; a coupled function cannot flux from a seeded pool), and containment/replication genuinely instantiate multiple conforming grains behind one interface. This is NOT a validated autopoietic system — no boundary-maintenance, steady-state, or perturbation-recovery criterion from the literature is applied.'
  explanatory_gain:
    result: POSITIVE
    basis: 'Watching enzymes and energy climb from zero — produced by one process before another can use them — makes the closure idea concrete rather than asserted, and containment''s three genuinely-distinct grains behind one interface gives Law 4 a second worked example beyond Fig 6.'
conclusion: '## Claims

  - The three closure processes (metabolism, containment, replication) compile into a minimal cell whose interface is produced by the coupling itself: enzymes and energy exist only because a coupled process made them, not because they were seeded. Containment and replication are each realized by conforming handlers at three grains (coarse closure, self-organized process, molecular mechanism) behind one fixed Fig 9a interface — Law 4''s second worked example; metabolism is realized at two grains in this composite. This is the Maturana-Varela closure PATTERN demonstrated qualitatively, NOT a validated autopoietic system.


  ## Evidence

  - **CONTAINMENT-THREE-GRAINS** — containment_coarse.boundary 0→1.5, containment_selforg.membrane 0→2.0, containment_molecular.aggregate 0→1.0 (fig09a-executable)

  - **CLOSURE-ENZYMES-FROM-ZERO** — enzymes.concentration 0→0.95 (fig09b-executable)

  - **METABOLISM-POWERS-REPLICATION** — genes.concentration 1.0→1.69 as energy.energy 1.0→1.31 (fig09b-executable)

  - **DRAFT-IS-INERT** — sanity check: the inert draft (empty update) keeps enzymes.concentration at 0.0 by construction


  ## Limitations

  - Toy-real constants throughout (k_cat, k_expr, k_rep, yields, assembly/turnover rates); none calibrated against a measured organism.

  - Closure is demonstrated as a PATTERN, not validated: no boundary-maintenance criterion, no measured steady state, no perturbation/recovery test.

  - Containment''s coupling into the metabolism/replication/expression loop is not modeled in fig09b — it draws from its own environment-supplied lipid pool in parallel.

  - Fig 9a''s three-grain framing is asymmetric: containment and replication each get three draft grains (replication''s molecular grain is structural, no numeric handler); metabolism gets two.


  ## Next steps

  - Add a boundary-maintenance or steady-state criterion (e.g. hold volume/surface-area ratio within a band under perturbation) to move from pattern demonstration toward a testable autopoiesis criterion.

  - Wire containment into the same shared-pool loop as metabolism/replication/expression so all three functions are mutually coupled, not two-of-three.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure drafts (fig09a-coarse-graining, fig09b-minimal-cell) compile to executables that run.
    biological_validation: 'The Maturana-Varela closure PATTERN is demonstrated at the toy-real (uncalibrated), qualitative level; no validated autopoiesis criterion is claimed.'
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - a coupled quantity (enzymes, energy) never rises above its zero/seed value, meaning the loop never turns
    - containment's three grains fail to produce non-identical dynamics, meaning the grain-swap did not genuinely install distinct handlers
    block_downstream: 'none — no study in this workspace is gated on this figure''s closure demonstration.'
limitations:
- 'This is a demonstration of the Maturana-Varela closure PATTERN, not a validated autopoietic system: no boundary-maintenance, steady-state, or perturbation-recovery criterion is applied.'
- Toy-real rate constants throughout; none calibrated against literature or a specific organism.
- Metabolism has only two draft grains in fig09a (coarse + self-organized); containment and replication have three, with replication's molecular grain structurally inert.
- Containment in fig09b is supplied from its own driver pool in parallel with the metabolism/replication/expression loop, not fed by their outputs.
falsifiability: Overturned if enzymes.concentration (or another loop-internal quantity) never rises above its zero/seed value across a full run — meaning the coupled loop never actually turns and a downstream process is silently running on a seeded rather than produced pool — or if containment's three declared grains fail to produce genuinely non-identical dynamics under compilation (meaning the grain-swap installed the same effective handler three times rather than three distinct conforming ones).
