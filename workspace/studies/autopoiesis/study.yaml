  classification: diagnostic
  gate_class: regression_pin
  description: 'Diagnostic that the destabilisation is caused by the DRIVE, not by the ProtocellV2Open code
    path -- overriding the drive off (f_in=0, k_wash=0) on the same open composite recovers v2''s
    persistence exactly (persists == 1.0 at 1000 steps, collapse_tick == -1.0), and the open update reduces
    bit-for-bit to rd_step_v2 when the drive is off.'
