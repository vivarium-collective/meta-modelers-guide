result: 'Both drafts compile with their interfaces preserved and run to non-trivial completion. Containment genuinely instantiates three distinct conforming handlers at three grains (boundary 0→1.5, membrane 0→2.0, aggregate 0→1.0), giving Law 4 its second worked example. In the minimal cell, enzymes climb 0→0.95 only because gene expression made them, and metabolism''s energy output (1.0→1.31) is spent by replication to grow the gene pool (1.0→1.69) — the qualitative signature of the Maturana-Varela closure pattern. This is a pattern demonstration, not validated autopoiesis: no boundary-maintenance, steady-state, or perturbation-recovery criterion is tested.'
