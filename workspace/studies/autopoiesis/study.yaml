      starve the boundary locally. Confirmed -- after a 60-degree wedge puncture, enclosed_area stays 0 and
      the punctured-wedge membrane mass stays ~2 versus ~79 in the intact ring at the same step (< 20 pct),
      the gap never healing. The == 0.0 is a deterministic pin (no RNG)
