- name: v2-open-drive-does-not-sustain
  classification: primary
  gate_class: acceptance_criterion
  description: 'OPEN-SYSTEM LEVEL (v2-open, ProtocellV2Open -- the remaining EMERGE step, built and
    measured). The honest measured verdict on whether an external drive makes emergent closure sustain
    INDEFINITELY -- it does NOT. A local open dissipative throughflow (uniform precursor feed f_in plus
    washout k_wash to an external reservoir, no global observer in the update) DESTABILISES the metastable
    v2 ring rather than converting it into a steady state -- the driven loop loses closure at ~step 591,
    ~4x FASTER than the undriven ~2451, via runaway autocatalytic filling (membrane mass runs away far
    above the seed, enclosed_area -> 0), so persists flips to 0.0 within the run window.'
  measure:
    kind: observable
    path: obs.persists
    expr: last(obs.persists)
  pass_if:
    op: ==
    value: 0.0
    kind: acceptance_criterion
    deterministic_pin: true
    provenance: prior -- external drive was hypothesised to possibly turn v2''s metastable closure into an
      indefinite steady self-maintenance; the honest measured result is the opposite. Confirmed -- the
