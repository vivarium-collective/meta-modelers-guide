      tests/test_protocell_viz.py); guarded skip when the optional process_bigraph dependency is absent,
      matching this investigation's convention.
  biological_validation:
    result: PASS
    basis: All primary behavior tests pass on measured readouts. The closed loop persists (enclosed_area
      plateaus ~149 px, persists == 1.0, collapse_tick == -1.0) while the single-variable k_prod=0 control
      collapses (enclosed_area -> 0 by step ~96, persists == 0.0), and the fatal-puncture viability bound
      independently confirms the authored closure-gated production cannot rebuild from a broken boundary.
      The metastability, determinism, and toy-scope boundaries -- and the fact that the closure gate is
      authored, not emergent -- are reported as limitations, not claimed away.
  explanatory_gain:
    result: POSITIVE
    basis: Putting the paper's §Self-organized processes autopoiesis criterion on the lattice turns "a
      membrane persists because the processes inside maintain the organization that keeps them possible"
      into an executable spatial criterion at TWO mechanistic grains. v1 realizes it as an AUTHORED,
      consequence-tested criterion (the k_prod=0 knockout and the fatal-puncture viability bound verify the
      consequences of a hand-coded global closure gate). v2 then removes that gate entirely and realizes
      the SAME criterion from LOCAL physics -- a closed membrane confines its self-secreted precursor and
      sustains itself with no global observer in the loop -- so closure-dependence EMERGES rather than being
      authored, and the puncture becomes a real local prediction (precursor bleeds, membrane starves
      locally). This supplies the boundary-maintenance criterion a coarser, specification-stage lumped
      realization named as its own missing next step, AND builds the mechanistically-local version that was
      v1's own named next step. The open-system (external-influx) version that was v2's own named next step
      is now built and measured too (v2-open, F-04) -- with the honest, informative verdict that a local
      external drive destabilises the metastable ring into faster runaway filling rather than reaching a
      steady state, so no local drive tested converts emergent closure into indefinite self-maintenance.
conclusion: '## Claims


  - The paper''s §Self-organized processes autopoiesis criterion is implemented as an AUTHORED
  operational-closure criterion (production gated by a global binary_fill_holes topological observer, not
  emergent from local physics) and its consequences are tested on a 2D lattice: a scalar membrane field
  with production gated on topological closure and self-limited by enclosed area PERSISTS (enclosed_area
  plateaus ~149 px, persists == 1.0, collapse_tick == -1.0 over 1800 steps), while the single-variable
  k_prod=0 vesicle control COLLAPSES (enclosed_area -> 0 by step ~96, persists == 0.0). Flipping one rate
  constant flips persistence into dissipation.


  - The consequences of the authored closure criterion are verified two ways -- within this construction
  persistence tracks the internal production loop: the knockout (the only differing variable) and
  independently the fatal-puncture viability bound (beer2024deriving) -- breaking the boundary so nothing is
  enclosed shuts off the authored closure-gated production, and the ring cannot rebuild from nothing.


  - MECHANISM-LEVEL EMERGE UPGRADE (v2, ProtocellV2, answering peer-review M4): removing the global
  binary_fill_holes observer from the update and making production depend on a LOCAL interior precursor
  yields GENUINELY EMERGENT closure. The v2 closed loop sustains topological closure ~2451 internal steps
  (persists == 1.0, enclosed_area ~293 px, precursor pooled ~72) with no global observer in the loop; the
  mechanistic precursor knockout s_p=0 collapses at ~step 95; and the puncture is now a real local
  prediction -- interior precursor bleeds out through the gap and the wedge membrane starves locally (~2 vs
  ~79 intact), no self-heal. EMERGE is upgraded from authored-closure to genuinely-emergent
  local-mechanism closure.


  ## Evidence


  - **CLOSED-LOOP-PERSISTS** -- persists == 1.0, membrane_mass > 0 over 1800 steps


  - **CLOSED-LOOP-ENCLOSES-INTERIOR** -- enclosed_area plateaus ~149 px (seed ~465 px), homeostasis


  - **CLOSED-LOOP-NEVER-COLLAPSES** -- collapse_tick == -1.0 within the window


  - **VESICLE-CONTROL-COLLAPSES** -- k_prod=0: persists == 0.0 (single-variable knockout)


  - **VESICLE-CONTROL-LOSES-ENCLOSURE** -- enclosed_area -> 0 by step ~96


  - **PUNCTURE-IS-FATAL** -- after wedge puncture, enclosed_area stays 0 for 1500 steps, phi -> ~0 (viability bound)


  - **V2-EMERGENT-CLOSURE-SUSTAINS** -- v2 (local precursor, no global observer): persists == 1.0, enclosed_area ~293 px, precursor pooled ~72, sustains closure ~2451 steps


  - **V2-UPDATE-HAS-NO-GLOBAL-OBSERVER** -- rd_step_v2 references no binary_fill_holes/enclosed_area (co_names) -- closure is emergent, not authored


  - **V2-PRECURSOR-KNOCKOUT-COLLAPSES** -- s_p=0: persists == 0.0, enclosed_area -> 0 by ~step 95 (mechanistic single-variable control)


  - **V2-PUNCTURE-STARVES-LOCALLY** -- wedge membrane stays ~2 vs ~79 intact, precursor bleeds through the gap, no self-heal (real local prediction)


  - **V2-OPEN-DRIVE-DOES-NOT-SUSTAIN** -- external drive (v2-open, local throughflow): persists == 0.0, closure lost ~step 591 (vs undriven ~2451) via runaway fill, membrane_mass ~3092 -- external drive DESTABILISES, does NOT reach a steady state (no local drive in an ~80-point sweep does)


  - **V2-OPEN-DRIVE-OFF-RECOVERS-V2** -- with f_in=k_wash=0 the same open composite persists == 1.0 at 1000 steps -- the destabilisation is caused by the drive alone


  - **V2-OPEN-CONTROLS-STILL-LOAD-BEARING** -- under drive, s_p=0 still loses closure ~step 188 and a puncture is not healed (enclosed_area stays 0) -- the drive does not rescue closure


  ## Limitations


  - The closure criterion is AUTHORED, not emergent: closure-dependence is hand-coded via a global
  binary_fill_holes topological observer, so the knockout and puncture results are consequence-tests of an
  implemented criterion, not evidence that a boundary made and sustained itself from local physics.


  - The homeostatic plateau is metastable, not eternal -- the physically-correct signature of a closed
  system with no external material influx (perpetual self-maintenance would need a genuine influx and
  would be the less physical result), not a defect.


  - The reaction-diffusion physics has no RNG; persistence is deterministic and NOT seed-dependent (the
  multi-seed range is a degenerate single point, enclosed_area == 149 at every seed), unlike this
  investigation''s CPM/Metropolis studies.


  - This is a minimal self-maintaining boundary demonstrating authored operational closure (the criterion
  implemented, its knockout and puncture consequences verified), NOT real membrane chemistry, a metabolic
  network, or molecular self-production. Parameters are tuned demonstration values, not fitted to any
  organism.


  ## Next steps


  - DONE this build -- Mechanistically-local closure (v2, ProtocellV2): the global binary_fill_holes
  observer is replaced by local physics in which an interior precursor is confined by a closed membrane and
  bleeds out through a leak, so closure-dependence follows from the local dynamics rather than an authored
  global topological test. Measured -- sustains closure ~2451 steps, s_p=0 knockout collapses ~step 95,
  puncture starves locally.


  - DONE this build -- External-influx / open-system autopoiesis (v2-open, ProtocellV2Open, F-04): the v2
  loop is driven with a local open dissipative throughflow (a uniform precursor feed plus washout to an
  external reservoir, no global observer in the update) so it is no longer on a closed budget. MEASURED, and
  the honest verdict is the hard way -- the drive does NOT reach a non-equilibrium steady state; it
  DESTABILISES the metastable ring into faster runaway autocatalytic filling (closure lost ~step 591 at the
  canonical drive vs ~2451 undriven, membrane mass runs away ~624 -> ~3092), and an ~80-point drive sweep
  found no local drive reaching a bounded steady enclosed_area > 0 (a uniform local drive cannot tell
  interior from exterior -- feed over-drives the inward filling, washout starves the ring). The controls
  stay load-bearing (s_p=0 still collapses ~step 188, a puncture is not healed). EMERGE stays at
  genuinely-emergent-but-metastable closure.


  - Still open -- a NON-UNIFORM or geometry-aware open drive (e.g. an absorbing exterior boundary, or a
  feed that couples to the membrane rather than the whole domain) that might break the interior/exterior
  degeneracy this build shows a uniform drive cannot -- the honest next question raised by F-04''s negative
  result.


  - Graded puncture self-repair: extend v2 so a partial puncture can be partially repaired (a small leak
  re-seals as the surrounding membrane re-confines precursor), turning the all-or-nothing viability bound
  into a recovery gradient.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: Both protocell-autopoietic.composite.json and protocell-vesicle-control.composite.json
      build and run to completion through the engine (1800 and 300 internal steps respectively), directly
      from their JSON specs.
    biological_validation: The paper's §Self-organized processes autopoiesis criterion is implemented
      spatially at the toy-real (tuned, uncalibrated) level as an AUTHORED operational-closure criterion
      (a global binary_fill_holes gate, not emergent) whose consequences -- the k_prod=0 knockout and the
      fatal-puncture viability bound -- are verified, with the authored-gate, metastability, determinism,
      and toy-scope boundaries reported as limitations rather than claimed away.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the closed loop fails to persist (enclosed_area falls to 0 or persists != 1.0 within the window --
      the production loop is not firing, or the closure gate is misread)
    - the vesicle control does NOT collapse (persists stays 1.0 with k_prod=0 -- the knockout is being
      silently refilled to the canonical k_prod by core.fill, or diffusion alone is holding the ring)
    - the fatal puncture recovers (enclosed_area rises above 0 after the wedge is zeroed -- closure-gated
      production is firing with nothing enclosed, breaking the viability bound)
    block_downstream: none -- no study in this workspace is gated on this closure demonstration.
limitations:
- 'The v1 closure criterion (protocell-autopoietic) is AUTHORED, not emergent: closure-dependence is
  hand-coded via a global binary_fill_holes topological observer, so its knockout and puncture results are
  consequence-tests of an implemented criterion. This limitation is SPECIFIC TO v1 and is ADDRESSED by v2
  (protocell-autopoietic-v2, ProtocellV2), the mechanism-level realization built and measured in this same
  study -- v2''s production depends on a local interior precursor with no global observer in the update, so
  its closure-dependence is emergent (sustains closure ~2451 steps; s_p=0 knockout collapses ~step 95;
  puncture bleeds precursor and starves the wedge locally).'
- 'v2''s emergent closure is still METASTABLE, not eternal: enclosed_area declines 465 -> 0 over ~2451
  internal steps as the membrane thickens inward and the interior fills -- a long metastable transient on a
  finite closed budget, of the same order as v1''s window, not a true fixed point. The open-system version
  driven by external influx is BUILT AND MEASURED (v2-open, ProtocellV2Open, F-04) and does NOT remove this
  limitation -- a local external drive destabilises the ring into faster runaway filling (closure lost ~step
  591 vs undriven ~2451) rather than reaching a steady state, and no local drive in an ~80-point sweep
  reaches a bounded steady enclosed_area > 0, so v2-open remains non-steady (indeed shorter-lived than v2).
  The metastable window also depends on seed geometry -- a thinner seed ring fills faster (measured -- a
  sigma=2.2 ring collapses by ~step 975).'
- 'The homeostatic plateau is metastable, not perpetual: a closed toy system with no external material
  influx self-maintains over a bounded window (~2000 internal steps, versus the control''s ~96-step
  collapse) and eventually runs down. This is the physically-correct signature of finite closure --
  perpetual self-maintenance would require a genuine energy/material influx -- not a defect.'
- 'The reaction-diffusion physics has no RNG. The Protocell seed config is accepted but currently inert,
  so persistence is deterministic and NOT seed-dependent (unlike this investigation''s CPM/Metropolis
  studies). The multi-seed regression''s reported range is a degenerate single point (enclosed_area == 149
  at every seed 1-5), not stochastic robustness.'
- 'This is a minimal self-maintaining boundary, NOT real membrane chemistry or metabolism. What is
  demonstrated is authored operational closure -- the criterion implemented, its consequences verified via
  the k_prod=0 flip and the fatal puncture -- not lipid biophysics, a metabolic network, or molecular
  self-production.'
- 'The parameters (D=0.02, k_decay=0.01, k_prod=0.03, thr=0.30) are tuned demonstration values, not fitted
  to a measured membrane or organism, and no literature acceptance band is claimed. D=0.02 sits inside the
  mild second-order-diffusion CFL D <= 0.25; the process raises on an unstable dt rather than silently
  admitting it.'
- 'Persistence is a global-binary closure judgement (enclosed area > 0 AND mass held, together): a
  partial puncture cannot be partially repaired in this build. Graded puncture self-repair is a named next
  step, not something this study shows.'
- The multi-grain composition idea (the same function realized by conforming handlers at
  coarse, self-organized, and molecular grains behind one interface) is out of scope; this
  study addresses containment closure at a single spatial mechanistic grain.
- The membrane-closure loop is modeled in isolation; coupling it to metabolism and replication
  through shared component pools (a three-function mutual-closure minimal cell) is a named next
  step.
falsifiability: 'v1 (specification-level) is overturned if the closed loop fails to persist within the
  plateau window (enclosed_area falls to 0 or persists != 1.0 -- the production loop not maintaining the
  boundary), if the k_prod=0 vesicle control does NOT collapse (persistence not actually caused by the loop
  -- e.g. the knockout is silently refilled to the canonical k_prod, or diffusion alone holds the ring), or
  if the fatal puncture recovers (enclosed_area rising above 0 after the wedge is zeroed -- closure-gated
  production firing with nothing enclosed, breaking the viability bound). v2 (mechanism-level EMERGE
  upgrade) is overturned if the v2 closed loop does NOT sustain closure inside its window (enclosed_area ->
  0 or persists != 1.0 -- the local precursor loop not maintaining the boundary), if the s_p=0 precursor
  knockout does NOT collapse (persistence not caused by the local precursor -- e.g. diffusion or the seed
  alone holds the ring), if the v2 update is found to reference a global closure operator such as
  binary_fill_holes (closure-dependence would then be authored, not emergent), or if a puncture SELF-HEALS
  (enclosed_area recovering above 0 or the wedge membrane rebuilding to intact levels -- the interior
  precursor not actually bleeding out through the gap). v2-open (open-system EMERGE step) carries a
  DIFFERENT falsifiable claim -- that a local external drive DESTABILISES rather than sustains: it is
  overturned if the canonical driven loop instead reaches a bounded steady enclosed_area > 0 that persists
  indefinitely (the honest verdict would then flip to steady self-maintenance), if the drive-off override
  does NOT recover v2''s persistence (the destabilisation would then be a code artefact, not the drive), or
  if the drive RESCUES a control (the s_p=0 knockout re-closing, or a puncture healing above enclosed_area 0
  -- closure would then not be load-bearing under drive). The measured result is reported honestly whichever
  way these fall; as built they fall to destabilisation, not steady self-maintenance.'
