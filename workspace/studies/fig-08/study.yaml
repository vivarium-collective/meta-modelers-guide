schema_version: 4
name: fig-08
investigation: paper-figures
title: "fig-08: Self-organized processes"
created: '2026-08-26'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional  # self-maintenance isolated by two independent process-knockout controls (metabolism KO; gene-expression KO), deterministic (reproduces exactly), all pools strictly positive/bounded over 40 ticks; kept Provisional -- toy-real and uncalibrated (no literature flux, no spatial membrane), so no promotion without the scientific-validation gate.
confidence_basis: 'Calibrated off Provisional. BASELINE (fig08-runnable): compositional dependence is demonstrated by knockout, but the flat pools only accumulate -- behavioral verification, held at Medium. MECHANISTIC VARIANT (fig08-mechanistic, scientific-review revision) materially raises mechanistic support: a cell with a membrane boundary, first-order turnover, ATP-costed repair and viability shows persistence at a steady state, component replacement, recovery from a membrane injury (viability dip 0.71 -> 0.92), and viability collapse to 0 when any one of import/metabolism/expression/repair is knocked out or the medium is not replenished. The study is still held at Provisional because the membrane is a scalar area (not a spatial self-produced boundary), the viability target and rate constants are scripted, and nothing is calibrated to a named organism or measured turnover/repair rate -- so this is organizational self-maintenance, not autopoiesis in the strong sense (finding F-06).'
question: 'Is the paper''s Fig. self_organized_process (§Composition of the cellular interface) executable rather than merely drawn -- does the `fig08-runnable` composite actually demonstrate that a cellular interface EMERGES when molecular processes are compositionally coupled so they maintain one another (metabolism synthesizes the components the membrane and replication need, containment/expression maintain the pools metabolism needs), so that the coupled system holds a sustained, far-from-equilibrium balance rather than each process running down independently?'
biological_summary: 'This study makes Fig. self_organized_process runnable. The paper''s §Composition of the cellular interface asks how molecular processes give rise to a cellular interface: at the molecular level, reactions, transport, and template-directed synthesis act on shared variables, and "a cellular interface emerges when these processes are compositionally coupled so that they maintain one another" -- membrane structure depends on metabolism that synthesizes lipids, metabolism depends on containment to maintain concentrations, and template-directed synthesis maintains the molecular components that realize these processes over time (caption a: self-organized processes -- autocatalysis, membrane formation, template replication -- combine into a self-maintaining organization; caption b: a minimal cell composition diagram -- metabolism, containment, replication supporting each other through shared components).


  The `fig08-runnable` composite is the executable form of caption b. It wires the six minimal-cell processes -- containment (assembles membrane from lipids), metabolism (turns enzymes + nutrients into metabolites + energy), gene expression (translates genes + amino_acids into proteins + enzymes), replication (copies genes by spending energy, returns nucleic_acids), diffusion (metabolite turnover), and mass-action reactions (interconvert building blocks) -- over ten FLAT scalar building-block pools they all share (membrane, lipids, metabolites, nutrients, amino_acids, nucleic_acids, enzymes, proteins, genes, energy). Because the processes share those pools, none stands alone: gene expression makes the enzymes metabolism needs, metabolism makes the energy replication spends, replication grows the gene template expression reads. This is the paper''s closure condition made concrete -- each process''s outputs sustain the inputs the others depend on.


  Run 40 ticks through the process-bigraph engine (deterministic ODE handlers, no RNG), the coupling holds: every one of the observed pools stays strictly positive and bounded (nothing collapses to zero, nothing explodes -- the largest pool, membrane, reaches only 2.2). The catalytic/template pools hold a sustained steady balance (genes 1.00 -> 1.07, energy 0.50 -> 0.58, metabolites 0.30 -> 0.33, nucleic_acids 0.30 -> 0.29; each drifts < 25% over the second half of the run) while the cell''s structural material is net-produced (membrane 0.2 -> 2.2, proteins 0.30 -> 0.88, enzymes 0.30 -> 0.50). That the balance is MAINTAINED by the coupling, not intrinsic to any one pool, is shown by opening the loop: knock metabolism out and its downstream metabolite pool collapses toward zero (0.33 -> 0.011) while energy, whose only source is metabolism, freezes exactly at its 0.5 seed; knock gene expression out and the enzyme pool metabolism depends on freezes exactly at its 0.3 seed, dragging metabolism''s own metabolite output down (0.33 -> 0.23). The sustained balance is the composite maintaining one another''s inputs, not each process coasting on its own reserves.


  The workbench 0.4.1 rebuild also makes the figure''s minimal-cell panel runnable as a nested-store executable (`fig08b-executable`, carried in `scripts/_catalog/measured_readouts.json`): where an earlier build of that panel was inert, over its 8-step catalog window the minimal cell now GROWS across its coupled stores -- membrane.area 0.2 -> 1.4, proteins.enzymes 0.3 -> 0.975, proteins.pool 0.3 -> 1.572, energy 0.5 -> 0.869, genes 1.0 -> 1.28, and metabolites.amino_acids 1.0 -> 1.146 (nucleic_acids holds ~0.30) -- the coupled minimal cell building structure and expression off its catalytic pools rather than sitting still. Confirmed in-memory.


  This is a didactic, toy-real realization: the pools, rate constants, and yields are hand-chosen so the coupled balance is legible over a 40-tick run, NOT calibrated to a named organism, metabolite, or literature flux. Its rigorous cousin is the `autopoiesis` study in the `draft-to-living-cell` investigation, which realizes the same self-maintenance claim at higher fidelity; this study''s job is only to show that the figure''s specific caption -- coupled processes maintaining one another into a self-sustaining whole -- runs and holds under test.'
claim: 'Fig. self_organized_process is executable: the `fig08-runnable` composite couples containment, metabolism, gene expression, replication, diffusion, and mass-action reactions over ten shared flat building-block pools, and over a deterministic 40-tick run it demonstrates the caption''s exact principle -- the coupled processes maintain one another into a sustained, far-from-equilibrium balance (every pool strictly positive and bounded; template/catalytic pools genes, energy, metabolites, nucleic_acids hold steady within 25% while structural material membrane, proteins, enzymes is net-produced), and that balance is a property of the COUPLING, not of any pool in isolation: removing metabolism starves its downstream metabolite pool toward zero and freezes energy at its seed, and removing gene expression freezes the enzyme pool metabolism depends on and drops metabolism''s metabolite output. This is a toy-real didactic demonstration, not a calibrated model; its rigorous cousin is the `autopoiesis` study in `draft-to-living-cell`.'
baseline:
- name: fig08-runnable
  composite: meta_modelers_guide.composites.fig08-runnable
  params: {}
variants:
- name: fig08-mechanistic
  composite: meta_modelers_guide.composites.fig08-mechanistic
  params: {}
  rationale: 'Real-mechanism upgrade (scientific-review revision, Oct 2026). The baseline fig08-runnable shows DEPENDENCE via process knockout, but its flat pools only ACCUMULATE — there is no membrane that gates anything, no turnover, no repair, no failure, so it cannot show the properties that make "self-maintenance" meaningful. This variant builds a self-maintaining cell (SelfMaintainingCell on a replenished NutrientReservoir) with: a membrane that GATES nutrient import; metabolism that makes ATP + precursors (needs enzymes); ATP-COSTED synthesis of enzymes and REPAIR of the membrane; first-order DEGRADATION of every component (so persistence requires continuous replacement); and VIABILITY dynamics. It grows to a far-from-equilibrium STEADY STATE, a one-time membrane injury at tick 45 is REPAIRED and viability RECOVERS, and breaking any edge of the operational-closure loop (knock out import/metabolism/expression/repair, or stop replenishing the medium) collapses viability. Operational closure and boundary maintenance are DEFINED before the word autopoiesis is used, and the honest finding is that this shows operational closure + homeostasis + recovery (DEPENDENCE and self-maintenance in the organizational sense) but NOT autopoiesis in the strong sense (the boundary is a scalar area; the viability target is scripted). Baseline kept intact as the didactic smoke test.'
key_assumptions:
- 'The `fig08-runnable` composite is a **didactic, toy-real** realization of the figure -- small, illustrative, built to look like Fig. self_organized_process b and play forward. The ten building-block pools, the six processes'' rate constants (assembly_rate 0.05, k_cat 0.1, k_expr 0.08, k_rep 0.015, turnover_rate 0.08, k_react 0.06), and the yields are hand-chosen so the coupled balance is legible over 40 ticks. They are NOT calibrated to a named organism, metabolite, enzyme, or literature flux.'
- 'The composite integrates over FLAT scalar pools (membrane, lipids, metabolites, ...), not spatially resolved fields or a real membrane geometry. "Containment" here is a scalar membrane-assembly ODE, not a diffusion barrier maintaining a concentration gradient in space. The self-maintenance shown is compositional (shared-pool coupling), not spatial.'
- 'The handlers are deterministic ODEs with no random seed, so every number below is exactly reproducible run to run; there is no stochasticity to average over.'
- 'The mutual-maintenance loop is demonstrated by process knockout (deleting a process from the state), which drives that process''s contribution to its shared pools to zero. This isolates each coupling edge but is a structural intervention on the composite, not a perturbation of a physical rate.'
- 'The rigorous cousin is the `autopoiesis` study in the `draft-to-living-cell` investigation; this study does not restate that study''s numbers or fidelity as its own.'
acceptance_criteria:
- The coupled composite sustains itself over the full run -- every observed shared pool stays strictly positive (nothing collapses to zero) and bounded (nothing explodes).
- The catalytic/template pools (genes, energy, metabolites, nucleic_acids) hold a sustained steady balance across the second half of the run, while the cell's structural material (membrane, proteins, enzymes) is net-produced -- a far-from-equilibrium organization maintaining structure over time, not an equilibrium flatline.
- 'The sustained balance is a property of the coupling, not of any pool in isolation: removing metabolism starves its downstream metabolite pool (toward zero) and freezes the energy pool it is the sole source of.'
- 'The maintenance loop closes both ways: removing gene expression, the sole source of the enzyme pool metabolism depends on, freezes that enzyme pool at its seed and lowers metabolism''s own metabolite output -- each process''s outputs sustain the inputs the others depend on.'
units_and_time:
  time: 1 tick = process interval 1.0, dimensionless model time; the run is 40 ticks (41 emits including t=0).
  quantities: 'all pool values are dimensionless model concentrations / area / energy units -- membrane carries type `area`, energy carries type `energy`, the rest `concentration`; none is calibrated to a physical unit. Rate constants and yields are dimensionless per-tick coefficients.'
  note: No quantity here is calibrated to a named organism, metabolite, enzyme, or literature flux; the numbers exist to make the coupled balance legible, not to match data.
behavior_tests:
- name: closure-sustains-itself-every-pool-positive
  classification: primary
  description: Over the full 40-tick run every observed shared pool (membrane, metabolites, enzymes, proteins, genes, energy, nucleic_acids) stays strictly positive -- the coupled organization sustains itself, nothing collapses to zero (caption a self-maintaining organization).
  measure:
    kind: observable
    path: min over run of each pool
    expr: min(series[k]) for k in the seven emitted pools
  pass_if:
    op: '>'
    kind: acceptance_criterion
    value: 0.0
    provenance: 'prior: a self-maintaining composition keeps every shared store above zero for the run. Observed (deterministic): pool minima all > 0 -- smallest is metabolites (min 0.267), largest floor genes (min 1.0); membrane 0.2 -> 2.2 monotone. The > 0 direction is the a-priori prediction (tests/test_fig08_autopoiesis.py::test_every_pool_stays_positive)'
  requires_simulation: fig08-runnable
- name: closure-is-bounded-nothing-explodes
  classification: primary
  description: The coupled balance neither runs away nor blows up -- every pool stays well bounded over the run, the mark of a maintained far-from-equilibrium steady state rather than an unstable positive-feedback loop.
  measure:
    kind: observable
    path: max over run of each pool
    expr: max(series[k]) for k in the seven emitted pools
  pass_if:
    op: <
    kind: acceptance_criterion
    value: 1000.0
    provenance: 'prior: a maintained balance does not explode. Observed (deterministic): the largest value any pool reaches over the run is membrane at 2.2, far under the 1e3 guard; the < 1e3 bound is a loose sanity ceiling, boundedness is the a-priori prediction (tests/test_fig08_autopoiesis.py::test_every_pool_stays_bounded)'
  requires_simulation: fig08-runnable
- name: template-pools-hold-a-steady-balance
  classification: primary
  description: The catalytic/template pools (genes, energy, metabolites, nucleic_acids) hold a sustained steady balance across the second half of the run -- the maintained state the coupling produces, not a pool draining or accumulating.
  measure:
    kind: observable
    path: relative drift midpoint -> end of each template pool
    expr: abs(s[-1] - s[mid]) / max(s[mid], 1e-9) for k in (genes, energy, metabolites, nucleic_acids)
  pass_if:
    op: <
    kind: acceptance_criterion
    value: 0.25
    provenance: 'prior: under closure the catalytic/template pools settle to a sustained balance (small second-half drift). Observed (deterministic) relative drift midpoint->end: genes 0.034, energy 0.083, metabolites 0.203, nucleic_acids 0.000 -- all < 0.25; the 0.25 threshold is a legibility bound, the "holds steady" direction is the prediction (tests/test_fig08_autopoiesis.py::test_template_pools_hold_a_steady_balance)'
  requires_simulation: fig08-runnable
- name: structural-material-is-net-produced
  classification: primary
  description: While the template pools hold steady, the cell's structural material (membrane, proteins, enzymes) is net-produced over the run -- the organization builds itself, the far-from-equilibrium direction the paper describes.
  measure:
    kind: observable
    path: end vs start of each structural pool
    expr: s[-1] > s[0] for k in (membrane, proteins, enzymes)
  pass_if:
    op: '>'
    kind: acceptance_criterion
    value: 0.0
    provenance: 'prior: the coupling net-produces structural material. Observed (deterministic) start -> end: membrane 0.20 -> 2.20, proteins 0.30 -> 0.88, enzymes 0.30 -> 0.50 -- each end strictly above its start (the pass_if encodes end - start > 0) (tests/test_fig08_autopoiesis.py::test_structural_material_is_net_produced)'
  requires_simulation: fig08-runnable
- name: metabolism-knockout-starves-downstream-pools
  classification: primary
  description: The sustained balance is a property of the coupling, not of any pool in isolation. Remove metabolism (its sole downstream source) and metabolites collapse toward zero while energy, whose only source is metabolism, freezes exactly at its seed.
  measure:
    kind: derived
    path: baseline vs metabolism-knockout end states
    expr: metabolites_ko / metabolites_base at end; energy_ko drift; energy_base growth
  pass_if:
    op: starves_downstream
    kind: acceptance_criterion
    value: metabolites_ko(0.011) < 0.5 * metabolites_base(0.33) and energy frozen at 0.5 (base grows 0.50 -> 0.58)
    provenance: 'prior: removing a process opens the loop and its downstream shared pools respond. Observed (deterministic): metabolites end 0.33 (base) -> 0.011 (KO), well under half of base; energy stays exactly 0.5 with metabolism removed vs growing to 0.58 in the baseline -- the dependent pools track the coupling, not their own reserves (tests/test_fig08_autopoiesis.py::test_knocking_out_metabolism_starves_downstream_pools)'
  requires_simulation: fig08-runnable
- name: gene-expression-sustains-the-enzymes-metabolism-depends-on
  classification: primary
  description: The maintenance loop closes both ways. Gene expression is the sole source of the enzyme pool, and metabolism depends on those enzymes. Knock gene expression out and the enzyme pool freezes exactly at its seed, dragging metabolism's own metabolite output down -- each process's outputs sustain the inputs the others depend on.
  measure:
    kind: derived
    path: baseline vs gene-expression-knockout end states
    expr: enzymes_ko drift; enzymes_base growth; metabolites_ko vs metabolites_base at end
  pass_if:
    op: sustains_partner_inputs
    kind: acceptance_criterion
    value: enzymes frozen at 0.30 in KO (base grows 0.30 -> 0.50) and metabolites_ko(0.23) < metabolites_base(0.33)
    provenance: 'prior: the coupling that sustains one process''s inputs from another''s outputs is what keeps the balance up. Observed (deterministic): with gene expression removed the enzyme pool stays exactly 0.30 across the whole run (min == max == 0.30) vs growing to 0.50 in the baseline, and metabolism''s metabolite output falls from 0.33 to 0.23 -- the partner-input coupling made concrete (tests/test_fig08_autopoiesis.py::test_gene_expression_sustains_the_enzymes_metabolism_depends_on)'
  requires_simulation: fig08-runnable
- name: runs-default-n-steps
  classification: diagnostic
  control: positive
  description: 'Foundational control (not the scientific claim): the composite builds and runs its declared default horizon through the process-bigraph engine, emitting one row per tick plus the t=0 emit.'
  measure:
    kind: observable
    path: len(emitted rows)
    expr: len(trajectory) == default_n_steps + 1
  pass_if:
    op: ==
    kind: regression_pin
    deterministic_pin: true
    value: 41.0
    provenance: 'the composite declares default_n_steps == 40 and emits 41 rows (including the t=0 emit); an exact count pin, exact while the composite horizon is pinned (tests/test_fig08_autopoiesis.py::test_runs_default_n_steps)'
  requires_simulation: fig08-runnable
# ── mechanistic variant (fig08-mechanistic) — scientific-review revision ──────
# A self-maintaining cell with a boundary, turnover, repair and viability.
# Classified by the reviewer's evidence taxonomy (pass_if.kind).
- name: mech-persists-and-pools-bounded
  classification: primary
  variant: fig08-mechanistic
  description: 'Every component stays strictly positive and bounded, and with no injury the cell grows to a far-from-equilibrium STEADY STATE and holds it (small second-half drift) — persistence through continuous replacement, not the baseline''s monotonic accumulation.'
  measure:
    kind: observable
    path: min/max of each pool; second-half relative drift
    expr: min(pool) > 0, max(pool) bounded; |s[-1]-s[60]|/s[60] small
  pass_if:
    op: persists
    kind: invariant
    value: all pools > 0 and bounded; steady-state drift < 0.1
    provenance: 'INVARIANT. Observed all pools strictly positive and bounded over 90 ticks; with perturbation off, membrane/enzymes/energy second-half drift < 0.1 — a maintained steady state, not accumulation (tests/test_fig08_mechanistic.py::test_all_pools_positive_and_bounded, ::test_persists_at_a_steady_state)'
  requires_simulation: fig08-mechanistic
- name: mech-turnover-requires-replacement
  classification: primary
  variant: fig08-mechanistic
  description: 'The steady-state membrane is HELD by repair balancing first-order degradation — active component REPLACEMENT. Knock out repair and the membrane decays away, so the maintained level is a dynamic balance, not an inert store.'
  measure:
    kind: derived
    path: membrane end-state, repair on vs off
    expr: membrane(repair on) held; membrane(repair off) → ~0
  pass_if:
    op: replacement_required
    kind: mechanistic_ablation
    value: membrane(repair on) > 2.0 and membrane(repair off) < 0.3× that
    provenance: 'MECHANISTIC_ABLATION. Observed membrane held at ~3.8 with repair on, decaying toward 0 with repair off (epsilon) — turnover unopposed; the steady level requires continuous replacement (tests/test_fig08_mechanistic.py::test_turnover_requires_active_replacement)'
  requires_simulation: fig08-mechanistic
- name: mech-recovers-after-injury
  classification: primary
  variant: fig08-mechanistic
  description: 'A one-time membrane injury at tick 45 (−60%) drops the boundary and depresses viability; the cell then REPAIRS the membrane and viability RECOVERS to its pre-injury steady state. Self-repair, not a scripted bounce — with repair off there is no recovery, and an early injury (tick 25) is also recovered.'
  measure:
    kind: derived
    path: membrane, viability around the injury; recovery vs repair-off
    expr: injury drop; viability dip; end recovers to pre-injury; no recovery if repair off
  pass_if:
    op: recovers
    kind: mechanistic_ablation
    value: mem[45] < 0.6·mem[44]; viability dips; mem[end] > 0.9·mem[44]; repair-off stays collapsed
    provenance: 'MECHANISTIC_ABLATION. Observed injury membrane 3.75→1.50, viability dip to 0.71, recovery to membrane 3.70 / viability 0.92 by tick 90; recovery requires active repair (repair-off stays collapsed), and an early injury at tick 25 is also recovered (tests/test_fig08_mechanistic.py::test_recovers_after_membrane_injury, ::test_repeated_perturbation_persists)'
  requires_simulation: fig08-mechanistic
- name: mech-closure-break-collapses-viability
  classification: primary
  variant: fig08-mechanistic
  description: 'Operational closure means every edge of the loop is required. Knocking out import, metabolism, enzyme-synthesis, or repair (epsilon, not 0.0) each collapses the membrane and drives viability to ~0 — dependence on every coupling edge, demonstrated.'
  measure:
    kind: derived
    path: final viability + membrane under each single knockout
    expr: viability → ~0 and membrane → ~0 for each of the four knockouts
  pass_if:
    op: closure_required
    kind: mechanistic_ablation
    value: final viability < 0.1 and membrane < 0.5 for KO transport/met/expr/repair
    provenance: 'MECHANISTIC_ABLATION (four single knockouts, epsilon). Observed final viability 0.00 and membrane collapsed for each of k_transport / k_met / k_expr / k_repair — every edge of the operational-closure loop is load-bearing (tests/test_fig08_mechanistic.py::test_knockout_collapses_viability[*])'
  requires_simulation: fig08-mechanistic
- name: mech-depends-on-external-input
  classification: diagnostic
  variant: fig08-mechanistic
  description: 'Matched external-input accounting: on a non-replenished (closed) medium the external nutrient is drawn down and the cell cannot self-maintain — viability collapses. The self-maintenance is of ORGANIZATION, not of matter/energy; it runs on a throughput the medium must supply.'
  measure:
    kind: derived
    path: external nutrient + viability under no replenishment
    expr: nutrient_ext → ~0 and viability → ~0
  pass_if:
    op: throughput_required
    kind: mechanistic_ablation
    value: nutrient_ext < 0.2 and viability < 0.3 without replenishment
    provenance: 'MECHANISTIC_ABLATION. Observed the medium depletes and viability collapses to 0.00 with replenishment off (epsilon) — the cell maintains organization on a required external throughput, it does not create matter/energy (tests/test_fig08_mechanistic.py::test_depends_on_external_input)'
  requires_simulation: fig08-mechanistic
