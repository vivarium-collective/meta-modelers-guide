findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The `fig08-runnable` composite makes Fig. self_organized_process executable: six processes coupled over ten shared flat building-block pools maintain one another into a sustained, far-from-equilibrium balance. Over a deterministic 40-tick run every observed pool stays strictly positive and bounded (nothing collapses to zero, the largest pool reaches only 2.2), the catalytic/template pools hold a steady balance (genes, energy, metabolites, nucleic_acids drift < 25% over the second half) while the cell''s structural material is net-produced (membrane 0.2 -> 2.2, proteins 0.30 -> 0.88, enzymes 0.30 -> 0.50). This is caption a''s self-maintaining organization, running.'
  evidence:
    from_test: template-pools-hold-a-steady-balance
    from_run: fig08-runnable
    observed: pool minima all > 0; template drifts genes 0.034 / energy 0.083 / metabolites 0.203 / nucleic_acids 0.000; membrane 0.2 -> 2.2, proteins 0.30 -> 0.88
  provenance:
    run_ids:
    - fig08-runnable
    ontology_terms:
    - containment: 'GO:0016044 (membrane organization)'
