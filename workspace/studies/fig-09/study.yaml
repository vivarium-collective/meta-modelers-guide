findings:
- id: F-01
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'Division realized as a genuine place-graph rewrite ADDS cell nodes at runtime and orders replication before division, exactly as caption a describes (DNA replication then separation into daughters). Over a deterministic 12-tick run the colony grows 1 -> 2 -> 4 cells, the count never falling, and at each round the chromosome count doubles (replication) a half-cycle before the cell count doubles (division). Confirmed: cells reach 4, monotone non-decreasing; first replication at t=3 strictly precedes first division at t=6.'
  evidence:
    from_test: replication-precedes-division
    from_run: fig09-rewrite
    observed: cells 1 -> 2 (t=6) -> 4 (t=12); chromosome count doubles at t=3 while cells still 1
  provenance:
    run_ids:
    - fig09-rewrite
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The composite realizes caption b''s core claim -- "division ... partitions state variables such as DNA ... into two cells" -- as a CONSERVING, EQUIPARTITIONING rewrite. At each replication the total DNA store doubles (1.0 -> 2.0 -> 4.0); at each division the boundary count exactly doubles, the total DNA is conserved across the split (nothing created or destroyed), and each daughter inherits exactly half of a parent cell''s DNA. Confirmed at both division events: t=6 (2.0 conserved, 1.0 per daughter) and t=12 (4.0 conserved, 1.0 per daughter). One maintained boundary becomes two with its stores partitioned across the daughters -- executable, not merely drawn.'
  evidence:
    from_test: division-conserves-and-equipartitions-dna
    from_run: fig09-rewrite
    observed: 'division events: 1->2 cells, DNA 2.0 conserved -> 1.0 each; 2->4 cells, DNA 4.0 conserved -> 1.0 each (each daughter = half of parent, all deterministic)'
  provenance:
    run_ids:
    - fig09-rewrite
    ontology_terms:
    - cell_cycle_division: 'GO:0051301 (cell division)'
    - replication: 'GO:0006260 (DNA replication)'
    - chromosome_partition: 'GO:0007059 (chromosome segregation)'
    - dna: 'SO:copy number'
- id: F-03
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The per-cell DNA content follows a strict replicate-then-halve invariant across the whole cell cycle, sharper than the aggregate conservation claim. Over the deterministic 12-tick run the per-cell DNA vector cycles [1.0] -> [2.0] -> [1.0, 1.0] -> [2.0, 2.0] -> [1.0, 1.0, 1.0, 1.0]: each cell doubles its chromosome to dna 2.0 at replication, then splits into two daughters of exactly dna 1.0 at division. So immediately after each division every cell carries exactly one chromosome at the 1.0 founder set point and the total DNA store exactly equals the cell count -- the "one chromosome, dna == 1.0 per daughter" invariant holds identically at both division events. Confirmed in-memory via build_fig10_division(cycle=3).'
  evidence:
    from_run: fig09-rewrite
    observed: 'per-cell DNA by tick: t=0 [1.0]; t=3 [2.0]; t=6 [1.0, 1.0]; t=9 [2.0, 2.0]; t=12 [1.0, 1.0, 1.0, 1.0] -- total DNA == cell count at every post-division state'
  provenance:
    run_ids:
    - fig09-rewrite
    ontology_terms:
    - replication: 'GO:0006260 (DNA replication)'
    - cell_cycle_division: 'GO:0051301 (cell division)'
- id: F-04
  kind: computational
  tier: mechanism
  status: novel
  variant: fig09-mechanistic
  statement: 'Division becomes an OUTCOME of physiology, not a clock — fixing the review''s objection that the baseline''s 1→2→4 verifies only the graph rewrite. In the mechanistic variant each cell grows by Michaelis–Menten uptake of a shared finite nutrient and divides ONLY when it has grown past a size checkpoint, completed replication, and has the energy for it. The colony grows 1→2→4→8→16 when fed, but under starvation (nutrient ≈ 0) the cell never reaches the checkpoint and division is DELAYED indefinitely (0 divisions over 40 ticks). A grown but under-energised or un-replicated cell also does not divide. So the 1→2→4→8→16 is now caused by growth, with the inter-division interval set by how fast the cell grows.'
