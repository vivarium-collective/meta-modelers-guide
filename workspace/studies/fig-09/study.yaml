    basis: 'Reported in two layers, per the review. BEHAVIORAL (baseline fig09-rewrite): the colony grows 1→2→4, replication precedes division, total DNA doubles at replication, and every division doubles the boundary count while conserving + equipartitioning the DNA store — all exact deterministic pins. This verifies the place-graph REWRITE and bookkeeping, not biological growth (division fires on a clock; the duplicated DNA appears for free). MECHANISTIC (variant fig09-mechanistic): division is an OUTCOME of growth/energy/size (starvation delays it indefinitely; a mechanistic_ablation), replication draws DNA from a nucleotide pool so DNA+nucleotides is conserved (invariant), and every material partition is conserved across the rewrite with energy = parent − div_cost. This is genuine mechanistic support for "division is a compositional rewrite driven by growth." NOT yet empirical validation against a measured cell-cycle time, growth rate, or genome — that remains the sibling investigation `draft-to-living-cell`.'
  explanatory_gain:
    result: POSITIVE
    basis: 'Realizing Fig. division as a genuine `overwrite[tree[node]]` rewrite -- deleting one cell node and adding two daughter nodes with partitioned chromosome subtrees at runtime -- makes the paper''s "division is a compositional rewrite in which one maintained boundary becomes two, with stores partitioned across daughters" claim literally executable and steppable, rather than a static three-panel drawing. A viewer can watch one boundary become two and the DNA store split evenly, frame by frame.'
conclusion: "## Claims\n\n- Realizing the paper's Fig. division caption b as a genuine place-graph rewrite over a colony `tree[node]` store (one `CellCycleDivision` process alternating REPLICATE and DIVIDE rewrites through the process-bigraph engine) reproduces \"division ... partitions state variables such as DNA ... into two cells.\" Over a deterministic 12-tick run the founder cell replicates its chromosome (DNA store 1.0 -> 2.0, boundary count still 1) then divides (one cell becomes two, each daughter carrying one chromosome with dna 1.0), repeating to 4 cells.\n\n- At every division event the boundary count exactly doubles, the total DNA store is conserved across the rewrite (2.0 -> 2x1.0; 4.0 -> 4x1.0), and each daughter inherits exactly half of a parent cell's DNA -- caption b's store-partition claim, asserted directly from the emitted trajectory. Replication always precedes division (caption a's replicate-then-separate ordering).\n\n## Evidence\n\n- **CELL-COUNT-INCREASES-DIVISION-HAPPENED** -- cells 1 (t=0-5) -> 2 (t=6-11) -> 4 (t=12), monotone non-decreasing\n\n- **REPLICATION-PRECEDES-DIVISION** -- chromosome count doubles at t=3 (cells still 1); cells first double at t=6\n\n- **TOTAL-DNA-DOUBLES-AT-REPLICATION** -- total DNA 1.0 -> 2.0 (t=3) -> 4.0 (t=9)\n\n- **DIVISION-CONSERVES-AND-EQUIPARTITIONS-DNA** -- t=6 (1->2, DNA 2.0 conserved, 1.0 each) and t=12 (2->4, DNA 4.0 conserved, 1.0 each); boundary count doubles, each daughter = half of parent\n\n## Limitations\n\n- Didactic / toy-real: cycle length, DNA amounts, capacity cap, and run length are illustrative model units, not calibrated to any organism's replication timing or genome size.\n\n- The division trigger is a discrete cell-cycle clock reaching a replicated (two-chromosome) state, NOT an integrated biomass store crossing a calibrated threshold; the caption's \"biomass\" half is not modeled as a continuous store here.\n\n- \"Interface ports duplicated\" is realized as each daughter re-establishing a cell->chromosome place-graph subtree, not as re-wiring quantitative interface fluxes to an environment -- this composite has no environment/metabolism coupling.\n\n- The rigorous spatial cousin is `growth-and-division` in the `draft-to-living-cell` investigation (a real CPM cell growing and dividing with per-pixel biomass); this study does not restate its numbers.\n\n## Next steps\n\n- Couple a continuous biomass store that integrates to a division threshold, so division timing is emergent rather than clock-driven.\n\n- Add an environment coupling so daughters must re-establish interface fluxes after division, realizing the \"interface ports ... re-established\" half of the paper's claim quantitatively."
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig09-rewrite.composite.json builds and runs to completion through the engine over a deterministic 12-tick run, adding place-graph nodes at runtime.'
    biological_validation: The paper's Fig. division compositional-rewrite claim is demonstrated at the toy-real (uncalibrated) place-graph level -- one boundary becomes two, with the DNA store doubled at replication and then conserved and equipartitioned across the division rewrite -- rather than as a static drawing or a scripted count.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the cell count fails to grow (the DIVIDE rewrite is not deleting the parent and adding two daughters, or the capacity cap is hit too early)
    - replication does not precede division (the phase alternation is inverted, or the cycle clock is mis-firing)
    - total DNA does not double at replication (the REPLICATE rewrite is not duplicating the chromosome's dna store)
    - division does not conserve or equipartition DNA (a daughter is dropped, DNA is manufactured or lost in the split, or the partition is uneven)
    block_downstream: 'any future study reusing the CellCycleDivision place-graph rewrite pattern (e.g. a spatial growth-and-division study that partitions biomass on division)'
limitations:
- 'Mechanistic variant (fig09-mechanistic) — scope and honest limits: it makes division an outcome of growth/energy/size with nucleotide-accounted replication and conserving partition over a 16-cell lineage, fixing the baseline''s clock-driven division and free DNA. But it remains a REDUCED model: growth is a single lumped Michaelis–Menten uptake (no explicit metabolic network or ATP/biomass stoichiometry), the V_rep/V_div/energy checkpoints are hand-set thresholds (not a modelled cell-cycle regulatory circuit), partition is exactly symmetric and deterministic (no stochastic timing or asymmetric division), and there is no spatial constriction/septum geometry. Not calibrated to any organism''s cell-cycle time, growth rate, or genome size. The rigorous spatial cousin is `growth-and-division` in draft-to-living-cell.'
- 'Didactic / toy-real composite: the cell-cycle length (3), per-chromosome DNA (1.0), capacity cap (16), and 12-tick run are illustrative model units chosen for legibility, not calibrated to any organism''s replication timing, growth rate, or genome size.'
- The "growth" that gates division is DISCRETE DNA replication reaching two chromosomes (a cell-cycle clock precondition), NOT a continuously integrated biomass store crossing a calibrated threshold. The caption names "DNA and biomass"; this composite realizes the DNA-partition half literally and treats division timing as clock-driven, leaving continuous biomass growth to the spatial cousin.
- '"Interface ports duplicated and re-established" is realized structurally -- each daughter re-establishes a cell->chromosome place-graph subtree -- not as re-wiring quantitative interface fluxes to an environment. This composite has no environment/metabolism coupling at all, so daughters do not have to re-couple to nutrients to remain viable.'
- The composite is fully deterministic (no randomness anywhere), so every count and DNA value here is an exact, reproducible pin -- there is no stochastic variability to characterize, which is a simplification relative to real division (variable timing, asymmetric partition).
- 'The rigorous spatial cousin is `growth-and-division` in the `draft-to-living-cell` investigation: a real CPM cell that grows via per-pixel biomass and divides spatially. This study demonstrates the compositional-rewrite / store-partition PRINCIPLE at the place-graph level and does NOT restate the cousin''s calibrated numbers as its own.'
falsifiability: Overturned if the colony fails to grow from one founder to at least four cells, if the cell count ever decreases (division removing rather than adding boundaries), if division precedes replication in any round, if the total DNA store fails to double at a replication event, if total DNA is not conserved across a division event (mass created or destroyed in the split), or if any division fails to partition the parent's DNA evenly (a daughter dropped or the split uneven) -- any of which would break the "division partitions state variables such as DNA into two cells" claim. Because the composite is deterministic, any such failure would reproduce exactly.
