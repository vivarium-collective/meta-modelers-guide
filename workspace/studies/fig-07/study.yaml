parent_studies:
- study: biomolecular-complementarity
  condition: tests-passed
experiment: 'Run the `fig07-runnable` composite (six ODE handlers -- transmembrane
  transport, metabolism, transcription, translation, subunit assembly, replication /
  repair -- over one place graph nesting up to six levels deep) to completion over its
  default 30 steps through the process-bigraph engine, and measure whether a process acting
  at each nesting level moves quantity in its nested store, whether the cascade propagates
  across every level as one coupled cell, and whether the place-graph containment is
  preserved as the dynamics run.'
result: 'Over a deterministic 30-step run (31 emitted frames), a process acting at each
  nesting level moves quantity in its store: transmembrane transport fills the cytoplasmic
  nutrient pool 0 -> 9.0 (monotonic), metabolism makes metabolites 0 -> ~20.5 and energy 0
  -> ~13.1, transcription of the six-levels-deep DNA makes RNA 0 -> ~0.64, translation makes
  protein 0 -> ~0.24 (trailing RNA, as it is downstream), and subunit assembly grows the
  four-levels-deep ribosome pool 0.5 -> ~0.88, closing the loop back to translation. All
  five levels change in one coupled run. The place-graph containment is preserved as the
  dynamics run: after the run every intermediate container along the six-level DNA chain is
  still a nested store, the deep DNA and ribosome leaves are reachable only at full depth,
  and the DNA leaf still sits nested alongside its untouched histone sibling. A process
  acting on a deeply-nested store moves the quantity IN that store -- the deep ribosome pool
  grew (final store == last emitted frame) and the deep genome was held at its set point
  (DNA == 1.0) by replication / repair. Every value reproduces exactly run to run. The
  paper''s §Biomolecular compositions figure (Fig molecular_compositions) is thus executable,
  not merely drawn -- its nested hierarchy of composites runs forward as one coupled cell.
  This is a didactic / toy-real composite; the calibrated molecular-complementarity cousin
  is `biomolecular-complementarity` in the `draft-to-living-cell` investigation.'
