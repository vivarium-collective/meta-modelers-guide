conclusion: '## Claims

  - Wiring six ODE processes over one place graph nesting up to six levels deep -- WITHOUT
    flattening the compartment hierarchy -- reproduces the paper''s §Biomolecular
    compositions figure (Fig molecular_compositions) as a runnable nested cascade. Over a
    deterministic 30-step run, a process acting at each nesting level moves quantity in its
    store (transport 0 -> 9.0 nutrients; metabolism 0 -> ~20.5 metabolites and 0 -> ~13.1
    energy; transcription of the six-levels-deep DNA 0 -> ~0.64 RNA; translation 0 -> ~0.24
    protein, trailing RNA; assembly 0.5 -> ~0.88 on the four-levels-deep ribosome pool,
    closing the loop). All five levels change; every value reproduces exactly.

  - The place-graph containment is PRESERVED as the dynamics run -- after the run the
    six-level DNA chain and four-level ribosome chain are still nested stores reachable
    only at full depth, and the DNA leaf still sits nested alongside its untouched histone
    sibling. A process acting on a deeply-nested store moves the quantity IN that store:
    the deep ribosome pool grew (final store == last emitted frame) and the deep genome
    was held at its set point (DNA == 1.0) by replication / repair.


  ## Evidence

  - **COMPOSITE-RUNS-AND-EMITS** -- 31 frames (30 ticks + initial emit), final time == 30.0

  - **TRANSPORT-FILLS-CYTOPLASMIC-NUTRIENTS** -- nutrients 0.0 -> 9.0, monotonic

  - **METABOLISM-MAKES-METABOLITES-AND-ENERGY** -- metabolites 0.0 -> ~20.5, energy 0.0 -> ~13.1

  - **CENTRAL-DOGMA-TRANSCRIPTION-AND-TRANSLATION-RISE** -- rna 0.0 -> ~0.64, proteins 0.0
    -> ~0.24, rna leads protein

  - **ASSEMBLY-GROWS-RIBOSOME-POOL-CLOSING-THE-LOOP** -- ribosome 0.5 -> ~0.88 past its seed

  - **CASCADE-PROPAGATES-ACROSS-MULTIPLE-LEVELS** -- all five levels change

  - **PLACE-GRAPH-CONTAINMENT-PRESERVED** -- six-level DNA chain + four-level ribosome
    chain intact, DNA nested beside histone

  - **PROCESS-MOVES-QUANTITY-IN-DEEP-NESTED-STORE** -- deep ribosome grew and == emitted
    last frame; deep DNA held at set point 1.0


  ## Limitations

  - This fig07-runnable composite is didactic / toy-real -- the ODE rate constants, yields,
    and pool seeds are hand-chosen so the whole nested cascade is legible within 30 steps,
    not calibrated to a named cell type, organism, or literature target.

  - "Levels" are place-graph nesting depths (compartment containment), not physical length
    scales; the exact depths mirror the biological compartment hierarchy but are a modeling
    choice.

  - The calibrated cousin for the molecular-complementarity narrative is
    `biomolecular-complementarity` in the `draft-to-living-cell` investigation; this study
    does not restate its numbers.


  ## Next steps

  - Fan out to the remaining runnable figure composites in the paper-figures investigation.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig07-runnable.composite.json builds and runs its default 30
      steps to completion through the engine over a deterministic run.'
    biological_validation: The nested-hierarchy-of-composites claim of Fig
      molecular_compositions is demonstrated at the toy-real (uncalibrated) level -- six
      real processes act on stores up to six levels deep in a preserved place graph, the
      cascade propagates across every level, and the compartment containment survives the
      run intact.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - a level fails to change (a process is mis-wired to its nested input/output path, or a
      driver pool is not seeded)
    - protein leads RNA, or RNA/protein never rise (transcription/translation wiring to the
      deep DNA / RNA stores is broken)
    - the ribosome pool does not grow (subunit assembly is not writing the four-levels-deep
      store, or the loop back to translation is broken)
    - the DNA set point drifts (replication / repair is not holding the six-levels-deep
      genome)
    - the place-graph containment is not preserved (a nested path was flattened, or a deep
      store is no longer reachable at full depth)
    block_downstream: 'any future study reusing the fig07 nested-place-graph pattern or its
      six coupled ODE processes'
limitations:
- This fig07-runnable composite is didactic / toy-real -- the ODE rate constants (transport
  k=0.3, metabolism k=0.25, assembly k=0.2), yields, transcription / translation kinetics,
  and initial pool seeds are hand-chosen so the whole nested cascade is legible within a
  30-step run, not fitted to a named cell type, organism, or literature target. The exact
  endpoint magnitudes (nutrients 9.0, metabolites ~20.5, ribosome ~0.88) are regression
  pins tied to those constants; the per-level direction and the containment claim are the
  a-priori structural predictions.
- '"Levels" here are place-graph nesting depths (compartment containment), not physical
  length scales; the six-level DNA path and four-level ribosome path mirror the biological
  compartment hierarchy (cytoplasm > nucleus > chromosome > chromatin > nucleosome > DNA)
  but the exact depths are a modeling choice.'
- The processes are ODE handlers over dimensionless concentration / count / energy stores;
  no quantity carries a calibrated physical unit, and there is no spatial, stochastic, or
  rule-based molecular detail -- the figure''s molecular-structure panel is represented by
  named nested stores, not by explicit binding sites or conformations.
- The rigorous molecular-complementarity cousin is `biomolecular-complementarity` in the
  `draft-to-living-cell` investigation; this study is the executable-figure counterpart and
  does not restate that cousin''s numbers as its own.
falsifiability: Overturned if the composite fails to run its default step count to
  completion, if any level fails to change over the run (a mis-wired process), if protein
  leads RNA or the ribosome pool fails to grow past its seed, if the DNA set point drifts
  away from 1.0, if the run is not deterministic across repeated runs of the same composite,
  or if the place-graph containment is not preserved after the run (a nested path flattened,
  or a deep store no longer reachable at full depth).
