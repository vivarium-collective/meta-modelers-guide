conclusion: '## Claims


  - Differential-adhesion cell sorting reproduces the paper''s §Molecular compositions complementarity
  (Fig 8) as a spatial mechanism: two cell types differing only in which contacts they find favorable
  demix a well-mixed checkerboard (hetero_frac ~0.64 -> ~0.06 over ~600 MCS) while staying cohesive (pixels
  ~1530, <1% drift; counts 32/32). A neutral-J control (all J=8) does not sort, isolating the contact-energy
  asymmetry as the cause.


  - A Cahn-Hilliard composition field realizes the condensate mechanism the paper draws from banani2017:
  a near-critical field phase-separates into two domains bounded by a sharp interface (variance ~7e-5
  -> ~0.38 over 10000 steps), mass conserved to ~4e-18, field bounded in [-1, 1].


  ## Evidence


  - **SORTING-HETEROTYPIC-INTERFACE-COLLAPSES** -- hetero_frac ~0.64 -> ~0.06, roughly an order of magnitude


  - **SORTING-CLUMP-STAYS-COHESIVE** -- cell_pixels ~1530, <1% drift (cohesion guard, 10% bound)


  - **SORTING-CONSERVES-CELL-COUNT** -- n_type1 = n_type2 = 32 throughout


  - **SORTING-NEUTRAL-J-DOES-NOT-SORT** -- neutral J holds hetero_frac ~0.52 (J causality control)


  - **CONDENSATE-PHASE-SEPARATES** -- phi_var ~7e-5 -> ~0.38, sharp emergent interface


  - **CONDENSATE-CONSERVES-MASS** -- phi_mean drift ~4e-18


  - **CONDENSATE-STAYS-BOUNDED** -- phi in [-0.989, 0.982], no NaN, at pinned dt=0.002


  ## Limitations


  - The condensate forms a boundary but does not do interface work -- it does not selectively concentrate
  or exclude a second species, the property that distinguishes a functional, regulatable boundary from
  a transient aggregate in the paper''s §Molecular compositions central question (Fig 8). Named as the
  next step, not glossed.


  - Neither regime computes a binding affinity; sorting is differential-adhesion demixing, not molecular
  selectivity, matching how a coarser, specification-stage lumped realization scopes its own selectivity
  gap.


  - Both regimes are tuned, not fitted: the sorting J-triple satisfies Steinberg''s sorting inequality
  (11 > 1/2*(2+2)) but the magnitudes and T=10 sit in a narrow cohesive-and-mobile window (T=1 freezes,
  T>=200 dissolves); the Cahn-Hilliard scheme is numerically stiff, dt pinned at 0.002. No fitted literature
  band is claimed because these are demonstration primitives, not models of a specific tissue or condensate.


  - The two demonstrations are independent and uncoupled; phi is not coupled to the CPM cells.


  ## Next steps


  - Make the condensate do interface work: add a second species and a selective-partitioning coupling
  so a droplet demonstrably concentrates or excludes it -- turning the paper''s central-question discriminator
  (functional regulatable boundary vs transient aggregate) into a tested pass/fail rather than a narrated
  one.


  - Add a genuine complementarity/selectivity term to the sorting side (a binding-affinity or partner-choice
  mechanism with a non-cognate binder to reject), closing the gap between complementarity-as-organizing-idea
  and complementarity-as-tested-mechanism.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: Both cell-sorting-spatial.composite.json and condensate-cahn-hilliard.composite.json
      build and run to completion through the engine (~600 MCS and 10000 steps respectively).
    biological_validation: The paper's §Molecular compositions complementarity (Fig 8) is demonstrated
      spatially at the toy-real (tuned, uncalibrated) level as two independent primitives -- differential-adhesion
      demixing and Cahn-Hilliard phase separation -- with the condensate's interface-work gap scoped honestly
      rather than claimed.
    pipeline_unblocks:
    - autopoiesis-spatial
  if_primary_tests_fail:
    diagnose:
    - the heterotypic-interface fraction does not collapse (the differential-J regime is not taking effect,
      or the seeding is not adjacent so t0 is already falsely low)
    - the fraction collapses but the cohesion guard fails -- the clump dissolved into medium (temperature
      too high) and a false 'perfect sort' of an empty lattice is being read
    - the Cahn-Hilliard field variance does not rise (no phase separation), or mass is not conserved (the
      update is not a proper flux divergence)
    - the field goes non-finite (dt above the biharmonic stability limit -- the process should raise,
      not emit NaN)
    block_downstream: autopoiesis-spatial (a self-maintained-boundary study builds on the phase-separation
      primitive here)
limitations:
- 'The condensate demonstrates phase separation (a mass-conserved boundary forming with an emergent interface),
  not interface work: it does not selectively concentrate or exclude a second species, the property that
  distinguishes a functional, regulatable boundary from a transient or unregulated aggregate in the paper''s
  §Molecular compositions central question (Fig 8). This is the honest gap and the natural next step,
  stated explicitly rather than glossed.'
- Neither regime computes a binding affinity. Cell sorting is differential-adhesion demixing (Steinberg),
  not a molecular selectivity/partner-choice mechanism -- there is no non-cognate binder that could be
  rejected to demonstrate selectivity by contrast, matching how a coarser, specification-stage lumped
  realization scopes its own selectivity gap.
- The sorting regime is tuned, not fitted. The J-triple (2/11/8) satisfies Steinberg's sorting inequality
  J(1,2) > 1/2*(J(1,1)+J(2,2)) as a qualitative theory anchor, but the magnitudes and temperature (T=10)
  were chosen to sit in a narrow cohesive-and-mobile window (T=1 freezes the mixed state, T>=200 dissolves
  the cells); no fitted literature band is claimed.
- The heterotypic-interface fraction is only valid alongside the cohesion guard -- read alone it falls
  to 0.0 when the clump dissolves (a false 'perfect sort'), so the sorted claim is gated on both the fraction
  dropping AND the live-cell pixel count being retained.
- The Cahn-Hilliard scheme is numerically stiff; its timestep is pinned at dt=0.002 against the biharmonic
  stability limit dt < dx^4/(16*M*kappa). It is a diffuse-interface analogue of a condensate, not a mechanistic
  model of a specific biomolecular condensate.
- The sorting and condensate demonstrations are independent and uncoupled -- phi is not coupled to the
  CPM cells; they are two separate spatial readings of complementarity-as-separation, deliberately not
  one model.
- The deep nested-hierarchy test (an interface preserved through the deepest leaf of a
  many-level structural nesting) is not covered; this study spatializes two complementarity
  primitives (cell sorting and a condensate) but not deep structural nesting.
- Spatializing the coupled gene-expression cascade (transcription through translation to
  assembly, with a ribosome pool maintained against dilution at nested depth) is future work;
  this study addresses only complementarity as spatial separation.
falsifiability: Overturned if the heterotypic-interface fraction fails to collapse under the differential-J
  regime (no sorting), if it collapses only because the clump dissolved (cohesion guard fails -- live-cell
  pixels not retained), if the neutral-J control unexpectedly sorts (demixing not actually caused by the
  contact-energy asymmetry), if the Cahn-Hilliard field variance fails to rise (no phase separation) or
  its mass is not conserved (the scheme not a proper flux divergence), or if the field goes non-finite
  at the pinned dt (the stability guard broken).
