parent_studies:
- study: cell-environment-coupling-spatial
  condition: tests-passed
experiment: 'Run two independent CPM/phase-field composites to completion through the process-bigraph
  engine: cell-sorting-spatial (CpmSorting, an 8x8 checkerboard of two cell types under a differential-adhesion
  J-triple, ~600 Monte Carlo steps) and condensate-cahn-hilliard (CahnHilliard, a 64x64 near-critical
  composition field, 10000 steps). Measure whether contact-energy complementarity alone drives spatial
  cell sorting (heterotypic-interface fraction collapsing while the clump stays cohesive), and whether
  a near-critical composition field phase-separates into a mass-conserved, bounded two-phase state with
  an emergent interface.'
result: Differential adhesion alone demixes the mixed checkerboard -- heterotypic-interface fraction ~0.64
  -> ~0.06 over ~600 MCS while the clump stays cohesive (pixels ~1530, <1% drift; counts 32/32) and a
  neutral-J control does not sort -- the paper's §Molecular compositions complementarity (Fig 8) as a
  spatial mechanism. Independently, the Cahn-Hilliard field phase-separates into two domains bounded by
  a sharp interface (variance ~7e-5 -> ~0.38 over 10000 steps), mass conserved to ~4e-18 and bounded in
  [-1, 1]. The condensate forms a boundary but does not yet do interface work (no selective concentration/exclusion
  of a second species) -- a boundary forming, not yet the functional, regulatable boundary the paper's
  central question distinguishes from a transient aggregate.
