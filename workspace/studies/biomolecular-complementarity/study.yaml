schema_version: 4
name: biomolecular-complementarity
investigation: draft-to-living-cell
title: Biomolecular Complementarity, Spatial
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'The paper''s §Molecular compositions section (Fig 8) frames its subject as a question about
  interfaces, not architecture: which patterns of molecular complementarity give rise to interfaces that
  behave as functional, regulatable boundaries, and which produce transient or unregulated aggregates?
  This study puts two spatial primitives of that question on the lattice. Differential-adhesion cell sorting
  -- Steinberg''s Differential Adhesion Hypothesis -- is complementarity made spatial: a mixed population
  of two cell types, distinguished only by which contacts they find energetically favorable, demixes so
  that like sits with like and the heterotypic boundary between them collapses, a direct spatial reading
  of which interface variables must align for two cells to stay coupled. Biomolecular-condensate phase
  separation is the diffuse-interface counterpart: a scalar composition field, seeded near-critical, spontaneously
  separates into two phases divided by a sharp interface -- a boundary forming out of a well-mixed medium,
  the way a condensate droplet does. Each is a real 2D spatial mechanism run through the process-bigraph
  engine; the two are independent demonstrations, not one coupled model.'
biological_summary: 'Steinberg''s differential-adhesion sorting is the paper''s §Molecular compositions
  complementarity (Fig 8) read spatially: molecules bind the partners they recognize and not others, and
  at the scale of cells that same selectivity shows up as which contacts are cheap and which are costly.
  Give two cell types a contact-energy matrix in which homotypic contact is favorable and heterotypic
  contact is expensive, and a well-mixed checkerboard self-organizes -- like cells cluster, unlike cells
  pull apart, and the heterotypic interface shrinks. That is the question of which interface variables
  must align for coupling to occur, made mechanical: cells stay adjacent exactly where their adhesion
  preferences are complementary.


  The condensate side realizes the paper''s other §Molecular compositions mechanism (Fig 8). Following
  banani2017 as the paper does, weak multivalent interactions among biomolecules can drive liquid-liquid
  phase separation into droplets that acquire emergent physical properties -- surface tension, viscosity,
  and selective permeability -- and that introduce new interface variables the surrounding system must
  now reckon with: binding states, complex composition, local density, and phase boundaries. Here that
  is modeled as a Cahn-Hilliard scalar composition field: a double-well free energy plus an interfacial-gradient
  penalty drives mass-conserving spinodal decomposition, so a near-critical field separates into two phases
  bounded by a sharp, emergent interface.


  Measured this build. SORTING (meta_modelers_guide.composites.cell-sorting-spatial): an 8x8 checkerboard
  of 64 cells (32 type-1 / 32 type-2, 5x5 px each, 70x70 lattice) demixes over ~600 Monte Carlo steps
  -- the heterotypic-interface fraction collapses from a clearly-mixed ~0.64 at the first observation
  (the raw seeded checkerboard is ~1.0 before any relaxation) to ~0.06, roughly an order-of-magnitude
  drop, while a cohesion guard confirms the clump did not merely dissolve: total live-cell pixels hold
  near ~1530 (well under the 10% drift bound) and the per-type counts stay exactly 32/32. The cohesion
  guard is load-bearing, not decoration -- the heterotypic-interface fraction alone falls to 0.0 when
  the cells boil off into medium at high temperature, which would read as a perfect sort of an empty lattice,
  so a dissolved clump must never be misread as sorted. CONDENSATE (meta_modelers_guide.composites.condensate-cahn-hilliard):
  a 64x64 composition field seeded with near-critical noise (mean 0, +/-0.025) phase-separates over 10000
  steps -- the field variance rises from ~7e-5 to ~0.38 as two domains form, total mass is conserved to
  ~4e-18 (the composition is redistributed, not created or destroyed), the field stays bounded in [-1,
  1], and no NaN appears.


  Honesty point, stated plainly because the paper''s central question demands it. The condensate study
  demonstrates a boundary forming -- phase separation, mass-conserved, with an emergent interface -- but
  it does not yet demonstrate the condensate doing interface work: selectively concentrating or excluding
  a second species, the property that would let it act as a functional, regulatable compartment rather
  than a transient aggregate. That is precisely the discriminator the paper''s §Molecular compositions
  question turns on, and it is the natural next step, not something this study already shows. The sorting
  study likewise demonstrates differential-adhesion demixing with a cohesion guard, not molecular binding-affinity
  selectivity: there is no partner-choice term, exactly as a coarser, specification-stage lumped realization
  scopes its own selectivity gap. Both regimes are tuned, not fitted: the sorting J-triple (homotypic
  2, heterotypic 11, medium 8) and temperature 10 sit in a narrow cohesive-and-mobile window (T=1 freezes
  the mixed state, T>=200 dissolves the cells), and the Cahn-Hilliard scheme is numerically stiff, its
  timestep pinned at dt=0.002 against the biharmonic stability limit. This is the spatial counterpart
  to the lumped ODE predecessor, which built the same complementarity pattern as
  a nested-hierarchy expression cascade; read the two side by side for the same interface idea at two
  very different mechanistic resolutions.'
claim: 'Differential-adhesion cell sorting reproduces the paper''s §Molecular compositions complementarity
  (Fig 8) as a spatial mechanism: two cell types differing only in which contacts they find energetically
  favorable demix a well-mixed checkerboard (heterotypic-interface fraction ~0.64 -> ~0.06 over ~600 Monte
  Carlo steps) while staying cohesive (live-cell pixels ~1530, <1% drift; per-type counts constant at
  32/32) -- like sitting with like is the spatial reading of which interface variables must align for
  coupling. Independently, a Cahn-Hilliard composition field realizes the condensate mechanism the paper
  draws from banani2017: a near-critical field phase-separates into two domains bounded by a sharp, emergent
  interface (variance ~7e-5 -> ~0.38 over 10000 steps) with mass conserved to ~4e-18 and the field bounded
  in [-1, 1]. The honest boundary of the claim is explicit: the condensate forms an interface but does
  not yet do interface work -- it does not selectively concentrate or exclude a second species -- so it
  demonstrates a boundary forming, not yet the functional, regulatable boundary the paper''s central question
  distinguishes from a transient aggregate. Neither regime computes a binding affinity; both are tuned
  demonstration primitives, not fitted to a measured tissue or condensate. The two run as independent
  processes through the process-bigraph engine, with no coupling between them.'
baseline:
- name: cell-sorting-spatial
  composite: meta_modelers_guide.composites.cell-sorting-spatial
  params: {}
- name: condensate-cahn-hilliard
  composite: meta_modelers_guide.composites.condensate-cahn-hilliard
  params: {}
variants: []
key_assumptions:
- 'Cell sorting here is differential-adhesion demixing (Steinberg), the spatial reading of the paper''s
  §Molecular compositions complementarity (Fig 8) -- not a molecular binding-affinity or selectivity mechanism.
  There is no partner-choice term, no impostor binder that could be rejected to demonstrate selectivity
  by contrast; cells simply minimize contact energy under a fixed J matrix. This mirrors how the specification-stage
  coarser, specification-stage lumped realization scopes its own selectivity gap: complementarity
  is the organizing idea, demixing is what is demonstrated.'
- 'The sorting regime is tuned, not fitted. The contact-energy triple (homotypic J=2, heterotypic J=11,
  medium J=8) satisfies Steinberg''s sorting inequality J(1,2) > 1/2*(J(1,1)+J(2,2)) (11 > 2) -- a qualitative,
  theory-grounded calibration anchor -- but the magnitudes and the temperature (T=10) were chosen to sit
  in a narrow cohesive-and-mobile window, not fitted to a measured tissue. Outside that window the demonstration
  fails in two distinct ways documented in the code-verified API map''s regime sweep: T=1 freezes the
  mixed state (no rearrangement), while T>=200 dissolves the cells into medium. No fitted literature band
  is claimed because these are demonstration primitives of a sorting mechanism, not a model of a specific
  organism''s tissue.'
- 'The heterotypic-interface fraction is only meaningful alongside its cohesion guard. Read alone the
  fraction falls to 0.0 when the clump dissolves (total intercell edges -> 0, a false ''perfect sort''
  of an empty lattice), so the sorted claim is gated on both signals together: the fraction must drop
  AND the total live-cell pixel count must be retained within ~10% of its starting value. Both hold here
  (fraction ~0.64 -> ~0.06; pixels ~1530, <1% drift).'
- The condensate is an independent, uncoupled second demonstration. The Cahn-Hilliard field phi does not
  touch the CPM cells, any dFBA/cobra path, or the sorting process at all -- it is a scalar field over
  its own fields store. The two are separate spatial readings of complementarity-as-separation (discrete
  adhesion energy vs continuous composition field), deliberately not coupled; coupling phi to the cells
  is out of scope and unverified.
- The Cahn-Hilliard scheme is numerically stiff and its timestep is pinned. The explicit biharmonic (nabla^4)
  term has an approximate stability limit dt < dx^4/(16*M*kappa); dt=0.002 (with M=1, kappa=0.5, dx=1)
  is verified stable over ~20000 steps, while dt=0.05 blows up to NaN within a few thousand steps -- the
  process raises loudly rather than silently emitting NaN. The pinned dt is a numerical calibration anchor,
  not a physical one.
- 'Honesty boundary, restated as an assumption because it scopes the whole study: the condensate demonstrates
  phase separation (a mass-conserved boundary forming with an emergent interface), not interface work.
  It does not selectively concentrate or exclude a second species, which is the property that would make
  it a functional, regulatable boundary rather than a transient aggregate in the terms of the paper''s
  §Molecular compositions central question (Fig 8). That is named as the next step, not glossed as already
  done.'
behavior_tests:
- name: sorting-heterotypic-interface-collapses
  classification: primary
  description: 'Under differential adhesion (homotypic J=2, heterotypic J=11, medium J=8, T=10), the mixed
    checkerboard demixes: the heterotypic-interface fraction collapses from a clearly-mixed start toward
    a sorted low value.'
  measure:
    kind: observable
    path: obs.hetero_frac
    expr: last(obs.hetero_frac)
  pass_if:
    op: <
    value: 0.2
    provenance: hetero_frac ~0.64 at first observation -> ~0.06 by ~600 MCS (raw seeded checkerboard ~1.0
      before relaxation), roughly an order-of-magnitude collapse (tests/test_sorting_regime.py::test_sorting_demixes_cohesively,
      tests/test_cpm_sorting.py::test_checkerboard_sorts_cohesively_in_composite, tests/test_cpm_sorting_spike.py::test_checkerboard_demixes_and_stays_cohesive)
  requires_simulation: cell-sorting-spatial
- name: sorting-clump-stays-cohesive
  classification: primary
  description: 'Cohesion guard: the demixing is real sorting, not dissolution. The total live-cell pixel
    count is retained (well within a 10% drift bound), so a dissolved clump is not misread as sorted.'
  measure:
    kind: observable
    path: obs.cell_pixels
    expr: abs(last(obs.cell_pixels) - first(obs.cell_pixels)) / first(obs.cell_pixels)
  pass_if:
    op: <
    value: 0.1
    provenance: cell_pixels ~1530 held to <1% drift over ~600 MCS (well inside the 10% cohesion bound)
      while hetero_frac collapsed -- the clump sorted, it did not dissolve (tests/test_sorting_regime.py::test_sorting_demixes_cohesively,
      tests/test_cpm_sorting.py::test_checkerboard_sorts_cohesively_in_composite)
  requires_simulation: cell-sorting-spatial
- name: sorting-conserves-cell-count
  classification: diagnostic
  description: 'Regression check that sorting moves cells rather than creating or destroying them: the
    per-type cell counts stay exactly 32/32 throughout the run.'
  measure:
    kind: observable
    path: obs.n_type1
    expr: last(obs.n_type1)
  pass_if:
    op: ==
    value: 32.0
    provenance: n_type1 == n_type2 == 32 for the full ~600 MCS run -- no cell created, destroyed, or merged,
      just moved (tests/test_cpm_sorting.py::test_checkerboard_sorts_cohesively_in_composite)
  requires_simulation: cell-sorting-spatial
- name: sorting-neutral-J-does-not-sort
  classification: diagnostic
  control: negative
  description: 'Negative control isolating J-regime causality: under neutral contact energies (all J=8,
    so heterotypic contact is no more costly than homotypic) the same checkerboard at T=10 does NOT demix
    -- proving the sorting is driven by the differential-J regime, not by CPM Metropolis dynamics per
    se.'
  measure:
    kind: observable
    path: obs.hetero_frac
    expr: last(obs.hetero_frac)
  pass_if:
    op: '>'
    value: 0.5
    provenance: 'a neutral-J composite re-run (all J=8):
      neutral J (all=8), T=10, same checkerboard stays mixed at hetero_frac ~0.52 over 600 MCS vs ~0.06
      for the differential-J regime -- the causality control for J. Documented regime sweep, not a committed
      pytest in this build.'
  requires_simulation: none
- name: condensate-phase-separates
  classification: primary
  description: 'The near-critical Cahn-Hilliard composition field undergoes spinodal decomposition into
    two phases: the field variance rises from near-zero toward the coexistence variance as an interface
    forms.'
  measure:
    kind: observable
    path: obs.phi_var
    expr: last(obs.phi_var)
  pass_if:
    op: '>'
    value: 0.3
    provenance: phi_var ~7e-5 -> ~0.38 over 10000 steps (64x64 field, M=1, kappa=0.5, dt=0.002) -- two
      domains formed, bounded by a sharp emergent interface (tests/test_sorting_regime.py::test_cahn_hilliard_phase_separates_mass_conserved,
      tests/test_cahn_hilliard.py::test_spinodal_decomposition_conserves_mass_and_stays_bounded)
  requires_simulation: condensate-cahn-hilliard
- name: condensate-conserves-mass
  classification: primary
  description: 'The phase separation redistributes composition, it does not create or destroy it: the
    field mean (total mass) is conserved across the whole run -- the mass-conservation property that distinguishes
    Cahn-Hilliard from a non-conservative Allen-Cahn interface.'
  measure:
    kind: observable
    path: obs.phi_mean
    expr: abs(last(obs.phi_mean) - first(obs.phi_mean))
  pass_if:
    op: <
    value: 0.001
    provenance: 'phi_mean drift ~4e-18 over 10000 steps (mass-conserving by construction: the update is
      a divergence of a flux) (tests/test_sorting_regime.py::test_cahn_hilliard_phase_separates_mass_conserved,
      tests/test_cahn_hilliard.py::test_spinodal_decomposition_conserves_mass_and_stays_bounded)'
  requires_simulation: condensate-cahn-hilliard
- name: condensate-stays-bounded
  classification: diagnostic
  description: 'Numerical-stability guard: at the pinned dt=0.002 the stiff biharmonic scheme stays bounded
    in the physical two-phase range [-1, 1] and emits no NaN -- a larger dt would blow up instead.'
  measure:
    kind: observable
    path: obs.phi_min
    expr: last(obs.phi_min)
  pass_if:
    op: '>'
    value: -1.05
    provenance: phi bounded to [-0.989, 0.982] at run end (no NaN); the process raises loudly if dt exceeds
      the ~dx^4/(16*M*kappa) stability limit rather than emitting NaN (tests/test_cahn_hilliard.py::test_spinodal_decomposition_conserves_mass_and_stays_bounded,
      tests/test_cahn_hilliard.py::test_dt_above_stability_limit_raises_instead_of_nan)
  requires_simulation: condensate-cahn-hilliard
