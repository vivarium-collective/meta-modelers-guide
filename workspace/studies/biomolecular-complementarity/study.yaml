experiment: Build the Fig 8 six-level place graph (ECM -> membrane -> cytoplasm -> nucleus -> chromosome -> chromatin -> nucleosome, plus a parallel organelles branch), wire a transcription-translation-assembly cascade through it from its deepest stores outward, and run the compiled composite 8 seconds through the engine.
result: The cascade populates — nutrients->2.4, metabolites->1.5, energy->0.84, with a small mRNA (->0.178) and protein (->0.008) pool — while the interface is preserved from the six-level place graph down to its deepest leaf (ribosome, in a parallel organelles branch, actively maintained ~0.5->0.501 against dilution). The inert draft, with no mechanism, stays at seed. Complementarity/selectivity is the paper's organizing principle for this hierarchy but is not a mechanism this executable builds or tests — reported honestly, not claimed.
