findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Multiple real CPM cells sharing one real spatio-flux nutrient field through one
    N-cell coupling process (`CpmColonyField`) reproduce the paper''s §Cell–cell coupling
    shared-resource-competition branch (no dedicated figure) as genuine spatial multicellularity:
    an uptake-capacity asymmetry alone (glucose_vmax 10 vs 4),
    with each cell running its own independent dFBA solve at its own footprint on the same
    depleting field, drives a decisive biomass and lattice-volume split -- asymmetric growth
    TOWARD competitive exclusion. Confirmed: biomass 237.9 vs 64.5 (3.69x), CPM volume 3511 vs 81
    px, over a 20-tick run. (Strict exclusion is not reached -- the loser is displaced but stays
    viable; see F-04.)'
  evidence:
    from_test: competition-excludes-the-slower-cell
    from_run: cellcell-compete
    observed: biomass 237.9 (id 1) vs 64.5 (id 2); volume 3511 px (id 1) vs 81 px (id 2)
  provenance:
    run_ids:
    - cellcell-compete
- id: F-04
  kind: biological
  tier: mechanism
  status: partial
  statement: 'The competition regime reaches asymmetric growth, NOT true competitive exclusion,
    over the run measured. The loser''s biomass GREW from its 1.25 seed to 64.5 (~51.6x) -- far
    above the viable-biomass floor -- while shrinking to an 81-px fragment against the winner''s
    3511 px: it is spatially DISPLACED, not driven below any viability bound. This study couples
    STATE (one shared field) but imposes no viability CONSTRAINT (no death, no viability bound),
    exactly the paper''s §Cell–cell coupling distinction that "what is coupled is not only state,
    but constraint" -- here, only state. The winner''s 3511-px endpoint is ~97.5% of the 3600-px
    lattice with the field nearly exhausted by t=20, so the endpoint is partly a finite-size
    lattice-saturation artifact; by t≈30 the winner fills the lattice and the still-viable loser
    is crowded off it (eviction, not starvation).'
  evidence:
    from_test: competition-loser-displaced-not-excluded
    from_run: cellcell-compete
    observed: 'loser (id 2) biomass 64.5 (51.6x the 1.25 floor), volume 81 px; winner 3511 px
      (~97.5% of the 3600-px lattice)'
  provenance:
    run_ids:
    - cellcell-compete
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Over the same coupling process, a different composite -- a localized glucose depot,
    a fast-diffusing acetate byproduct, and an acetate-consuming cell role -- sustains a cell that
    never touches glucose purely via a spatial metabolic handoff: the consumer''s local glucose
    reads 0.0 the entire run while its biomass still climbs, entirely on diffused acetate. This is
    the paper''s §Cell–cell coupling relational-molecule claim made concrete -- the same acetate is
    the secretor''s metabolic waste and the consumer''s sole carbon food, its meaning set by each
    cell''s interface (microbial cross-feeding, morris2013). Confirmed: consumer local_glucose 0.0,
    local_acetate 1.30, biomass 1.25 -> 3.79, ending as a viable 65-pixel CPM cell.'
  evidence:
    from_test: crossfeeding-consumer-grows-on-acetate-alone
    from_run: cellcell-crossfeed
    observed: consumer local_glucose 0.0; local_acetate 1.30; biomass 1.25 -> 3.79
  provenance:
    run_ids:
    - cellcell-crossfeed
- id: F-05
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cross-feeding handoff is NECESSARY, not incidental: a secretor-knockout control
    (`cellcell-crossfeed-knockout` -- the cross-feed composite with the acetate secretor cell
    removed so no acetate is produced anywhere) leaves the otherwise-identical consumer unable to
    grow. It sits at local acetate 0.0 and its biomass never climbs off its 1.25 seed (persisting
    on the lattice at ~35 px), against the 1.25 -> 3.79 growth the same consumer shows when the
    secretor is present. This closes the handoff-necessity argument the flagship left resting only
    on local_glucose == 0.0 + observed growth: the consumer''s growth is genuinely caused by the
    secretor''s acetate, not by anything intrinsic to the consumer or the field.'
  evidence:
