conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: 'Both cellcell-compete.composite.json and cellcell-crossfeed.composite.json build and
      run to completion through the process-bigraph engine
      (tests/test_cellcell_regimes.py, tests/test_cpm_colony_field.py, tests/test_cpm_colony_viz.py);
      guarded skip when the optional cobra/cpm/spatio_flux dependencies are absent, matching this
      investigation''s flagship and draft-to-living-cell''s own FBA-grain convention.'
  biological_validation:
    result: PASS
    basis: All primary behavior tests pass on measured readouts from real 20-tick runs -- the
      competition regime drives a decisive biomass/volume split between two otherwise-identical
      competitors differing only in uptake capacity, and the cross-feeding regime sustains a
      consumer cell that never touches glucose purely via a diffused acetate handoff. The
      foundational two-writer additivity control also passes, independent of both regimes.
  explanatory_gain:
    result: POSITIVE
    basis: Generalizing the flagship's single-cell CpmCellField to an N-cell CpmColonyField and
      demonstrating both branches of the paper's §Cell–cell coupling viability-negotiation
      pattern (no dedicated figure) -- competitive exclusion AND cross-feeding -- from the same
      coupling process, differing only in the
      composite's cell roles and field constants, makes draft-to-living-cell's law-4 claim
      (different handlers over one interface negotiate a shared-resource constraint differently)
      concrete at real spatial, per-footprint dFBA resolution that its lumped two-role, shared-
      scalar-pool analogue could not reach.
conclusion: '## Claims

  - Composing N real CPM cells with one shared, real spatio-flux nutrient field through a single
    N-cell coupling process (`CpmColonyField`) reproduces the paper''s §Cell–cell coupling
    viability-negotiation pattern (no dedicated figure) as genuine spatial multicellularity. Over
    20-tick runs: an uptake-capacity asymmetry alone
    (glucose_vmax 10 vs 4) drives spatial competitive exclusion (biomass 237.9 vs 64.5, 3.69x;
    volume 3511 vs 81 px); a different composite over the same process -- localized glucose depot,
    fast-diffusing acetate byproduct, acetate-consuming role -- sustains a cell that never touches
    glucose (local glucose 0.0) purely via a diffusing cross-feeding handoff (local acetate 1.30,
    biomass 1.25 -> 3.79).


  ## Evidence

  - **COMPETITION-EXCLUDES-THE-SLOWER-CELL** -- biomass 237.9 (id 1) vs 64.5 (id 2), 3.69x margin

  - **COMPETITION-VOLUME-TRACKS-BIOMASS** -- CPM volume 3511 px (id 1) vs 81 px (id 2)

  - **CROSSFEEDING-CONSUMER-BLIND-TO-GLUCOSE** -- consumer local_glucose == 0.0

  - **CROSSFEEDING-CONSUMER-GROWS-ON-ACETATE-ALONE** -- consumer biomass 1.25 -> 3.79 on acetate
    alone

  - **CROSSFEEDING-ACETATE-PLUME-REACHES-CONSUMER** -- consumer local_acetate == 1.30 by t=20

  - **TWO-WRITER-ADDITIVITY-CONSERVES-MASS** -- disjoint per-cell field writes sum losslessly,
    runtime-verified


  ## Limitations

  - e_coli_core-derived constants (glucose_vmax, acetate_vmax, grow_per_biomass, the O2 cap) are
    toy-real -- plausible, hand-tuned magnitudes, not fitted to any organism or medium.

  - The cross-feeding regime''s acetate/glucose diffusion ratio (15.0 vs 0.4) is directionally
    defensible (acetate is a smaller molecule) but was chosen, not fitted; the localized glucose
    depot is a deliberately engineered spatial arrangement, not a naturally arising gradient.

  - The consumer''s growth under cross-feeding is back-loaded to roughly the last 5 ticks of the
    run, once the acetate plume has had time to diffuse across the distance between the two
    cells'' footprints -- monotonic over the measured window, not smoothly exponential from tick 0.

  - Each CPM cell gets its own independent cobra model copy, not one shared model instance across
    the colony.

  - CPM-native chemotaxis (directed motion toward a sensed gradient) remains out of scope for both
    regimes here.

  ## Next steps

  - Extend `CpmColonyField` to N > 2 cells to test whether the competitive/cross-feeding pattern
    generalizes to population-scale spatial negotiation.

  - Add CPM-native chemotaxis so the consumer can move toward the sensed acetate plume rather than
    merely sitting in its path.

  - Fan out to the next spatial counterpart in the design spec''s increment plan.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'Both cellcell-compete.composite.json and cellcell-crossfeed.composite.json
      build and run to completion through the engine over 20 ticks.'
    biological_validation: The spatial §Cell–cell coupling viability-negotiation pattern (no
      dedicated figure) is demonstrated at the
      toy-real (uncalibrated) level, with genuine per-cell CPM shape dynamics and independent
      dFBA solves behind both the competitive-exclusion and cross-feeding branches, rather than a
      scripted trajectory.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the faster competitor's biomass/volume margin over the slower one collapses (uptake-capacity
      asymmetry not taking effect, or the shared field is not actually being depleted by both
      cells)
    - the consumer's local glucose is not near-zero (the localized glucose depot is leaking into
      the consumer's footprint, defeating the cross-feeding demonstration)
    - the consumer's biomass never rises despite zero local glucose (the acetate plume is not
      reaching it, or the consumer's acetate uptake/growth coupling is broken)
    - the two-writer additivity control fails to conserve mass (the N-cell field-write assumption
      CpmColonyField depends on is broken)
    block_downstream: 'future N>2-cell population-scale spatial studies, all of which reuse
      CpmColonyField or its coupling pattern'
limitations:
- e_coli_core-derived constants (glucose_vmax, acetate_vmax, grow_per_biomass, the O2 cap) are
  toy-real, hand-tuned magnitudes chosen to make both regimes legible over a short run -- not
  fitted to any organism or medium.
- 'The cross-feeding regime''s acetate/glucose diffusion ratio (15.0 vs 0.4) is directionally
  defensible -- acetate is a smaller molecule and diffuses faster than glucose in real aqueous
  media -- but the specific ratio was chosen to make the plume legibly reach the consumer within
  20 ticks, not fitted to measured diffusion coefficients; the localized 20 mM glucose depot is
  likewise a deliberately engineered spatial arrangement so the consumer genuinely sees zero
  glucose, not a naturally arising gradient.'
- The consumer's growth under cross-feeding is back-loaded to roughly the last 5 ticks of the
  20-tick run, once the secretor's acetate plume has had time to diffuse across the distance
  separating the two cells' footprints -- monotonic over the measured window, but not smoothly
  exponential from tick 0.
- Each CPM cell in CpmColonyField gets its own independent cobra model copy, not one shared model
  instance across the colony.
- 'The additive two-writer assumption CpmColonyField''s N-cell field-write depends on is now
  runtime-verified directly (tests/test_cpm_colony_two_writer.py), independent of both regimes''
  own dFBA mechanism -- previously an unverified assumption inherited from the flagship study.'
- CPM-native chemotaxis (directed motion up a sensed gradient) remains out of scope for both
  regimes here, matching the flagship's own deferral.
falsifiability: Overturned if the faster competitor's biomass/volume margin over the slower
  competitor collapses under the competition regime, if the shared glucose field is not
  measurably depleted (the cells not genuinely coupled through one field), if the cross-feeding
  consumer's local glucose is not near-zero (the localized depot leaking into its footprint), if
  the consumer's biomass fails to rise despite zero local glucose (the acetate handoff not
  actually sustaining it), or if the additive two-writer field control fails to conserve mass
  (the N-cell field-write assumption CpmColonyField depends on broken).
