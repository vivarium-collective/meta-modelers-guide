schema_version: 4
name: closing-the-loop
investigation: draft-to-living-cell
title: Closing the Loop
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Does the cell–environment coupling of Fig 5 close into a genuine sense/act loop when the environment
  is a real spatial field — i.e. does the cell read a diffusing chemical field, act back on it through
  an uptake flux, and grow from what it takes up, all over one shared field store?
hypothesis: 'Compiling Fig 5 with an environment handler that diffuses a map[float] chemical field and
  a cell handler that senses-and-acts produces a closed loop: an initial point source spreads across the
  field, the cell''s uptake flux becomes positive, and its mass increases — sensing and acting being the
  same coupling read in two directions.'
objective: Run the Fig 5 executable with a real diffusing spatial field and measure field spread, the
  cell's uptake flux, and cell mass to confirm the loop closes.
biological_summary: 'Fig 5 turns the static interface of Fig 4 into a relationship. The environment is
  not a set of scalars but a field — here a nine-cell map[float] chemical field plus a mechanical field
  — and the cell couples to it locally: it senses the field value at its location and acts back by taking
  up matter, which both feeds its growth and depletes the field. Diffusion then carries the depletion
  (and the cell''s secretions) outward. The key conceptual move is that sensing and acting are not two
  subsystems but one coupling: the same shared field store is what the cell reads and what it writes.
  Measured, the seeded source cell falls from 1.0 to 0.20 as it diffuses to its neighbors, the uptake
  flux rises to 0.34, and the cell''s mass grows to 1.17.'
claim: Over a real 1-D diffusing nutrient field (Fick) the cell forms a gradient and draws a local well;
  field mass is CONSERVED — Σfield 5.05 + cumulative uptake 0.95 ≈ the initial 6.0 — so sensing and acting
  are one conserved coupling.
baseline:
- name: cell-environment
  composite: viva_meta_modelers_guide.composites.fig05-cell-environment
  params: {}
variants: []
expected_behavior:
- A seeded point source spreads to neighbouring field cells.
- The cell exerts a positive uptake flux on the field.
- The cell gains mass from what it takes up.
behavior_tests:
- name: gradient-forms
  classification: primary
  description: A localized bolus diffuses into a spatial gradient (Fickian).
  measure:
    kind: observable
    expr: field profile over space×time
  pass_if:
    op: threshold
    condition: bolus spreads to neighbours
  requires_simulation: closing-the-loop
- name: mass-conserved
  classification: primary
  description: Field + cumulative uptake is conserved (no source/sink leak).
  measure:
    kind: observable
    expr: Σfield(t) + uptake_total(t)
  pass_if:
    op: threshold
    condition: ≈ initial field mass
  requires_simulation: closing-the-loop
- name: cell-draws-well
  classification: supporting
  description: The cell is a local sink — uptake and biomass rise.
  measure:
    kind: observable
    expr: uptake_total(t)
  pass_if:
    op: threshold
    condition: '> 0 and rising'
  requires_simulation: closing-the-loop
runs:
- name: closing-the-loop
  composite: closing-the-loop
  emitter: RAMEmitter
  id: closing-the-loop
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    GRADIENT-FORMS:
      result: PASS
      detail: point bolus diffuses across the 15-node lattice
    MASS-CONSERVED:
      result: PASS
      detail: 5.05 + 0.95 ≈ 6.00 (conserved)
    CELL-DRAWS-WELL:
      result: PASS
      detail: cumulative uptake 0 → 0.95
findings:
