schema_version: 4
name: closing-the-loop
investigation: draft-to-living-cell
title: Closing the Loop
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Does the cell–environment coupling of Fig 5 close into a genuine sense/act loop when the environment
  is a real spatial field — i.e. does the cell read a diffusing chemical field, act back on it through
  an uptake flux, and grow from what it takes up, all over one shared field store?
biological_summary: 'Fig 5 turns the static interface of Fig 4 into a relationship. The environment is
  not a set of scalars but a field — here a map[float] chemical field over a 15-node lattice plus a mechanical field
  — and the cell couples to it locally: it senses the field value at its location and acts back by taking
  up matter, which both feeds its growth and depletes the field. Diffusion then carries the depletion
  (and the cell''s secretions) outward. The key conceptual move is that sensing and acting are not two
  subsystems but one coupling: the same shared field store is what the cell reads and what it writes.
  Measured over the 15-node diffusing lattice, cumulative uptake climbs from 0 to 0.95 and the cell''s
  biomass grows to 0.66, while field mass is conserved (Σfield 5.05 + uptake 0.95 ≈ the initial 6.00).'
claim: 'Sensing and acting are one coupling, not two: a cell and its environment can be specified as a
  shared interface over which the cell reads a field and acts back on it.'
baseline:
- name: cell-environment
  composite: viva_meta_modelers_guide.composites.fig05-cell-environment
  params: {}
variants: []
behavior_tests:
- name: biomass-growth
  classification: primary
  measure:
    kind: observable
    path: biomass
    expr: last(biomass)
  pass_if:
    op: '>='
    value: 0.3
    provenance: cell sink grows from the diffusing field (exec last≈0.66)
  requires_simulation: biomass-growth
- name: nutrient-uptake
  classification: primary
  measure:
    kind: observable
    path: uptake_total
    expr: last(uptake_total)
  pass_if:
    op: '>='
    value: 0.5
    provenance: Monod uptake at the site draws down the bolus (exec last≈0.95)
  requires_simulation: nutrient-uptake
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: biomass
    expr: last(biomass)
  pass_if:
    op: '>='
    value: 0.3
    provenance: inert-draft run stays at seed (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: closing-the-loop
  composite: closing-the-loop
  emitter: RAMEmitter
  id: closing-the-loop
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    GRADIENT-FORMS:
      result: PASS
      detail: point bolus diffuses across the 15-node lattice
    MASS-CONSERVED:
      result: PASS
      detail: 5.05 + 0.95 ≈ 6.00 (conserved)
    CELL-DRAWS-WELL:
      result: PASS
      detail: cumulative uptake 0 → 0.95
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'A localized bolus diffuses into a spatial gradient (Fickian). Confirmed: point bolus diffuses
    across the 15-node lattice.'
  evidence:
    from_test: gradient-forms
    from_run: closing-the-loop
    observed: point bolus diffuses across the 15-node lattice
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Field + cumulative uptake is conserved (no source/sink leak). Confirmed: 5.05 + 0.95 ≈ 6.00
    (conserved).'
  evidence:
    from_test: mass-conserved
    from_run: closing-the-loop
    observed: 5.05 + 0.95 ≈ 6.00 (conserved)
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'The cell is a local sink — uptake and biomass rise. Confirmed: cumulative uptake 0 → 0.95.'
  evidence:
    from_test: cell-draws-well
    from_run: closing-the-loop
    observed: cumulative uptake 0 → 0.95
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Gradient-forms, mass-conserved, and cell-draws-well all pass; the inert draft stays at seed, so the sense/act coupling is what drives the dynamics.
  explanatory_gain:
    result: POSITIVE
    basis: Running sensing and acting over one shared field store makes the "one coupling, not two" claim measurable as a conserved field balance.
conclusion: '## Claims

  - Over a real 1-D diffusing nutrient field (Fick) the cell forms a gradient and draws a local well;
  field mass is CONSERVED — Σfield 5.05 + cumulative uptake 0.95 ≈ the initial 6.0 — so sensing and acting
  are one conserved coupling.


  ## Evidence

  - **GRADIENT-FORMS** — point bolus diffuses across the 15-node lattice

  - **MASS-CONSERVED** — 5.05 + 0.95 ≈ 6.00 (conserved)

  - **CELL-DRAWS-WELL** — cumulative uptake 0 → 0.95

  - **conservation** — field+uptake conserved: Σfield 5.05 + taken 0.95 ≈ initial 6.00


  ## Limitations

  - Toy-real diffusion model: field mass is conserved and the drawdown is Fickian in shape, but diffusion/uptake constants are illustrative.


  ## Next steps

  - Add a second cell to the field to test competition and cross-feeding over the shared store.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - one-interface-three-mechanisms
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Single diffusing field on a small 15-node lattice with one cell; no multi-cell competition for the shared field.
- Diffusion and uptake constants are illustrative toy-real values, not calibrated to a medium or organism.
falsifiability: Overturned if field mass is not conserved across the shared store (Σfield + cumulative uptake ≠ initial), or if the cell reads the field without acting back on it (uptake stays at 0).
