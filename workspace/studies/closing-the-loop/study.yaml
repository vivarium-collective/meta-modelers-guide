conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Every behavior test passes against real measured readouts; the study demonstrates the paper's
      pattern qualitatively (toy-real, uncalibrated).
  explanatory_gain:
    result: POSITIVE
    basis: The draft->executable compilation makes the paper's interface-preservation claim mechanical
      and observable for this figure.
conclusion: '## Claims

  - Over a real 1-D diffusing nutrient field (Fick) the cell forms a gradient and draws a local well;
  field mass is CONSERVED — Σfield 5.05 + cumulative uptake 0.95 ≈ the initial 6.0 — so sensing and acting
  are one conserved coupling.


  ## Evidence

  - **GRADIENT-FORMS** — point bolus diffuses across the 15-node lattice

  - **MASS-CONSERVED** — 5.05 + 0.95 ≈ 6.00 (conserved)

  - **CELL-DRAWS-WELL** — cumulative uptake 0 → 0.95

  - **conservation** — field+uptake conserved: Σfield 5.05 + taken 0.95 ≈ initial 6.00


  ## Limitations

  - Physically-consistent TOY model: quantities are conserved and rate-law shapes are real (Monod, Michaelis–Menten,
  Fick, Arrhenius, logistic), but constants are illustrative, not fitted to a specific organism.


  ## Next steps

  - Parameterize the rate constants from literature to move from correct-shape to quantitatively-calibrated.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - typed-interface
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Uncalibrated toy-real constants — demonstrates the compositional pattern, not a quantitatively validated
  cell.
- Deterministic single run per mechanism; no multi-seed replication (the dynamics here are deterministic
  given the handler).
falsifiability: The claim is overturned if the compiled executable fails to preserve the draft's interface
  (a port renamed or a wire dropped by compilation), or if the handler produces no non-trivial dynamics
  on the declared ports.
