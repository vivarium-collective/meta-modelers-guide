schema_version: 4
name: closing-the-loop
investigation: draft-to-living-cell
title: Closing the Loop
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Does the cell–environment coupling of Fig 5 close into a genuine sense/act loop when the environment
  is a real spatial field — i.e. does the cell read a diffusing chemical field, act back on it through
  an uptake flux, and grow from what it takes up, all over one shared field store?
biological_summary: 'Fig 5 turns the static interface of Fig 4 into a relationship. The environment is
  not a set of scalars but a field — here a map[float] chemical field over a 15-node lattice plus a mechanical field
  — and the cell couples to it locally: it senses the field value at its location and acts back by taking
  up matter, which both feeds its growth and depletes the field. Diffusion then carries the depletion
  (and the cell''s secretions) outward. The key conceptual move is that sensing and acting are not two
  subsystems but one coupling: the same shared field store is what the cell reads and what it writes.
  Measured over the diffusing lattice, the cell senses the bolus at its location and draws it down (a
  field cell falls 1.0→0.2) as it takes up matter (uptake flux 0→0.34) and grows (cell mass 1.0→1.17),
  and it acts back mechanically on its environment (traction 0→0.41, mechanical field 0→0.94).'
claim: 'Sensing and acting are one coupling, not two: a cell and its environment can be specified as a
  shared interface over which the cell reads a field and acts back on it.'
baseline:
- name: cell-environment
  composite: meta_modelers_guide.composites.fig05-cell-environment
  params: {}
variants: []
behavior_tests:
- name: cell-draws-well
  classification: primary
  description: The cell senses the field at its location and draws it down — uptake flux climbs and the
    bolus cell falls.
  measure:
    kind: observable
    path: uptake_flux
    expr: last(uptake_flux)
  pass_if:
    op: '>='
    value: 0.2
    provenance: cell takes up from the field — uptake flux 0.0→0.34, bolus cell drawn down 1.0→0.2 (exec last≈0.34)
  requires_simulation: closing-the-loop
- name: cell-acts-back
  classification: primary
  description: The cell acts back on its environment — traction rises from zero.
  measure:
    kind: observable
    path: traction
    expr: last(traction)
  pass_if:
    op: '>='
    value: 0.3
    provenance: cell acts back mechanically — traction 0.0→0.41 (exec last≈0.41)
  requires_simulation: closing-the-loop
- name: mechanical-response
  classification: primary
  description: The cell drives a mechanical field in the shared environment.
  measure:
    kind: observable
    path: mechanical_field
    expr: last(mechanical_field)
  pass_if:
    op: '>='
    value: 0.5
    provenance: mechanical field driven by the cell 0.0→0.94 (exec last≈0.94)
  requires_simulation: closing-the-loop
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: traction
    expr: last(traction)
  pass_if:
    op: '>='
    value: 0.3
    provenance: inert-draft run stays at seed — traction 0 (no mechanism → no dynamics)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: closing-the-loop
runs:
- name: closing-the-loop
  composite: closing-the-loop
  emitter: RAMEmitter
  id: closing-the-loop
  status: completed
  provenance: scripts/render_study_evidence.py — fig05-executable compiled from the Fig 5 draft, run to
    completion through the engine.
  params: {}
  outcomes:
    CELL-DRAWS-WELL:
      result: PASS
      detail: uptake flux 0.0 → 0.34; bolus cell drawn down 1.0 → 0.2
    CELL-ACTS-BACK:
      result: PASS
      detail: traction 0.0 → 0.41 (cell acts on its environment)
    MECHANICAL-RESPONSE:
      result: PASS
      detail: mechanical field 0.0 → 0.94
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell senses the field at its location and acts back on it by taking up matter, drawing
    the bolus down. Confirmed: uptake flux 0.0 → 0.34, bolus cell 1.0 → 0.2.'
  evidence:
    from_test: cell-draws-well
    from_run: closing-the-loop
    observed: uptake flux 0.0 → 0.34; bolus cell 1.0 → 0.2
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell acts back mechanically on its environment. Confirmed: traction 0.0 → 0.41.'
  evidence:
    from_test: cell-acts-back
    from_run: closing-the-loop
    observed: traction 0.0 → 0.41
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'The cell drives a mechanical field in the shared environment. Confirmed: mechanical field
    0.0 → 0.94.'
  evidence:
    from_test: mechanical-response
    from_run: closing-the-loop
    observed: mechanical field 0.0 → 0.94
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Cell-draws-well, cell-acts-back, and mechanical-response all pass; the inert draft stays at seed, so the sense/act coupling is what drives the dynamics.
  explanatory_gain:
    result: POSITIVE
    basis: Running sensing and acting over one shared field store makes the "one coupling, not two" claim measurable — the cell draws down the field it senses and acts back on it.
conclusion: '## Claims

  - Over a real diffusing nutrient field the cell senses the bolus at its location and draws it down (a
  field cell falls 1.0→0.2, uptake flux 0→0.34) and acts back mechanically on its environment (traction
  0→0.41, mechanical field 0→0.94) — sensing and acting are one coupling over the shared field store.


  ## Evidence

  - **CELL-DRAWS-WELL** — uptake flux 0.0 → 0.34; bolus cell drawn down 1.0 → 0.2

  - **CELL-ACTS-BACK** — traction 0.0 → 0.41

  - **MECHANICAL-RESPONSE** — mechanical field 0.0 → 0.94


  ## Limitations

  - Toy-real model: the drawdown is Fickian in shape but the diffusion/uptake constants are illustrative, and field mass is not tracked as a closed balance.


  ## Next steps

  - Add a second cell to the field to test competition and cross-feeding over the shared store.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - one-interface-three-mechanisms
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Single diffusing field on a small 15-node lattice with one cell; no multi-cell competition for the shared field.
- Diffusion and uptake constants are illustrative toy-real values, not calibrated to a medium or organism.
falsifiability: Overturned if the cell reads the field without acting back on it — uptake stays at 0 and traction/mechanical field never rise — or if the compiled executable's port set differs from the declared Fig 5 interface.
