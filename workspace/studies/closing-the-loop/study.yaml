schema_version: 4
name: closing-the-loop
investigation: draft-to-living-cell
title: Closing the Loop
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Does the cell–environment coupling of Fig 5 close into a genuine sense/act loop when the environment
  is a real spatial field — i.e. does the cell read a diffusing chemical field, act back on it through
  an uptake flux, and grow from what it takes up, all over one shared field store?
hypothesis: 'Compiling Fig 5 with an environment handler that diffuses a map[float] chemical field and
  a cell handler that senses-and-acts produces a closed loop: an initial point source spreads across the
  field, the cell''s uptake flux becomes positive, and its mass increases — sensing and acting being the
  same coupling read in two directions.'
objective: Run the Fig 5 executable with a real diffusing spatial field and measure field spread, the
  cell's uptake flux, and cell mass to confirm the loop closes.
biological_summary: 'Fig 5 turns the static interface of Fig 4 into a relationship. The environment is
  not a set of scalars but a field — here a nine-cell map[float] chemical field plus a mechanical field
  — and the cell couples to it locally: it senses the field value at its location and acts back by taking
  up matter, which both feeds its growth and depletes the field. Diffusion then carries the depletion
  (and the cell''s secretions) outward. The key conceptual move is that sensing and acting are not two
  subsystems but one coupling: the same shared field store is what the cell reads and what it writes.
  Measured, the seeded source cell falls from 1.0 to 0.20 as it diffuses to its neighbors, the uptake
  flux rises to 0.34, and the cell''s mass grows to 1.17.'
claim: 'Sensing and acting are two sides of one coupling: over a real diffusing map[float] field the cell
  draws down a local source (1.0→0.20), acts back with uptake flux 0.34, and grows (mass 1.0→1.17).'
baseline:
- name: cell-environment
  composite: viva_meta_modelers_guide.composites.fig05-cell-environment
  params: {}
variants: []
expected_behavior:
- A seeded point source spreads to neighbouring field cells.
- The cell exerts a positive uptake flux on the field.
- The cell gains mass from what it takes up.
behavior_tests:
- name: field-diffuses
  classification: behavioral
  description: A point source at field cell 4 spreads outward (source falls, neighbours rise).
  measure:
    kind: observable
    expr: last(environment.chemical_field[4]) and last(chemical_field[0])
  pass_if:
    op: threshold
    condition: source < 0.5 AND a neighbour > 0
  requires_simulation: closing-the-loop
- name: cell-acts
  classification: behavioral
  description: The cell acts back on the environment through a positive uptake flux.
  measure:
    kind: observable
    expr: last(environment.uptake_flux)
  pass_if:
    op: threshold
    condition: '> 0'
  requires_simulation: closing-the-loop
- name: cell-grows
  classification: behavioral
  description: The cell gains mass over the run from its uptake.
  measure:
    kind: observable
    expr: last(single_cell.mass)
  pass_if:
    op: threshold
    condition: '> 1.0'
  requires_simulation: closing-the-loop
runs:
- name: closing-the-loop
  composite: closing-the-loop
  emitter: RAMEmitter
  steps: 9
  provenance: scripts/measure_all.py — build_core() -> Composite -> run(8.0) with a RAMEmitter; readouts
    in scripts/_catalog/measured_readouts.json
  params: {}
  outcomes:
    FIELD-DIFFUSES:
      result: PASS
      detail: source field[4] 1.0->0.2049; neighbour field[0]->0.2647
    CELL-ACTS:
      result: PASS
      detail: last(uptake_flux) = 0.3387 > 0
    CELL-GROWS:
      result: PASS
      detail: last(single_cell.mass) = 1.1693 > 1.0
  id: closing-the-loop
  status: completed
findings:
- id: F-01
  kind: biological
  tier: observation
  status: confirms
  statement: 'A point source at field cell 4 spreads outward (source falls, neighbours rise). Confirmed:
    source field[4] 1.0->0.2049; neighbour field[0]->0.2647.'
  evidence:
    from_test: field-diffuses
    from_run: closing-the-loop
    observed: source field[4] 1.0->0.2049; neighbour field[0]->0.2647
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'The cell acts back on the environment through a positive uptake flux. Confirmed: last(uptake_flux)
    = 0.3387 > 0.'
  evidence:
    from_test: cell-acts
    from_run: closing-the-loop
    observed: last(uptake_flux) = 0.3387 > 0
- id: F-03
  kind: biological
  tier: observation
  status: confirms
  statement: 'The cell gains mass over the run from its uptake. Confirmed: last(single_cell.mass) = 1.1693
    > 1.0.'
  evidence:
    from_test: cell-grows
    from_run: closing-the-loop
    observed: last(single_cell.mass) = 1.1693 > 1.0
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Every behavior test passes against real measured readouts; the study demonstrates the paper's
      pattern qualitatively (toy-real, uncalibrated).
  explanatory_gain:
    result: POSITIVE
    basis: The draft->executable compilation makes the paper's interface-preservation claim mechanical
      and observable for this figure.
conclusion: '## Claims

  - Sensing and acting are two sides of one coupling: over a real diffusing map[float] field the cell
  draws down a local source (1.0→0.20), acts back with uptake flux 0.34, and grows (mass 1.0→1.17).


  ## Evidence

  - **FIELD-DIFFUSES** — source field[4] 1.0->0.2049; neighbour field[0]->0.2647

  - **CELL-ACTS** — last(uptake_flux) = 0.3387 > 0

  - **CELL-GROWS** — last(single_cell.mass) = 1.1693 > 1.0


  ## Limitations

  - Toy-real, not calibrated: the handler uses plausible constants, not fitted parameters, so the run
  demonstrates the *pattern*, not a validated quantity.

  - A single mechanism/handler per draft; alternative handlers are out of scope here (except the Fig 6
  study, which is *about* alternative handlers).


  ## Next steps

  - Calibrate the handler against literature values to move from pattern-demonstration toward quantitative
  validation.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - typed-interface
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- Uncalibrated toy-real constants — demonstrates the compositional pattern, not a quantitatively validated
  cell.
- Deterministic single run per mechanism; no multi-seed replication (the dynamics here are deterministic
  given the handler).
falsifiability: The claim is overturned if the compiled executable fails to preserve the draft's interface
  (a port renamed or a wire dropped by compilation), or if the handler produces no non-trivial dynamics
  on the declared ports.
