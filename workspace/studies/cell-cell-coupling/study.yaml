conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: 'All three composites -- cellcell-compete.composite.json, cellcell-crossfeed.composite.json,
      and the new cellcell-crossfeed-knockout.composite.json -- build and
      run to completion through the process-bigraph engine
      (tests/test_cellcell_regimes.py, tests/test_cpm_colony_field.py, tests/test_cpm_colony_viz.py,
      tests/test_composites_build.py); guarded skip when the optional cobra/cpm/spatio_flux
      dependencies are absent, matching this investigation''s flagship and the lumped ODE
      predecessor''s own FBA-grain convention.'
  biological_validation:
    result: PASS
    basis: All primary behavior tests pass on measured readouts from real 20-tick runs -- the
      competition regime drives a decisive biomass/volume split between two otherwise-identical
      competitors differing only in uptake capacity (asymmetric growth via resource preemption
      between the two cells -- not population-level competitive exclusion, which would need dividing
      populations; the loser is displaced but stays viable, 51.6x above the viable-biomass floor,
      not driven below any viability bound -- this study couples shared state, not a viability
      constraint), and the cross-feeding regime sustains a consumer cell that never touches
      glucose purely via a diffused acetate handoff. Two structural/foundational verifications
      (the two-writer additivity check and the acetate-plume positive check) and a genuine
      negative control (the secretor-knockout -- with no acetate produced, the consumer flatly
      fails to grow, biomass held at its 1.25 seed) all pass, pinning both the mechanism and its
      necessity.
  explanatory_gain:
    result: POSITIVE
    basis: Generalizing the flagship's single-cell CpmCellField to an N-cell CpmColonyField and
      demonstrating both branches of the paper's §Cell–cell coupling viability-negotiation
      pattern (no dedicated figure) -- shared-resource competition (asymmetric growth via resource
      preemption) AND cross-feeding -- from the same
      coupling process, differing only in the
      composite's cell roles and field constants, makes this investigation's law-4 claim
      (different handlers over one interface negotiate a shared-resource constraint differently)
      concrete at real spatial, per-footprint dFBA resolution that its lumped two-role, shared-
      scalar-pool analogue could not reach. The secretor-knockout control further pins the
      cross-feeding handoff as necessary, not incidental.
conclusion: '## Claims

  - Composing N real CPM cells with one shared, real spatio-flux nutrient field through a single
    N-cell coupling process (`CpmColonyField`) reproduces the paper''s §Cell–cell coupling
    viability-negotiation pattern (no dedicated figure) as genuine spatial multicellularity. Over
    20-tick runs: an uptake-capacity asymmetry alone
    (glucose_vmax 10 vs 4) drives asymmetric growth via resource preemption between the two cells
    (biomass ratio 2.9-3.7x across 5 seeds, 3.69x on the flagship seed; 237.9 vs
    64.5; volume 3511 vs 81 px) -- the loser is spatially displaced but stays viable (its
    biomass grew ~51.6x above the 1.25 seed floor), not driven below a viability bound; this is
    resource preemption between two single, never-dividing cells, not population-level competitive
    exclusion (which would need dividing populations), and the winner''s ~97.5%-lattice swell
    without division is a finite-size saturation artifact; a different composite over the same process -- localized glucose
    depot, fast-diffusing acetate byproduct, acetate-consuming role -- sustains a cell that never
    touches glucose (local glucose 0.0) purely via a diffusing cross-feeding handoff (local
    acetate 1.30, biomass 1.25 -> 3.79), and a secretor-knockout control shows that handoff is
    necessary (no acetate -> consumer held at its 1.25 seed).


  ## Evidence

  - **COMPETITION-EXCLUDES-THE-SLOWER-CELL** -- biomass 237.9 (id 1) vs 64.5 (id 2), 3.69x margin

  - **COMPETITION-VOLUME-TRACKS-BIOMASS** -- CPM volume 3511 px (id 1) vs 81 px (id 2)

  - **COMPETITION-LOSER-DISPLACED-NOT-EXCLUDED** -- loser biomass 64.5 (51.6x the 1.25 viable-
    biomass floor): displaced (81 px vs winner 3511 px ~97.5% of the lattice), not excluded

  - **CROSSFEEDING-CONSUMER-BLIND-TO-GLUCOSE** -- consumer local_glucose == 0.0

  - **CROSSFEEDING-CONSUMER-GROWS-ON-ACETATE-ALONE** -- consumer biomass 1.25 -> 3.79 on acetate
    alone

  - **CROSSFEEDING-ACETATE-PLUME-REACHES-CONSUMER** (positive check) -- consumer local_acetate ==
    1.30 by t=20

  - **CROSSFEEDING-SECRETOR-KNOCKOUT-CONSUMER-FAILS-TO-GROW** (negative control) -- secretor
    removed, no acetate produced, consumer biomass held at its 1.25 seed (vs 1.25 -> 3.79)

  - **TWO-WRITER-ADDITIVITY-CONSERVES-MASS** (structural check) -- disjoint per-cell field writes
    sum losslessly, runtime-verified


  ## Limitations

  - "Competitive exclusion" is not literally reached over the run: the loser is displaced (81 px,
    biomass 64.5) but stays viable -- this study couples shared state, not a viability constraint,
    so no cell is driven below a viability bound (§Cell–cell coupling: what is coupled is not only
    state, but constraint -- here, only state). The winner''s 3511-px (~97.5% of 3600) endpoint is
    partly a finite-size lattice-saturation artifact; at t≈30 the winner fills the lattice and the
    still-viable loser is crowded off it (eviction, not starvation).

  - e_coli_core-derived constants (glucose_vmax, acetate_vmax, grow_per_biomass, the O2 cap) are
    toy-real -- plausible, hand-tuned magnitudes, not fitted to any organism or medium.

  - The cross-feeding regime''s acetate/glucose diffusion ratio (15.0 vs 0.4 = 37.5x) is a
    legibility choice, not a calibration: acetate does diffuse faster, but the real aqueous ratio is
    only ~1.5-2x, so 37.5x is roughly 20x the physical ratio (chosen, not fitted); the localized
    glucose depot is a deliberately engineered spatial arrangement, not a naturally arising gradient.

  - The consumer''s growth under cross-feeding is back-loaded to roughly the last 5 ticks of the
    run, once the acetate plume has had time to diffuse across the distance between the two
    cells'' footprints -- monotonic over the measured window, not smoothly exponential from tick 0.

  - Each CPM cell gets its own independent cobra model copy, not one shared model instance across
    the colony.

  - CPM-native chemotaxis (directed motion toward a sensed gradient) remains out of scope for both
    regimes here.

  ## Next steps

  - Extend `CpmColonyField` to N > 2 cells to test whether the competitive/cross-feeding pattern
    generalizes to population-scale spatial negotiation.

  - Add CPM-native chemotaxis so the consumer can move toward the sensed acetate plume rather than
    merely sitting in its path.

  - Fan out to the next spatial counterpart in the planned increments.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'Both cellcell-compete.composite.json and cellcell-crossfeed.composite.json
      build and run to completion through the engine over 20 ticks.'
    biological_validation: The spatial §Cell–cell coupling viability-negotiation pattern (no
      dedicated figure) is demonstrated at the
      toy-real (uncalibrated) level, with genuine per-cell CPM shape dynamics and independent
      dFBA solves behind both the shared-resource-competition (asymmetric growth via resource
      preemption; loser displaced, not excluded) and cross-feeding branches, rather than a scripted
      trajectory. The cross-feeding handoff is pinned as necessary by the secretor-knockout
      control (no acetate -> no consumer growth).
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the faster competitor's biomass/volume margin over the slower one collapses (uptake-capacity
      asymmetry not taking effect, or the shared field is not actually being depleted by both
      cells)
    - the consumer's local glucose is not near-zero (the localized glucose depot is leaking into
      the consumer's footprint, defeating the cross-feeding demonstration)
    - the consumer's biomass never rises despite zero local glucose (the acetate plume is not
      reaching it, or the consumer's acetate uptake/growth coupling is broken)
    - the secretor-knockout consumer DOES grow despite no acetate being produced (the observed
      cross-feeding growth was not actually caused by the secretor's acetate -- necessity broken)
    - the two-writer additivity control fails to conserve mass (the N-cell field-write assumption
      CpmColonyField depends on is broken)
    block_downstream: 'future N>2-cell population-scale spatial studies, all of which reuse
      CpmColonyField or its coupling pattern'
limitations:
- 'The regime is resource preemption between two single, never-dividing cells, NOT population-level
  competitive exclusion (which would need dividing populations): the competition loser is spatially
  displaced (ends at 81 px, biomass 64.5 -- still 51.6x above its 1.25 seed / viable-biomass floor)
  but is never driven below a viability bound. This study couples shared STATE (one field) but no
  viability CONSTRAINT (no death, no viability bound on a losing cell), so the phenomenon
  is resource preemption, not exclusion. The winner''s 3511-px endpoint is ~97.5%
  of the 3600-px lattice with the field nearly exhausted by t=20 -- a single cell swelling to fill
  the lattice without dividing is a finite-size saturation artifact, not physiology; extending the
  run to t≈30 fills the lattice and crowds the still-viable loser off it (eviction, not starvation),
  which a viability-constraint coupling and dividing populations would be needed to turn into genuine
  exclusion.'
- 'The competition headline is a multi-seed band, not a single-seed point: a 5-seed robustness
  sweep (tests/test_cellcell_multiseed.py) puts the biomass ratio at ~2.9x-3.7x (mean
  ~3.2x), with the single-seed flagship 3.69x at the TOP of the band, and the faster competitor winning
  every seed by > 1.5x. See key_assumptions for the convention this establishes for the
  investigation.'
- e_coli_core-derived constants (glucose_vmax, acetate_vmax, grow_per_biomass, the O2 cap) are
  toy-real, hand-tuned magnitudes chosen to make both regimes legible over a short run -- not
  fitted to any organism or medium.
- 'The cross-feeding regime''s acetate/glucose diffusion ratio (15.0 vs 0.4 = 37.5x) is a legibility
  choice, not a calibration -- acetate does diffuse faster than glucose (smaller molecule), but the
  real aqueous ratio is only ~1.5-2x (glucose ≈ 600 µm²/s, acetate ≈ 1100 µm²/s), so 37.5x is roughly
  20x the physical ratio, chosen to make the plume legibly reach the consumer within
  20 ticks, not fitted to measured diffusion coefficients; the localized glucose depot (20 model units) is
  likewise a deliberately engineered spatial arrangement so the consumer genuinely sees zero
  glucose, not a naturally arising gradient.'
- The consumer's growth under cross-feeding is back-loaded to roughly the last 5 ticks of the
  20-tick run, once the secretor's acetate plume has had time to diffuse across the distance
  separating the two cells' footprints -- monotonic over the measured window, but not smoothly
  exponential from tick 0.
- Each CPM cell in CpmColonyField gets its own independent cobra model copy, not one shared model
  instance across the colony.
- 'The additive two-writer assumption CpmColonyField''s N-cell field-write depends on is now
  runtime-verified directly (tests/test_cpm_colony_two_writer.py), independent of both regimes''
  own dFBA mechanism -- previously an unverified assumption inherited from the flagship study.'
- 'The secretor-knockout necessity control removes the secretor CELL entirely (cleanest single-
  variable knockout: no acetate source anywhere) rather than silencing acetate secretion in
  place; the alternative -- raising the secretor''s O2 cap so it stops overflowing -- also makes
  it grow far faster and crowd the consumer off the lattice, a confound the cell-removal avoids.
  The control therefore establishes that acetate is necessary for the consumer''s growth, but not
  the finer counterfactual of an in-place, same-growth secretor that merely stops secreting.'
- CPM-native chemotaxis (directed motion up a sensed gradient) remains out of scope for both
  regimes here, matching the flagship's own deferral.
- The shared nutrient field has no continuous supply term; the competition regime depletes a
  fixed initial mass, producing a finite-lattice-saturation artifact (the winner ends near
  full-lattice while the field is nearly exhausted). A continuous nutrient-supply term (a
  bounded first-order source) would remove this confound and let population-level competitive
  exclusion (with dividing populations) or
  a genuine steady state be tested rather than transient depletion.
- The compete, crossfeed, and knockout composites are asserted in prose to share the same
  external colony interface, but this is not verified by a structural check; a diagnostic test
  asserting interface equality across the mechanism swaps would strengthen the
  substrate-independence claim from assertion to demonstration.
falsifiability: Overturned if the faster competitor's biomass/volume margin over the slower
  competitor collapses under the competition regime, if the shared glucose field is not
  measurably depleted (the cells not genuinely coupled through one field), if the cross-feeding
  consumer's local glucose is not near-zero (the localized depot leaking into its footprint), if
  the consumer's biomass fails to rise despite zero local glucose (the acetate handoff not
  actually sustaining it), if the secretor-knockout consumer nonetheless grows despite no acetate
  being produced (the cross-feeding growth not actually caused by the secretor's acetate --
  necessity broken), or if the additive two-writer field control fails to conserve mass
  (the N-cell field-write assumption CpmColonyField depends on broken).
