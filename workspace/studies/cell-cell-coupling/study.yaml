parent_studies:
- study: cell-environment-coupling
  condition: tests-passed
experiment: 'Run two `CpmColonyField` composites -- `cellcell-compete` (two glucose competitors,
  glucose_vmax 10.0 vs 4.0, one shared uniform glucose field) and `cellcell-crossfeed` (a
  glucose-to-acetate secretor plus an acetate-consuming cell, a localized glucose depot, and a
  fast-diffusing acetate byproduct) -- each to completion over 20 ticks through the process-
  bigraph engine, and measure whether uptake-capacity asymmetry alone drives spatial resource
  preemption between the two cells, and whether a diffusing metabolic byproduct alone can sustain a
  cell that never touches its nominal nutrient.

  '
result: 'Over 20-tick runs, the competition regime drives a decisive spatial split from uptake-
  capacity asymmetry alone (biomass ratio 2.9-3.7x across 5 seeds, 3.69x on the flagship seed; 237.9
  vs 64.5; CPM volume 3511 vs 81 px) -- asymmetric
  growth via resource preemption between the two cells, not population-level competitive exclusion

  (which would need dividing populations): the loser is displaced but
  still viable (its biomass grew ~51.6x, far above the 1.25 seed floor), never driven below a
  viability bound, and the winner''s ~97.5%-lattice endpoint is partly a finite-size saturation
  artifact -- this study couples shared state, not a viability constraint. The
  cross-feeding regime -- the same `CpmColonyField` process, a different composite -- sustains a
  consumer cell that never touches glucose (local glucose 0.0) purely via a diffusing acetate
  handoff (local acetate 1.30, biomass 1.25 -> 3.79, ending as a viable 65-pixel CPM cell), and a
  secretor-knockout control confirms that handoff is necessary (secretor removed, no acetate
  produced, the consumer held at its 1.25 seed). The
  paper''s §Cell–cell coupling viability-negotiation pattern (no dedicated figure) holds as
  genuine spatial multicellularity, composed from independent frameworks through one N-cell
  coupling process, one interface, two regimes. The cross-feeding regime also carries the paper''s
  closing relational-molecule claim (§Cell–cell coupling): the same acetate is metabolic waste to
  the secretor and sole carbon food to the consumer -- and, in `disintegration`, a toxin
  whose accumulation crosses a cell''s viability bound -- one molecule whose meaning is set
  relationally by each cell''s interface.

  '
