schema_version: 4
name: cell-cell-coupling
investigation: draft-to-living-cell
title: Cell–Cell Coupling
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional
question: 'Does the paper''s §Cell–cell coupling viability-negotiation pattern (no dedicated

  figure) hold as real spatial multicellularity — multiple CPM cells sharing one diffusing

  nutrient field, each running its own dynamic-FBA step at its own footprint, producing both

  resource preemption between two cells and cross-feeding — when the whole colony is composed from independent

  frameworks through one N-cell coupling process (`CpmColonyField`), rather than the lumped

  two-role, shared-scalar-pool stand-in a lumped, specification-stage realization used?

  '
biological_summary: 'This is the spatial realization of the paper''s §Cell–cell coupling pattern

  (no dedicated figure), built on the flagship''s `CpmCellField` process

  generalized to `CpmColonyField` — one process instance that owns N CPM cells sharing one

  spatio-flux field grid, running one dynamic-FBA step per cell at its own lattice footprint each

  tick, and writing all N cells'' uptake/secretion deltas back into the shared field as one summed

  update. The additive two-writer assumption this depends on (two cells'' disjoint footprint

  deltas summing correctly into one shared `map[array]` fields store, conserving mass) is no

  longer an assumption — it is runtime-verified directly (`tests/test_cpm_colony_two_writer.py`):

  two synthetic single-pixel writers on disjoint pixels are each applied independently and sum

  losslessly over repeated ticks.


  Two tuned regimes over the same `CpmColonyField` process demonstrate both branches of the

  paper''s §Cell–cell coupling negotiation (no dedicated figure). COMPETITION (`meta_modelers_guide.composites.cellcell-compete`): two glucose

  competitors seeded on a uniform glucose field (3.0 model units), differing only in uptake capacity

  (`glucose_vmax` 10.0 vs 4.0). Measured over a 20-tick run

  (`tests/test_cellcell_regimes.py::test_competition_excludes_the_slower_cell`,

  `tests/test_cpm_colony_field.py`): the faster competitor ends with biomass 237.9 against the

  slower competitor''s 64.5 — a 3.69x margin — and CPM lattice volume 3511 px against 81 px, an

  even starker asymmetry, because CPM growth compounds superlinearly once one cell has

  out-competed the other for the shared glucose. The shared field is measurably drawn down by

  both cells drawing on the same pool, and the loser is displaced to a small fragment (81 px) of

  the lattice it started with parity on. This is asymmetric growth under shared-resource

  competition — resource preemption between two cells, not population-level competitive exclusion (which

  would require dividing populations): the loser''s biomass

  still GREW from its 1.25 seed to 64.5 (~51.6x) and stays far above any viable-biomass floor, so

  it is spatially DISPLACED, not driven below a viability bound (this study imposes no death and

  no viability constraint on a losing cell). And the winner''s 3511 px is ~97.5% of the 3600-px

  lattice, with the field nearly exhausted by t=20 — the endpoint is as much a finite-size

  lattice-saturation artifact as a biological one (a single cell swelling to ~97.5% of the lattice

  without ever dividing is a lattice artifact, not physiology; by t≈30 the winner fills the whole

  lattice and the still-viable loser is simply crowded off it, evicted rather than starved). This is exactly

  the paper''s §Cell–cell coupling distinction that "what is coupled is not only state, but

  constraint": these cells couple STATE (one shared field) but no viability CONSTRAINT, so strict

  exclusion is out of reach here — spatial competition as a direct, unscripted consequence of two

  independent dFBA solves reading the same depleting field.


  CROSS-FEEDING (`meta_modelers_guide.composites.cellcell-crossfeed`) is the biology that carries

  this investigation''s deepest claim: the paper''s §Cell–cell coupling closes on the idea that an

  environmental variable acquires its significance relationally — the same molecule counts as

  nutrient, signal, or toxin only through its consequences for a given cell''s viability. Acetate

  embodies exactly that here. It is the glucose-fermenting secretor''s metabolic WASTE — a

  byproduct it dumps into the shared field — and, at the very same instant, the consumer''s sole

  carbon FOOD, the only thing keeping it alive. One molecule, two opposite meanings, each set

  relationally by the cell whose interface it meets. This is textbook microbial metabolic

  cooperation / cross-feeding (morris2013): a byproduct of one organism''s metabolism becomes an

  obligate resource for another, and a spatial community is knit together by the exchange. The

  regime realizes it concretely: a glucose-to-acetate

  secretor (O2 cap 5, seeded at a localized glucose depot (20 model units) in lattice columns 0-18) paired

  with an acetate-consuming cell (`acetate_vmax` 20) seeded well outside the glucose depot

  (columns 22-30), with acetate diffusing far faster than glucose in this regime (diffusion

  coefficient 15.0 vs 0.4) so the secreted byproduct plume can reach the consumer before the

  glucose gradient does. Measured over the same 20-tick run

  (`tests/test_cellcell_regimes.py::test_crossfeeding_keeps_the_consumer_viable`): the consumer''s

  own local glucose reads 0.0 — it genuinely cannot touch glucose — while its local acetate reads

  1.30, and its biomass climbs from an initial 1.25 to 3.79 (roughly 3x) on that acetate alone,

  ending as a viable cell occupying 65 lattice pixels. The consumer''s growth is back-loaded to

  the last several ticks of the run, once the secretor''s plume has had time to diffuse the

  distance between the two cells'' footprints — growth is monotonic over the window measured, not

  smoothly exponential from tick 0. That the secretor''s acetate is what CAUSES this growth — not

  anything intrinsic to the consumer or the field — is closed by a secretor-knockout necessity

  control (`meta_modelers_guide.composites.cellcell-crossfeed-knockout`): the same composite with

  the secretor cell removed so NO acetate is ever produced. Run 20 ticks, the otherwise-identical

  consumer (now the only cell) sits at local acetate 0.0 and its biomass never climbs off its

  1.25 seed — it persists on the lattice (~35 px) but flatly fails to grow, the genuine negative

  control for the handoff. This same acetate carries the arc across the investigation:

  waste-and-food here, it becomes a TOXIN in `disintegration`, where a high local acetate

  concentration crosses a cell''s viability bound and triggers its collapse — one molecule, three

  relational meanings across the two studies.

  '
claim: 'Composing N real CPM cells with one shared, real spatio-flux nutrient field through a

  single N-cell coupling process (`CpmColonyField`) reproduces the paper''s §Cell–cell coupling

  viability-negotiation pattern (no dedicated figure) as genuine spatial multicellularity, not a

  scripted or lumped stand-in for it: over

  20-tick runs, an uptake-capacity asymmetry alone (glucose_vmax 10 vs 4) drives asymmetric

  growth via resource preemption between the two cells (biomass ratio 2.9-3.7x across 5 seeds,

  3.69x on the flagship seed; volume 3511 vs 81

  px — the loser displaced but still viable, above its 1.25 seed, not driven below a viability

  bound; population-level competitive exclusion would need dividing populations, and the winner''s

  ~97.5%-lattice swell without division is a saturation artifact), while a

  different composite over the same coupling process — a localized glucose depot, a fast-diffusing

  acetate byproduct, and an acetate-consuming role — sustains a cell that never touches glucose

  (local glucose 0.0) purely via a diffusing cross-feeding handoff (local acetate 1.30, biomass

  1.25 -> 3.79). Both regimes run through the same process; only the composite''s cell roles and

  field constants differ, mirroring the lumped ODE predecessor''s law-4 pattern

  (two handler environments negotiate the shared-resource constraint differently over one

  interface) at real spatial, per-footprint metabolic resolution.

  '
baseline:
- name: cellcell-compete
  composite: meta_modelers_guide.composites.cellcell-compete
  params: {}
- name: cellcell-crossfeed
  composite: meta_modelers_guide.composites.cellcell-crossfeed
  params: {}
- name: cellcell-crossfeed-knockout
  composite: meta_modelers_guide.composites.cellcell-crossfeed-knockout
  params: {}
variants:
- name: cellcell-compete-mm
  composite: meta_modelers_guide.composites.cellcell-compete-mm
  description: 'Cell-cell (colony) interface surrogate-calibration twin of the competition
    baseline (a tuned MM stand-in): the SAME colony interface `CpmColonyField`, its per-cell metabolism swapped
    from constraint-based dynamic-FBA (cobra e_coli_core, O2-capped) to a lumped, cobra-free
    Michaelis-Menten / Monod metabolism (`mechanism: mm`) BEHIND THE BYTE-IDENTICAL
    `CpmColonyField` ports. Each competitor keeps its OWN saturating glucose uptake
    v = glucose_vmax*glc/(glucose_km+glc) -- the very kinetics the dFBA path MM-limits its
    exchange bound with -- so the vmax 10-vs-4 asymmetry that drives the resource-preemption split is
    preserved by construction; growth is then a fixed biomass yield (mm_yield*v) and acetate
    a fixed overflow fraction (mm_overflow*v standing in for the dFBA O2-cap mixed-acid
    overflow). The mm_* params (mm_yield 0.075, mm_overflow 0.034) are TUNED so the colony
    interface-level observables track the dFBA competition baseline (only 2 free knobs, since the
    vmax 10/4 uptake kinetics are SHARED with dFBA, against ~6 colony observables -- over-constrained,
    not exactly determined); they are not derived from the dFBA solution. This lifts the flagship
    single-cell dFBA<->MM surrogate calibration up to the multi-cell composition level. PRE-SATURATION
    TEST NOW RUN (peer-review M2) -- the 20-tick match was measured at ~97.5%+ lattice saturation; re-
    measuring in a non-saturated regime (10 ticks, ~50% occupancy) separates real agreement from the
    ceiling artifact. Growth/competition observables are genuinely substitutable pre-saturation (total
    biomass ~9%, competition ratio ~1%, total CPM volume ~2%, glucose ~1%), but the ~0.2% acetate
    match is a SATURATION ARTIFACT -- pre-saturation the MM overflow surrogate diverges ~68% (mm_overflow
    was tuned to the saturated endpoint, not the trajectory).'
  params:
    mechanism: mm
    mm_yield: 0.075
    mm_overflow: 0.034
key_assumptions:
- 'e_coli_core-derived constants (`glucose_vmax` 10.0/4.0 for the two competitors,

  `acetate_vmax` 20 for the consumer, `grow_per_biomass` 30, the O2 cap of 5 on the secretor) are

  toy-real: plausible, hand-tuned magnitudes chosen to make resource preemption and cross-

  feeding both legible over a short (20-tick) run, not fitted to a named organism or medium.'
- 'The cross-feeding regime''s acetate/glucose diffusion ratio (15.0 vs 0.4 = 37.5x) is a

  legibility choice, not a calibration: acetate does diffuse faster than glucose (it is a smaller

  molecule), but the real aqueous ratio is only ~1.5-2x (glucose ≈ 600 µm²/s, acetate ≈ 1100 µm²/s),

  so 37.5x is roughly 20x the physical ratio. The specific ratio was chosen to make the byproduct plume legibly reach the

  consumer within a 20-tick run, not fitted to measured diffusion coefficients. Likewise the

  cross-feeding regime''s localized glucose depot (20 model units) (columns 0-18 only, with the consumer

  seeded outside it at columns 22-30) is a deliberately engineered spatial arrangement chosen so

  the consumer genuinely sees zero glucose (local_glucose == 0.0), not a naturally arising

  gradient.'
- 'The consumer''s growth under cross-feeding is back-loaded to roughly the last 5 ticks of the

  20-tick run, once the secretor''s acetate plume has had time to diffuse across the distance

  separating the two cells'' footprints — growth is monotonic over the measured window but is not

  a smooth exponential from tick 0, and a shorter run would show less of it.'
- 'Each CPM cell in `CpmColonyField` gets its own independent cobra model copy, not one shared

  model instance across the colony — avoiding any risk of one cell''s dFBA solve silently

  perturbing another''s solver state, at the cost of N times the per-tick FBA solve cost.'
- 'The additive two-writer assumption `CpmColonyField` depends on — that disjoint per-cell

  footprint deltas can be summed into one shared `map[array]` fields store and conserve mass — is

  no longer taken on faith; it is runtime-verified directly by

  `tests/test_cpm_colony_two_writer.py` against two synthetic single-pixel writers on disjoint

  pixels, independently of the colony process itself.'
- CPM-native chemotaxis (directed motion up a sensed gradient, e.g. the consumer moving toward
  the secretor's acetate plume rather than merely sitting in its path) remains out of scope for
  both regimes here, matching the flagship's own deferral.
- 'The "viable-biomass floor" this study measures the competition loser against is the 1.25 seed
  biomass every cell starts at: a cell above its seed biomass is metabolically viable (net-
  growing or holding), one that has fallen below it is in net mass-loss toward death. This is a
  deliberately minimal, toy-real viability notion, not a fitted maintenance/decay bound; the
  process emits no explicit viability flag, so viability is read off the per-cell biomass
  observable. The point it establishes is robust to the exact floor value: the
  competition loser ends at 64.5 (51.6x the floor), so it is displaced, not excluded.'
- 'The competition regime is resource preemption between two single, never-dividing cells, NOT
  population-level competitive exclusion (which would need dividing populations). It imposes no
  death and no viability constraint on a losing cell, so the loser (biomass 64.5, 81
  px) is spatially displaced, not eliminated. The winner''s 3511-px endpoint is ~97.5% of the
  3600-px lattice with the field nearly spent by t=20 — a single cell swelling to fill the lattice
  without dividing is a finite-size saturation artifact, not physiology; extending the run to t≈30
  fills the lattice and crowds the still-viable loser off it (eviction, not starvation). Strict
  exclusion would require coupling a viability constraint (and dividing populations), not only
  shared state — the paper''s §Cell–cell coupling distinction.'
- 'MULTI-SEED ROBUSTNESS (the headline is a range, not a single-seed point). The competition
  headline ratio (3.69x, id 1 / id 2 biomass) is a SINGLE-SEED reading of a stochastic CPM
  Metropolis trajectory. A 5-seed sweep (`tests/test_cellcell_multiseed.py`, seeds 1-5, CPM seed
  varied via the now config-overridable `CpmColonyField` seed) gives the range: ratio
  2.9x-3.7x, mean ~3.2x -- the hard-coded single-seed 3.69x is the TOP of the band, not its
  middle. The qualitative claim is seed-robust: the faster competitor (id 1, glucose_vmax 10)
  wins on both biomass and lattice volume at every seed, always by > 1.5x. This study establishes
  the multi-seed convention for the investigation (process reads `seed` from config; deep-copy the
  composite state, sweep the seed, assert the qualitative claim per seed and report the numeric
  range); studies 5/7/9 copy the pattern rather than resting on a single hard-coded seed.'
- 'The secretor-knockout necessity control (`cellcell-crossfeed-knockout`) removes the secretor
  cell entirely rather than only silencing its acetate secretion in place; this is the cleanest
  single-variable knockout (no acetate source anywhere) and avoids a confound of the alternative
  (raising the secretor''s O2 cap so it stops overflowing also makes it grow far faster and crowd
  the consumer off the lattice). The consumer is therefore the only cell in the control (id 1),
  and its glucose exchange stays off by role, so the slowly-diffusing glucose depot it cannot eat
  is harmless to the control.'
acceptance_criteria:
- The higher-uptake-capacity cell should end with more biomass and more lattice volume than the lower-capacity cell — resource preemption ordering (a sign/ordering prior stated before running).
- An acetate-consuming cell seeded away from glucose should grow only via the secretor's diffused acetate, and should fail to grow when the secretor is removed (necessity).
- Disjoint per-cell field writes should sum losslessly into one shared field — mass conservation.
units_and_time:
  time: 1 tick = unspecified physical time (dimensionless model time); runs are 20 ticks.
  quantities: glucose/acetate field values, biomass, and CPM lattice volume (px) are dimensionless model units. The "3.0 mM" / "20 mM" glucose figures printed elsewhere are decorative — dimensionless model units, not calibrated mM — and the diffusion coefficients are legibility choices, not measured values.
external_anchors:
- 'aqueous diffusivities: glucose ≈ 600 µm²/s, acetate ≈ 1100 µm²/s → real acetate/glucose ratio ≈ 1.5-2x (order-of-magnitude anchor, not a calibration target). The study''s 37.5x ratio (15.0 vs 0.4) is a legibility choice — roughly 20x the physical ratio — chosen so the plume reaches the consumer within 20 ticks, not "directionally defensible" calibration.'
- 'acetate yield under overflow ≈ 0.3-0.5 mol acetate / mol glucose; glucose uptake ≈ 10 mmol/gDW/hr (E. coli aerobic) (order-of-magnitude anchors, not calibration targets).'
behavior_tests:
- name: competition-excludes-the-slower-cell
  classification: primary
  description: Under the competition regime (glucose_vmax 10.0 vs 4.0, one shared glucose field),
    the faster competitor ends with materially more biomass and CPM lattice volume than the
    slower one — spatial resource preemption between the two cells (not population-level competitive
    exclusion, which would need dividing populations).
  measure:
    kind: observable
    path: obs.biomass
    expr: 'last(obs.biomass["1"]) / last(obs.biomass["2"])'
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 1.5
    provenance: 'prior: the higher-uptake-capacity cell (glucose_vmax 10) should end with more
      biomass than the lower-capacity cell (vmax 4) → expect ratio > 1 (pin floor 1.5). Observed:
      multi-seed band 2.9-3.7x (3.69x on the flagship seed; biomass 237.9 vs 64.5) over 20 ticks
      (tests/test_cellcell_regimes.py::test_competition_excludes_the_slower_cell,
      tests/test_cpm_colony_field.py::test_two_cells_metabolize_grow_and_deplete_disjointly;
      tests/test_cellcell_multiseed.py for the 5-seed band)'
  requires_simulation: cellcell-compete
- name: competition-volume-tracks-biomass
  classification: primary
  description: The faster competitor's CPM lattice volume ends larger than the slower
    competitor's, confirming the biomass asymmetry carries through to structural (pixel-level)
    dominance, not just the internal FBA state.
  measure:
    kind: observable
    path: obs.volume
    expr: 'last(obs.volume["1"]) > last(obs.volume["2"])'
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 0.0
    provenance: 'prior: the biomass winner should also hold more lattice volume → expect
      volume(id1) > volume(id2). Observed: 3511 px (id 1) vs 81 px (id 2) over 20 ticks; the
      winner''s 3511 px is ~97.5% of the 3600-px lattice, a finite-size saturation endpoint rather
      than unbounded dominance (tests/test_cellcell_regimes.py::test_competition_excludes_the_slower_cell)'
  requires_simulation: cellcell-compete
- name: competition-loser-displaced-not-excluded
  classification: diagnostic
  control: positive
  description: 'Boundary on the competition claim: the LOSER is out-competed spatially but
    stays FAR above the viable-biomass floor (its 1.25 seed biomass) -- so it is displaced, not
    driven below any viability bound. This is resource preemption between two single, never-dividing
    cells reaching a finite-size saturation endpoint, not death of the loser and not population-level
    competitive exclusion (which would need dividing populations): this study couples state (a shared
    field) but no viability constraint (§Cell–cell coupling -- what is coupled is not only state
    but constraint; here, only state).'
  measure:
    kind: observable
    path: obs.biomass
    expr: 'last(obs.biomass["2"])   # loser final biomass, vs the 1.25 viable-biomass floor'
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 1.25
    provenance: 'prior: this study couples shared state but imposes no viability constraint, so the
      loser should stay above its 1.25 seed (displaced, not excluded). Observed: loser (id 2) ends
      at biomass 64.5 -- it GREW ~51.6x from its 1.25 seed and sits
      far above the viable-biomass floor, while holding only 81 px against the winner''s 3511 px
      (~97.5% of the 3600-px lattice): spatially displaced, not excluded. Extending the run to
      t≈30 fills the lattice and crowds the still-viable loser off it (eviction, not starvation)
      (tests/test_cellcell_regimes.py::test_competition_loser_is_displaced_not_excluded)'
  requires_simulation: cellcell-compete
- name: crossfeeding-consumer-blind-to-glucose
  classification: primary
  description: Under the cross-feeding regime, the consumer cell's own local glucose concentration
    is effectively zero -- it is seeded outside the localized glucose depot and genuinely cannot
    touch glucose.
  measure:
    kind: observable
    path: obs.local_glucose
    expr: 'last(obs.local_glucose["2"])'
  pass_if:
    kind: regression_pin
    op: <
    value: 0.5
    provenance: 'by construction the consumer is seeded outside the localized glucose depot;
      consumer (id 2) local_glucose == 0.0 over 20 ticks
      (tests/test_cellcell_regimes.py::test_crossfeeding_keeps_the_consumer_viable)'
  requires_simulation: cellcell-crossfeed
- name: crossfeeding-consumer-grows-on-acetate-alone
  classification: primary
  description: Despite never touching glucose, the consumer's biomass grows over the run --
    it is living entirely on the secretor's diffused acetate byproduct.
  measure:
    kind: observable
    path: obs.biomass
    expr: 'last(obs.biomass["2"])'
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 1.25
    provenance: 'prior: an acetate-consuming cell fed only the secretor''s diffused acetate should
      grow above its 1.25 seed. Observed: consumer (id 2) biomass 1.25 -> 3.79 (roughly 3x,
      back-loaded to the last ~5 ticks once the acetate plume arrives) over 20 ticks
      (tests/test_cellcell_regimes.py::test_crossfeeding_keeps_the_consumer_viable)'
  requires_simulation: cellcell-crossfeed
- name: crossfeeding-acetate-plume-reaches-consumer
  classification: diagnostic
  control: positive
  description: 'Positive structural verification (not a negative control): the cross-feeding
    coupling is real, not two isolated cells -- the secretor''s acetate byproduct measurably
    reaches the consumer''s own footprint (local_acetate > 0). Something DOES happen; this confirms
    the plume arrives, so it is a positive check, not an expected-fail.'
  measure:
    kind: observable
    path: obs.local_acetate
    expr: 'last(obs.local_acetate["2"])'
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 0.0
    provenance: 'prior: the fast-diffusing acetate plume should reach the consumer''s footprint →
      expect local_acetate > 0. Observed: consumer (id 2) local_acetate == 1.30 by t=20, confirming
      the fast-diffusing (coefficient 15.0 vs glucose''s 0.4) acetate plume reaches the consumer''s
      footprint (tests/test_cellcell_regimes.py::test_crossfeeding_keeps_the_consumer_viable)'
  requires_simulation: cellcell-crossfeed
- name: two-writer-additivity-conserves-mass
  classification: diagnostic
  control: structural
  description: 'Foundational structural verification (not a negative control, and not this
    study''s scientific claim): the additive two-writer assumption CpmColonyField''s N-cell
    field-write depends on -- disjoint per-cell footprint deltas summed into one shared field
    conserve mass -- holds structurally, independent of any dFBA mechanism. It confirms a property
    HOLDS (mass is conserved to the expected value), so it is a positive/structural check.'
  measure:
    kind: observable
    path: fields.glucose
    expr: net change in sum(fields.glucose) over 3 ticks (final minus initial)
  pass_if:
    kind: regression_pin
    op: '=='
    value: -6.0
    deterministic_pin: true
    provenance: 'deterministic structural identity — exact only while the integer per-tick deltas
      and engine apply order are fixed. A synthetic structural-control process (not this study''s
      composites): two single-pixel writers on disjoint pixels, each removing 1.0/tick over 3 ticks,
      sum to a net field-wide change of exactly -6.0 with both pixels independently correct
      (tests/test_cpm_colony_two_writer.py::test_two_disjoint_writers_sum_and_conserve)'
  requires_simulation: none
- name: crossfeeding-secretor-knockout-consumer-fails-to-grow
  classification: diagnostic
  control: negative
  description: 'Genuine negative control (secretor-knockout necessity): with the acetate secretor
    removed from the cross-feed composite so NO acetate is produced anywhere, the otherwise-
    identical consumer (now the only cell, id 1) FAILS to grow -- its biomass stays at the 1.25
    seed and its local acetate stays 0.0. Closes the handoff-necessity argument: the consumer''s
    growth in the cross-feed regime is caused by the secretor''s acetate, not by anything
    intrinsic to the consumer or the field.'
  measure:
    kind: observable
    path: obs.biomass
    expr: 'last(obs.biomass["1"])   # consumer-alone final biomass; expected to stay at the seed'
  pass_if:
    kind: acceptance_criterion
    op: <=
    value: 1.2500001
    provenance: 'prior: remove the secretor so no acetate is produced anywhere, and the consumer
      should fail to grow — biomass stays at its 1.25 seed. Observed: consumer (id 1) biomass stays
      at its 1.25 seed and local_acetate stays 0.0 over
      20 ticks with the secretor removed -- it persists on the lattice (~35 px) but flatly fails
      to grow, versus 1.25 -> 3.79 in the full cross-feed regime
      (tests/test_cellcell_regimes.py::test_crossfeeding_knockout_consumer_fails_to_grow)'
  requires_simulation: cellcell-crossfeed-knockout
- name: colony-interface-observables-substitutable
  classification: primary
  description: 'Interface surrogate calibration at the CELL-CELL (colony) level: a tuned MM colony
    is fit to reproduce the dFBA colony''s observables behind the same colony
    interface `CpmColonyField`, its per-cell metabolism swapped dFBA -> lumped Michaelis-Menten
    (`cellcell-compete-mm`, `mechanism: mm`) behind byte-identical ports. The two colonies''
    interface-level observables (per-cell + total biomass, the competition ratio, total CPM
    lattice volume, the acetate plume, net glucose depletion) agree within a stated tolerance --
    the mm_* params were tuned to preserve the interaction variables, so this is surrogate
    calibration ("a tuned surrogate matches the coarse-grained relation"), not identical internals
    and not yet mechanism-independence. This 20-tick match is measured at ~97.5%+ lattice saturation
    (a finite-lattice ceiling both mechanisms hit) -- the pre-saturation gate `colony-substitutable-
    pre-saturation` below separates the real agreement from the ceiling artifact.'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose
    expr: per-observable abs(dFBA - MM) / dFBA over a 20-tick run
  pass_if:
    kind: regression_pin
    op: <
    value: 0.15
    provenance: 'over 20 ticks (tests/test_cellcell_substitutability.py::test_colony_interface_observables_substitutable):
      per-cell biomass dFBA 237.9/64.5 vs MM 223.3/64.3 (6.1%/0.3%), total biomass 302.4 vs 287.6
      (4.9%), competition ratio 3.69x vs 3.47x (5.9%), total CPM volume 3592 vs 3600 px (0.2%),
      acetate 431.5 vs 430.8 (0.2%), net glucose depleted 10677 vs 10764 (0.8%) -- every colony
      interface observable within ~6%; the two composites also expose byte-identical CpmColonyField
      ports (::test_colony_ports_are_byte_identical). ARTIFACT FLAG measured, see the pre-saturation
      gate below -- the ~0.2% CPM-volume AND ~0.2% acetate agreements are measured at ~99.8% lattice
      saturation; both mechanisms hit the same 3600-px finite-lattice ceiling and the acetate plumes
      coincide only at that endpoint, so those near-perfect agreements are saturation artifacts, not
      independent evidence.'
  requires_simulation: cellcell-compete-mm
- name: colony-substitutable-pre-saturation
  classification: primary
  description: 'PRE-SATURATION test of the colony surrogate (peer-review M2) -- the real conversion

    of the saturated 20-tick match into a genuine, artifact-free comparison. The 20-tick agreement is

    measured at ~99.8% lattice occupancy; re-measuring at 10 ticks (~50% occupancy, well below the

    ceiling) with the mm_* params FROZEN separates the real agreement from the artifact. Honest two-

    sided result. The GROWTH / COMPETITION observables are genuinely substitutable pre-saturation --

    total biomass ~9%, competition ratio ~1%, total CPM volume ~2%, net glucose depletion ~1% -- so

    the headline competition result is not a ceiling artifact. But the ~0.2% ACETATE match IS an

    artifact -- dFBA''s acetate plume saturates early (~431 units by ~8 ticks, flat thereafter) while

    the MM overflow surrogate climbs roughly linearly and only CATCHES UP at the saturated endpoint;

    pre-saturation at 10 ticks the MM plume is barely half-built and diverges from dFBA by ~68%. The

    tuned mm_overflow matched the saturated endpoint, not the trajectory.'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose
    expr: per-observable abs(dFBA - MM) / dFBA at 10 ticks (~50% occupancy), mm_* params frozen
  pass_if:
    kind: acceptance_criterion
    op: <
    value: 0.15
    provenance: 'PRE-SATURATION, mm_* params frozen, 10 ticks ~50% occupancy
      (tests/test_cellcell_presaturation.py::test_presaturation_growth_observables_substitutable). GATE
      on the growth/competition observables -- total biomass dFBA 102.2 vs MM 92.7 (9.3%), per-cell
      89.6/12.6 vs 81.3/11.4 (9.3%/9.7%), competition ratio 7.09x vs 7.12x (0.5%), total CPM volume
      1805 vs 1777 px (1.6%), net glucose depleted 3675 vs 3634 (1.1%) -- worst 9.7%, within the 0.15
      band. ARTIFACT (diagnostic, ::test_acetate_match_is_a_saturation_artifact) -- acetate agrees
      < 5% only at the saturated 20-tick endpoint (431.5 vs 430.8); pre-saturation at 10 ticks it
      diverges 68% (dFBA 431.5 vs MM 136.3), so the ~0.2% endpoint match is a saturation artifact.
      Degrees of freedom -- 2 free mm_* params (uptake kinetics shared with dFBA) vs ~6 colony
      observables (over-constrained); the one observable mm_overflow directly controls (acetate) is
      the one that fails pre-saturation.'
  requires_simulation: cellcell-compete-mm
- name: mm-colony-runs-without-cobra
