  description: 'The surrogate-model payoff: the MM colony realizes the same colony<->field
    interface (both cells grow off their 1.25 seed, the field''s glucose is drawn down, an acetate
    plume is secreted) with cobra BLOCKED -- a mechanism that runs where the dFBA original could
    not.'
