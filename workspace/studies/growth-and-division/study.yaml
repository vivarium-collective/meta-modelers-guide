variants: []
key_assumptions:
- 'Growth is modelled by DNAReplicationODE: d[dna]/dt = k·dna·energy (k=0.15), an autocatalytic process driven by a free-energy input — the Fig 10 analogue of the environment-coupled uptake that grows internal stores elsewhere in the paper (cf. Fig 5''s cell-environment coupling).'
- 'The division rewrite fires exactly once per run (symmetric division, fixed dna_threshold = 2.0); asymmetric division, septum placement, repeated division cycles, and size control are not modelled.'
behavior_tests:
- name: growth-crosses-threshold
  classification: primary
  description: 'The autocatalytic, energy-coupled DNA-replication process (d[dna]/dt = k·dna·energy) grows the cell''s own dna store from 1 → 3.06, crossing dna_threshold = 2.0 — growth, not a timer, is what puts the cell at the division trigger.'
  measure:
    kind: observable
    path: dna
    expr: last(dna)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'growth process (k·dna·energy) drives parent dna 1 → 3.06, crossing dna_threshold 2.0 (exec fig10-1-executable)'
  requires_simulation: growth-and-division
- name: division-fires
  classification: primary
  description: 'The cell''s replicated DNA crosses ``dna_threshold`` = 2.0 (parent dna 1 → 3.06) and the rewrite fires once — cell_count goes 1 → 2. The trigger is DNA state grown by the cell itself, not a wall clock.'
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 1.5
    provenance: 'DNA crosses threshold 2.0 (parent dna 1→3.06) → rewrite fires once, cell_count 1→2 (exec fig10-1-executable, tests/test_compilation.py::test_fig10_division_is_event_driven)'
  requires_simulation: growth-and-division
- name: daughters-spawn
  classification: primary
  description: 'The rewrite spawns two structurally-new daughter nodes and conserves mass: each daughter inherits DNA (0 → 2.75) and half the parent''s biomass (0 → 0.5) while the parent''s biomass is driven to 0 (M → M/2 + M/2, not M → 2M).'
  measure:
    kind: observable
    path: dna
    expr: last(dna)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'division spawns two new daughters (exec daughter dna 0→2.75; each daughter biomass 0→0.5, parent biomass →0 — mass conserved; tests/test_compilation.py::test_rewrite_conformance_against_wiring, tests/test_fig10_rewrite.py::test_cell_divides_into_two_daughters)'
  requires_simulation: growth-and-division
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'One-line sanity check (not the study''s control): the inert draft has empty updates by construction, so it stays at seed cell_count 1 and fails this threshold by design. This confirms the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 1.5
    provenance: 'inert-draft run stays at seed cell_count 1 (empty update by construction) → fails by design (expected-fail control)'
  requires_simulation: growth-and-division
