experiment: Install a Milner reaction rule behind the Fig 10 division interface, let an autocatalytic, energy-coupled DNA-replication process grow the cell's dna to the threshold (the Fig 10 analogue of environment-coupled uptake growing an internal store), and observe the rewrite fire.
result: The cell's replicated dna, driven by the growth process, climbs 1 → 3.06 and crosses the threshold (2.0); the single cell node is replaced by two structurally-new daughters, each inheriting dna → 2.75 and half the parent's biomass (→ 0.5) while the parent's biomass falls to 0 — a genuine, mass-conserving structural rewrite driven by the cell's own growth, not a timer.
