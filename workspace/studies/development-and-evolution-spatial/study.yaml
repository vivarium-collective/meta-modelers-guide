conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All three composites (development-evolution-spatial, development-evolution-no-mutation,
      development-evolution-no-selection) build and run to completion through the process-bigraph
      engine directly from their JSON specs, and CpmEvolution reuses study 8's CpmGrowthDivision
      unchanged via two no-op hooks (tests/test_dev_evo_regime.py, tests/test_cpm_evolution.py,
      tests/test_cpm_evolution_spike.py, tests/test_evolution_viz.py); guarded skip when the
      optional cpm/spatio_flux/cobra dependencies are absent, matching this investigation's
      convention.
  biological_validation:
    result: PASS
    basis: All primary behavior tests pass on measured readouts. DEVELOPMENT -- rim_core_ratio grows
      1.0 -> ~1.44 (emergent core/rim heterogeneity). EVOLUTION -- mean_vmax shifts up in 4/5 seeds
      under selection while the no-mutation control stays exactly at the founder (0/5) and the
      no-selection control drifts undirected (2/5, mean ~0), isolating selection as the cause of the
      directional shift, which operates via differential division on the shared field. The
      same-knob/crowding bound and the toy evo-devo scope (facilitated variation deferred) are
      reported as findings, not claimed away.
  explanatory_gain:
    result: POSITIVE
    basis: Putting the paper's §Development and evolution section on the real dividing colony turns
      two of biology's hardest transitions into runnable, honestly-controlled spatial mechanisms --
      development as a measured collective interface, evolution as a heritable coupling parameter
      selected by differential division -- supplying exactly the phenomenon (real heritable
      variation, real fitness-based selection) the non-spatial analogue
      draft-to-living-cell/development-and-evolution conceded it could only gesture at, by REUSING
      study 8's colony and adding one heritable coupling parameter.
conclusion: '## Claims


  - DEVELOPMENT holds spatially: a growing CPM colony on a shared depleting glucose field forms
  emergent core-vs-rim physiological heterogeneity -- rim_core_ratio grows 1.0 -> ~1.44 over 45
  ticks (core more depleted than rim), a collective interface not imposed but emerging from
  shared-field competition (the paper''s §Development and evolution section, Fig 10c-d).


  - EVOLUTION holds spatially: a heritable glucose-uptake trait (vmax) shifts its population mean
  UP under shared-field selection in 4/5 seeds (delta range [-0.116, +0.700], mean +0.221; one seed
  reverses). A DUAL control isolates the cause -- the no-mutation control stays exactly at the
  founder (0/5), the no-selection control drifts undirected (2/5, mean -0.039) -- so the directional
  shift is CAUSED by selection, operating via differential division on the shared field.


  - This REUSES study 8''s CpmGrowthDivision unchanged and adds only one heritable coupling
  parameter -- the paper''s "interfaces and couplings are themselves evolvable features of
  organization," made concrete.


  ## Evidence


  - **DEVELOPMENT-HETEROGENEITY-EMERGES** -- rim_core_ratio 1.0 -> ~1.44 over 45 ticks


  - **SELECTION-SHIFTS-MEAN-TRAIT-UP** -- mean_vmax up in 4/5 seeds (mean +0.221)


  - **TRAIT-INHERITANCE-WITHIN-3-SIGMA** -- 69 division events, 99% within 3 sigma (pairing correct)


  - **NO-MUTATION-CONTROL-STATIC** -- mutate=false: mean 1.500 exactly, var 0 (0/5 shift)


  - **NO-SELECTION-CONTROL-MUTATES-UNDIRECTED** -- selection=false: var > 0 but mean drifts undirected (2/5, -0.039)


  ## Limitations


  - The development and evolution halves pull the same field-depletion knob, and both saturate
  within the ~gen 4-6 crowding window on the 60x60 lattice; a larger grid / leaner field would run
  more generations and sharpen the gradient, at the cost of the same crowding that drives it.


  - The selection signal is real but modest (mean +0.22) and stochastic (one seed reversed) --
  reported as a 4/5 fraction, never a single-seed headline.


  - Toy evo-devo scope: development = shared-field core/rim heterogeneity (NOT morphogenesis /
  signalling); evolution = one scalar heritable trait under resource selection (NOT genome /
  regulatory-network evolution). Constants are toy-real, not fitted.


  ## Next steps


  - Facilitated variation (kirschner2005): evolve the ports/couplings THEMSELVES -- mutate the
  wiring, not a parameter of a fixed coupling -- the axis that moves this from pattern to
  phenomenon (named deferral, deferrals.md).


  - Larger grid / leaner field: run more generations past the ~gen 4-6 crowding bound to sharpen
  both the radial gradient and the selection signal.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: All three composites (development-evolution-spatial,
      development-evolution-no-mutation, development-evolution-no-selection) build and run to
      completion through the engine directly from their JSON specs; CpmEvolution reuses study 8's
      CpmGrowthDivision unchanged via two no-op hooks (`_cell_glucose_vmax`, `_on_division`).
    biological_validation: The paper's §Development and evolution section is demonstrated spatially
      at the toy-real level -- development as a measured emergent collective interface (rim/core
      heterogeneity) and evolution as a heritable coupling parameter shifted UP by selection
      through differential division, with a dual control isolating selection as the cause and the
      same-knob/crowding bound plus toy-scope (facilitated variation deferred) reported as findings.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the colony develops no radial heterogeneity (rim_core_ratio stays ~1.0 -- the shared field is
      not depleting, or too few cells to split core/rim)
    - selection does not shift the mean up under selection-ON (mutation not feeding dFBA uptake, or
      the trait not inherited through the division pairing)
    - the no-mutation control is NOT static (mean drifts from 1.500 with mutate=false -- the BOOLEAN
      flag is being ignored, or a mut_sigma=0.0 float override was silently dropped and it secretly mutates)
    - the no-selection control shifts up as strongly as selection-ON (selection=false still lets the
      trait feed dFBA uptake -- the control is not actually fitness-neutral)
    block_downstream: none -- this is the capstone; no study in this workspace is gated on it.
limitations:
- 'The DEVELOPMENT and EVOLUTION halves pull the SAME knob (field depletion): both intensify with
  stronger depletion, and the colony saturates its own 60x60 footprint by roughly generation 4-6,
  so both are demonstrated within that bounded window. A larger grid or leaner/higher-uptake field
  would run more generations and sharpen the radial gradient -- at the cost of the same crowding
  that itself drives the heterogeneity. Stated as a finding, not glossed.'
- 'The selection signal is real but modest (mean +0.22) and stochastic: across seeds 1-5 the mean
  shifts up in 4/5 (one seed reverses, delta -0.116). Reported as a multi-seed fraction with range,
  never a single flattering seed -- the honest result of a bounded stochastic Metropolis trajectory.'
- 'This is a TOY evo-devo. DEVELOPMENT = shared-field-driven core/rim physiological heterogeneity,
  NOT morphogenesis, signalling, or a genetic patterning program. EVOLUTION = ONE scalar heritable
  trait (glucose vmax) under resource selection, NOT genome/regulatory-network evolution, NOT
  speciation. The constants (vmax0 1.5, mut_sigma 0.3, vol_threshold 80, reset_target 40) are
  toy-real, not fitted to any organism, and no literature acceptance band is claimed.'
- 'kirschner2005 "facilitated variation" -- evolving the ports/couplings THEMSELVES rather than a
  parameter of a fixed port -- is a NAMED DEFERRAL (docs/superpowers/deferrals.md). This study
  mutates a parameter of a fixed coupling; mutating the wiring/ports is the axis that would move it
  from pattern to phenomenon, and it is out of scope for this first realization.'
- 'Selection is entangled with crowding by construction: higher-vmax cells divide faster and reach
  larger colonies, so the trait shift and the population-size difference are the SAME mechanism
  (selection through differential division on the shared field), not two independent findings. The
  claim says exactly that, not an independent fitness axis.'
falsifiability: 'Overturned if the colony develops no emergent radial heterogeneity (rim_core_ratio
  stays ~1.0 through the run -- the shared field is not depleting, or the core/rim split is not
  readable), if selection-ON fails to shift the mean vmax up in a majority of seeds (mutation not
  feeding dFBA uptake, or the trait not inherited through the creation-order division pairing), if
  the no-mutation control is NOT static (mean drifting from the founder 1.500 under mutate=false --
  the BOOLEAN flag ignored or a mut_sigma=0.0 float override silently dropped so it secretly
  mutates), or if the no-selection control shifts up as strongly as selection-ON (selection=false
  not actually making the trait fitness-neutral -- failing to isolate selection as the cause).'
