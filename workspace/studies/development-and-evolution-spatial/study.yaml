experiment: 'Run three development-evolution composites to completion through the process-bigraph
  engine directly from their JSON specs, each a growing CPM colony (CpmEvolution, study 8''s
  CpmGrowthDivision reused unchanged) on a shared 60x60 glucose field with a heritable per-cell
  glucose-uptake trait (vmax, founder 1.5, Gaussian mutation sigma=0.3 on division):
  development-evolution-spatial (selection ON -- the trait feeds each cell''s dFBA uptake, 45 ticks,
  seeds 1-5), development-evolution-no-mutation (mutate=false, the BOOLEAN no-mutation control), and
  development-evolution-no-selection (selection=false, the fitness-neutral no-selection control).
  Measure DEVELOPMENT via the radial rim-core glucose ratio (rim_core_ratio, core-vs-rim
  heterogeneity binned by distance from the colony centroid) and EVOLUTION via the population mean
  and variance of the trait (mean_vmax, var_vmax), reporting the mean shift as a multi-seed fraction
  and using the dual control to isolate selection as the cause of the directional trait shift.'
result: 'DEVELOPMENT holds spatially -- the growing colony forms emergent core-vs-rim physiological
  heterogeneity (rim_core_ratio grows 1.0 -> ~1.44 over 45 ticks, the core more depleted than the
  rim), a collective interface emerging from shared-field competition, not imposed. EVOLUTION holds
  spatially -- the heritable glucose-uptake trait (vmax) shifts its population mean UP under
  shared-field selection in 4/5 seeds (delta range [-0.116, +0.700], mean +0.221; one seed reverses,
  the honest multi-seed result), operating via differential division on the shared depleting field
  (higher-vmax cells grow/divide more, so their trait proliferates). The DUAL control isolates
  selection as the cause: the no-mutation control stays EXACTLY at the founder value 1.500 with zero
  variance (0/5 shift -- no raw material), and the no-selection control mutates (var > 0) but drifts
  undirected (2/5 up, mean -0.039). Only the selection-ON arm shifts the mean directionally, so the
  trait shift is CAUSED by selection, not mutation alone. This REUSES study 8''s CpmGrowthDivision
  unchanged and adds only one heritable coupling parameter, realizing the paper''s §Development and
  evolution section (Fig 10c-f) on the real dividing colony. The honest boundaries are reported as
  findings -- the two halves pull the same field-depletion knob and both saturate within the ~gen
  4-6 crowding window, and the scope is a toy evo-devo (development = shared-field core/rim
  heterogeneity, NOT morphogenesis; evolution = one scalar trait under resource selection, NOT
  genome evolution; kirschner2005 facilitated variation -- evolving the ports/couplings themselves
  -- is a named deferral).'
