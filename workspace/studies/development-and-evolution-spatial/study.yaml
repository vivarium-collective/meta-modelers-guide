schema_version: 4
name: development-and-evolution-spatial
investigation: the-cellular-interface-multicellular
title: Development and Evolution, Spatial
created: '2026-08-22'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'The paper''s §Development and evolution section (Fig 10c-f) extends the interface idea
  across time: individual cellular interfaces become embedded in a COLLECTIVE interface defined
  by shared state -- a growing colony develops physiological heterogeneity (a depleted core
  against a fed rim) where each cell''s own interface sits inside one collective interface -- and
  a heritable trait EVOLVES when variation is selected on that shared field. This study puts both
  halves on the real dividing CPM colony and asks the discriminating question directly: does a
  growing CPM colony on a shared depleting glucose field form emergent core-vs-rim heterogeneity
  (DEVELOPMENT), and does a heritable per-cell glucose-uptake trait (vmax) shift its population
  mean UP under shared-field selection (EVOLUTION) -- and, crucially, is that directional shift
  caused by SELECTION rather than mutation alone? The load-bearing design is a DUAL control:
  against the selection-ON colony, a no-mutation arm (the trait cannot vary) and a no-selection
  arm (the trait mutates but confers no fitness) isolate selection as the cause. This study
  REUSES study 8''s dividing colony (`growth-and-division-spatial`, `CpmGrowthDivision`) unchanged
  and adds ONLY one heritable coupling parameter -- the paper''s claim that the interfaces and
  couplings are themselves evolvable features of organization, made concrete by making one
  coupling parameter heritable and selectable on the colony that already grows and divides.'
biological_summary: 'The paper''s §Development and evolution section (Fig 10c-f) is where the
  cellular-interface idea is extended across developmental and evolutionary time, and it is the
  hardest pair in the paper -- the non-spatial analogue draft-to-living-cell/development-and-evolution
  could only gesture at it, its own verdict conceding that its "selection" was a single ODE with
  fixed viability/fitness constants and its "new port" a scripted config ramp: pattern, not
  phenomenon. This study is the capstone of the nine spatial studies and supplies exactly the
  phenomenon that one named as missing, at a very different mechanistic resolution, by REUSING the
  study-8 dividing colony rather than building anything new.


  DEVELOPMENT -- the collective interface, measured. A CPM colony grows on a shared 60x60 glucose
  field: each cell runs its own per-footprint dynamic-FBA (dFBA against e_coli_core) to grow and
  divide (study 8''s mechanism, unchanged). As the colony compounds, the interior cells sit inside
  the colony''s own depleted core while the outer cells are fed from the rim -- so each cell''s
  individual interface (its local glucose exchange) becomes embedded in a COLLECTIVE interface
  defined by the shared field. This is measured radially: binning live cells by distance from the
  colony centroid (median split into core/rim) and comparing mean local glucose, the rim-core
  ratio (`rim_core_ratio`) grows from 1.0 (few cells, no readable gradient) to ~1.44 by the end
  of a 45-tick run -- the core is measurably more depleted than the rim. Nothing imposes this: it
  is the same shared-field mass-balance that produced study 8''s division desync, now read as a
  spatial gradient -- physiological heterogeneity EMERGING from shared-field competition
  (stewart2008/flemming2016 biofilm physiological heterogeneity), not a patterning program.


  EVOLUTION -- one heritable trait, selected on the shared field. Each cell carries a heritable
  scalar trait, its glucose-uptake `vmax`, used as that cell''s own dFBA uptake parameter. On
  division the daughter inherits the parent''s trait plus a Gaussian mutation (sigma=0.3, seeded
  RNG) through the SAME creation-order parent<->daughter pairing study 8 already uses for biomass
  and lineage; the parent keeps its own trait. Selection is emergent and mechanistic: a
  higher-vmax cell draws more glucose, grows faster, crosses `vol_threshold` sooner, divides more,
  and so its trait proliferates -- selection through DIFFERENTIAL DIVISION on the shared depleting
  field, not an externally-imposed fitness function. Measured across seeds 1-5 (45 ticks, founder
  vmax0=1.5): the population mean `vmax` shifts UP in 4/5 seeds (delta range [-0.116, +0.700], mean
  +0.221), with one seed reversing -- reported honestly as a fraction, not "always."


  THE DUAL CONTROL isolates selection as the cause. Two negative controls, each identical to the
  selection-ON colony but for one flag. NO-MUTATION (`mutate: false`, a BOOLEAN flag -- never a
  `mut_sigma: 0.0` float override, which bigraph_schema silently drops): the trait cannot vary, so
  the population mean stays EXACTLY the founder value 1.500 with zero variance in every seed (0/5
  shift) -- no raw material for selection to act on. NO-SELECTION (`selection: false`): the trait
  still mutates (`var_vmax > 0`, raw variance builds) but every cell''s dFBA uses the fixed founder
  vmax0 regardless of its own trait, so the trait confers no fitness -- the mean drifts UNDIRECTED
  (up in only 2/5 seeds, mean delta -0.039, near zero). Only the selection-ON arm shifts the mean
  directionally (4/5). Mutation alone (no-selection) does not; the absence of variation
  (no-mutation) cannot: the directional trait shift is CAUSED by selection.


  What is honestly demonstrated, and what is not. FIRST, this is a strict UPGRADE over the
  non-spatial study 9: real heritable variation and real fitness-based selection (differential
  division on a shared field) replace that study''s empty variation handler and fixed-constant
  ODE. SECOND, the two halves pull the same knob: both development heterogeneity and evolution
  intensify with stronger field depletion, and the colony saturates its own footprint on the
  60x60 lattice by roughly generation 4-6, so both are demonstrated within that bounded window --
  a larger grid or a leaner field would run more generations and sharpen the gradient, at the cost
  of the same crowding that drives the heterogeneity. Stated plainly rather than glossed. THIRD,
  the scope is a TOY evo-devo: DEVELOPMENT here is shared-field-driven core/rim physiological
  heterogeneity, NOT morphogenesis, signalling, or a genetic patterning program; EVOLUTION is ONE
  scalar heritable trait under resource selection, NOT genome or regulatory-network evolution and
  NOT speciation. kirschner2005 "facilitated variation" -- evolving the interfaces/couplings
  THEMSELVES (the ports and wiring), not a parameter of a fixed port -- is a named deferral: this
  study mutates a parameter of a fixed coupling, exactly the axis the non-spatial study''s reviewer
  said would be needed to move from pattern to phenomenon.'
claim: 'The paper''s §Development and evolution section (Fig 10c-f) holds as a spatial mechanism on
  the real dividing CPM colony, REUSING study 8''s `CpmGrowthDivision` unchanged and adding only a
  heritable per-cell coupling parameter. DEVELOPMENT: a growing colony on a shared depleting
  glucose field forms emergent core-vs-rim physiological heterogeneity -- the radial rim-core
  glucose ratio grows from 1.0 to ~1.44 over 45 ticks (core more depleted than rim), a collective
  interface not imposed but emerging from shared-field competition. EVOLUTION: a heritable
  glucose-uptake trait (vmax) shifts its population mean UP under shared-field selection in 4/5
  seeds (delta range [-0.116, +0.700], mean +0.221; one seed reverses -- the honest multi-seed
  result). A DUAL control isolates the cause: the no-mutation control stays exactly at the founder
  value with zero variance (0/5 seeds, no raw material), and the no-selection control mutates
  (var > 0) but drifts undirected (2/5 up, mean -0.039). Only selection-ON shifts the mean
  directionally, so the trait shift is CAUSED by selection -- operating via differential division
  on the shared field (higher-vmax cells grow/divide more, so their trait proliferates), not by
  mutation alone. The honest boundaries are stated as findings: the development and evolution
  halves pull the same field-depletion knob and both saturate within the ~gen 4-6 crowding window;
  the scope is a toy evo-devo (development = shared-field core/rim heterogeneity, NOT
  morphogenesis; evolution = one scalar trait under resource selection, NOT genome evolution;
  facilitated variation -- evolving the ports/couplings themselves -- is a named deferral).'
baseline:
- name: development-evolution-spatial
  composite: meta_modelers_guide.composites.development-evolution-spatial
  params: {}
- name: development-evolution-no-mutation
  composite: meta_modelers_guide.composites.development-evolution-no-mutation
  params: {}
- name: development-evolution-no-selection
  composite: meta_modelers_guide.composites.development-evolution-no-selection
  params: {}
variants: []
key_assumptions:
- 'This study REUSES study 8''s dividing colony (`CpmGrowthDivision`, `growth-and-division-spatial`)
  UNCHANGED and adds ONLY a heritable per-cell trait plus the dev/evo observables. `CpmEvolution`
  is a minimal subclass wired through the base''s two no-op hooks: `_cell_glucose_vmax(cid)`
  (returns this cell''s heritable `vmax` instead of the population-wide constant) and
  `_on_division(parent, daughter)` (draws the daughter''s trait from the parent + Gaussian
  mutation). The base''s dFBA-growth + native `divide_cells` + biomass-partition + lineage loop is
  called verbatim via `super().update()`; nothing in the growth/division mechanism is duplicated
  or altered. This is the paper''s "interfaces and couplings are themselves evolvable features of
  organization" made concrete -- one heritable coupling parameter added to the existing colony.'
- 'DEVELOPMENT is MEASURED, not imposed. `rim_core_ratio` bins live cells by Euclidean distance
  from the colony centroid (median split into core <= median, rim > median) and compares mean
  `local_glucose` between the two groups; rim/core > 1 means the core is more depleted than the
  rim. No structure is written into the field or the cells -- the gradient is the same shared-field
  mass-balance that produced study 8''s division desync, now read radially. It starts at 1.0 (too
  few cells to split, or no readable gradient) and grows to ~1.44 as the colony develops, an
  emergent collective interface (stewart2008/flemming2016 biofilm physiological heterogeneity).'
- 'EVOLUTION selection is EMERGENT and MECHANISTIC, not an imposed fitness function. The trait
  `vmax` IS the cell''s own dFBA glucose-uptake parameter, so a higher-vmax cell draws more
  glucose, grows faster, crosses `vol_threshold` sooner, divides more, and its trait proliferates
  -- selection through DIFFERENTIAL DIVISION on the shared depleting field. The trait shift and the
  fact that selected populations reach more cells are the SAME mechanism (selection acting through
  division rate), not two independent findings -- stated plainly.'
- 'The DUAL control isolates selection, and both controls are built to avoid two verified config
  traps. NO-MUTATION is a BOOLEAN flag (`mutate: false`), never a `mut_sigma: 0.0` float override
  -- bigraph_schema silently drops a `0.0` float override (schema default retained), so a
  float-gated "no mutation" arm would secretly keep mutating and masquerade as weak selection.
  NO-SELECTION (`selection: false`) keeps mutation ON but makes every cell''s dFBA use the fixed
  founder `vmax0` regardless of its trait, so variation is present but confers no fitness. Only
  with BOTH controls in place does the selection-ON directional shift isolate selection (not
  mutation, not drift) as the cause.'
- 'EVOLUTION is stochastic and reported as a multi-seed FRACTION, not a single-seed headline. The
  `seed` config is threaded into BOTH the CPM potts spec (world construction -- the base process
  hardcodes `potts.seed=1`, so without this every "different seed" replays one Metropolis
  trajectory) AND the mutation RNG. Across seeds 1-5, selection-ON shifts the mean up in 4/5 seeds
  (one reverses); the reported 4/5 is the honest result, following the multi-seed convention
  established on `cell-cell-coupling-spatial` (`tests/test_cellcell_multiseed.py`).'
- 'The two halves pull the SAME knob (field depletion), and the demonstration is bounded by
  crowding. Both development heterogeneity and evolution intensify with stronger field depletion,
  and the colony saturates the 60x60 lattice by roughly generation 4-6, so both are demonstrated
  WITHIN that bounded window. A larger grid or leaner field would run more generations and sharpen
  the gradient -- at the cost of the same crowding that itself drives the heterogeneity. The
  constants are toy-real (`vmax0` 1.5, `mut_sigma` 0.3, `vol_threshold` 80, `reset_target` 40,
  `mcs` 3, T 11 carried from study 8), not fitted to any organism; no literature acceptance band
  is claimed.'
- 'The SCOPE is a toy evo-devo. DEVELOPMENT = shared-field-driven core/rim physiological
  heterogeneity, NOT morphogenesis, signalling, or a genetic patterning program (the collective
  interface is a measured resource gradient, not a regulated body plan). EVOLUTION = ONE scalar
  heritable trait (glucose `vmax`) under resource selection, NOT genome/regulatory-network
  evolution and NOT speciation. kirschner2005 "facilitated variation" -- evolving the
  ports/couplings THEMSELVES rather than a parameter of a fixed port -- is a NAMED DEFERRAL
  (docs/superpowers/deferrals.md): this study mutates a parameter of a fixed coupling.'
behavior_tests:
- name: development-heterogeneity-emerges
  classification: primary
  description: 'DEVELOPMENT: the colony develops emergent core-vs-rim physiological heterogeneity.
    `rim_core_ratio` starts near its 1.0 floor (few cells, no readable gradient) and ends clearly
    above 1.0 -- the colony''s core is measurably more glucose-depleted than its rim by the end of
    a 45-tick run (the collective interface of the paper''s §Development and evolution section, Fig
    10c-d). Emergent from shared-field competition, not imposed.'
  measure:
    kind: observable
    path: obs.rim_core_ratio
    expr: last(obs.rim_core_ratio)
  pass_if:
    op: '>'
    value: 1.2
    provenance: 'rim_core_ratio grows 1.0 (5 ticks) -> ~1.44 (45 ticks) on the flagship seed 3;
      loose 1.2 floor (not the exact 1.44) so the bound is not a golden-value pin
      (tests/test_dev_evo_regime.py::test_development_heterogeneity_emerges,
      tests/test_cpm_evolution.py::test_rim_core_ratio_shows_heterogeneity)'
  requires_simulation: development-evolution-spatial
- name: selection-shifts-mean-trait-up
  classification: primary
  description: 'EVOLUTION: under selection (trait feeds dFBA uptake, mutation ON), the population
    mean `vmax` ends clearly above the founder value -- selection through differential division on
    the shared depleting field. Reported as a multi-seed fraction: UP in 4/5 seeds (delta range
    [-0.116, +0.700], mean +0.221), one seed reversing -- the honest stochastic result.'
  measure:
    kind: observable
    path: obs.mean_vmax
    expr: last(obs.mean_vmax)
  pass_if:
    op: '>'
    value: 1.6
    provenance: 'flagship seed 3: mean_vmax 1.500 -> 2.200 (+0.700); multi-seed (seeds 1-5)
      UP in 4/5, range [-0.116, +0.700], mean +0.221 -- asserted as a fraction, not per-seed
      (tests/test_dev_evo_regime.py::test_evolution_shifts_trait_under_selection,
      tests/test_cpm_evolution.py::test_selection_shifts_mean_vmax_up,
      tests/test_cpm_evolution_spike.py::test_selection_shifts_mean_trait_up)'
  requires_simulation: development-evolution-spatial
- name: trait-inheritance-within-3-sigma
  classification: diagnostic
  description: 'The evolution crux is wired correctly: across division events, |vmax[daughter] -
    vmax[parent]| is ~N(0,sigma)-distributed -- the same creation-order parent<->daughter pairing
    study 8 uses for biomass/lineage propagates the trait, not scrambles it. A wrong pairing would
    smear diffs across the whole trait range (~1.5+), not cluster them within a few sigma
    (verified in the Task 1 spike: 69 division events, 99% within 3 sigma, mean |diff| ~0.85 sigma).'
  measure:
    kind: observable
    path: obs.var_vmax
    expr: last(obs.var_vmax)
  pass_if:
    op: '>'
    value: 0.0
    provenance: 'seed 3 spike: across 69 division events |child-parent| max ~0.997 (~3.3 sigma),
      mean ~0.252 (~0.85 sigma = E|N(0,0.3)|), 99% within 3 sigma; var_vmax builds > 0 only when
      mutation is on (tests/test_cpm_evolution_spike.py::test_trait_inheritance_within_3_sigma,
      tests/test_dev_evo_regime.py::test_evolution_shifts_trait_under_selection)'
  requires_simulation: none
- name: no-mutation-control-static
  classification: primary
  control: negative
  description: 'The no-mutation control, half of the dual control: with `mutate: false` (a BOOLEAN
    flag, not a `mut_sigma: 0.0` float override -- which bigraph_schema silently drops), the trait
    cannot vary across divisions, so the population mean stays EXACTLY the founder value 1.500 with
    zero variance in every seed (0/5 shift). No raw material for selection to act on -- proving the
    selection-ON shift needs heritable variation.'
  measure:
    kind: observable
    path: obs.mean_vmax
    expr: last(obs.mean_vmax)
  pass_if:
    op: ==
    value: 1.5
    provenance: 'mutate=false: mean_vmax == 1.500 exactly and var_vmax == 0.0 in every seed 1-5
      (0/5 shift) -- the BOOLEAN-flag control that genuinely reaches the process
      (tests/test_dev_evo_regime.py::test_no_mutation_control_is_static,
      tests/test_cpm_evolution.py::test_no_mutation_control_is_static,
      tests/test_cpm_evolution_spike.py::test_no_mutation_control_is_static)'
  requires_simulation: development-evolution-no-mutation
- name: no-selection-control-mutates-undirected
  classification: primary
  control: negative
  description: 'The no-selection control, the other half of the dual control: with
    `selection: false` the trait still mutates (`var_vmax > 0`, raw variance builds) but every
    cell''s dFBA uses the FIXED founder vmax0 regardless of its own trait, so the trait confers no
    fitness -- the mean drifts UNDIRECTED (up in only 2/5 seeds, mean delta -0.039, near zero),
    clearly below the selection-ON 4/5. Isolates SELECTION, not mutation alone, as the cause of
    the directional shift.'
  measure:
    kind: observable
    path: obs.var_vmax
    expr: last(obs.var_vmax)
  pass_if:
    op: '>'
    value: 0.0
    provenance: 'selection=false: var_vmax > 0 (still mutates) but the mean drifts undirected --
      UP in 2/5 seeds, delta range [-0.270, +0.112], mean -0.039 (vs selection-ON 4/5, +0.221)
      (tests/test_dev_evo_regime.py::test_no_selection_control_does_not_directionally_shift)'
  requires_simulation: development-evolution-no-selection
runs:
- name: development-evolution-spatial
  composite: development-evolution-spatial
  emitter: RAMEmitter
  id: development-evolution-spatial
  status: completed
  provenance: meta_modelers_guide/composites/development-evolution-spatial.composite.json
    (CpmEvolution -- study 8''s CpmGrowthDivision reused unchanged via two no-op hooks, plus a
    heritable per-cell vmax that mutates on division, sigma=0.3, and IS under selection; 60x60
    shared glucose field, founder vmax0=1.5, seed 3) run 45 ticks through the process-bigraph
    engine (tests/test_dev_evo_regime.py, tests/test_cpm_evolution.py, tests/test_evolution_viz.py);
    the baked trait-colored GIF + synced metrics panel in viz/ were re-rendered over the same run.
  params: {}
  outcomes:
    DEVELOPMENT-HETEROGENEITY-EMERGES:
      result: PASS
      detail: rim_core_ratio grows 1.0 -> ~1.44 over 45 ticks -- core more depleted than rim, emergent collective interface
    SELECTION-SHIFTS-MEAN-TRAIT-UP:
      result: PASS
      detail: mean_vmax 1.500 -> 2.200 (seed 3); multi-seed UP in 4/5 (range [-0.116, +0.700], mean +0.221)
    TRAIT-INHERITANCE-WITHIN-3-SIGMA:
      result: PASS
      detail: 69 division events, |child-parent| 99% within 3 sigma, var_vmax builds > 0 -- pairing correct
- name: development-evolution-no-mutation
  composite: development-evolution-no-mutation
  emitter: RAMEmitter
  id: development-evolution-no-mutation
  status: completed
  provenance: meta_modelers_guide/composites/development-evolution-no-mutation.composite.json
    (identical to development-evolution-spatial except mutate=false -- a BOOLEAN flag, not a
    mut_sigma=0.0 float override, which bigraph_schema silently drops) run 45 ticks across seeds
    1-5 through the process-bigraph engine (tests/test_dev_evo_regime.py,
    tests/test_cpm_evolution.py).
  params: {}
  outcomes:
    NO-MUTATION-CONTROL-STATIC:
      result: PASS
      detail: 'mutate=false: mean_vmax == 1.500 exactly, var_vmax == 0.0 in every seed (0/5 shift) -- no raw material'
- name: development-evolution-no-selection
  composite: development-evolution-no-selection
  emitter: RAMEmitter
  id: development-evolution-no-selection
  status: completed
  provenance: meta_modelers_guide/composites/development-evolution-no-selection.composite.json
    (identical to development-evolution-spatial except selection=false -- the trait still mutates
    but every cell''s dFBA uses the fixed founder vmax0, so it confers no fitness) run 45 ticks
    across seeds 1-5 through the process-bigraph engine (tests/test_dev_evo_regime.py).
  params: {}
  outcomes:
    NO-SELECTION-CONTROL-MUTATES-UNDIRECTED:
      result: PASS
      detail: 'selection=false: var_vmax > 0 (mutates) but mean drifts undirected -- UP in 2/5 seeds, mean -0.039'
