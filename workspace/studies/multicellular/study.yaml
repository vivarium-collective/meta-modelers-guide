schema_version: 4
name: multicellular
investigation: draft-to-living-cell
title: Multicellular Rewrites
created: '2026-08-17'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Once a single cell divides (Fig 10-1), can the emergence of multicellularity be
  expressed as compositional topology rewrites — DEVELOPMENT, where cells reorganize into a
  colony that is itself a higher-level composite with aggregate observables (Fig 10-2), and
  EVOLUTION, where variation and selection extend the interface alphabet itself by adding a
  new port to a lineage (Fig 10-3)?
biological_summary: 'If division makes two cells from one, multicellularity is what those cells
  do next — and it arrives as two distinct compositional rewrites. DEVELOPMENT (Fig 10-2)
  treats a biofilm as a composite one level above the single cell: cells adhere to a surface
  (attached 0 → 1.35, adhesion 0 → 0.67) and grow (cells 1 → 1.57), secrete a shared
  extracellular matrix (ecm 0 → 1.8), and the whole assembly acquires aggregate, colony-level
  observables that no single cell has — an emergent biofilm_mass accumulating 0 → 2.25. The
  compositional point is that the same modelling apparatus that describes one cell describes
  their collective by nesting: the colony is a store containing cells, with processes acting on
  the group. EVOLUTION (Fig 10-3) is the slower rewrite. A population of variants competes under
  selection — the population grows (cell_ecoli.cell_count 1 → 3.4) — and, crucially, a variant
  lineage acquires a *new interface port*, a capability emerging from 0 → 0.57
  (cell_O157.new_port). This is the compositional signature of innovation: the interface
  alphabet itself is extended, not merely re-valued. Two multicellular rewrites, one modelling
  idea — reorganize the topology, and (for evolution) grow the alphabet of ports.'
claim: 'Multicellularity is two compositional topology rewrites at a level above the single
  cell: DEVELOPMENT reorganizes cells into a colony that is itself a composite with its own
  aggregate behavior, and EVOLUTION rewrites a population under selection so a lineage gains an
  entirely new interface port.'
baseline:
- name: development-rewrite
  composite: viva_meta_modelers_guide.composites.fig10-2-rewrite
  params: {}
- name: development
  composite: viva_meta_modelers_guide.composites.fig10-2-development
  params: {}
- name: evolution-rewrite
  composite: viva_meta_modelers_guide.composites.fig10-3-rewrite
  params: {}
- name: evolution
  composite: viva_meta_modelers_guide.composites.fig10-3-evolution
  params: {}
variants: []
behavior_tests:
- name: colony-develops
  classification: primary
  measure:
    kind: observable
    path: biofilm_mass
    expr: last(biofilm_mass)
  pass_if:
    op: '>='
    value: 1.5
    provenance: development rewrite — an aggregate colony observable emerges (exec biofilm_mass last≈2.25)
  requires_simulation: colony-develops
- name: ecm-accumulates
  classification: primary
  measure:
    kind: observable
    path: ecm
    expr: last(ecm)
  pass_if:
    op: '>='
    value: 1.0
    provenance: the colony secretes a shared extracellular matrix (exec ecm last≈1.8)
  requires_simulation: ecm-accumulates
- name: population-grows
  classification: primary
  measure:
    kind: observable
    path: cell_count
    expr: last(cell_count)
  pass_if:
    op: '>='
    value: 2.0
    provenance: evolution rewrite — the population grows under selection (exec cell_ecoli.cell_count last≈3.4)
  requires_simulation: population-grows
- name: capability-emerges
  classification: primary
  measure:
    kind: observable
    path: new_port
    expr: last(new_port)
  pass_if:
    op: '>='
    value: 0.3
    provenance: a variant lineage acquires a new interface capability (exec new_port last≈0.57)
  requires_simulation: capability-emerges
- name: draft-is-inert
  classification: diagnostic
  measure:
    kind: observable
    path: biofilm_mass
    expr: last(biofilm_mass)
  pass_if:
    op: '>='
    value: 1.5
    provenance: inert-draft run stays at seed (no mechanism → no dynamics, biofilm_mass stays 0)
  control: negative
  description: 'Negative control: the inert draft (no mechanism) MUST fail this.'
  requires_simulation: draft-is-inert
runs:
- name: multicellular
  composite: multicellular
  emitter: RAMEmitter
  id: multicellular
  status: completed
  provenance: scripts/render_study_evidence.py — fig10-2-executable + fig10-3-executable compiled
    from the Fig 10-2 and Fig 10-3 drafts, run to completion through the engine.
  params: {}
  outcomes:
    COLONY-GROWS:
      result: PASS
      detail: biofilm_mass 0 → 2.25, ecm 0 → 1.8; cells 1 → 1.57 attaching to the surface (attached 0 → 1.35)
    POPULATION-GROWS:
      result: PASS
      detail: cell_ecoli.cell_count 1 → 3.4 under selection
    NEW-CAPABILITY:
      result: PASS
      detail: cell_O157.new_port 0 → 0.57 — a new interface capability on a variant
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'DEVELOPMENT — the colony grows and its cells attach to the surface, secreting a
    shared matrix while an aggregate colony observable emerges. Confirmed: cells 1 → 1.57,
    attached 0 → 1.35, ecm 0 → 1.8, biofilm_mass 0 → 2.25.'
  evidence:
    from_test: colony-develops
    from_run: multicellular
    observed: biofilm_mass 0 → 2.25, ecm 0 → 1.8, cells 1 → 1.57, attached 0 → 1.35
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'EVOLUTION — the population grows under selection. Confirmed: cell_ecoli.cell_count 1 → 3.4 over the run.'
  evidence:
    from_test: population-grows
    from_run: multicellular
    observed: cell_ecoli.cell_count 1 → 3.4
- id: F-03
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'EVOLUTION — a variant lineage acquires a new interface port, extending the
    interface alphabet itself. Confirmed: cell_O157.new_port 0 → 0.57.'
  evidence:
