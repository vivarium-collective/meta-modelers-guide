conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Colony-develops, ecm-accumulates, population-grows and capability-emerges all pass on
      measured readouts; the inert draft stays at seed, so both rewrites are mechanism-driven.
  explanatory_gain:
    result: POSITIVE
    basis: Nesting cells inside a colony store makes "development as higher-level composition"
      measurable via aggregate observables, and letting a lineage gain a new port under selection
      makes "the interface alphabet itself changes over time" observable rather than merely asserted.
conclusion: '## Claims

  - Multicellularity is two compositional topology rewrites. DEVELOPMENT: the colony grows
  (cells 1→1.57), attaches (attached 0→1.35), and secretes ECM (0→1.8), and colony-level
  observables emerge from nesting cells in a store — an aggregate biofilm_mass accumulating
  0→2.25 that no single cell has. EVOLUTION: under selection the population grows
  (cell_ecoli.cell_count 1→3.4) and a variant lineage acquires a new interface port
  (cell_O157.new_port 0→0.57), extending the interface alphabet itself.


  ## Evidence

  - **COLONY-GROWS** — biofilm_mass 0 → 2.25; ecm 0 → 1.8; cells 1 → 1.57, attached 0 → 1.35

  - **POPULATION-GROWS** — cell_ecoli.cell_count 1 → 3.4 under selection

  - **NEW-CAPABILITY** — cell_O157.new_port 0 → 0.57 on a variant


  ## Limitations

  - Toy-real colony and selection: growth, ECM accumulation, population growth and new-port
  emergence are real in shape, but rate constants, selection coefficients and timing are illustrative.


  ## Next steps

  - Give the colony spatial structure to test nutrient gradients and detachment as compositional
  processes, and introduce multiple competing new ports to test selection over a richer
  interface-innovation space.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: Both figure drafts compile to executables that run.
    biological_validation: The paper's development and evolution patterns are demonstrated at the
      toy-real (uncalibrated) level; interface preservation holds.
    pipeline_unblocks:
    - the-living-atlas
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on these figures' mechanisms)
limitations:
- DEVELOPMENT is a well-mixed colony with mild growth (cells 1→1.57); no spatial gradients,
  detachment, or nutrient-limited zones within the biofilm. Adhesion and ECM-secretion rates are
  illustrative, not fitted to a measured biofilm.
- EVOLUTION is a two-variant competition with a single new port; real evolution explores a
  combinatorial space of interface changes not sampled here. Selection coefficients and mutation
  timing are illustrative, not inferred from a measured fitness landscape.
falsifiability: Overturned if the colony fails to grow, attach, or accumulate ECM and aggregate
  biofilm_mass (DEVELOPMENT), or if the population fails to grow or the new interface port never
  emerges in the winning lineage — new_port stays at 0 (EVOLUTION).
experiment: Compose cells with attachment, ECM secretion, and growth behind the Fig 10-2
  development interface, and competing variants under shared resource and dilution behind the
  Fig 10-3 evolution interface, and run both to completion through the engine.
result: DEVELOPMENT — the colony grows and attaches (cells 1→1.57) while matrix accumulates
  (ecm 0→1.8) and an aggregate biofilm_mass (0→2.25) emerges from nesting cells in a store.
  EVOLUTION — the population grows (cell_count 1→3.4) and a variant carries a new interface
  capability (new_port 0→0.57), so the interface set itself changes under selection.
