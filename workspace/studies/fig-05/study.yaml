  statement: 'Fig 5b''s grain swap is not cosmetic: realizing the SAME coarse-metabolism interface at three different model grains gives measurably different biomass through byte-identical ports. The companion executables fig05-executable-{coarse,kinetic,fba} install three internal mechanisms behind one shared interface (biomass, energy, entropy, secretions over a fixed supply) -- a linear coarse law, a saturating kinetic (Michaelis-Menten) law, and a flux-balance (FBA) law. Measured in-memory over the standard executable run (workbench 0.4.1): final biomass is 4.0 (coarse) / 2.6667 (kinetic) / 6.2936 (FBA) -- a 2.4x spread -- with the FBA grain additionally secreting 30.4478 of acetate (overflow metabolism) against 1.6 for coarse, and energy 144.0 / entropy 151.2761 far above the coarse grain''s 2.4 / 0.8. Choosing the grain changes the quantitative readout the shared interface reports, which is exactly why switching the active level of description (Fig 5b''s selector) is a substantive modeling act. These are toy-real magnitudes; the point is the measurable grain-dependence, not a calibrated biomass yield.'
  evidence:
