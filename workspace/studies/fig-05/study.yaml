conclusion: '## Claims

  - Composing a StressRamp, a GrainSelector, and two gated grain processes (CoarseGrainProcess, FineGrainProcess) sharing one biomass/energy interface reproduces Fig 5b''s viability-driven grain swap as a runnable temporal study. Over a deterministic 26-step run: viability declines monotonically across the 0.5 threshold, the grain flips coarse->fine at t=13 (one tick after viability first reads below threshold at t=12, the scheduling handover), exactly one grain acts per tick, and the shared biomass output turns over from linear growth (coarse, alive; peak 3.9 at the flip) to first-order decay (fine, dying; ~1.14 by t=26), with energy mirroring it (2.6 -> ~0.76).

  - The whole trajectory is bit-reproducible -- no process draws randomness -- so every pin (crossing t=12, flip t=13, biomass peak 3.9) is an exact, deterministic fact of the composite.


  ## Evidence

  - **COARSE-GRAIN-WHILE-VIABLE** -- active_grain == "coarse" for every frame with viability >= 0.5

  - **FLIPS-TO-FINE-AND-STAYS** -- exactly one flip, coarse->fine at t=13, fine through t=26

  - **SWITCH-AT-THRESHOLD-CROSSING** -- viability first < 0.5 at t=12, flip at t=13, |13-12| == 1

  - **GATE-HANDS-CONTROL-TO-THE-ACTIVE-GRAIN** -- coarse grows (+), fine decays (-), each inert when not selected; opposite directions on the shared biomass output

  - **BIOMASS-TURNS-OVER-AT-THE-SWITCH** -- biomass 0 -> 3.9 (peak at the flip) -> ~1.14 by t=26

  - **ENERGY-MIRRORS-BIOMASS** -- energy 0 -> 2.6 (peak at the flip) -> ~0.76 by t=26

  - **VIABILITY-DECLINES-MONOTONICALLY** -- 1.0 monotone down to 0.0 by t=23, below 0.5 from t=12

  - **TRAJECTORY-IS-DETERMINISTIC** -- two independent builds emit identical trajectories


  ## Limitations

  - This composite is didactic / toy-real: the stress rate, threshold, yields, and decay rates are hand-tuned to make the arc legible in 26 steps, not calibrated to any named stressor, molecule, or measured rate.

  - The coarse and fine grains are lumped single-term stand-ins for "a coarse cellular process" and "a fine molecular one"; neither resolves real molecular mechanism.

  - Viability is an abstract scalar driven down by an external ramp, not an emergent consequence of the cell''s metabolism or environment; the trigger is a threshold crossing on that scalar.

  - The one-tick lag between the viability crossing (t=12) and the grain flip (t=13) is the composite''s process-scheduling latency, not a modeled biological delay.

  - The rigorous spatial cousin is `disintegration` in the `draft-to-living-cell` investigation, where a real CPM cell loses structural viability under a real diffusing acetate field and its shed pixels become scattering debris particles -- a per-pixel, calibrated-in-form realization of the same §Disintegration level shift. Do not read that cousin''s numbers as this study''s.


  ## Next steps

  - Drive viability from an emergent quantity (e.g. an energy or nutrient store) rather than a scripted ramp, so the crossing arises from the cell''s own dynamics.

  - Make the fine grain a genuinely multi-species molecular mechanism rather than a single decay term, to show the coarse->fine refinement resolving real structure.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'fig05-grain-runnable.composite.json builds and runs to completion (26 steps) through the engine, deterministically.'
    biological_validation: Fig 5b''s viability-driven grain swap is demonstrated at the toy-real (uncalibrated) level -- a live viability signal toggling gated coarse/fine grains on a shared interface, with the biomass trajectory turning over at the switch, rather than a static diagram.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - the grain never flips (GrainSelector not wired to viability, or viability never crosses threshold within the run)
    - the flip does not track the crossing (scheduling latency changed, or the stress rate no longer brings viability below threshold in time)
    - biomass does not turn over (a grain''s gate is broken, so both or neither act, or the yields/decay rates no longer produce visible growth-then-decay)
    - the trajectory is not reproducible (an RNG was introduced somewhere in the composite)
    block_downstream: 'any figure study reusing the GrainSelector / gated-grain toggle pattern'
limitations:
- This composite is didactic / toy-real -- the stress rate (0.045/tick), viability threshold (0.5), coarse yields (0.3, 0.2), and fine decay rates (0.09, 0.09) are hand-tuned magnitudes chosen to make hold -> cross -> flip -> turn-over legible within a 26-step run, not fitted to a named stressor, molecule, or measured rate.
- The coarse and fine grains are lumped single-term stand-ins (one linear yield, one first-order decay) for "a coarse cellular process" and "a fine molecular one"; they realize the same interface at two levels of description -- the point of the figure -- but neither resolves real molecular mechanism.
- Viability is an abstract scalar driven monotonically down by an external StressRamp, a clean controllable driver rather than an emergent consequence of the cell''s own metabolism or environment; the trigger is a threshold crossing on that scalar, not a spatial or biochemical collapse.
- The active grain flips one tick after viability first reads below threshold (crossing t=12, flip t=13). This one-tick lag is the composite''s process-scheduling latency (the GrainSelector''s set propagating to the grains'' gate on the next tick), not a modeled biological delay -- so the biomass peak coincides with the grain flip and the tests anchor on the flip, not the raw viability cross.
- The rigorous spatial cousin is `disintegration` in the `draft-to-living-cell` investigation, where a real CPM cell loses structural viability under a real diffusing acetate field and its shed pixels become scattering debris particles -- a per-pixel realization of the same §Disintegration level shift. This study does not restate that cousin''s numbers as its own.
falsifiability: Overturned if the active grain fails to be "coarse" throughout the viable phase, if the grain never flips to "fine" or flips more than once or reverts, if the flip does not track the viability-threshold crossing within one tick, if the gate fails to make exactly one grain act per tick (both or neither acting), if the shared biomass output fails to grow-then-decay with a peak at the switch, or if two independent builds produce differing trajectories (implying a hidden RNG).
