schema_version: 4
name: typed-interface
investigation: draft-to-living-cell
title: The Typed Interface
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can the cellular boundary be specified as nothing but a set of typed, unit-bearing exchange
  ports (chemical, mechanical, electrical, thermal, plus growth rate, shape, objective, viability) with
  no committed mechanism, and then compiled — by installing one conforming handler — into a running, bounded,
  goal-directed cell whose interface is exactly the one declared?
biological_summary: 'A cell, viewed from the outside, is a small alphabet of exchange variables: fluxes
  of matter (chemical, mol·s⁻¹), forces (mechanical, N), currents (electrical, A) and heat (thermal, W),
  together with higher-level cellular quantities — growth rate (hr⁻¹), shape, an objective the cell pursues,
  and a viability that says whether the cellular description still holds. Fig 4 is that alphabet. This
  study makes it operational: the draft declares each port with its type and unit and promises ''a bounded,
  goal-directed cell''; the handler keeps the promise, uptaking chemical and converting it into growth
  so that shape and objective climb. Nothing about the interface changes between draft and executable
  — only a mechanism is installed behind it.'
claim: A cell can be specified at one level by its interface — typed exchange variables such as chemical
  flux, force, current, heat, growth, shape, objective, and viability — without committing to the mechanism
  that realizes those behaviors.
baseline:
- name: interaction-modalities
  composite: viva_meta_modelers_guide.composites.fig04a-interaction-modalities
  params: {}
- name: cellular-interface
  composite: viva_meta_modelers_guide.composites.fig04b-cellular-interface
  params: {}
variants: []
behavior_tests:
- name: volume-growth
  classification: primary
  description: The conforming handler grows the cell — volume climbs well above its seed.
  measure:
    kind: observable
    path: volume
    expr: max(volume)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'executable run: max volume 6.11 from seed 0.5 (Monod uptake → yield·u growth)'
  requires_simulation: typed-interface
- name: nutrient-depletion
  classification: primary
  description: Monod uptake draws the finite nutrient pool down to ≈0 (saturating consumption).
  measure:
    kind: observable
    path: nutrient
    expr: last(nutrient)
  pass_if:
    op: <=
    value: 0.1
    provenance: 'Monod uptake depletes the finite pool (10.0) to ~0 by t=18'
  requires_simulation: typed-interface
- name: viability-cliff
  classification: primary
  description: Viability holds ≈1 in-band then collapses once T exceeds t_tol (Arrhenius).
  measure:
    kind: observable
    path: viability
    expr: last(viability)
  pass_if:
    op: <=
    value: 0.1
    provenance: 'Arrhenius: viability collapses once T > t_tol = 42 (crosses at t≈5.6, →0 by t=18)'
  requires_simulation: typed-interface
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'Negative control: the inert draft (typed ports, no mechanism) MUST fail volume-growth
    — volume stays at its 0.5 seed. This is what the correct model is contrasted against.'
  measure:
    kind: observable
    path: volume
    expr: max(volume)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'inert-draft run: max volume 0.50 (no mechanism → no growth); the control the correct model is contrasted against'
  requires_simulation: typed-interface
runs:
- name: typed-interface
  composite: typed-interface
  emitter: RAMEmitter
  id: typed-interface
  status: completed
  provenance: scripts/render_dynamics.py — viva_meta_modelers_guide.dynamics builders run to completion
    through the engine; conservation invariant checked per figure.
  params: {}
  outcomes:
    GROWTH-TRACKS-NUTRIENT:
      result: PASS
      detail: volume +3.70 from nutrient −10.00 (yield-bounded)
    MONOD-SATURATION:
      result: PASS
      detail: nutrient 10→0 (saturating drawdown)
    VIABILITY-CLIFF:
      result: PASS
      detail: viability 1.0 → ~0 as temperature ramps 37→50 °C past the 42 °C band
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Volume gained is paid for by nutrient consumed (mass balance). Confirmed: volume +3.70 from
    nutrient −10.00 (yield-bounded).'
  evidence:
    from_test: growth-tracks-nutrient
    from_run: typed-interface
    observed: volume +3.70 from nutrient −10.00 (yield-bounded)
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'Uptake follows a saturating Monod law and depletes the pool. Confirmed: nutrient 10→0 (saturating
    drawdown).'
  evidence:
    from_test: monod-saturation
    from_run: typed-interface
    observed: nutrient 10→0 (saturating drawdown)
- id: F-03
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Viability holds in the tolerance band then collapses past it (Arrhenius). Confirmed: viability
    1.0 → ~0 as temperature ramps 37→50 °C past the 42 °C band.'
  evidence:
    from_test: viability-cliff
    from_run: typed-interface
    observed: viability 1.0 → ~0 as temperature ramps 37→50 °C past the 42 °C band
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Volume, nutrient, and viability tests all pass on measured readouts; the inert-draft negative control stays at its 0.5 seed, isolating the installed handler as the cause.
  explanatory_gain:
    result: POSITIVE
    basis: Compiling the inert Fig 4 interface into a running cell makes interface-preservation and the growth-versus-viability coupling directly observable.
conclusion: '## Claims

  - Given one conforming handler the cellular interface becomes a bounded cell that grows on a DEPLETING
  nutrient (Monod uptake; volume +3.7 as substrate falls 10→0) and whose viability holds ≈1 in-band then
  collapses in an Arrhenius cliff once temperature is ramped past its tolerance — coupled dynamics, not
  a ramp.


  ## Evidence

  - **GROWTH-TRACKS-NUTRIENT** — volume +3.70 from nutrient −10.00 (yield-bounded)

  - **MONOD-SATURATION** — nutrient 10→0 (saturating drawdown)

  - **VIABILITY-CLIFF** — viability 1.0 → ~0 as temperature ramps 37→50 °C past the 42 °C band

  - **conservation** — volume gained 3.70 from nutrient drawn-down 10.00


  ## Limitations

  - Single-handler toy-real model: mass is conserved and the rate laws (Monod, Arrhenius) are real in shape, but the constants are illustrative.


  ## Next steps

  - Install a second, independent handler behind the same interface to show mechanism-independence directly.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - closing-the-loop
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- One handler realizes the interface (Monod uptake + Arrhenius viability); the port set admits many mechanisms but only this one is installed and measured.
- Constants (uptake half-saturation, yield, thermal tolerance) are illustrative, not fitted to a named organism.
falsifiability: Overturned if the compiled cell's port set differs from the declared Fig 4 interface, or if installing the handler leaves volume flat (no growth) or viability without an Arrhenius collapse past t_tol.
