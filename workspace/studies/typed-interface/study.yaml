schema_version: 4
name: typed-interface
investigation: draft-to-living-cell
title: The Contract and Its Coupling
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can the cellular boundary be specified as nothing but a set of typed, unit-bearing exchange ports (Fig 4) with no committed mechanism, compiled — by installing one conforming handler — into a running, bounded, goal-directed cell whose interface is exactly the one declared; and does that same interface become a genuine sense/act LOOP (Fig 5) when the environment is a real diffusing spatial field the cell reads and acts back on?
biological_summary: 'A cell, viewed from the outside, is a small alphabet of exchange variables: fluxes of matter (chemical, mol·s⁻¹), forces (mechanical, N), currents (electrical, A) and heat (thermal, W), together with higher-level cellular quantities — growth rate (hr⁻¹), shape, an objective the cell pursues, and a viability that says whether the cellular description still holds. Fig 4 is that alphabet. This study makes it operational in two stages behind ONE preserved interface. First (Fig 4): the draft declares each port with its type and unit and intends ''a bounded, goal-directed cell''; installing a conforming handler turns it into one — chemical is taken up and converted into growth, so shape and the objective climb — while the ports and their wiring are preserved unchanged (structural conformance). Then (Fig 5) the interface becomes a RELATIONSHIP: the environment is not a set of scalars but a field — a map[float] chemical field over a 15-node lattice plus a mechanical field — and the cell couples to it locally. It senses the field value at its location and acts back by taking up matter, which both feeds its growth and depletes the field; diffusion then carries the depletion outward. The key conceptual move is that sensing and acting are not two subsystems but one coupling: the same shared field store is what the cell reads and what it writes. Measured on the compiled executables: chemical flux 0.0 → -0.8 drives shape 1.0 → 4.2 and objective 0.0 → 1.6 (Fig 4); and over the diffusing lattice the cell draws down the bolus at its location (a field cell 1.0 → 0.2) as it takes up matter (uptake flux 0 → 0.34) and acts back mechanically (traction 0 → 0.41, mechanical field 0 → 0.94) (Fig 5).'
claim: A cell can be specified at one level by its typed interface — exchange variables such as chemical flux, force, current, heat, growth, shape, objective, and viability — without committing to a mechanism; and that same interface is a genuine coupling in which sensing and acting are one relationship over a shared field store, not two subsystems.
baseline:
- name: interaction-modalities
  composite: meta_modelers_guide.composites.fig04a-interaction-modalities
  params: {}
- name: cellular-interface
  composite: meta_modelers_guide.composites.fig04b-cellular-interface
  params: {}
- name: cell-environment
  composite: meta_modelers_guide.composites.fig05-cell-environment
  params: {}
variants: []
behavior_tests:
- name: shape-growth
  classification: primary
  description: The conforming handler grows the cell through its interface — shape climbs well above its seed.
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'executable run: shape 1.0→4.2 (chemical uptake drives growth); exec last≈4.2 (fig04b-executable)'
  requires_simulation: typed-interface
- name: chemical-uptake
  classification: primary
  description: The cell takes up chemical across its interface — net chemical flux goes negative.
  measure:
    kind: observable
    path: chemical
    expr: min(chemical)
  pass_if:
    op: <=
    value: -0.5
    provenance: 'chemical flux 0.0→-0.8 (net uptake across the interface); exec last≈-0.8 (fig04b-executable)'
  requires_simulation: typed-interface
- name: objective-climbs
  classification: primary
  description: The cell pursues its declared objective — the objective readout climbs from zero.
  measure:
    kind: observable
    path: objective
    expr: last(objective)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'objective 0.0→1.6 as growth proceeds; exec last≈1.6 (fig04b-executable)'
  requires_simulation: typed-interface
- name: cell-draws-well
  classification: primary
  description: The cell senses the field at its location and draws it down — uptake flux climbs and the bolus cell falls.
  measure:
    kind: observable
    path: uptake_flux
    expr: last(uptake_flux)
  pass_if:
    op: '>='
    value: 0.2
    provenance: cell takes up from the field — uptake flux 0.0→0.34, bolus cell drawn down 1.0→0.2 (exec last≈0.34, fig05-executable)
  requires_simulation: closing-the-loop
- name: cell-acts-back
  classification: primary
  description: The cell acts back on its environment — traction rises from zero.
  measure:
    kind: observable
    path: traction
    expr: last(traction)
  pass_if:
    op: '>='
    value: 0.3
    provenance: cell acts back mechanically — traction 0.0→0.41 (exec last≈0.41, fig05-executable)
  requires_simulation: closing-the-loop
- name: mechanical-response
  classification: primary
  description: The cell drives a mechanical field in the shared environment.
  measure:
    kind: observable
    path: mechanical_field
    expr: last(mechanical_field)
  pass_if:
    op: '>='
    value: 0.5
    provenance: mechanical field driven by the cell 0.0→0.94 (exec last≈0.94, fig05-executable)
  requires_simulation: closing-the-loop
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'One-line sanity check (NOT the study''s control): the inert draft has empty updates by construction, so shape stays at its 1.0 seed and fails this threshold by design — confirming the framework''s definition of a draft, not a scientific counterfactual.'
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'inert-draft run: shape stays 1.0 (empty update by construction) → fails by design (expected-fail control)'
  requires_simulation: typed-interface
runs:
- name: typed-interface
  composite: typed-interface
  emitter: RAMEmitter
  id: typed-interface
  status: completed
  provenance: scripts/render_study_evidence.py — fig04b-executable compiled from the Fig 4 draft, run to completion through the engine.
  params: {}
  outcomes:
    SHAPE-GROWTH:
      result: PASS
      detail: shape 1.0 → 4.2 (growth well above seed)
    CHEMICAL-UPTAKE:
      result: PASS
      detail: chemical flux 0.0 → -0.8 (net uptake across the interface)
    OBJECTIVE-CLIMBS:
      result: PASS
      detail: objective 0.0 → 1.6 (goal-directed progress)
    DRAFT-IS-INERT:
      result: PASS
      detail: 'expected-fail control: the inert draft (empty update) keeps shape at 1.0 — it fails the ≥2.0 threshold by design, confirming a draft is inert'
- name: closing-the-loop
  composite: closing-the-loop
  emitter: RAMEmitter
  id: closing-the-loop
  status: completed
  provenance: scripts/render_study_evidence.py — fig05-executable compiled from the Fig 5 draft, run to completion through the engine over one shared diffusing field store.
  params: {}
  outcomes:
    CELL-DRAWS-WELL:
      result: PASS
      detail: uptake flux 0.0 → 0.34; bolus cell drawn down 1.0 → 0.2
    CELL-ACTS-BACK:
      result: PASS
      detail: traction 0.0 → 0.41 (cell acts on its environment)
    MECHANICAL-RESPONSE:
      result: PASS
      detail: mechanical field 0.0 → 0.94
