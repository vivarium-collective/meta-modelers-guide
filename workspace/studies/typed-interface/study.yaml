experiment: Start with the Fig. 4 interface as an inert specification, install a bounded-cell mechanism
  behind it, and run the resulting composite. The compiler must preserve the declared interface exactly.
result: 'The interface is preserved while the installed mechanism produces cell-level dynamics: chemical
  uptake drives growth and progress toward the cell''s objective.'
