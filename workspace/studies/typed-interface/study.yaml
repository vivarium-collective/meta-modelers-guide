schema_version: 4
name: typed-interface
investigation: draft-to-living-cell
title: The Typed Interface
created: '2026-08-15'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Can the cellular boundary be specified as nothing but a set of typed, unit-bearing exchange
  ports (chemical, mechanical, electrical, thermal, plus growth rate, shape, objective, viability) with
  no committed mechanism, and then compiled — by installing one conforming handler — into a running, bounded,
  goal-directed cell whose interface is exactly the one declared?
biological_summary: 'A cell, viewed from the outside, is a small alphabet of exchange variables: fluxes
  of matter (chemical, mol·s⁻¹), forces (mechanical, N), currents (electrical, A) and heat (thermal, W),
  together with higher-level cellular quantities — growth rate (hr⁻¹), shape, an objective the cell pursues,
  and a viability that says whether the cellular description still holds. Fig 4 is that alphabet. This
  study makes it operational: the draft declares each port with its type and unit and promises ''a bounded,
  goal-directed cell''; the handler keeps the promise, uptaking chemical and converting it into growth
  so that shape and objective climb. Nothing about the interface changes between draft and executable
  — only a mechanism is installed behind it.'
claim: A cell can be specified at one level by its interface — typed exchange variables such as chemical
  flux, force, current, heat, growth, shape, objective, and viability — without committing to the mechanism
  that realizes those behaviors.
baseline:
- name: interaction-modalities
  composite: meta_modelers_guide.composites.fig04a-interaction-modalities
  params: {}
- name: cellular-interface
  composite: meta_modelers_guide.composites.fig04b-cellular-interface
  params: {}
variants: []
behavior_tests:
- name: shape-growth
  classification: primary
  description: The conforming handler grows the cell — shape climbs well above its seed.
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'executable run: shape 1.0→4.2 (chemical uptake drives growth); exec last≈4.2'
  requires_simulation: typed-interface
- name: chemical-uptake
  classification: primary
  description: The cell takes up chemical across its interface — net chemical flux goes negative.
  measure:
    kind: observable
    path: chemical
    expr: min(chemical)
  pass_if:
    op: <=
    value: -0.5
    provenance: 'chemical flux 0.0→-0.8 (net uptake across the interface); exec last≈-0.8'
  requires_simulation: typed-interface
- name: objective-climbs
  classification: primary
  description: The cell pursues its declared objective — the objective readout climbs from zero.
  measure:
    kind: observable
    path: objective
    expr: last(objective)
  pass_if:
    op: '>='
    value: 1.0
    provenance: 'objective 0.0→1.6 as growth proceeds; exec last≈1.6'
  requires_simulation: typed-interface
- name: draft-is-inert
  classification: diagnostic
  control: negative
  description: 'Negative control: the inert draft (typed ports, no mechanism) MUST fail shape-growth
    — shape stays at its 1.0 seed. This is what the correct model is contrasted against.'
  measure:
    kind: observable
    path: shape
    expr: max(shape)
  pass_if:
    op: '>='
    value: 2.0
    provenance: 'inert-draft run: shape stays 1.0 (no mechanism → no growth); the control the correct model is contrasted against'
  requires_simulation: typed-interface
runs:
- name: typed-interface
  composite: typed-interface
  emitter: RAMEmitter
  id: typed-interface
  status: completed
  provenance: scripts/render_study_evidence.py — fig04b-executable compiled from the Fig 4 draft, run
    to completion through the engine.
  params: {}
  outcomes:
    SHAPE-GROWS:
      result: PASS
      detail: shape 1.0 → 4.2 (growth well above seed)
    CHEMICAL-UPTAKE:
      result: PASS
      detail: chemical flux 0.0 → -0.8 (net uptake across the interface)
    OBJECTIVE-CLIMBS:
      result: PASS
      detail: objective 0.0 → 1.6 (goal-directed progress)
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Installing one conforming handler grows the cell through its interface. Confirmed: shape
    1.0 → 4.2.'
  evidence:
    from_test: shape-growth
    from_run: typed-interface
    observed: shape 1.0 → 4.2
- id: F-02
  kind: biological
  tier: observation
  status: confirms
  statement: 'The cell takes up chemical across its interface (net negative flux). Confirmed: chemical
    flux 0.0 → -0.8.'
  evidence:
    from_test: chemical-uptake
    from_run: typed-interface
    observed: chemical flux 0.0 → -0.8
- id: F-03
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell makes progress toward its declared objective as growth proceeds. Confirmed: objective
    0.0 → 1.6.'
  evidence:
    from_test: objective-climbs
    from_run: typed-interface
    observed: objective 0.0 → 1.6
conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All figure composites build and every executable runs to completion (scripts/build_executables.py
      + scripts/measure_all.py, 2026-08-16).
  biological_validation:
    result: PASS
    basis: Shape, chemical, and objective tests all pass on measured readouts; the inert-draft negative control stays at its 1.0 shape seed, isolating the installed handler as the cause.
  explanatory_gain:
    result: POSITIVE
    basis: Compiling the inert Fig 4 interface into a running cell makes interface-preservation and the uptake-driven growth directly observable.
conclusion: '## Claims

  - Given one conforming handler the cellular interface becomes a bounded, goal-directed cell: chemical
  is taken up across the interface (flux 0.0→−0.8) and drives growth, so shape climbs 1.0→4.2 and the
  objective rises 0.0→1.6 — coupled dynamics behind an unchanged interface, not a scripted ramp.


  ## Evidence

  - **SHAPE-GROWS** — shape 1.0 → 4.2 (growth well above seed)

  - **CHEMICAL-UPTAKE** — chemical flux 0.0 → -0.8 (net uptake across the interface)

  - **OBJECTIVE-CLIMBS** — objective 0.0 → 1.6 (goal-directed progress)


  ## Limitations

  - Single-handler toy-real model: the rate laws are real in shape but the constants are illustrative, and only this one mechanism is installed behind the interface.


  ## Next steps

  - Install a second, independent handler behind the same interface to show mechanism-independence directly.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The figure draft compiles to an executable that runs.
    biological_validation: The paper's pattern is demonstrated at the toy-real (uncalibrated) level; interface
      preservation holds.
    pipeline_unblocks:
    - closing-the-loop
  if_primary_tests_fail:
    diagnose:
    - compiler dropped/renamed an interface port (law 2 violation)
    - handler produced no non-trivial dynamics on the declared ports
    block_downstream: the-living-atlas (the composed whole cell depends on this figure's mechanism)
limitations:
- One handler realizes the interface (chemical uptake driving growth); the port set admits many mechanisms but only this one is installed and measured.
- Constants (uptake rate, yield) are illustrative, not fitted to a named organism.
falsifiability: Overturned if the compiled cell's port set differs from the declared Fig 4 interface, or if installing the handler leaves shape flat (no growth) or the objective unchanged.
