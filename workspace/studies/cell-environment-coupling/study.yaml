schema_version: 4
name: cell-environment-coupling
investigation: draft-to-living-cell
title: Cell–Environment Coupling (flagship)
created: '2026-08-21'
status: complete
phase: Decide
gate_status: passed
confidence: Provisional
question: 'When a single cell metabolizes at its own location, does it measurably reshape the very

  nutrient gradient it depends on — environmental modification (local resource depletion + secretion) — closing the paper''s

  §Cell–environment coupling sense → metabolize → secrete loop (Fig 4) as real spatial

  metabolism: one cell sensing local glucose, running flux-balance analysis at its own footprint,

  growing, and secreting a byproduct that diffuses back into the field it senses? The paper

  frames this feedback loop as "the minimal structure required for control"; here the loop is

  genuinely closed (a real depletion → uptake feedback) in the flagship, while directed control —

  chemotaxis up the sensed gradient — is the flagship''s non-motile-by-design other half, now

  BUILT and MEASURED in the `chemotaxis` variant (finding F-08). Mechanistically, the cell and its environment are

  two real, independently-built simulators (viva-cpm''s Cellular Potts engine, spatio-flux''s

  diffusion-advection and dynamic-FBA processes) composed through one typed coupling process

  (`CpmCellField`), rather than a scripted or lumped stand-in for that coupling.

  '
biological_summary: 'A cell does not merely inhabit its environment — it remakes it. Here one

  cell sits in a nutrient gradient, eats at its own location, and secretes a byproduct back into

  the field, measurably reshaping the very gradient it depends on: environmental modification (local resource depletion + secretion),

  realized spatially. This is the paper''s §Cell–environment coupling sense → metabolize → secrete

  loop (Fig 4), and this investigation''s flagship. The paper frames this feedback loop as "the

  minimal structure required for control": here the loop is genuinely closed (a real

  depletion → uptake feedback), while directed control — chemotaxis up the sensed gradient — is

  the flagship''s non-motile-by-design other half, now built and measured in the `chemotaxis`

  variant (finding F-08); the FLAGSHIP cell itself senses, metabolizes,

  grows, and secretes, but does not act on what it senses. Mechanically it composes two real,

  independently-built simulators through one typed coupling process (`CpmCellField`): one CPM cell

  — a real Cellular Potts Model agent from viva-cpm, with genuine pixel-level shape, adhesion, and

  volume dynamics on a 60x60 lattice — with a shared spatio-flux `fields` grid (glucose, acetate)

  running `DiffusionAdvection`. `CpmCellField` is the entire interface between

  them: each tick it reads the mean glucose concentration at the cell''s current footprint (the

  set of lattice pixels the CPM cell occupies), solves one dynamic-FBA step against `e_coli_core`

  with Michaelis–Menten-limited glucose uptake (`glucose_km`, `glucose_vmax`) and a fixed

  oxygen cap (`oxygen_vmax`) — the O2 cap is what forces the optimizer into mixed-acid acetate

  overflow rather than pure aerobic respiration, matching the biological mechanism this coupling

  is meant to demonstrate. That causal claim is not left to the code: the O2-uncapped mechanism

  control (`o2-cap-forces-acetate-overflow` below) lifts the oxygen bound and shows acetate

  secretion collapses to ~0 while the capped flagship secretes a real plume, so the overflow is a

  demonstrated experiment rather than an assertion. The coupling then mass-balances the FBA

  solution against how much glucose the

  footprint actually holds (so the cell can never manufacture biomass or acetate from glucose it

  did not actually remove), grows the CPM cell''s target volume in proportion to the resulting

  biomass, and writes the clamped glucose uptake and acetate secretion back into the field as a

  spatial delta. spatio-flux''s own `DiffusionAdvection` then spreads both species outward: the

  depleted local glucose is partially resupplied from the field''s pre-set left-low-to-right-high

  gradient, and the secreted acetate forms an expanding plume.


  Measured on `single-cell-in-a-field` over 20 ticks (`tests/test_flagship_field.py`,

  `tests/test_cpm_cell_field.py`, `tests/test_cpm_viz.py`): the CPM cell grows from 32 to 110

  lattice pixels (about 3.4x), against a 60x60 = 3600-pixel lattice — roughly 3% coverage at the

  end, nowhere near filling the field. Local footprint glucose peaks at 1.15 (t=2, after diffusion

  briefly outpaces the cell''s own uptake) then falls to 0.94 by t=20 — ~18% peak-to-trough (the peak

  at t=2 is created by diffusion inflow after t=0) and ~6% from the initial condition — as the cell''s

  own consumption outpaces the partial resupply diffusion provides. Field-wide,

  net glucose falls by about 32 units (5940 -> 5908, out of the field''s full 3600-pixel total

  mass) — a small fraction of the whole field, because only the cell''s own footprint and its

  immediate diffusive neighborhood are touched, which is exactly the local, footprint-scale

  environmental modification the composite is built to show rather than a field-wide depletion event. Acetate,

  starting at zero everywhere, rises to a field-wide total of about 47 by t=20 as the secreted

  byproduct diffuses into a spreading plume. Biomass (the FBA-tracked internal state driving CPM

  growth) rises from 0.1 to about 0.37.

  '
claim: 'Composing a real CPM cell with a real spatio-flux nutrient field through one typed

  coupling process (`CpmCellField`) reproduces the paper''s §Cell–environment coupling

  sense → metabolize → secrete loop (Fig 4) as genuine spatial metabolism, not a scripted stand-in

  for it (the flagship loop is closed; directed control/chemotaxis is built and measured in the

  `chemotaxis` variant, finding F-08) — over 20 ticks the

  cell runs dynamic-FBA at its own

  footprint (`e_coli_core`, O2-capped to force acetate overflow), grows ~3.4x in CPM volume (32

  -> 110 px, ~3% of a 60x60 lattice it does not come close to filling), depletes local glucose by

  up to ~18% peak-to-trough (~6% from the initial condition) before diffusion partially resupplies it

  (environmental modification), and secretes a

  diffusing acetate plume — two independently-built simulators talking through one typed port.

  '
baseline:
- name: single-cell-in-a-field
  composite: meta_modelers_guide.composites.single-cell-in-a-field
  params: {}
variants:
- name: mm-mechanism
  composite: meta_modelers_guide.composites.single-cell-in-a-field-mm
  description: 'Interface surrogate-calibration twin (a tuned Michaelis-Menten stand-in — this

    investigation''s test of the paper''s substitutability idea, at the level of surrogate

    calibration): the flagship with the cell''s INTERNAL metabolism swapped from constraint-based

    dynamic-FBA (cobra e_coli_core, O2-capped) to a lumped Michaelis–Menten / Monod metabolism

    (`mechanism: mm`, no cobra) BEHIND THE BYTE-IDENTICAL `CpmCellField` ports. Uptake

    v = mm_vmax·glc/(mm_km+glc); biomass gain mm_yield·v; acetate overflow mm_overflow·v — a fixed

    overflow fraction standing in for the dFBA''s O2-cap-driven mixed-acid overflow. The 4 MM params

    (mm_vmax 4.0, mm_km 0.5, mm_yield 0.024, mm_overflow 1.4) are TUNED so the interface-level

    observables track the dFBA flagship (4 knobs fit to 4 interface observables — exactly determined,

    so a good tuned fit is unsurprising); they are not derived from the dFBA solution. The named next

    step is now RUN — a genuine held-out test (peer-review M2). With those 4 params FROZEN, dFBA vs MM

    was compared on conditions neither was tuned on. Two-sided, honest result — inside the calibrated

    glucose-limited, fixed-O2 regime the substitution is mechanism-independent (a different initial

    glucose field and a 2x-longer run both hold within ~13%), but the MM box is BLIND to oxygen — on a

    held-out O2 cap (dFBA 2.5 -> 5.0) agreement collapses to ~74%, the honest boundary of the swap.'
  params:
    mechanism: mm
    mm_vmax: 4.0
    mm_km: 0.5
    mm_yield: 0.024
    mm_overflow: 1.4
- name: steadystate
  composite: meta_modelers_guide.composites.single-cell-in-a-field-steadystate
  description: 'M7d steady-state regime (peer review) — the flagship is a pure transient
    (no source terms — every flagship claim is a transient reading, never a source/sink
    equilibrium). This variant adds three cell-INDEPENDENT terms behind the same
    `CpmCellField` ports so the composite becomes a chemostat-like regime with a genuine
    flux fixed point — a first-order glucose SOURCE (grid-wide relaxation toward a setpoint,
    `glucose_source_rate` 0.15 toward `glucose_source_target` 1.5), a first-order acetate
    DECAY sink (`acetate_decay_rate` 0.2), and a logistic biomass carrying capacity
    (`biomass_capacity` 0.5) that halts exponential growth at a stationary-phase ceiling.
    A biomass dilution term alone gives NO interior fixed point in this coupling — the
    cell''s per-pixel uptake scales with biomass/footprint-area (both grow together), so
    local glucose equilibrates at a biomass-independent value and mu never falls to a
    dilution rate — the logistic cap is what forces biomass, and hence every flux, to a
    steady state. Field mass is deliberately NOT conserved here (open-system source/sink);
    that is the point of a steady state. Run ~120 ticks it reaches a verified steady state
    (see the `steadystate-flux-equilibrium` acceptance criterion below).'
  params:
    glucose_source_rate: 0.15
    glucose_source_target: 1.5
    acetate_decay_rate: 0.2
    biomass_capacity: 0.5
- name: chemotaxis
  composite: meta_modelers_guide.composites.single-cell-in-a-field-chemotaxis
  description: 'CHEMOTAXIS variant (the deferred half of the paper''s loop, now BUILT and
    MEASURED) — the same flagship cell in the same left-low-to-right-high glucose field, but
    now the cell ACTS on what it senses. `chemotaxis_strength` 50.0 turns on directed motion
    up the SENSED glucose gradient behind the same `CpmCellField` ports — each tick the
    coupling process takes grad(glucose) of the SHARED spatio-flux field over the cell''s
    footprint and sets viva-cpm''s per-type external-potential force f = strength·grad(glucose),
    so the Metropolis pixel-copy is biased up-gradient via U(r) = −f·r (the linearized form of
    CC3D chemotaxis ΔH = −λ·Δc, driven by the external shared field rather than a viva-cpm
    internal one, which has no write path here). RESULT — directed up-gradient motion is
    genuinely achieved and it helps — over 20 ticks the cell migrates from COM x ≈ 18.5 to
    ≈ 39.3 (+20.8 px up-gradient) versus the non-motile flagship''s +0.2 px thermal drift on
    the identical field (~90×), reaching a ~2.1× richer local glucose region (sensed local
    glucose 1.95 vs 0.94) and for it acquiring ~16% more glucose (net 36.8 vs 31.6), building
    ~13% more biomass (0.418 vs 0.370), and growing ~36% more CPM volume (150 vs 110 px).
    Deterministic (fixed CPM seed). `chemotaxis_strength` 0.0 is the flagship default — the
    force is never set, so the base flagship run is byte-identical.'
  params:
    chemotaxis_strength: 50.0
key_assumptions:
- 'e_coli_core constants (`glucose_km` 0.5, `glucose_vmax` 3.5, `oxygen_vmax` 2.5,

  `box_volume_L` 0.3, `grow_per_biomass` 300.0) are toy-real: plausible, hand-tuned magnitudes

  chosen to produce gradual, spatially-legible dynamics over a short (~20-25 tick) run, not

  fitted to a named organism, medium, or literature target.'
- 'The metabolized/diffused nutrient field is exclusively the spatio-flux `fields` store

  (glucose, acetate) that `CpmCellField` and `DiffusionAdvection` share. The CPM cell''s OWN

  internal lattice/world (its shape, occupied pixels, footprint) lives inside viva-cpm''s Rust

  engine as a private object the coupling process owns (`CpmCellField.world`) — it is not a

  process-bigraph store, and no other process in the composite reads or writes it. viva-cpm''s

  own internal field concept (`field_at_cell`, `secretory_types`, `receptor_coupling`) is

  separate machinery this composite does not use.'
- Growth is roughly exponential in this coupling (biomass compounds each tick), so the run is
  deliberately bounded to ~20-25 ticks — a longer run would need either a saturating growth term
  or a much larger field to stay spatially legible rather than filling the lattice.
- Chemotaxis toward the sensed field (directed up-gradient motion) is BUILT and MEASURED in the
  `chemotaxis` variant (finding F-08) — the FLAGSHIP itself remains non-motile by design (its
  modest position drift, COM x ≈ 18.5 → 18.7 over 20 ticks, is CPM thermal fluctuation under the
  configured temperature, not directed motion), and the `chemotaxis` variant adds a
  gradient-directed external-potential force behind the same ports that produces genuine directed
  up-gradient migration (COM x 18.5 → 39.3, +20.8 px, ~90× the flagship''s thermal drift) with a
  measured nutrient/growth advantage.
acceptance_criteria:
- A cell metabolizing at its footprint should end with more biomass than it started — growth under nutrients.
- Under an O2 cap, overflow metabolism should secrete acetate ( > 0 ); lifting the cap should remove that secretion (uncapped acetate ≈ 0).
- The metabolizing cell should be a net sink on the shared field — total glucose should fall below its initial value.
- Per-species field mass should be conserved — initial mass plus every writer's reported net exchange should equal final mass.
units_and_time:
  time: 1 tick = unspecified physical time (dimensionless model time); runs are bounded to ~20-25 ticks.
  quantities: glucose/acetate field values, biomass, and CPM lattice volume (px) are dimensionless model units. box_volume_L, glucose_km/glucose_vmax and the field concentrations are hand-tuned toy-real magnitudes, not calibrated to mM or to a named medium.
external_anchors:
- 'acetate yield under overflow ≈ 0.3-0.5 mol acetate / mol glucose (order-of-magnitude anchor, not a calibration target).'
- 'glucose uptake ≈ 10 mmol/gDW/hr (E. coli aerobic) (order-of-magnitude anchor, not a calibration target).'
behavior_tests:
- name: cell-metabolizes-and-grows
  classification: primary
  description: 'The cell runs dynamic-FBA at its own footprint and grows: biomass rises above its

    initial value and CPM volume exceeds 40 px by step 20.'
  measure:
    kind: observable
    path: obs.biomass
    expr: last(obs.biomass)
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 0.1
    provenance: 'prior: a cell metabolizing at its footprint should end with more biomass than its
      0.1 seed (growth under nutrients) → expect final biomass > 0.1. Observed over 20 ticks:
      biomass 0.1 -> ~0.37 (tests/test_flagship_field.py::test_flagship_sense_act_loop;
      tests/test_cpm_cell_field.py::test_cell_metabolizes_grows_and_reshapes_field asserts the
      same pattern on a smaller 40x40 grid over 12 ticks)'
  requires_simulation: single-cell-in-a-field
- name: cpm-volume-grows
  classification: primary
  description: The CPM cell's own target-volume-driven growth carries through to its actual
    lattice-pixel volume — the cell occupies more pixels by the end of the run.
  measure:
    kind: observable
    path: obs.volume
    expr: last(obs.volume)
  pass_if:
    kind: regression_pin
    op: '>'
    value: 40.0
    provenance: 'pin set after the run — CPM volume 32 -> 110 px over 20 ticks (~3.4x), ~3% of the
      60x60=3600px lattice; 40 px is a floor above the 32 px seed (tests/test_flagship_field.py::test_flagship_sense_act_loop)'
  requires_simulation: single-cell-in-a-field
- name: acetate-secreted-and-diffuses
  classification: primary
  description: The cell secretes acetate into the shared field as a genuine byproduct of the
    O2-capped dFBA overflow mechanism, and it is present in the field (i.e. has diffused/spread)
    by the end of the run.
  measure:
    kind: observable
    path: fields.acetate
    expr: sum(fields.acetate)
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 0.0
    provenance: 'prior: overflow metabolism under an O2 cap secretes acetate → expect field-wide
      acetate > 0. Observed: field-wide acetate 0 -> ~47.0 over 20 ticks, spreading into a plume
      around the cell''s footprint (tests/test_flagship_field.py::test_flagship_sense_act_loop; the
      plume is the third panel of the baked GIF)'
  requires_simulation: single-cell-in-a-field
- name: net-glucose-consumed
  classification: primary
  description: Net field-wide glucose falls over the run — the cell is a genuine sink on the
    shared field, not merely redistributing it.
  measure:
    kind: observable
    path: fields.glucose
    expr: sum(fields.glucose)
  pass_if:
    kind: acceptance_criterion
    op: <
    value: 5940.0
    provenance: 'prior: a metabolizing cell is a net sink on the shared field → expect total glucose
      to fall below its 5940.0 initial. Observed: field-wide glucose total 5940.0 -> ~5908.4 over 20
      ticks (~32 units net consumed); the local footprint drawdown is much sharper — ~18%
      peak-to-trough (the peak is created by diffusion inflow after t=0) and ~6% from the initial
      condition — than the field-wide total, because only the cell''s footprint and its immediate
      diffusive neighborhood are touched (tests/test_flagship_field.py::test_flagship_sense_act_loop)'
  requires_simulation: single-cell-in-a-field
- name: o2-cap-forces-acetate-overflow
  classification: diagnostic
  control: negative
  description: 'Foundational mechanism control (not this study''s scientific claim): the acetate
    the flagship secretes is CAUSED BY the O2 cap, not an artifact of the coupling. This runs a
    second composite (`single-cell-in-a-field-o2uncapped`) identical to the flagship except the
    oxygen bound is lifted (`oxygen_vmax` 2.5 -> 1000, EX_o2_e effectively unbounded). With
    respiration no longer capacity-limited, unconstrained e_coli_core takes pure aerobic
    respiration as growth-optimal and EX_ac_e sits at 0 — so the cell secretes ~0 acetate (and
    grows faster: biomass ~2.35 vs the capped ~0.37), while the capped flagship secretes a real
    plume. This turns the study''s overflow claim ("the O2 cap is what forces the optimizer into
    mixed-acid overflow") from a code assertion into a demonstrated experiment. The flagship
    was built first and, unlike the later studies, had no such foundational control until this
    pass; this is it.'
  measure:
    kind: observable
    path: fields.acetate
    expr: sum(fields.acetate) with oxygen uncapped vs capped
  pass_if:
    kind: acceptance_criterion
    op: approx_equal
    value: 0.0
    provenance: 'prior: lifting the O2 cap removes the overflow driver, so unconstrained e_coli_core
      respires fully → expect uncapped acetate ≈ 0. Observed field-wide acetate over 20 ticks: capped
      flagship 0 -> ~47.0, O2-uncapped 0 -> 0.0 (exactly), a >100x collapse; uncapped biomass ~2.35 vs
      capped ~0.37 (the cell respires fully instead of overflowing)
      (tests/test_flagship_field.py::test_o2_cap_is_what_forces_acetate_overflow;
      composite meta_modelers_guide/composites/single-cell-in-a-field-o2uncapped.composite.json)'
  requires_simulation: single-cell-in-a-field-o2uncapped
- name: field-mass-balance-closes
  classification: diagnostic
  control: positive
  description: 'Foundational conservation control (not this study''s scientific claim): the paper
    frames conservation laws (mass, energy balance) as interface constraints on any coupling. This
    runs the flagship composite through a closed per-species ledger — for glucose and acetate,
    initial_field_mass + Σ(every writer''s own reported net exchange) == final_field_mass — where
    the writer''s reported delta and what actually accumulates in the shared grid travel through two
    independent code paths (the process''s per-tick arithmetic vs process-bigraph''s additive
    `apply` for a `map[array]` port), so a clamp that manufactures mass, a double-write, or a
    schema `apply` that concatenates instead of sums surfaces as a nonzero residual. The ledger
    also shows the cell nets a glucose sink and an acetate source while DiffusionAdvection under
    Neumann BC nets ~0.'
  measure:
    kind: observable
    path: fields.glucose, fields.acetate
    expr: abs(final_mass - (initial_mass + Σ writer_net_exchange)) per species
  pass_if:
    kind: regression_pin
    op: <
    value: 1.0e-06
    provenance: 'both glucose and acetate ledgers close to < 1e-6 over 15 ticks; cell net glucose
      < 0 (sink) and net acetate > 0 (source), diff net ~0 for both
      (tests/test_mass_balance.py::test_flagship_field_mass_balance_closes;
      meta_modelers_guide/analysis/mass_balance.py)'
  requires_simulation: single-cell-in-a-field
- name: interface-substitutable-across-mechanisms
  classification: primary
  description: 'Surrogate calibration of the paper''s substitutability idea (the TUNED-condition

    baseline for the held-out test below) — a tuned Michaelis-Menten twin (cobra-free) is fit to

    reproduce the dFBA flagship''s cell↔field interface observables behind the byte-identical

    `CpmCellField` ports. The MM twin''s 4 free params are TUNED to preserve the interaction variables

    (4 knobs fit to 4 observables — exactly determined), so its interface-level observables (final

    biomass, total acetate secreted, CPM volume, net glucose depletion) agree with the dFBA flagship

    within ~10% on the tuned condition (all four within a 30% tolerance). On its own this is surrogate

    calibration — the held-out gate `interface-substitutable-held-out` is what tests independence.'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose
    expr: per-observable abs(dFBA - MM) / dFBA over a 20-tick run
  pass_if:
    kind: regression_pin
    op: <
    value: 0.30
    provenance: 'over 20 ticks (tests/test_substitutability.py::test_interface_observables_substitutable):
      biomass dFBA 0.370 vs MM 0.342 (7.5%), CPM volume 110 vs 99 (10%), field-wide acetate 47.02 vs
      47.02 (~0%), net glucose depleted 31.6 vs 33.6 (6.2%) — every interface observable within ~10%;
      the MM path also runs with NO cobra (test_mm_mechanism_runs_without_cobra), the surrogate-model
      payoff. The 4 MM params (mm_vmax 4.0, mm_km 0.5, mm_yield 0.024, mm_overflow 1.4) were tuned to
      match (4 knobs fit to 4 observables — exactly determined); the held-out gate below tests them frozen.'
  requires_simulation: single-cell-in-a-field-mm
- name: interface-substitutable-held-out
  classification: primary
  description: 'HELD-OUT test of the surrogate (peer-review M2) — the real conversion of surrogate

    calibration into a genuine held-out test. The 4 MM params stay FROZEN at their tuned values and

    dFBA vs MM are compared on conditions NEITHER was tuned on. Honest two-sided result. Inside the

    calibrated glucose-limited, fixed-O2 regime the substitution is mechanism-independent, not just a

    fit — on a held-out initial glucose field (flat 3.0, not the tuned 0.3→3.0 gradient) every

    interface observable agrees within ~12%, and out to a 2x-longer run (40 ticks) within ~13%. But

    the MM box carries no oxygen variable — on a held-out O2 cap (dFBA 2.5→5.0, dFBA-only) agreement

    COLLAPSES to ~74% (dFBA nearly quadruples biomass/volume; the O2-blind MM twin cannot follow).

    Mechanism-independence holds within the calibrated regime; the O2 axis is the surrogate''s blind

    spot and the honest boundary of the swap.'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose
    expr: per-observable abs(dFBA - MM) / dFBA on held-out conditions, MM params frozen
  pass_if:
    kind: acceptance_criterion
    op: <
    value: 0.15
    provenance: 'HELD-OUT, MM params frozen (tests/test_substitutability_heldout.py). GATE — held-out
      glucose field flat 3.0 over 20 ticks — biomass dFBA 0.531 vs MM 0.480 (9.7%), CPM volume 160 vs
      141 (11.9%), acetate 74.9 vs 73.8 (1.4%), net glucose depleted 49.1 vs 52.7 (7.3%) — worst 11.9%,
      within the 0.15 band (::test_heldout_glucose_field_substitutable). CORROBORATION — 40-tick run —
      biomass 1.282 vs 1.123 (12.4%), volume 383 vs 335 (12.5%), acetate 207 vs 199 (4.1%), glucose
      139 vs 142 (2.0%) — worst 12.5% (::test_heldout_longer_run_substitutable). BOUNDARY (diagnostic,
      not gated small) — held-out O2 cap 2.5→5.0 diverges 73-74% on biomass/volume (dFBA 1.282/382 vs
      frozen MM 0.342/99): the surrogate is blind to O2 (::test_surrogate_is_blind_to_oxygen_heldout).
      Degrees of freedom — 4 free MM params vs 4 interface observables (exactly determined), so the
      tuned fit was guaranteed; the held-out agreement in-regime is the real evidence.'
  requires_simulation: single-cell-in-a-field-mm
- name: steadystate-flux-equilibrium
  classification: diagnostic
  control: positive
  gate_class: acceptance_criterion
  description: 'M7d steady-state check (peer review) — the flagship is a pure transient with
    no source terms, so every flagship number is a transient reading, never a source/sink
    equilibrium. The `single-cell-in-a-field-steadystate` variant adds a first-order glucose
    source, a first-order acetate decay sink, and a logistic biomass carrying capacity, and
    is run ~120 ticks to a VERIFIED flux steady state — d(biomass)/dt and both field fluxes
    fall below tolerance while the cell keeps metabolizing at maintenance. This answers the
    limitation the flagship itself flags (the field has no continuous source or decay term).'
  measure:
    kind: observable
    path: obs.biomass, fields.glucose, fields.acetate
    expr: max per-tick relative change of biomass and of each field total over the final 10 of 120 ticks
  pass_if:
    kind: acceptance_criterion
    op: <
    value: 0.001
    provenance: 'STEADY STATE REACHED. Criterion — over the final 10 of 120 ticks the max
      per-tick relative change of biomass and of both field totals is < 0.1%. Measured
      (tests/test_flagship_field.py::test_steadystate_regime_reaches_flux_steady_state) —
      biomass 0.0015%/tick, field glucose 0.0001%/tick, field acetate 0.014%/tick, all three
      below the 0.1% tolerance. Standing steady-state values — biomass ~0.500 (the
      biomass_capacity ceiling), CPM volume ~147 px (stable to CPM thermal noise ~3 px),
      local footprint glucose ~1.356, field glucose total ~5372 (uptake balanced by source),
      field acetate total ~31.5 (secretion balanced by decay). The cell is alive and
      metabolizing at the fixed point, not a dead/zeroed field.'
  requires_simulation: single-cell-in-a-field-steadystate
- name: cadence-convergence
  classification: diagnostic
  control: positive
  gate_class: rigor_check
  description: 'M7d cadence rigor check (peer review) — the flagship''s operator-split
    CPM<->dFBA<->diffusion loop runs at coupling cadence 1, and only the PDE substeps are
    CFL-guarded today. Halving then quartering the coupling cadence (sub-step interval 1 ->
    0.5 -> 0.25) and measuring the drift in the four gated observables between the two finest
    levels tests whether the pinned trajectories are cadence-converged. Convergence band is
    <= 10%. HONEST two-sided result — the three TIME-INTEGRATED gated observables converge
    tightly, but the INSTANTANEOUS local-footprint glucose does NOT (it is the one pinned
    trajectory that moves under refinement, flagged on F-02 below).'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, fields.acetate, fields.glucose, obs.local_nutrient
    expr: abs(drift) between coupling cadence 0.25 and 0.5 (finest two levels), per observable
  pass_if:
    kind: rigor_check
    op: <
    value: 0.10
    provenance: 'MEASURED drift between the finest two cadences (0.25 vs 0.5), deterministic
      fixed-seed run (tests/test_flagship_field.py::test_flagship_cadence_convergence).
      CONVERGED within the 10% band — final biomass 1.6%, CPM volume 2.6%, net glucose
      depleted 1.8%, field-wide acetate 1.7% (values — biomass 0.375 vs 0.381, volume 111 vs
      114, net glucose 32.3 vs 32.9, acetate 48.1 vs 49.0). NOT CONVERGED — the instantaneous
      local-footprint glucose (obs.local_nutrient) drifts 15.7% (0.864 vs 1.025), EXCEEDING
      the band, because it is a single-tick snapshot over a stochastically-shifting CPM
      footprint and the CPM''s fixed mcs_per_update is NOT interval-scaled (halving the
      cadence doubles the total Monte-Carlo relaxation the lattice receives). Finding — the
      integrated flagship claims (biomass/volume growth, acetate plume, net glucose sink)
      are cadence-robust; the local-depletion pin (F-02''s 0.94 / ~18% peak-to-trough / ~6%
      from initial) is cadence-sensitive and is re-levelled to an approximate, not
      cadence-converged, reading.'
  requires_simulation: single-cell-in-a-field
- name: chemotaxis-moves-cell-up-gradient-and-helps
  classification: primary
  gate_class: acceptance_criterion
  description: 'The chemotaxis variant closes the sense → act loop — the cell moves DIRECTED up
    the sensed glucose gradient (+x) while the non-motile flagship control barely drifts on the
    identical field, and by reaching the richer region it acquires more glucose and grows more.
    Measured head-to-head over 20 ticks — up-gradient displacement (chemo vs control), sensed
    local glucose, net glucose acquired, biomass, and CPM volume.'
  measure:
    kind: observable
    path: obs.position, obs.local_nutrient, obs.biomass, obs.volume, fields.glucose
    expr: chemotaxis vs flagship-control COM-x displacement + nutrient/growth deltas over 20 ticks
  pass_if:
    kind: acceptance_criterion
    op: '>'
    value: 10.0
    provenance: 'MEASURED, deterministic fixed-seed run (tests/test_chemotaxis_field.py::test_chemotaxis_moves_cell_up_gradient_and_helps_growth).
      DIRECTED MOTION — chemotaxis COM x 18.5 → 39.3 (+20.8 px up-gradient) vs flagship control
      18.5 → 18.73 (+0.2 px thermal drift), ~90× — pass_if value 10.0 is the up-gradient
      displacement floor the migrating cell clears (+20.8) and the control does not (+0.2).
      REACHES RICHER REGION — sensed local glucose 1.95 vs 0.94 (~2.1×). HELPS — net glucose
      acquired 36.8 vs 31.6 (+16%), biomass 0.418 vs 0.370 (+13%), CPM volume 150 vs 110 px
      (+36%). Directed up-gradient motion is genuinely achieved and measurably improves nutrient
      acquisition and growth versus the non-motile flagship on the same field.'
  requires_simulation: single-cell-in-a-field-chemotaxis
- name: chemotaxis-off-is-byte-identical-to-flagship
  classification: diagnostic
  control: negative
  gate_class: regression_pin
  description: 'Byte-identical no-op control — chemotaxis_strength 0.0 (the flagship default)
    leaves the flagship trajectory unchanged. With the force off, CpmCellField never calls
    set_external_potential, so the world''s external potential stays all-zero and a run with the
    flag EXPLICITLY 0.0 is identical, to the bit, to a run with the flag ABSENT. This proves the
    chemotaxis term is a pure add-on that does not perturb the existing flagship.'
  measure:
    kind: observable
    path: obs.biomass, obs.volume, obs.position
    expr: flag-absent run == flag-explicitly-0.0 run (exact equality of endpoints)
  pass_if:
    kind: regression_pin
    op: approx_equal
    value: 0.0
    provenance: 'MEASURED (tests/test_chemotaxis_field.py::test_chemotaxis_off_is_byte_identical_to_flagship)
      — flag-absent and flag-explicitly-0.0 runs return bit-identical (biomass, volume, COM-x,
      COM-y); the flagship endpoints are unchanged (biomass ~0.369, CPM volume 110, only thermal
      up-gradient drift). The chemotaxis term is off-by-default and byte-identical to the flagship.'
