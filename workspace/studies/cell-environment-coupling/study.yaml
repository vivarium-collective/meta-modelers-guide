conclusion: '## Claims

  - A single cell reshapes the very nutrient gradient it depends on — environmental modification

    (local resource depletion + secretion), realized spatially. Composing a real CPM cell with a real spatio-flux nutrient

    field through one typed coupling process (`CpmCellField`) reproduces the paper''s

    §Cell–environment coupling sense → metabolize → secrete loop (Fig 4) as genuine spatial

    metabolism — the loop closed (depletion → uptake feedback), with directed control (chemotaxis)

    the flagship''s non-motile-by-design other half, now built and measured in the `chemotaxis`

    variant (finding F-08 — directed up-gradient migration with a nutrient/growth advantage).

    Over 20 ticks the cell grows ~3.4x in CPM volume (32 -> 110 px, ~3% of a 60x60 lattice it does

    not come close to filling), depletes its own local glucose by ~18% peak-to-trough (~6% from the

    initial condition) before diffusion partially resupplies it (environmental modification), and

    secretes a diffusing acetate plume from an

    O2-capped dynamic-FBA overflow mechanism.


  ## Evidence

  - **CELL-METABOLIZES-AND-GROWS** — biomass 0.1 -> ~0.37 via dynamic-FBA at the cell''s own

    footprint

  - **CPM-VOLUME-GROWS** — CPM lattice volume 32 -> 110 px (~3.4x), ~3% lattice coverage

  - **ACETATE-SECRETED-AND-DIFFUSES** — field-wide acetate 0 -> ~47.0 as the plume spreads

  - **NET-GLUCOSE-CONSUMED** — field-wide glucose 5940.0 -> ~5908.4; local footprint drawdown

    ~18% peak-to-trough (~6% from initial)

  - **O2-CAP-FORCES-ACETATE-OVERFLOW** (foundational control) — O2-uncapped acetate 0 -> 0.0

    (exactly) vs capped 0 -> ~47.0: the overflow is caused by the O2 cap, shown by experiment

  - **FIELD-MASS-BALANCE-CLOSES** (foundational control) — glucose and acetate ledgers close to

    < 1e-6 (cell nets a glucose sink + acetate source; diffusion nets ~0)


  ## Limitations

  - e_coli_core constants (`glucose_km`, `glucose_vmax`, `oxygen_vmax`, `box_volume_L`,

    `grow_per_biomass`) are toy-real — plausible, hand-tuned magnitudes, not fitted to any

    organism or medium.

  - Chemotaxis toward the sensed field is now BUILT and MEASURED in the `chemotaxis` variant
    (finding F-08) — the FLAGSHIP itself stays non-motile by design (its modest position drift is
    CPM thermal fluctuation, not directed motion), and the variant adds a gradient-directed
    external-potential force behind the same ports that produces genuine directed up-gradient
    migration (COM x 18.5 → 39.3, +20.8 px, ~90× the flagship''s thermal drift) with a measured
    nutrient/growth advantage (local glucose ~2.1×, net glucose +16%, biomass +13%, volume +36%).

  - Growth is roughly exponential in this coupling, so the run is deliberately bounded to

    ~20-25 ticks to stay spatially legible; a longer run was not attempted.

  - The metabolized field is exclusively the spatio-flux `fields` store; the CPM cell''s own

    internal lattice/world is a private, write-protected object inside viva-cpm''s Rust engine,

    not a process-bigraph store, and no other process reads or writes it.

  ## Next steps

  - Directed chemotaxis (motion up the sensed gradient) is now built and measured as the
    `chemotaxis` variant (finding F-08) — directed up-gradient migration with a nutrient/growth
    advantage. A natural follow-up is chemotaxis under the steady-state / multi-cell regimes.

  - Multi-cell competition over one shared field is realized in `cell-cell-coupling`, which reuses

    `CpmCellField` for each competing cell.'
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'single-cell-in-a-field.composite.json builds and runs to completion

      through the engine over 20 ticks.'
    biological_validation: The spatial §Cell–environment coupling sense → metabolize → secrete
      pattern (Fig 4) is demonstrated at the toy-real (uncalibrated) level, with genuine CPM shape
      dynamics and dynamic-FBA optimization behind the coupling rather than a scripted trajectory
      (directed control/chemotaxis remains the deferred half of the paper's loop).
    pipeline_unblocks:
    - cell-cell-coupling
  if_primary_tests_fail:
    diagnose:
    - the cell's biomass or CPM volume never rises (metabolism or growth-coupling broken)
    - local footprint glucose never depletes despite consumption (mass-balance/clamp bug)
    - acetate never appears in the field (O2 cap not forcing overflow, or the secretion write
      is not reaching the shared field store)
    - net field-wide glucose does not fall (the cell is not acting as a genuine sink)
    block_downstream: 'the other eight studies, now all built, most of which reuse
      CpmCellField or its coupling pattern'
limitations:
- e_coli_core constants (glucose_km, glucose_vmax, oxygen_vmax, box_volume_L, grow_per_biomass)
  are toy-real, hand-tuned magnitudes chosen for gradual, legible dynamics over a short run — not
  fitted to any organism or medium.
- Chemotaxis toward the external field is now BUILT and MEASURED (finding F-08, the `chemotaxis`
  variant). The FLAGSHIP cell stays non-motile by design — it senses, metabolizes, grows, and
  secretes but does not move directionally up-gradient — while the variant biases the CPM
  Metropolis pixel-copy up the SHARED glucose gradient via a gradient-directed external-potential
  force (f = chemotaxis_strength·grad(glucose), U(r) = −f·r) behind the same `CpmCellField` ports.
  Directed up-gradient motion is genuinely achieved (COM x 18.5 → 39.3, +20.8 px, ~90× the
  flagship''s +0.2 px thermal drift) and it measurably helps — the migrating cell reaches a ~2.1×
  richer glucose region and acquires ~16% more glucose, ~13% more biomass, and ~36% more CPM
  volume than the stationary control on the identical field. Off by default (strength 0.0 →
  flagship byte-identical). The variant is single-cell on a static-gradient field; chemotaxis
  under the steady-state or multi-cell regimes is the follow-up.
- Growth is roughly exponential in this coupling, so the run is deliberately bounded to
  ~20-25 ticks to stay spatially legible.
- 'The metabolized nutrient field is exclusively the spatio-flux ``fields`` store; the CPM cell''s
  own internal lattice/world lives inside viva-cpm''s Rust engine as a private, write-protected
  object the coupling process owns, not a process-bigraph store — no other process in the
  composite reads or writes it, and viva-cpm''s own internal field concept
  (field_at_cell/secretory_types) is separate machinery this composite does not use.'
- The cell's only channel for acting back on its environment here is metabolic (uptake and
  secretion). A second, non-metabolic sense/act channel — mechanical stress / traction, where the
  cell pushes on its surroundings and reads the reaction force — is not modeled; it is a candidate
  future coupling process alongside chemotaxis.
- 'The FLAGSHIP nutrient field has no continuous source or decay term — its 20-tick dynamics are
  transient depletion plus diffusion, not a source/sink equilibrium. M7d (peer review) now
  ADDRESSES this — the `single-cell-in-a-field-steadystate` variant adds a first-order glucose
  source, a first-order acetate decay sink, and a logistic biomass carrying capacity, and reaches a
  verified flux steady state by ~t=100-120 (finding F-06). The flagship itself remains a transient
  by design; the steady-state regime is the standing-field extension.'
- 'CADENCE (M7d, peer review) — the operator-split CPM<->dFBA<->diffusion loop runs at coupling
  cadence 1 and only the PDE substeps are CFL-guarded. A cadence-halving/quartering convergence
  check (finding F-07) shows the time-integrated gated observables (biomass/volume growth, acetate
  plume, net glucose sink) are cadence-converged (< 3% drift between cadence 0.25 and 0.5), but the
  INSTANTANEOUS local-footprint glucose is NOT (~16% drift) because the CPM''s fixed mcs_per_update
  is not interval-scaled. F-02''s local-depletion depths (0.94 / ~18% / ~6%) are therefore
  approximate cadence-1 readings, not converged quantities; a cadence-invariant local reading would
  require interval-scaling the CPM Monte-Carlo sweeps, a follow-up.'
falsifiability: Overturned if the cell's biomass or CPM lattice volume never rise over the run,
  if local footprint glucose never depletes despite ongoing consumption, if acetate never appears
  in the shared field (the O2 cap failing to force overflow, or the secretion write not reaching
  the field store), or if net field-wide glucose does not fall (the cell failing to act as a
  genuine sink on the shared field).
