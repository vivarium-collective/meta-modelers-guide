    kind: observable
    path: uptake_flux
    expr: last(uptake_flux)
  pass_if:
    op: '>='
    value: 0.2
    provenance: cell takes up from the field — uptake flux 0.0→0.34, bolus cell drawn down 1.0→0.2 (exec last≈0.34, fig05-executable)
