findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'A real CPM cell coupled to a real spatio-flux nutrient field through one typed

    process (`CpmCellField`) closes the paper''s §Cell–environment coupling

    sense → metabolize → secrete loop (Fig 4) as genuine spatial metabolism (the loop is closed;

    directed control/chemotaxis is built and measured in the `chemotaxis` variant, F-08) — it

    runs dynamic-FBA at its own footprint and grows both biologically (biomass) and structurally

    (CPM lattice volume). Confirmed: biomass 0.1 -> ~0.37, CPM volume 32 -> 110 px (~3.4x) over

    20 ticks, on a 3600-pixel lattice the cell occupies only ~3% of by the end.'
  evidence:
    from_test: cell-metabolizes-and-grows
    from_run: single-cell-in-a-field
    observed: biomass 0.1 -> ~0.37; CPM volume 32 -> 110 px
  provenance:
    run_ids:
    - single-cell-in-a-field
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell measurably depletes the local nutrient it senses before diffusion partially

    resupplies it — environmental modification as a direct spatial-metabolic consequence, not a scripted

    trajectory. Confirmed: local footprint glucose concentration peaks at 1.15 (t=2) and falls to

    0.94 by t=20 — ~18% peak-to-trough (the peak is created by diffusion inflow after t=0) and ~6%

    from the initial condition — while the field-wide glucose total falls by only

    ~32 of 5940 units — the depletion signature is sharply local to the cell''s own footprint and

    its immediate diffusive neighborhood, not a field-wide event.


    CADENCE CAVEAT (M7d re-level) — the QUALITATIVE finding (a sharply-local depletion halo,

    net field-wide sink) is cadence-robust, and the field-wide net-consumption number (~32 units)

    is cadence-converged (< 2% drift under cadence halving, see `cadence-convergence`). But the

    INSTANTANEOUS local-footprint figures quoted here — the 0.94 endpoint, the ~18% peak-to-trough

    and ~6%-from-initial depths — are NOT cadence-converged — the local footprint concentration is

    a single-tick snapshot over a stochastically-shifting CPM footprint (whose fixed mcs_per_update

    is not interval-scaled), and it drifts ~16% between coupling cadence 0.25 and 0.5. These local

    depths are therefore APPROXIMATE, cadence-1 readings, not converged quantities; the load-bearing

    claim (local depletion happens and is sharply local) stands.'
  evidence:
    from_test: net-glucose-consumed
    from_run: single-cell-in-a-field
    observed: local footprint glucose 1.15 -> 0.94 (~18% peak-to-trough, ~6% from initial — approximate,
      NOT cadence-converged — see cadence-convergence, ~16% drift under cadence halving); field-wide glucose
      5940.0 -> ~5908.4 (net consumption cadence-converged < 2%)
  provenance:
    run_ids:
    - single-cell-in-a-field
- id: F-03
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The O2-capped dynamic-FBA mechanism forces the optimizer into mixed-acid acetate

    overflow (rather than pure aerobic respiration), and that byproduct genuinely diffuses

    outward into a spreading plume via spatio-flux''s own `DiffusionAdvection` process — the

    secretion side of the coupling is as real as the uptake side. Confirmed: field-wide acetate

    0 -> ~47.0 over 20 ticks.'
  evidence:
    from_test: acetate-secreted-and-diffuses
    from_run: single-cell-in-a-field
    observed: field-wide acetate 0 -> ~47.0
  provenance:
    run_ids:
    - single-cell-in-a-field
- id: F-04
  kind: methodological
  tier: mechanism
  status: confirms
  statement: 'The acetate overflow is CAUSED BY the O2 cap, shown by experiment rather than

    asserted from code: lifting the oxygen bound (O2-uncapped control, oxygen_vmax 2.5 -> 1000)

    collapses acetate secretion to ~0 while the capped flagship secretes a real plume — the cell

    respires fully instead of overflowing (and grows faster for it). Confirmed: field-wide acetate

    capped 0 -> ~47.0 vs uncapped 0 -> 0.0 (exactly); uncapped biomass ~2.35 vs capped ~0.37.'
  evidence:
    from_test: o2-cap-forces-acetate-overflow
    from_run: single-cell-in-a-field-o2uncapped
    observed: acetate capped ~47.0 vs uncapped 0.0; biomass uncapped ~2.35 vs capped ~0.37
  provenance:
    run_ids:
    - single-cell-in-a-field
    - single-cell-in-a-field-o2uncapped
- id: F-05
  kind: methodological
  tier: mechanism
  status: partial
  statement: 'INTERFACE SURROGATE CALIBRATION — a tuned Michaelis-Menten twin reproduces the

    flagship''s cell↔field interface observables, this investigation''s test of the paper''s

    substitutability idea at the level of surrogate calibration. The paper (§2 / §Cellular interface)

    argues that "this substitutability is not only a

    software convenience. It allows the interface itself to become the object of comparison:

    different mechanisms may realize the same externally observable relation", and that "different

    internal organizations may sometimes be represented through the same coarse-grained interface

    when they preserve the interaction variables relevant to that description." Here that idea is

    put to a first test: the flagship cell''s INTERNAL metabolism is swapped from constraint-based

    dynamic-FBA (cobra e_coli_core, O2-capped) to a lumped, cobra-free Michaelis–Menten / Monod metabolism

    (`single-cell-in-a-field-mm`, `mechanism: mm`) behind the BYTE-IDENTICAL `CpmCellField` ports,

    and the interface-level observables are compared head-to-head. Confirmed: over 20 ticks the tuned

    MM twin reproduces the coarse-grained cell↔field interface — final

    biomass dFBA 0.370 vs MM 0.342 (7.5%), CPM volume 110 vs 99 px (10%), total acetate secreted

    47.02 vs 47.02 (~0%), net glucose depleted 31.6 vs 33.6 units (6.2%); every interface observable

    agrees within ~10%. The MM twin additionally runs with NO cobra at all — the surrogate-model

    payoff, a mechanism that runs where the original could not. This is surrogate calibration, not yet

    mechanism-independence: the 4 MM params

    (mm_vmax 4.0, mm_km 0.5, mm_yield 0.024, mm_overflow 1.4) were TUNED to preserve the interaction

    variables (4 knobs fit to 4 observables — exactly determined) — the claim is "a tuned surrogate

    matches the coarse-grained relation", not identical internals, and not a derivation of MM from the

    dFBA solution.


    HELD-OUT TEST NOW RUN (peer-review M2) — the named next step is done, and re-levels this finding

    honestly on both sides. With the 4 MM params FROZEN at their tuned values, dFBA vs MM were compared

    on conditions neither was tuned on (tests/test_substitutability_heldout.py). Inside the calibrated

    glucose-limited, fixed-O2 regime the substitution is MECHANISM-INDEPENDENT, not just a fit — a

    held-out initial glucose field (flat 3.0, not the tuned 0.3→3.0 gradient) agrees within 11.9% on

    every observable, and a 2x-longer run (40 ticks) within 12.5%. But the lumped MM box carries NO

    oxygen variable, and that is its blind spot — on a held-out O2 cap (dFBA 2.5→5.0) dFBA nearly

    quadruples its biomass/volume while the O2-blind MM twin is unchanged, so agreement COLLAPSES to

    ~74%. The honest re-level — mechanism-independence WITHIN the calibrated regime (held-out within

    ~13% on the glucose/time axes), surrogate calibration only ACROSS the O2 axis the MM box has no

    variable for. Degrees of freedom — 4 free MM params vs 4 interface observables (exactly determined),

    so the tuned fit was guaranteed a priori; the in-regime held-out agreement is the load-bearing

    evidence, and the O2-axis collapse is the load-bearing limitation.'
  evidence:
    from_test: interface-substitutable-held-out
    from_run: single-cell-in-a-field-mm
    observed: 'TUNED (20 ticks): biomass 0.370 vs 0.342 (7.5%), volume 110 vs 99 (10%), acetate 47.02
      vs 47.02 (~0%), glucose 31.6 vs 33.6 (6.2%). HELD-OUT frozen: flat-3.0 field within 11.9%,
      40-tick within 12.5%; held-out O2 cap 2.5→5.0 diverges ~74% (MM blind to O2). MM runs cobra-free'
  provenance:
    run_ids:
    - single-cell-in-a-field
    - single-cell-in-a-field-mm
- id: F-06
  kind: methodological
  tier: mechanism
  status: confirms
  statement: 'STEADY-STATE REGIME (M7d, peer review) — the flagship is a pure transient (no
    source terms), so every flagship number is a transient reading, never a source/sink
    equilibrium, and the study itself flags this as a limitation. Adding three cell-independent
    terms behind the same `CpmCellField` ports — a first-order glucose source (grid-wide
    relaxation toward a setpoint), a first-order acetate decay sink, and a logistic biomass
    carrying capacity — turns the composite into a chemostat-like regime that reaches a VERIFIED
    flux steady state. Confirmed — over the final 10 of 120 ticks the per-tick relative change of
    biomass (0.0015%), field glucose (0.0001%), and field acetate (0.014%) all fall below the
    0.1% steady-state tolerance, with standing values biomass ~0.500, CPM volume ~147 px, local
    glucose ~1.356, field glucose ~5372 (uptake balanced by source), field acetate ~31.5
    (secretion balanced by decay); the cell is alive and metabolizing at the fixed point. Note —
    a biomass dilution term alone gives NO interior fixed point in this coupling (per-pixel uptake
    scales with biomass/footprint-area, so local glucose equilibrates biomass-independently and mu
    never falls to a dilution rate); the logistic carrying capacity is what forces every flux to a
    steady state. This demonstrates the source/sink-equilibrium regime the flagship deferred.'
  evidence:
    from_test: steadystate-flux-equilibrium
    from_run: single-cell-in-a-field-steadystate
    observed: 'per-tick relative flux < 0.1% over the final 10 of 120 ticks (biomass 0.0015%,
      glucose 0.0001%, acetate 0.014%); standing values biomass ~0.500, volume ~147 px, local
      glucose ~1.356, field glucose ~5372, field acetate ~31.5'
  provenance:
    run_ids:
    - single-cell-in-a-field-steadystate
- id: F-07
  kind: methodological
  tier: mechanism
  status: partial
  statement: 'CADENCE CONVERGENCE (M7d, peer review) — the flagship''s operator-split
    CPM<->dFBA<->diffusion loop runs at coupling cadence 1, and only the PDE substeps are
    CFL-guarded. Halving then quartering the coupling cadence and measuring the drift in the four
    gated observables between the two finest levels gives an HONEST two-sided result. The three
    TIME-INTEGRATED gated observables are cadence-robust — between cadence 0.25 and 0.5 final
    biomass drifts 1.6%, CPM volume 2.6%, net glucose depleted 1.8%, and field-wide acetate 1.7%,
    all inside the 10% convergence band. But the INSTANTANEOUS local-footprint glucose does NOT
    converge — it drifts 15.7% (0.864 vs 1.025), exceeding the band, because it is a single-tick
    snapshot over a stochastically-shifting CPM footprint and the CPM''s fixed mcs_per_update is
    not interval-scaled (halving the cadence doubles the total Monte-Carlo relaxation the lattice
    receives). Re-level — the integrated flagship claims (biomass/volume growth, acetate plume, net
    glucose sink) are cadence-converged and stand as-is; F-02''s LOCAL-DEPLETION pin (the 0.94
    endpoint, ~18% peak-to-trough, ~6%-from-initial depths) is cadence-sensitive and is re-levelled
    to an approximate, cadence-1 reading — the one pinned trajectory the cadence check moves.'
  evidence:
    from_test: cadence-convergence
    from_run: single-cell-in-a-field
    observed: 'drift between finest two cadences (0.25 vs 0.5) — biomass 1.6%, volume 2.6%, net
      glucose 1.8%, acetate 1.7% (all < 10% band); local-footprint glucose 15.7% (exceeds band —
      NOT converged)'
  provenance:
    run_ids:
    - single-cell-in-a-field
- id: F-08
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'CHEMOTAXIS — DIRECTED UP-GRADIENT MOTION, BUILT AND MEASURED. The flagship senses,
    metabolizes, grows, and secretes but does NOT act on what it senses — directed control
    (chemotaxis up the sensed gradient) was the deferred half of the paper''s sense → metabolize →
    act loop. The `chemotaxis` variant closes it behind the same `CpmCellField` ports — each tick
    the coupling process takes grad(glucose) of the SHARED spatio-flux field over the cell''s
    footprint and sets viva-cpm''s per-type external-potential force f = chemotaxis_strength·grad(glucose),
    so the Metropolis pixel-copy is biased up-gradient via U(r) = −f·r (the linearized form of
    CC3D chemotaxis ΔH = −λ·Δc, driven by the external shared field the cell already senses, not a
    viva-cpm-internal PDE field — which has no write path in this coupling). RESULT — directed
    up-gradient motion is genuinely achieved and it measurably helps. Over 20 ticks on the identical
    field the chemotaxis cell migrates from COM x ≈ 18.5 to ≈ 39.3 — a +20.8 px up-gradient
    displacement versus the non-motile flagship control''s +0.2 px thermal drift (~90×) — reaching a
    ~2.1× richer local glucose region (sensed local glucose 1.95 vs 0.94) and, for it, acquiring ~16%
    more glucose (net 36.8 vs 31.6), building ~13% more biomass (0.418 vs 0.370), and growing ~36%
